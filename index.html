  const [defaultPrice, setDefaultPrice] = useState(()=>{try{return localStorage.getItem("qimma_default_price")||"";}catch{return "";}});
  const saveDefaultPrice = v => { setDefaultPrice(v); try{localStorage.setItem("qimma_default_price",v);}catch(e){} };
  const ALL_COLS = ["اسم العميل","رقم العقد","قيمة العقد","اسم المستثمر","دعم العميل","دعم الحساب","سعر البطاقة","البطاقات المدعومة","البطاقات المسحوبة","رصيد البطاقات","نقدي البطاقات","نقدي السلع","الإجمالي النقدي"];
  const [visCols, setVisCols] = useState(()=>{try{const s=JSON.parse(localStorage.getItem("qimma_vis_cols")||"null");return s||ALL_COLS.reduce((a,c)=>({...a,[c]:true}),{});}catch{return ALL_COLS.reduce((a,c)=>({...a,[c]:true}),{});}});
  const toggleCol = c => { const n={...visCols,[c]:!visCols[c]}; setVisCols(n); try{localStorage.setItem("qimma_vis_cols",JSON.stringify(n));}catch(e){} };
  const [showColMenu, setShowColMenu] = useState(false);

  const saveManual = r => { setManualRows(r); localStorage.setItem("qimma_goods3",JSON.stringify(r)); if(gsWrite) gsWrite("goods3", r); };
  const savePriceOverride = (id, val) => {
    const p = {...priceOverrides, [id]: val};
    setPriceOverrides(p);
    localStorage.setItem("qimma_price_ov", JSON.stringify(p));
    if(gsWrite) gsWrite("price_ov", p);
  };

  // Build rows from contracts + manual
  const contractRows = contracts.filter(c=>!c.isOldContract && c.contractType!=="migrated").map(c=>{
    const inv = investors.find(i=>String(i.id)===String(c.investorId));
    // بطاقة (سوا/موبايلي/زين) → تخصم العدد من رصيد البطاقات
    // غيرها (أسهم/جوال/سيارة) → سلعة نقدية: تخصم قيمة العقد النقدية من الإجمالي النقدي
    const isCard = (c.goods||"").trim().startsWith("بطاقة");
    if(isCard){
      return {
        id:"c_"+c.id, date:c.date, contractNum:c.num,
        contractAmount:parseFloat(c.amount)||0,
        client:c.client,
        investor:inv?invLabel(inv):"—",
        supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
        supportAcc:0,
        withdrawnQty:parseInt(c.qty)||0,
        fromContract:true,
      };
    } else {
      // سلعة نقدية: قيمتها النقدية تُخصم من الإجمالي النقدي (سالبة)، بدون لمس البطاقات
      const stockInfo = (c.goods||"").includes("أسهم") && c.stockName ? (" ("+c.stockName+(c.stockQty?" ×"+c.stockQty:"")+")") : "";
      return {
        id:"c_"+c.id, date:c.date, contractNum:c.num,
        contractAmount:parseFloat(c.amount)||0,
        client:c.client+" — "+(c.goods||"سلعة")+stockInfo,
        investor:inv?invLabel(inv):"—",
        supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
        supportAcc:-(parseFloat(c.amount)||0),  // سالبة: تخصم قيمة العقد النقدية من الإجمالي النقدي
        withdrawnQty:0,
        fromContract:true,
        cashOnly:true, isCashItem:true, itemName:c.goods,
      };
    }
  });

  // ترتيب زمني: بالتاريخ، ثم بوقت الإنشاء (timestamp) — آخر عملية تكون آخر صف
  const seqOf = r => {
    // العقد id = "c_<timestamp>"، اليدوي id = <timestamp> رقمي
    const raw = String(r.id).replace(/^c_/,"");
    const n = parseInt(raw,10);
    return isNaN(n) ? 0 : n;
  };
  const allRows = [...contractRows, ...manualRows].sort((a,b)=>{
    const d = new Date(a.date)-new Date(b.date);
    if(d!==0) return d;
    return seqOf(a)-seqOf(b);
  });

  // Calculate running balance: نفصل نقدي البطاقات عن نقدي السلع
  let runningCards = 0;
  let lastPrice = 0;
  let runningGoodsCash = 0;
  const displayAsc = allRows.map(row=>{
    if(row.cashOnly){
      const amt=parseFloat(row.supportAcc)||0;
      runningGoodsCash += amt;
      const cardsCash = runningCards*(lastPrice||0);
      return {...row, rowPrice:0, supported:0, withdrawn:0, runningCards, cardsCash, goodsCash:runningGoodsCash, cashBalance:cardsCash+runningGoodsCash, isCashItem:true};
    }
    const rowPrice = parseFloat(priceOverrides[row.id]||row.price)||parseFloat(defaultPrice)||lastPrice||1;
    if(rowPrice) lastPrice = rowPrice;
    const supC = parseFloat(row.supportClient)||0;
    const supA = parseFloat(row.supportAcc)||0;
    const supported = supC||supA ? Math.floor((supC+supA)/rowPrice) : 0;
    const withdrawn = parseInt(row.withdrawnQty)||0;
    runningCards = runningCards + supported - withdrawn;
    const cardsCash = runningCards*rowPrice;
    return {...row, rowPrice, supported, withdrawn, runningCards, cardsCash, goodsCash:runningGoodsCash, cashBalance:cardsCash+runningGoodsCash};
  });
  // عرض: الأحدث فوق
  const display = [...displayAsc].reverse();

  return (
    <div>
      {goBack && (
        <button onClick={goBack} style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",color:"#e0b85c",border:"1px solid rgba(200,146,42,0.3)",borderRadius:12,padding:"10px 18px",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial",display:"inline-flex",alignItems:"center",gap:8,marginBottom:16}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e0b85c" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          رجوع
        </button>
      )}
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:19,fontWeight:800}}>📦 البضاعة</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>

          <button style={styles.btn(C.teal)} onClick={()=>setShowAdd(s=>!s)}>➕ إضافة دعم</button>
        </div>
      </div>

      {/* Add manual row */}
      {showAdd && (
        <div style={{...styles.panel,marginBottom:16,padding:16}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>إضافة دعم حساب</div>
          {/* اختيار نوع الدعم */}
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button type="button" onClick={()=>setNewRow(p=>({...p,itemType:"cards"}))}
              style={{flex:1,padding:"11px",borderRadius:10,border:"2px solid "+(newRow.itemType==="cards"?C.teal:C.border),background:newRow.itemType==="cards"?C.tealLt:"#fff",color:newRow.itemType==="cards"?C.teal:C.ink2,fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>💳 بطاقات</button>
            <button type="button" onClick={()=>setNewRow(p=>({...p,itemType:"other"}))}
              style={{flex:1,padding:"11px",borderRadius:10,border:"2px solid "+(newRow.itemType==="other"?C.gold:C.border),background:newRow.itemType==="other"?"#fef9ec":"#fff",color:newRow.itemType==="other"?"#a87520":C.ink2,fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>📦 سلعة أخرى (أسهم/سيارة)</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>التاريخ</label>
              <input style={styles.input} type="date" value={newRow.date} onChange={e=>setNewRow(p=>({...p,date:e.target.value}))}/>
            </div>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>قيمة الدعم (ر.س)</label>
              <input style={styles.input} type="number" placeholder="المبلغ" value={newRow.supportAcc} onChange={e=>setNewRow(p=>({...p,supportAcc:e.target.value}))}/>
            </div>
            {newRow.itemType==="cards" ? (
              <div>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>سعر البطاقة</label>
                <input style={styles.input} type="number" placeholder="اتركه فارغ للتعبئة التلقائية" value={newRow.price} onChange={e=>setNewRow(p=>({...p,price:e.target.value}))}/>
              </div>
            ) : (
              <div>
                <label style={{fontSize:15,fontWeight:700,color:"#a87520",display:"block",marginBottom:4}}>اسم السلعة *</label>
                <input style={styles.input} type="text" placeholder="مثال: أسهم الراجحي / سيارة" value={newRow.itemName} onChange={e=>setNewRow(p=>({...p,itemName:e.target.value}))}/>
              </div>
            )}
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>ملاحظة</label>
              <input style={styles.input} type="text" placeholder="اختياري" value={newRow.note} onChange={e=>setNewRow(p=>({...p,note:e.target.value}))}/>
            </div>
          </div>
          {newRow.itemType==="other" && <div style={{fontSize:13,color:"#a87520",marginBottom:10,fontWeight:600}}>💡 قيمة الدعم ستُضاف مباشرة على الرصيد النقدي (بدون حساب بطاقات).</div>}
          <button style={styles.btn(C.teal)} onClick={()=>{
            if(!newRow.supportAcc){toast("أدخل مبلغ الدعم","error");return;}
            if(newRow.itemType==="other" && !newRow.itemName.trim()){toast("أدخل اسم السلعة","error");return;}
            if(newRow.itemType==="other"){
              saveManual([...manualRows,{id:Date.now(),date:newRow.date,contractNum:"—",contractAmount:0,client:newRow.itemName+(newRow.note?(" — "+newRow.note):""),investor:"—",supportClient:0,supportAcc:parseFloat(newRow.supportAcc)||0,withdrawnQty:0,fromContract:false,price:0,cashOnly:true,itemName:newRow.itemName}]);
            } else {
              saveManual([...manualRows,{id:Date.now(),date:newRow.date,contractNum:"—",contractAmount:0,client:newRow.note||"دعم حساب",investor:"—",supportClient:0,supportAcc:parseFloat(newRow.supportAcc)||0,withdrawnQty:0,fromContract:false,price:parseFloat(newRow.price)||0}]);
            }
            setNewRow({date:todayLocal(),supportAcc:"",note:"",price:"",itemType:"cards",itemName:""});
            setShowAdd(false);
            toast("✅ تم إضافة الدعم");
          }}>💾 حفظ</button>
        </div>
      )}

      {/* شريط التحكم: السعر الافتراضي + إظهار الأعمدة */}
      <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:12,padding:"12px 14px",background:"#f8fafc",borderRadius:10,border:"1px solid "+C.border}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:14,fontWeight:700,color:C.ink2}}>💳 سعر البطاقة الافتراضي:</span>
          <input type="number" value={defaultPrice} onChange={e=>saveDefaultPrice(e.target.value)} placeholder="مثال: 19.7"
            style={{width:90,border:"2px solid "+C.gold,borderRadius:6,padding:"5px 8px",fontSize:14,textAlign:"center",background:"#fffbf0",fontWeight:700}}/>
          <span style={{fontSize:12,color:"#6b7280"}}>(يمكن تعديله لأي صف)</span>
        </div>
        <div style={{position:"relative",marginRight:"auto"}}>
          <button onClick={()=>setShowColMenu(s=>!s)} style={{...styles.btn("#e5e7eb","#374151"),fontSize:13,padding:"7px 14px"}}>⚙️ الأعمدة</button>
          {showColMenu && (
            <div style={{position:"absolute",top:"110%",left:0,zIndex:20,background:"#fff",border:"1px solid "+C.border,borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",padding:10,minWidth:200,maxHeight:"50vh",overflowY:"auto"}}>
              <div style={{fontSize:13,fontWeight:800,color:C.ink,marginBottom:8}}>إظهار / إخفاء الأعمدة</div>
              {ALL_COLS.map(c=>(
                <label key={c} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 4px",cursor:"pointer",fontSize:14}}>
                  <input type="checkbox" checked={visCols[c]!==false} onChange={()=>toggleCol(c)}/>
                  <span>{c}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Table */}
      <div style={{overflowX:"auto",maxHeight:"75vh",overflowY:"auto",borderRadius:10,boxShadow:"0 2px 12px rgba(0,0,0,0.08)"}}>
        <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:14}}>
          <thead>
            <tr style={{background:C.ink,color:"#fff"}}>
              <th style={{padding:"8px",whiteSpace:"nowrap",fontWeight:700,textAlign:"center",position:"sticky",top:0,zIndex:10}}>التاريخ</th>
              {ALL_COLS.filter(c=>visCols[c]!==false).map((h,hi)=>{
                const isName = h==="اسم العميل";
                return <th key={h} style={{padding:"8px",whiteSpace:"nowrap",fontWeight:700,textAlign:"center",
                  position:"sticky",top:0,zIndex:isName?12:10,
                  ...(isName?{right:0,zIndex:12}:{}),
                  background:["رصيد البطاقات","نقدي البطاقات","نقدي السلع","الإجمالي النقدي"].includes(h)?"#1a6b4a":C.ink}}>{h}</th>;
              })}
              <th style={{padding:"8px",position:"sticky",top:0,zIndex:10}}></th>
            </tr>
          </thead>
          <tbody>
            {display.length===0?(
              <tr><td colSpan={ALL_COLS.length+2} style={{textAlign:"center",padding:40,color:"#1f2937"}}>لا توجد بيانات</td></tr>
            ):display.map((row,i)=>{
              const cell=(s,content)=><td style={{padding:"6px 8px",borderBottom:"1px solid #eee",...s}}>{content}</td>;
              const C_={
                "رقم العقد":cell({textAlign:"center",fontWeight:700},row.contractNum),
                "قيمة العقد":cell({textAlign:"center"},row.contractAmount>0?row.contractAmount.toLocaleString("en-US"):""),
                "اسم العميل":cell({fontWeight:700,whiteSpace:"nowrap",position:"sticky",right:0,background:i%2===0?"#fff":"#f8f8f8",zIndex:5,borderLeft:"2px solid #e2e8f0"},row.client),
                "اسم المستثمر":cell({},row.investor),
                "دعم العميل":cell({textAlign:"center",color:C.green,fontWeight:700},row.supportClient>0?row.supportClient.toLocaleString("en-US"):""),
                "دعم الحساب":cell({textAlign:"center",color:C.teal,fontWeight:700},row.supportAcc>0?row.supportAcc.toLocaleString("en-US"):""),
                "سعر البطاقة":<td style={{padding:"3px 4px",borderBottom:"1px solid #eee",textAlign:"center"}}>{row.isCashItem?<span style={{fontSize:12,color:"#a87520",fontWeight:700}}>📦 سلعة</span>:<input type="number" value={priceOverrides[row.id]||row.price||""} placeholder={String(row.rowPrice||"")} onChange={e=>savePriceOverride(row.id,e.target.value)} style={{width:60,border:"1px solid "+C.gold,borderRadius:4,padding:"3px 4px",fontSize:14,textAlign:"center",background:"#fffbf0"}}/>}</td>,
                "البطاقات المدعومة":cell({textAlign:"center",background:"#f0faf5",fontWeight:700},row.supported>0?row.supported:""),
                "البطاقات المسحوبة":cell({textAlign:"center",color:C.red,fontWeight:700},row.withdrawn>0?row.withdrawn:""),
                "رصيد البطاقات":cell({textAlign:"center",background:"#f0f0ff",fontWeight:800,color:C.teal},row.runningCards),
                "نقدي البطاقات":cell({textAlign:"center",fontWeight:700,color:"#0891b2"},(row.cardsCash||0).toLocaleString("en-US")),
                "نقدي السلع":cell({textAlign:"center",fontWeight:700,color:(row.goodsCash||0)<0?C.red:"#a87520"},(row.goodsCash||0).toLocaleString("en-US")),
                "الإجمالي النقدي":cell({textAlign:"center",background:"#fffbf0",fontWeight:800,color:row.cashBalance<0?C.red:C.gold},row.cashBalance.toLocaleString("en-US")),
              };
              return (
              <tr key={row.id||i} style={{background:i%2===0?"#fff":"#f8f8f8"}}>
                {cell({textAlign:"center"},row.date)}
                {ALL_COLS.filter(c=>visCols[c]!==false).map(c=><React.Fragment key={c}>{C_[c]}</React.Fragment>)}
                <td style={{padding:"4px",borderBottom:"1px solid #eee",textAlign:"center"}}>
                  {!row.fromContract&&<button style={{...styles.btn(C.red),fontSize:13,padding:"3px 8px"}} onClick={()=>{if(window.confirm("حذف هذا السطر؟"))saveManual(manualRows.filter(r=>r.id!==row.id));}}>🗑️</button>}
                </td>
              </tr>
            );})}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// ─── قمة AI — المساعد الذكي (Claude API) ────────────────────
const AI_MODELS = ["gemini-2.5-flash","gemini-3.5-flash","gemini-3.6-flash","gemini-3.1-flash-lite","gemini-2.5-flash-lite"];

function QimaAI({contracts, investors, payments, setPayments, settings, doneIds, markDone, daily, setDaily, loans, zakatTx, pending, bankTx, invTxList, monthClose, dailyOpen, toast, logAct, goBack}) {
  const [msgs, setMsgs] = useState(()=>{ try{ return JSON.parse(localStorage.getItem("qimma_ai_chat")||"[]"); }catch(e){ return []; } });
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [aiKey, setAiKey] = useState(()=>localStorage.getItem("qimma_ai_key")||"");
  const [aiModel, setAiModel] = useState(()=>localStorage.getItem("qimma_ai_model")||"gemini-2.5-flash");
  const [showSetup, setShowSetup] = useState(false);
  const [pendingAction, setPendingAction] = useState(null);
  const [listening, setListening] = useState(false);
  const [lastCost, setLastCost] = useState(null);
  const [imgData, setImgData] = useState([]);
  const [aiTab, setAiTab] = useState("chat");
  const [drillDown, setDrillDown] = useState(null);
  const chatEnd = React.useRef(null);
  const recogRef = React.useRef(null);
  const imgRef = React.useRef(null);
  const scrollDown = () => setTimeout(()=>chatEnd.current?.scrollIntoView({behavior:"smooth"}),120);

  // حفظ المحادثة تلقائياً
  useEffect(()=>{
    try{ localStorage.setItem("qimma_ai_chat", JSON.stringify(msgs.slice(-500))); }catch(e){}
  },[msgs]);

  // التقرير الصباحي تلقائياً مرة واحدة كل يوم
  useEffect(()=>{
    try{
      const t = todayLocal();
      if(localStorage.getItem("qimma_ai_brief_day") === t) return;
      localStorage.setItem("qimma_ai_brief_day", t);
      setTimeout(()=>{
        setMsgs(p=>[...p, {role:"ai", text: buildBrief()}]);
        scrollDown();
      }, 400);
    }catch(e){}
  },[]);

  const _n = x => +x || 0;
  const activeC = contracts.filter(c=>!c.deleted && !doneIds.includes(c.id));
  const doneC = contracts.filter(c=>!c.deleted && doneIds.includes(c.id));
  const allC = contracts.filter(c=>!c.deleted);

  const _paid = (cid) => (payments||[]).filter(p=>p.contractId===cid).reduce((s,p)=>s+_n(p.amount),0);
  const _left = (c) => Math.max(0,(_n(c.totalInst)||_n(c.amount))-_paid(c.id));
  const _overdue = (c) => {
    const inst=_n(c.instAmt), tot=_n(c.totalInst)||_n(c.amount), paid=_paid(c.id);
    if(tot>0&&paid>=tot) return 0;
    if(inst<=0||!c.firstInst) return 0;
    const f=new Date(c.firstInst), n=new Date();
    let due=(n.getFullYear()-f.getFullYear())*12+(n.getMonth()-f.getMonth());
    if(n.getDate()>=f.getDate()) due+=1;
    due=Math.min(Math.max(0,due),Math.max(1,Math.round(tot/inst)));
    return Math.max(0,Math.floor((due*inst-paid)/inst));
  };
  const _lastPay = (cid) => {
    const ps=(payments||[]).filter(p=>p.contractId===cid).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    return ps[0]||null;
  };
  const _invName = (c) => { const i=investors.find(x=>String(x.id)===String(c.investorId)); return i?i.name:""; };

  // ═══════════ محرك تقييم المخاطر (تنبؤي) ═══════════
  // يجمع 5 مؤشرات سلوكية ويعطي درجة 0-100 (كلما زادت = خطر أكبر)
  const riskScore = (c) => {
    const inst=_n(c.instAmt), tot=_n(c.totalInst)||_n(c.amount), paid=_paid(c.id);
    const ps=(payments||[]).filter(p=>p.contractId===c.id).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const reasons=[];
    let score=0;

    // 1) التأخر الحالي (وزن 40)
    const od=_overdue(c);
    if(od>0){ const v=Math.min(40, od*13); score+=v; reasons.push(`متأخر ${od} شهر`); }

    // 2) الانقطاع عن السداد (وزن 25)
    const lp=ps.length?ps[ps.length-1]:null;
    let gapDays=null;
    if(lp && lp.date){
      gapDays=Math.floor((new Date()-new Date(lp.date))/86400000);
      if(gapDays>120){ score+=25; reasons.push(`انقطع ${gapDays} يوم`); }
      else if(gapDays>75){ score+=16; reasons.push(`انقطع ${gapDays} يوم`); }
      else if(gapDays>45){ score+=8; reasons.push(`انقطع ${gapDays} يوم`); }
    } else if(c.firstInst && new Date(c.firstInst)<new Date()){
      score+=25; reasons.push("لم يسدد ولا قسط");
    }

    // 3) انتظام السداد تاريخياً (وزن 15)
    if(ps.length>=2){
      const gaps=[];
      for(let i=1;i<ps.length;i++){
        const g=Math.floor((new Date(ps[i].date)-new Date(ps[i-1].date))/86400000);
        if(g>0) gaps.push(g);
      }
      if(gaps.length){
        const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
        if(avg>55){ score+=15; reasons.push("سداده غير منتظم"); }
        else if(avg>40){ score+=7; reasons.push("تباعد في السداد"); }
      }
    }

    // 4) نسبة الإنجاز مقابل الزمن المنقضي (وزن 12)
    if(tot>0 && c.firstInst && inst>0){
      const months=Math.max(1, Math.round(tot/inst));
      const elapsed=Math.max(0,(new Date().getFullYear()-new Date(c.firstInst).getFullYear())*12+(new Date().getMonth()-new Date(c.firstInst).getMonth())+1);
      const expectedPct=Math.min(100, elapsed/months*100);
      const actualPct=paid/tot*100;
      const lag=expectedPct-actualPct;
      if(lag>35){ score+=12; reasons.push(`متخلف ${Math.round(lag)}% عن الجدول`); }
      else if(lag>18){ score+=6; reasons.push(`متخلف ${Math.round(lag)}% عن الجدول`); }
    }

    // 5) حجم المبلغ المكشوف (وزن 8)
    const left=_left(c);
    if(left>30000){ score+=8; reasons.push("مبلغ مكشوف كبير"); }
    else if(left>15000){ score+=4; }

    // 6) خصم: سجل نظيف
    if(od===0 && ps.length>=3 && gapDays!==null && gapDays<40){ score=Math.max(0,score-10); reasons.push("سجل نظيف"); }

    score=Math.max(0,Math.min(100,Math.round(score)));
    let level,color,advice;
    if(score>=70){ level="خطر مرتفع"; color="#dc2626"; advice="تواصل عاجل + إشعار الكفيل"; }
    else if(score>=45){ level="خطر متوسط"; color="#f97316"; advice="اتصال ومتابعة أسبوعية"; }
    else if(score>=22){ level="مراقبة"; color="#eab308"; advice="تذكير ودّي قبل الاستحقاق"; }
    else { level="آمن"; color="#16a34a"; advice="لا إجراء"; }
    return {score, level, color, advice, reasons, gapDays, od};
  };

  // ═══════════ 1) السياق الذكي — يرسل كل البيانات للإجابة الدقيقة ═══════════
  const pickSections = (q) => {
    const s = {core:true, contracts:true, done:true, overdue:true, good:false,
               payments:true, monthly:true, daily:true, loans:true, bank:true, risk:true,
               goods:true, invtx:true, close:true, namesOnly:false, dueDay:false, client:null};
    const t = String(q||"");

    // ── مطابقة عميل محدد ──
    let matched = null;
    allC.forEach(c=>{
      const name = String(c.client||"").trim();
      if(!name) return;
      const parts = name.split(/\s+/).filter(w=>w.length>=3);
      const full = name.length>=5 && t.includes(name);
      const twoTokens = parts.filter(w=>t.includes(w)).length >= 2;
      if((full || twoTokens) && (!matched || name.length>matched.length)) matched = name;
    });
    if(!matched){
      const num = t.match(/\b\d{9,10}\b/);
      if(num){ const c=allC.find(x=>String(x.idNum)===num[0]||String(x.cPhone)===num[0]); if(c) matched=c.client; }
    }
    if(matched){ s.client = matched; }

    if(/يوم|أيام|ايام|تاريخ|تواريخ|موعد|مواعيد|استحقاق|متى|أول قسط|اول قسط/.test(t)) s.dueDay = true;
    if(/أسماء|اسماء|قائمة|اعرض|اطبع/.test(t) && new RegExp("عقد|عقود|زبون|زبائن|زباين|الزباين|عميل|عملاء|عميلة|شخص|أشخاص|اشخاص|ناس|مين|اللي").test(t) && !s.dueDay) s.namesOnly = true;
    if(/مصروف|صرف|سحب|يومية|دفتر|نقدي|صندوق|استلام/.test(t)) s.daily = true;
    if(/سلف|سلفة|قرض|زكاة|معلق/.test(t)) s.loans = true;
    if(/بنك|بنكي|تحويل|حساب بنكي|آيبان|ايبان/.test(t)) s.bank = true;
    if(/بضاعة|بضائع|جوال|سيارة|أسهم|بطاقة|منتج|سلعة/.test(t)) s.goods = true;
    if(/مستثمر|صندوق|فرصة|شريك|رأس مال|حركة حساب/.test(t)) s.invtx = true;
    if(/إقفال|اقفال|جرد|ميزانية/.test(t)) s.close = true;
    if(new RegExp("عقد|عقود|زبون|زبائن|زباين|الزباين|عميل|عملاء|عميلة|شخص|أشخاص|اشخاص|ناس|مين|اللي|قائمة|كل ال|جميع").test(t)) s.contracts = true;
    if(s.dueDay) s.contracts = true;
    if(/ملخص|وضع|تقرير|إحصائ|احصائ|شامل|عام|كامل/.test(t)){
      s.contracts=true; s.overdue=true; s.monthly=true; s.daily=true; s.goods=true; s.risk=true;
    }
    // لو ما انطبق شي، أعطه الأساسيات + العقود
    if(!s.contracts && !s.overdue && !s.good && !s.done && !s.payments && !s.risk &&
       !s.monthly && !s.daily && !s.loans && !s.bank && !s.goods && !s.invtx && !s.close){
      s.contracts = true; s.overdue = true;
    }
    return s;
  };

  const buildContext = (q) => {
    const sec = pickSections(q);
    const today = todayLocal();
    let ctx = `=== مؤسسة قمة الفرصة التجارية ===\nتاريخ اليوم: ${today}\n\n`;

    // ── زبون محدد: نرسل ملفه كامل فقط ──
    if(sec.client){

        ctx += `  الواصل: ${_paid(c.id)} | المتبقي: ${_left(c)} | متأخر: ${_overdue(c)} شهر\n`;

          ps.forEach(p=>{ ctx += `    ${p.date||""} — ${_n(p.amount)} ${p.note?("("+p.note+")"):""}\n`; });
        } else ctx += `  لا توجد سدادات\n`;

      return ctx;
    }

    // ── الأساسيات (دائماً) ──
    const totalCash = activeC.reduce((s,c)=>s+_n(c.amount),0);
    const totalInst = activeC.reduce((s,c)=>s+_n(c.totalInst),0);

    const totalLeftAll = activeC.reduce((s,c)=>s+_left(c),0);
    const overdueList = activeC.filter(c=>_overdue(c)>0);
    const monthlyExpected = activeC.reduce((s,c)=>s+_n(c.instAmt),0);

    ctx += `═══ إحصائيات عامة ═══\n`;
    ctx += `عقود نشطة: ${activeC.length} | منتهية: ${doneC.length}\n`;
    ctx += `نقدي: ${totalCash} | أقساط: ${totalInst} | ربح متوقع: ${totalInst-totalCash}\n`;
    ctx += `واصل: ${totalPaidAll} | متبقي: ${totalLeftAll} | نسبة التحصيل: ${totalInst>0?Math.round(totalPaidAll/totalInst*100):0}%\n`;
    ctx += `دخل شهري متوقع: ${monthlyExpected} | متعثرين: ${overdueList.length} (${overdueList.reduce((s,c)=>s+_overdue(c)*_n(c.instAmt),0)} ر.س)\n`;

    ctx += `\n═══ المستثمرون (${investors.length}) ═══\n`;
    investors.forEach(inv=>{

      ctx += `• ${inv.name} (ID:${inv.id}) | رأس المال: ${_n(inv.fund)} | نشطة: ${ic.length} | نقدي: ${ic.reduce((s,c)=>s+_n(c.amount),0)} | أقساط: ${ic.reduce((s,c)=>s+_n(c.totalInst),0)} | واصل: ${ic.reduce((s,c)=>s+_paid(c.id),0)} | متبقي: ${ic.reduce((s,c)=>s+_left(c),0)} | قسط شهري: ${ic.reduce((s,c)=>s+_n(c.instAmt),0)} | متعثرين: ${ic.filter(c=>_overdue(c)>0).length}\n`;
    });

    // ── الأقسام حسب الطلب ──
    if(sec.namesOnly){
      ctx += `\n═══ قائمة كل العقود النشطة (${activeC.length}) ═══\n`;
      ctx += `الرقم. الاسم | القسط | المتبقي | متأخر | يوم الاستحقاق\n`;
      activeC.slice().sort((a,b)=>String(a.client).localeCompare(String(b.client),"ar")).forEach((c,i)=>{
        const dd = c.firstInst ? new Date(c.firstInst).getDate() : "—";
        ctx += `${i+1}. ${c.client} | ${_n(c.instAmt)} | ${_left(c)} | ${_overdue(c)} | ${dd}\n`;
      });
      if(doneC.length){
        ctx += `\n═══ قائمة العقود المنتهية (${doneC.length}) ═══\n`;
        doneC.forEach((c,i)=>{ ctx += `${i+1}. ${c.client}\n`; });
      }
      ctx += `\nملاحظة: هذي القائمة كاملة وغير مقتطعة. اعرضها كلها لو طُلب منك.\n`;
      return ctx;
    }

    if(sec.contracts){
      ctx += `\n═══ العقود النشطة (${activeC.length}) ═══\n`;
      ctx += `رقم|العميل|الجوال|المستثمر|النقدي|الأقساط|القسط|الواصل|المتبقي|متأخر|يوم_الاستحقاق|البضاعة|تاريخ|أول_قسط|النوع|طريقة_السداد|البنك\n`;
      activeC.forEach(c=>{
        const dd = c.firstInst ? new Date(c.firstInst).getDate() : "";
        ctx += `${c.num||""}|${c.client}|${c.cPhone||""}|${_invName(c)}|${_n(c.amount)}|${_n(c.totalInst)}|${_n(c.instAmt)}|${_paid(c.id)}|${_left(c)}|${_overdue(c)}|${dd}|${c.goods||""}|${c.date||""}|${c.firstInst||""}|${c.contractType||"monthly"}|${c.payMethod||"نقدي"}|${c.bankName||""}\n`;
      });
      ctx += `\nملاحظة: "يوم_الاستحقاق" = رقم اليوم من الشهر الذي يستحق فيه القسط (مستخرج من تاريخ أول قسط).\n`;
    }

    if(sec.dueDay){
      const byDay = {};
      activeC.forEach(c=>{
        if(!c.firstInst) return;
        const d = new Date(c.firstInst).getDate();
        if(!byDay[d]) byDay[d] = [];
        byDay[d].push(c);
      });
      const days = Object.keys(byDay).map(Number).sort((a,b)=>a-b);
      ctx += `\n═══ توزيع العملاء حسب يوم الاستحقاق الشهري ═══\n`;
      const noDate = activeC.filter(c=>!c.firstInst).length;
      days.forEach(d=>{
        const list = byDay[d];
        ctx += `\n— يوم ${d} من كل شهر (${list.length} عميل | إجمالي الأقساط: ${list.reduce((s,c)=>s+_n(c.instAmt),0)}):\n`;
        list.forEach((c,i)=>{ ctx += `  ${i+1}. ${c.client} | قسط ${_n(c.instAmt)} | متبقي ${_left(c)} | ${c.cPhone||"—"}${_overdue(c)>0?(" | متأخر "+_overdue(c)+" شهر"):""}\n`; });
      });
      if(noDate) ctx += `\n(${noDate} عقد بدون تاريخ أول قسط محدد)\n`;
      ctx += `\nهذي القائمة كاملة ومصنّفة — استخدمها مباشرة للإجابة عن أي سؤال يخص يوم/تاريخ الاستحقاق.\n`;
    }

    if(sec.overdue && overdueList.length){
      ctx += `\n═══ المتعثرون مرتبين من الأسوأ (${overdueList.length}) ═══\n`;
      overdueList.slice().sort((a,b)=>_overdue(b)-_overdue(a)).forEach(c=>{
        const lp=_lastPay(c.id);
        ctx += `• ${c.client} | متأخر ${_overdue(c)} شهر | مبلغ التأخر: ${_overdue(c)*_n(c.instAmt)} | متبقي: ${_left(c)} | قسط: ${_n(c.instAmt)} | جوال: ${c.cPhone||"—"} | كفيل: ${c.gName||"—"} ${c.gPhone||""} | ${_invName(c)} | آخر سداد: ${lp?lp.date:"لا يوجد"}\n`;
      });

    if(sec.risk){
      const scored = activeC.map(c=>({c, r:riskScore(c)})).sort((a,b)=>b.r.score-a.r.score);
      const hi = scored.filter(x=>x.r.score>=45);
      ctx += `\n═══ تقييم المخاطر التنبؤي (درجة 0-100) ═══\n`;
      ctx += `توزيع: خطر مرتفع ${scored.filter(x=>x.r.score>=70).length} | متوسط ${scored.filter(x=>x.r.score>=45&&x.r.score<70).length} | مراقبة ${scored.filter(x=>x.r.score>=22&&x.r.score<45).length} | آمن ${scored.filter(x=>x.r.score<22).length}\n`;
      ctx += `المبلغ المعرض للخطر (درجة 45+): ${hi.reduce((s,x)=>s+_left(x.c),0)}\n\n`;
      ctx += `العميل|الدرجة|المستوى|المتبقي|القسط|أسباب الخطر|التوصية\n`;
      scored.slice(0,60).forEach(x=>{
        ctx += `${x.c.client}|${x.r.score}|${x.r.level}|${_left(x.c)}|${_n(x.c.instAmt)}|${x.r.reasons.join("، ")||"—"}|${x.r.advice}\n`;
      });
    }

    if(sec.good){
      const good = activeC.filter(c=>_overdue(c)===0 && _paid(c.id)>0);
      ctx += `\n═══ الزبائن المنتظمون (${good.length}) ═══\n`;
      good.slice().sort((a,b)=>_paid(b.id)-_paid(a.id)).slice(0,50).forEach(c=>{
        ctx += `• ${c.client} | واصل: ${_paid(c.id)} | متبقي: ${_left(c)} | نسبة السداد: ${_n(c.totalInst)>0?Math.round(_paid(c.id)/_n(c.totalInst)*100):0}% | عدد سدادات: ${(payments||[]).filter(p=>p.contractId===c.id).length}\n`;
      });

    if(sec.done && doneC.length){
      ctx += `\n═══ العقود المنتهية (${doneC.length}) ═══\n`;
      doneC.forEach(c=>{ ctx += `${c.num||""}|${c.client}|${_invName(c)}|نقدي:${_n(c.amount)}|أقساط:${_n(c.totalInst)}|واصل:${_paid(c.id)}|${c.date||""}|${c.goods||""}\n`; });
    }

    const allPays = _arr(payments).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    if(sec.payments && allPays.length){
      ctx += `\n═══ سجل السدادات — الأحدث أولاً (إجمالي ${allPays.length}) ═══\n`;
      allPays.slice(0,150).forEach(p=>{
        const c = contracts.find(x=>x.id===p.contractId);
        ctx += `${p.date||""}|${c?c.client:"—"}|${_n(p.amount)}|${p.note||""}\n`;
      });

      allPays.forEach(p=>{ const m=String(p.date||"").slice(0,7); if(m) byMonth[m]=(byMonth[m]||0)+_n(p.amount); });
      const mk = Object.keys(byMonth).sort().reverse();

    }

    if(sec.daily){
      const dly = _arr(daily);
      if(dly.length){

        dly.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,150).forEach(d=>{
          ctx += `${d.date||""}|${d.type||""}|${_n(d.amount)}|${d.note||d.desc||""}\n`;
        });
      }
      if(dailyOpen && typeof dailyOpen==="object"){
        const dk = Object.keys(dailyOpen).filter(k=>k!=="__base");
        if(dk.length){
          ctx += `\n═══ أرصدة الصناديق ═══\n`;
          dk.forEach(k=>{ ctx += `${k}: ${typeof dailyOpen[k]==="object"?JSON.stringify(dailyOpen[k]):dailyOpen[k]}\n`; });
        }
      }
    }

    if(sec.loans){
      const ln=_arr(loans), zk=_arr(zakatTx), pd=_arr(pending);
      if(ln.length){ ctx += `\n═══ السلف (${ln.length}) ═══\n`; ln.forEach(l=>{ const i=investors.find(x=>String(x.id)===String(l.investorId)); ctx += `${l.date||""}|${i?i.name:(l.name||"")}|${_n(l.amount)}|${l.note||""}\n`; }); }
      if(zk.length){ ctx += `\n═══ الزكاة (${zk.length}) ═══\n`; zk.forEach(z=>{ const i=investors.find(x=>String(x.id)===String(z.investorId)); ctx += `${z.date||""}|${i?i.name:""}|${_n(z.amount)}|${z.note||""}\n`; }); }
      if(pd.length){ ctx += `\n═══ المبالغ المعلقة (${pd.length}) ═══\n`; pd.forEach(p=>{ ctx += `${p.date||""}|${p.name||p.client||""}|${_n(p.amount)}|${p.note||""}\n`; }); }
    }

    if(sec.bank){
      const btx=_arr(bankTx);
      if(btx.length){
        ctx += `\n═══ الحركات البنكية (${btx.length}) ═══\n`;
        btx.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,120).forEach(b=>{
          ctx += `${b.date||""}|${b.type||""}|${_n(b.amount)}|${b.note||b.desc||""}\n`;

      ctx += `\n═══ توزيع العقود حسب البضاعة ═══\n`;

    if(sec.invtx && invTxList && typeof invTxList==="object"){

        mk.sort().reverse().slice(0,24).forEach(k=>{ const v=monthClose[k]; ctx += `${k}: ${typeof v==="object"?JSON.stringify(v):v}\n`; });
      }
    }

    return ctx;
  };

  // ═══════════ 2) التقرير الصباحي ═══════════
  const buildBrief = () => {
    const today = todayLocal();
    const d = new Date();
    const yest = new Date(d.getTime()-86400000).toISOString().slice(0,10);
    const dayNum = d.getDate();

    const dueToday = activeC.filter(c=>{
      if(!c.firstInst) return false;
      return new Date(c.firstInst).getDate() === dayNum;
    });
    const paidYest = _arr(payments).filter(p=>p.date===yest);
    const paidToday = _arr(payments).filter(p=>p.date===today);
    const od = activeC.filter(c=>_overdue(c)>0).sort((a,b)=>_overdue(b)-_overdue(a));

═══ تقييم المخاطر ═══
لو وصلك جدول "تقييم المخاطر التنبؤي"، فهو محسوب من 5 مؤشرات سلوكية: التأخر الحالي، مدة الانقطاع عن السداد، انتظام السداد تاريخياً، التخلف عن الجدول الزمني، وحجم المبلغ المكشوف. الدرجة 0-100 والمستويات: آمن (<22)، مراقبة (22-44)، خطر متوسط (45-69)، خطر مرتفع (70+).
استخدمه لما يُسأل عن التنبؤ بالتعثر أو ترتيب الأولويات في المتابعة.

مهمتك:
- جاوب على أي سؤال تحليلي من البيانات المُرسلة
- قارن، رتّب، صنّف، احسب نسب، اكتشف أنماط، أعطِ توصيات عملية
- لا تخترع أي رقم — كل رقم لازم يكون من البيانات المُرسلة
- القوائم المُرسلة لك **كاملة وغير مقتطعة**. لا تقل أبداً "زوّدني بالبيانات" أو "البيانات المتاحة محدودة" — لو وصلتك قائمة فاعرضها كلها
- لو طُلبت قائمة طويلة، اعرضها بالكامل ولا تختصرها إلا لو طُلب منك
- لو فعلاً ما وصلك القسم المطلوب، قول: "أعد صياغة السؤال بكلمة أوضح مثل: قائمة/متأخرين/سدادات/يومية"

═══ تنفيذ الأوامر ═══

- استخدم الاسم الكامل للعميل كما هو في البيانات بالضبط
- لا تنفذ أمر إلا لو طُلب صراحة
- اكتب جملة قصيرة تشرح الأمر قبل كتلة الـ JSON
- عبدالله سيؤكد الأمر قبل التنفيذ، فلا تسأله للتأكيد

═══ الرسوم البيانية ═══
لو السؤال عن مقارنة أو تطور زمني، أرفق:
\`\`\`chart
{"title":"عنوان الرسم","data":[{"label":"يناير","value":15000},{"label":"فبراير","value":22000}]}
\`\`\`

═══ المصطلحات ═══
- كل المبالغ بالريال السعودي
- "النقدي" = قيمة البضاعة الأصلية | "الأقساط" = إجمالي ما يدفعه الزبون (نقدي + ربح)
- "الواصل" = المدفوع | "المتبقي" = الأقساط − الواصل

═══ صفحات النظام ═══
- لو طلب الدفتر الخاص، وجّهه للإعدادات — آخر الصفحة يضغط النقاط الثلاث
- "متأخر X شهر" = عدد الأقساط المستحقة وغير المدفوعة
- contractType: monthly=شهري، defer=مؤجل، migrated=مرحّل من النظام القديم

═══ اقتراحات المتابعة ═══
في نهاية كل رد، أضف 3 أسئلة متابعة قصيرة (أقل من 6 كلمات لكل سؤال) ذات صلة بما أجبت عنه:
\`\`\`follow
السؤال الأول
السؤال الثاني
السؤال الثالث
\`\`\`

═══ التنسيق ═══
لما تعرض بيانات فيها أكثر من عمود (قوائم عملاء، مقارنات، أرقام)، استخدم **جدول Markdown** بهذي الصيغة:
| م | الاسم | القسط | المتبقي |
|---|---|---|---|
| 1 | محمد أحمد | 800 | 9,800 |

- لا تقل "لا أستطيع" أو "أعتذر" أو "للأسف" — حاول دائماً تلبية الطلب
- لو أرسل لك صور، اقرأها بالكامل واستخرج كل المعلومات بدون ما تقول "الصورة غير واضحة"

- أنت مساعد ذكي شامل، مو فقط محاسبي — ساعد عبدالله في أي شيء يطلبه
- تذكّر كل ما قيل في المحادثة واستخدمه في إجاباتك — لا تنسى أي معلومة سابقة
- لو طلب طباعة كشف أو تقرير، اعرضه بجدول Markdown منسق وجاهز للطباعة
- لو طلب أيقونات أو رموز معينة في الكشف، استخدمها بالضبط كما طلب
- عندك كل بيانات المؤسسة: العقود، السدادات، المستثمرين، المخاطر، اليومية — استخدمها كلها للإجابة بدقة

      if(data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts){
        return {ok:true, text: data.candidates[0].content.parts.map(function(p){return p.text||"";}).join("")};
      }
      const msg = (data.error && data.error.message) ? data.error.message : "لم أستطع الإجابة";
      const retryable = /no longer available|not found|not supported|is not available|deprecated|shut down|not compatible|does not support/i.test(msg);
      // إذا الخطأ بسبب googleSearch جرّب بدونه
      if(body.tools && body.tools.length && /tool|google|search|not support/i.test(msg)){
        var bodyNoTools = Object.assign({}, body); delete bodyNoTools.tools;
        var resp2 = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
          { method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":aiKey}, body: JSON.stringify(bodyNoTools) }
        );
        var data2 = await resp2.json();
        if(data2.candidates && data2.candidates[0] && data2.candidates[0].content && data2.candidates[0].content.parts){
          return {ok:true, text: data2.candidates[0].content.parts.map(function(p){return p.text||"";}).join("")};
        }
      }
      return {ok:false, msg:msg, retryable:retryable};

      return {ok:false, msg: e.message||"خطأ في الاتصال", retryable:true};
    }

// ─── Search Page ─────────────────────────────────────────────
function SearchPage({contracts, investors, settings, payments, setPayments, toast, setPage}) {
  const [q, setQ] = useState("");
  const [payModal, setPayModal] = useState(null);
  const [payAmount, setPayAmount] = useState("");
  const [payDate, setPayDate] = useState(todayLocal());

  const results = q.length >= 2 ? contracts.filter(c =>
    c.client?.includes(q) ||
    c.gName?.includes(q) ||
    c.idNum?.includes(q) ||
    c.cPhone?.includes(q) ||
    c.gId?.includes(q) ||
    c.gPhone?.includes(q)
  ) : [];

  const active = results.filter(c => {
    const paid = _getPaid(payments, c.id);
    return paid < (c.totalInst||0);
  });
  const done = results.filter(c => {
    const paid = _getPaid(payments, c.id);
    return paid >= (c.totalInst||0);
  });

  const addPay = () => {
    if(!payAmount||!payModal) return;
    const amt = parseFloat(payAmount);
    setPayments(p=>[...p,{id:Date.now(),contractId:payModal.id,amount:amt,date:payDate}]);
    toast("✅ تم تسجيل الدفعة");
    setPayModal(null);
    setPayAmount("");
  };

  const ContractCard = ({c, isDone}) => {
    const inv = investors.find(i=>String(i.id)===String(c.investorId));
    const paid = _getPaid(payments, c.id);
    const left = Math.max(0,(c.totalInst||0)-paid);
    const pct = c.totalInst>0 ? Math.min(100,Math.round(paid/c.totalInst*100)) : 0;
    const risk = assessRisk(c, payments);
    return (
      <div style={{...styles.panel,marginBottom:12,borderRight:`4px solid ${isDone?C.green:C.teal}`}}>
        <div style={{padding:"14px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontWeight:800,fontSize:17,color:C.ink}}>{c.client}</div>
              <div style={{fontSize:14,color:"#1f2937"}}>عقد #{c.num} | {c.date} | {inv?invLabel(inv):"—"}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
              <span style={styles.badge(isDone?C.greenLt:C.tealLt, isDone?C.green:C.teal)}>
                {isDone?"✅ منتهي":"⏳ ساري"}
              </span>
              {!isDone && risk.level!=="—" && (
                <span style={{background:risk.color,color:"#fff",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:800,whiteSpace:"nowrap"}}>
                  ● {risk.level}{risk.months>0?(" ("+risk.months+" شهر)"):""}
                </span>
              )}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:10,fontSize:15}}>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>إجمالي العقد</div>
              <div style={{fontWeight:800,color:C.ink}}>{SAR(c.totalInst||0)}</div>
            </div>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>رأس المال</div>
              <div style={{fontWeight:800,color:C.ink}}>{SAR(c.amount||0)}</div>
            </div>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>القسط</div>
              <div style={{fontWeight:800,color:C.ink}}>{SAR(c.instAmt||0)}</div>
            </div>
            <div style={{background:C.greenLt,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>الواصل</div>
              <div style={{fontWeight:800,color:C.green}}>{SAR(paid)}</div>
            </div>
            <div style={{background:left<=0?C.greenLt:C.redLt,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>المتبقي</div>
              <div style={{fontWeight:800,color:left<=0?C.green:C.red}}>{SAR(left)}</div>
            </div>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>نسبة السداد</div>
              <div style={{fontWeight:800,color:C.teal}}>{pct}%</div>
            </div>
          </div>
          <div style={{background:"#f0f0f0",borderRadius:99,height:6,marginBottom:10}}>
            <div style={{background:isDone?C.green:C.teal,borderRadius:99,height:6,width:pct+"%"}}></div>
          </div>
          {!isDone && (
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button style={{...styles.btn(C.teal),flex:1}} onClick={()=>{setPayModal(c);setPayAmount("");}}>
                💰 تسجيل دفعة
              </button>
              {(c.instAmt||0)>0 && (
                <button style={{...styles.btn(C.green),flex:1}} onClick={()=>{
                  const amt = parseFloat(c.instAmt)||0;
                  if(amt<=0) return;
                  const rem = Math.max(0,(c.totalInst||0)-paid);
                  const pay = Math.min(amt, rem);
                  if(!window.confirm("تسجيل سداد قسط "+SAR(pay)+" للعميل "+c.client+" بتاريخ اليوم؟")) return;
                  setPayments(p=>[...p,{id:Date.now(),contractId:c.id,amount:pay,date:todayLocal(),note:"قسط"}]);
                  toast("✅ تم تسجيل القسط");
                }}>
                  ⚡ سدّد القسط
                </button>
              )}
            </div>
          )}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontSize:19,fontWeight:800}}>🔍 البحث</div>
        <button style={{...styles.btn("#64748b","#fff"),fontSize:15,padding:"8px 16px"}} onClick={()=>setPage&&setPage("dashboard")}>← رجوع</button>
      </div>
      <div style={{...styles.card,marginBottom:20}}>
        <input
          style={{...styles.input,fontSize:17,padding:"12px 16px"}}
          placeholder="ابحث باسم العميل، الكفيل، رقم الهوية، أو الجوال..."
          value={q}
          onChange={e=>setQ(e.target.value)}
          autoFocus
        />
        {q.length===1 && <div style={{fontSize:15,color:"#1f2937",marginTop:6}}>اكتب حرفين على الأقل للبحث</div>}
      </div>

      {q.length>=2 && results.length===0 && (
        <div style={{...styles.panel,padding:40,textAlign:"center",color:"#1f2937"}}>لا توجد نتائج</div>
      )}

      {active.length>0 && (
        <div style={{marginBottom:20}}>
          <div style={{fontSize:16,fontWeight:800,marginBottom:12,color:C.teal}}>⏳ العقود السارية ({active.length})</div>
          {active.map(c=><ContractCard key={c.id} c={c} isDone={false}/>)}
        </div>
      )}

      {done.length>0 && (
        <div>
          <div style={{fontSize:16,fontWeight:800,marginBottom:12,color:C.green}}>✅ العقود المنتهية ({done.length})</div>
          {done.map(c=><ContractCard key={c.id} c={c} isDone={true}/>)}
        </div>
      )}

      {/* Pay Modal */}
      <Modal open={!!payModal} onClose={()=>setPayModal(null)} title="💰 تسجيل دفعة">
        {payModal && (
          <div style={{padding:"14px 18px"}}>
            <div style={{fontWeight:700,marginBottom:4}}>{payModal.client}</div>
            <div style={{fontSize:15,color:"#1f2937",marginBottom:16}}>المتبقي: {SAR(Math.max(0,(payModal.totalInst||0)-_getPaid(payments,payModal.id)))}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              <div>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>المبلغ</label>
                <input style={styles.input} type="number" value={payAmount} onChange={e=>setPayAmount(e.target.value)} placeholder="المبلغ"/>
              </div>
              <div>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>التاريخ</label>
                <input style={styles.input} type="date" value={payDate} onChange={e=>setPayDate(e.target.value)}/>
              </div>
            </div>
            <button style={styles.btn(C.teal)} onClick={addPay}>💾 حفظ</button>
          </div>
        )}
      </Modal>
    </div>
  );
}


// ─── Overdue Page (المتأخرون) ───────────────────────────────────
// ══════════════════════════════════════════════════════════════
// ⚡ صفحة التحصيل — تصميم أبيض + بطاقات مستثمرين + مؤشر دائري
// ══════════════════════════════════════════════════════════════
function CollectionPage({contracts, investors, settings, payments, setPayments, toast, logAct, doneIds, markDone, setContracts, activeContracts}) {
  const [colDate, setColDate] = useState(todayLocal());
  const [selInv, setSelInv] = useState(null); // المستثمر المختار (null = شاشة الاختيار)
  const [viewMode, setViewMode] = useState("collect"); // collect = التحصيل | overdue = المتعثرون
  const [colSearch, setColSearch] = useState("");
  const [colAmts, setColAmts] = useState({});
  const [expanded, setExpanded] = useState({});
  const gP = (cid) => (payments||[]).filter(p=>p.contractId===cid).reduce((s,p)=>s+(+p.amount||0),0);

  // ألوان المستثمرين
  const invColors=["#6366f1","#0d9488","#e11d48","#ea580c","#0284c7","#7c3aed","#059669","#b45309","#dc2626","#4f46e5","#0891b2"];
  const getInvColor=(idx)=>invColors[idx%invColors.length];

  // كل العقود النشطة مع الحسابات
  const allRows = contracts.filter(c=>!c.deleted && !doneIds.includes(c.id))
    .map(c=>{
      const paid=gP(c.id), left=Math.max(0,(c.totalInst||0)-paid);
      let lateAmt=0; const inst=c.instAmt||0;
      if(left>0 && inst>0 && c.firstInst){
        const fd=new Date(c.firstInst), nd=new Date(colDate);
        let md=(nd.getFullYear()-fd.getFullYear())*12+(nd.getMonth()-fd.getMonth());
        if(nd.getDate()>=fd.getDate()) md+=1;
        if(md<0) md=0;
        lateAmt=Math.min(Math.max(0,md*inst-paid),left);
      }
      return {...c,paid,left,lateAmt};
    })
    .filter(c=>c.left>0);

  // إحصائيات اليوم
  const dayPays=(payments||[]).filter(p=>p.date===colDate);
  const cntToday=new Set(dayPays.map(p=>p.contractId)).size;
  const sumToday=dayPays.reduce((s,p)=>s+(+p.amount||0),0);

  // تجميع حسب المستثمر لشاشة الاختيار
  const invCards = sortedInvestors(investors).map((inv,idx)=>{
    const items=allRows.filter(c=>String(c.investorId)===String(inv.id));
    const lateCount=items.filter(c=>c.lateAmt>0).length;
    const totalInst=items.reduce((s,c)=>s+(c.instAmt||0),0);
    return {inv, items, lateCount, totalInst, color:getInvColor(idx)};
  }).filter(g=>g.items.length>0);

  // عقود المستثمر المختار
  const selRows = selInv ? _sortContracts(allRows
    .filter(c=>String(c.investorId)===String(selInv.id))
    .filter(c=>!colSearch||c.client.includes(colSearch)||(c.cPhone||"").includes(colSearch)))
    : [];

  const doCollect=(c)=>{
    const amt=parseFloat(colAmts[c.id]!=null?colAmts[c.id]:c.instAmt)||0;
    if(amt<=0){toast("⚠️ المبلغ غير صحيح","warn");return;}
    const realAmt=Math.min(amt,c.left);
    if(!window.confirm("تأكيد سداد "+SAR(realAmt)+" لـ "+c.client+"؟")) return;
    const newPaid=c.paid+realAmt;
    setPayments(p=>[...p,{id:Date.now()+Math.floor(Math.random()*1000),contractId:c.id,amount:realAmt,date:colDate,note:"تحصيل"}]);
    if(newPaid>=(c.totalInst||0)){
      toast("🎉 "+c.client+" — تم سداد العقد بالكامل!","success");
      setTimeout(()=>{
        if(window.confirm("✅ عقد "+c.client+" انتهى بالكامل.\nهل تريد إقفاله ونقله للعقود المنتهية؟")){
          markDone(c.id);
          toast("📁 تم إقفال العقد ونقله للمنتهية");
        }
      },300);
    } else {
      toast("✅ "+c.client+" — "+SAR(realAmt));
    }
    setColAmts(p=>({...p,[c.id]:""}));
    if(logAct) logAct("تحصيل","سداد",(c.client+" — "+SAR(realAmt)));
  };

  const toggle=(id)=>setExpanded(p=>({...p,[id]:!p[id]}));

  // مؤشر دائري SVG
  const CircleProgress=({pct,size=44,stroke=4})=>{
    const r=(size-stroke)/2, circ=2*Math.PI*r;
    const offset=circ-(Math.min(pct,100)/100)*circ;
    const clr=pct>=70?"#22c55e":pct>=30?"#f59e0b":"#ef4444";
    return React.createElement("svg",{width:size,height:size,style:{transform:"rotate(-90deg)",flexShrink:0}},
      React.createElement("circle",{cx:size/2,cy:size/2,r:r,fill:"none",stroke:"#e5e7eb",strokeWidth:stroke}),
      React.createElement("circle",{cx:size/2,cy:size/2,r:r,fill:"none",stroke:clr,strokeWidth:stroke,strokeDasharray:circ,strokeDashoffset:offset,strokeLinecap:"round",style:{transition:"stroke-dashoffset 0.5s ease"}}),
      React.createElement("text",{x:size/2,y:size/2,textAnchor:"middle",dominantBaseline:"central",fill:clr,fontSize:size*0.26,fontWeight:900,style:{transform:"rotate(90deg)",transformOrigin:"center"}},pct+"%")
    );
  };

  // ─── هيدر مشترك ───
  const Header=({title})=>(
    React.createElement("div",{style:{background:"linear-gradient(135deg,#0f1923,#1a2744)",borderRadius:16,padding:"16px 18px",marginBottom:16,color:"#fff"}},
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
        React.createElement("div",{style:{fontSize:11,color:"rgba(255,255,255,0.5)"}},"\u0642\u0645\u0629 \u0627\u0644\u0641\u0631\u0635\u0629"),
        React.createElement("div",{style:{fontSize:11,color:"rgba(255,255,255,0.5)"}},"محصّل اليوم")
      ),
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
        React.createElement("div",{style:{fontSize:20,fontWeight:900}},title),
        React.createElement("div",{style:{fontSize:28,fontWeight:900,color:"#34d399"}},cntToday)
      ),
      sumToday>0 && React.createElement("div",{style:{textAlign:"left",fontSize:13,color:"#34d399",fontWeight:700,marginTop:4}},SAR(sumToday)+" ريال")
    )
  );

  // ═══════════════════════════════════════
  // شاشة 1: اختيار المستثمر (البطاقات)
  // ═══════════════════════════════════════
  if(!selInv){
    return (
      React.createElement("div",{style:{minHeight:"80vh"}},
        React.createElement(Header,{title:"التحصيل"}),
        // ── تبويبا الحالة: التحصيل / المتعثرون ──
        React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}},
          React.createElement("button",{onClick:()=>setViewMode("collect"),
            style:{padding:"13px",borderRadius:13,border:viewMode==="collect"?"none":"2px solid #e6eaf0",
              background:viewMode==="collect"?"linear-gradient(135deg,#1a1a2e,#0f3460)":"#fff",
              color:viewMode==="collect"?"#e0b85c":"#64748b",fontWeight:800,fontSize:14.5,cursor:"pointer",
              fontFamily:"IBM Plex Sans Arabic,Arial",display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
            React.createElement("svg",{width:18,height:18,viewBox:"0 0 24 24"},
              React.createElement("g",{fill:"none",stroke:viewMode==="collect"?"#e0b85c":"#8b93a7",strokeWidth:1.75,strokeLinecap:"round",strokeLinejoin:"round",dangerouslySetInnerHTML:{__html:'<path d="M13.6 3.2 6.6 13.4h4.6L10.4 20.8l7-10.2h-4.6Z"/>'}})
            ),
            "التحصيل"

          React.createElement("button",{onClick:()=>setViewMode("overdue"),
            style:{padding:"13px",borderRadius:13,border:viewMode==="overdue"?"none":"2px solid #e6eaf0",

              fontFamily:"IBM Plex Sans Arabic,Arial",display:"flex",alignItems:"center",justifyContent:"center",gap:8}},
            React.createElement("svg",{width:18,height:18,viewBox:"0 0 24 24"},
              React.createElement("g",{fill:"none",stroke:viewMode==="overdue"?"#e0b85c":"#8b93a7",strokeWidth:1.75,strokeLinecap:"round",strokeLinejoin:"round",dangerouslySetInnerHTML:{__html:'<path d="M12 4.2 21.4 20.4H2.6Z"/><path d="M12 10.2v4.4"/>'}}),
              React.createElement("g",{fill:viewMode==="overdue"?"#e0b85c":"#8b93a7",dangerouslySetInnerHTML:{__html:'<circle cx="12" cy="17.4" r="1.25"/>'}})

            (()=>{const n=invCards.reduce((s,g)=>s+g.lateCount,0); return n>0?React.createElement("span",{style:{fontSize:12,opacity:.85}},"("+n+")"):null;})()

              React.createElement("div",{style:{display:"flex",gap:8,marginBottom:14,alignItems:"center",flexWrap:"wrap"}},
                React.createElement("label",{style:{fontSize:13,fontWeight:700,color:"#374151"}},"📅"),
                React.createElement("input",{type:"date",value:colDate,onChange:e=>setColDate(e.target.value),style:{...styles.input,width:"auto",flex:1}})

              invCards.length===0

function OverduePage({contracts, investors, payments, goCollect, onFlag}) {
  const [filterInv, setFilterInv] = React.useState("all");
  const active = (contracts||[]).filter(c => !c.deleted);

  const calcOverdue = (c) => {
    const instAmt = +c.instAmt || 0;
    const totalInst = +c.totalInst || +c.amount || 0;
    if(instAmt <= 0 || !c.firstInst) return null;
    const ps = (payments||[]).filter(p => p.contractId === c.id);
    const paidTotal = ps.reduce((s,p)=>s+(+p.amount||0), 0);
    const remaining = Math.max(0, totalInst - paidTotal);
    if(remaining <= 0) return null;
    const totalCount = Math.max(1, Math.round(totalInst / instAmt));
    const first = new Date(c.firstInst);
    const now = new Date();
    let monthsElapsed = (now.getFullYear()-first.getFullYear())*12 + (now.getMonth()-first.getMonth());
    if(now.getDate() >= first.getDate()) monthsElapsed += 1;
    monthsElapsed = Math.max(0, monthsElapsed);
    const due = Math.min(monthsElapsed, totalCount);
    const paidCount = Math.floor(paidTotal / instAmt);
    const monthsBehind = Math.max(0, due - paidCount);
    const overdueAmt = monthsBehind * instAmt;
    return {monthsBehind, overdueAmt, remaining, paidTotal};
  };

  const allRows = active.map(c => ({c, o: calcOverdue(c)}));
  const autoRows = allRows.filter(x => x.o && x.o.monthsBehind >= 3);
  const manualOnly = allRows.filter(x => x.c.defaulter && (!x.o || x.o.monthsBehind < 3));
  const rows = [...autoRows, ...manualOnly].sort((a,b)=>(b.o?b.o.monthsBehind:0)-(a.o?a.o.monthsBehind:0));

  const grouped = {};
  rows.forEach(x => {
    const iid = String(x.c.investorId);
    if(filterInv!=="all" && iid!==filterInv) return;
    if(!grouped[iid]) grouped[iid]={inv:investors.find(i=>String(i.id)===iid), items:[]};
    grouped[iid].items.push(x);
  });
  // إضافة كل المستثمرين حتى لو ما عندهم متعثرين
  const invList = filterInv==="all" ? sortedInvestors(investors) : investors.filter(i=>String(i.id)===filterInv);
  invList.forEach(iv=>{
    const iid=String(iv.id);
    if(!grouped[iid]) grouped[iid]={inv:iv, items:[]};
  });
  const groups = Object.values(grouped).sort((a,b)=>{
    const na=a.inv?(a.inv.code||a.inv.name):"", nb=b.inv?(b.inv.code||b.inv.name):"";
    const ma=String(na).match(/(\d+)/), mb=String(nb).match(/(\d+)/);
    return (ma?parseInt(ma[1]):9999)-(mb?parseInt(mb[1]):9999);
  });

  const filtered = rows.filter(x=>filterInv==="all"||String(x.c.investorId)===filterInv);
  const totalDefaulters = filtered.length;
  const totalOverdue = filtered.reduce((s,x)=>s+(x.o?x.o.overdueAmt:0),0);
  const totalRemaining = filtered.reduce((s,x)=>{
    const paid=(payments||[]).filter(p=>p.contractId===x.c.id).reduce((ss,p)=>ss+(p.amount||0),0);
    return s+Math.max(0,(+x.c.totalInst||0)-paid);
  },0);
  const totalContracts = filtered.length;

  return (
    <div style={styles.main}>
      <div style={{...styles.panel,borderTop:"4px solid "+C.red}}>
        <div style={{padding:"16px 20px"}}>
          <h2 style={{margin:"0 0 14px",fontSize:19,fontWeight:900,color:C.ink,display:"flex",alignItems:"center",gap:8}}>
            <svg width="21" height="21" viewBox="0 0 24 24"><g fill="none" stroke="#dc2626" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4.2 21.4 20.4H2.6Z"/><path d="M12 10.2v4.4"/></g><circle cx="12" cy="17.4" r="1.25" fill="#dc2626"/></svg>
            المتعثرون</h2>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",marginBottom:14}}>
            <div style={{flex:1,minWidth:100,background:"linear-gradient(135deg,#1a1a2e,#0f3460)",borderRadius:10,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:13,color:"#fff",fontWeight:700,opacity:0.85}}>عدد المتعثرين</div>
              <div style={{fontSize:26,fontWeight:900,color:"#fff"}}>{totalDefaulters}</div>
            </div>
            <div style={{flex:1,minWidth:100,background:"linear-gradient(135deg,#1a1a2e,#0f3460)",borderRadius:10,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:13,color:"#fff",fontWeight:700,opacity:0.85}}>المبالغ المتأخرة</div>
              <div style={{fontSize:20,fontWeight:900,color:"#e0b85c"}}>{NUM(totalOverdue)}</div>
            </div>
            <div style={{flex:1,minWidth:100,background:"linear-gradient(135deg,#1a1a2e,#0f3460)",borderRadius:10,padding:"12px 14px",textAlign:"center"}}>
              <div style={{fontSize:13,color:"#fff",fontWeight:700,opacity:0.85}}>إجمالي المتبقي</div>
              <div style={{fontSize:20,fontWeight:900,color:"#fff"}}>{NUM(totalRemaining)}</div>
            </div>
          </div>
          <select style={{...styles.select,marginBottom:0}} value={filterInv} onChange={e=>setFilterInv(e.target.value)}>
            <option value="all">كل المستثمرين</option>
            {sortedInvestors(investors).map(i=><option key={i.id} value={i.id}>{invLabel(i)}</option>)}
          </select>
        </div>
      </div>

      {groups.length===0 && (
        <div style={{...styles.panel,textAlign:"center",padding:40,color:"#6b7280",fontSize:16}}>✅ لا يوجد متعثرون</div>
      )}
      {groups.map(g=>{
        const gRemaining = g.items.reduce((s,x)=>{const pd=(payments||[]).filter(p=>p.contractId===x.c.id).reduce((ss,p)=>ss+(p.amount||0),0);return s+Math.max(0,(+x.c.totalInst||0)-pd);},0);
        const gPaid = g.items.reduce((s,x)=>(payments||[]).filter(p=>p.contractId===x.c.id).reduce((ss,p)=>ss+(p.amount||0),s),0);
        const gTotal = g.items.reduce((s,x)=>s+(+x.c.totalInst||0),0);
        const gCash = g.items.reduce((s,x)=>s+(+x.c.amount||0),0);
        return (
        <div key={g.inv?g.inv.id:"x"} style={styles.panel}>
          <div style={{...styles.panelHdr,background:"#1e2235",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:900,color:"#fff"}}>{g.inv?invLabel(g.inv):"—"}</h3>
            <span style={{background:C.red,color:"#fff",borderRadius:20,padding:"3px 14px",fontSize:14,fontWeight:800}}>{g.items.length} متعثر</span>
          </div>
          <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr style={{background:"#f1f5f9"}}>

                )}
                {g.items.map((x,xi)=>{
                  const {c,o} = x;
                  const paid = (payments||[]).filter(p=>p.contractId===c.id).reduce((s,p)=>s+(p.amount||0),0);
                  const left = Math.max(0,(+c.totalInst||0)-paid);
