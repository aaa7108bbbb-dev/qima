              </div>)}
            </div>);
          })}
          </div>
        </div>);
      })()}
      {/* Statement Modal */}
      <Modal open={!!yearInv} onClose={()=>setYearInv(null)} title={"📅 كشف سنوي — "+(yearInv?.name||"")} titleBg={C.gold} wide>
        {yearInv && (()=>{
          const myCon = contracts.filter(c=>c.investorId===yearInv.id);
          const myTx = (txList[yearInv.id]||[]);
          const capital = yearInv.capital||0;
          // النقدي حتى نهاية تاريخ معيّن
          const cashUpto = (end) => {
            let v = capital;
            myCon.forEach(c=>{ if(new Date(c.date) <= end){ const r=calcC(c,settings); v -= (c.amount + r.acc + r.inst + r.admin); } });
            (payments||[]).forEach(p=>{ if(myCon.find(c=>c.id===p.contractId) && new Date(p.date) <= end){ v += (+p.amount||0); } });
            myTx.forEach(t=>{ if(t.date && new Date(t.date) <= end){ v += (+t.amount||0); } });
            return v;
          };
          // المتبقي عند الناس حتى نهاية تاريخ
          const remainUpto = (end) => {
            let v = 0;
            myCon.forEach(c=>{ if(new Date(c.date) <= end){
              const tot = +c.totalInst || +c.amount || 0;
              const paid = (payments||[]).filter(p=>p.contractId===c.id && new Date(p.date)<=end).reduce((s,p)=>s+(+p.amount||0),0);
              v += Math.max(0, tot - paid);
            }});
            return v;
          };
          // نطاق الشهور: من أقدم عقد إلى اليوم
          let earliest = new Date();
          myCon.forEach(c=>{ const d=new Date(c.date); if(d<earliest) earliest=d; });
          if(myCon.length===0) earliest = new Date();
          const now = new Date();
          const months = [];
          let y=earliest.getFullYear(), m=earliest.getMonth();
          while(y<now.getFullYear() || (y===now.getFullYear() && m<=now.getMonth())){
            const isCurrent = (y===now.getFullYear() && m===now.getMonth());
            const end = isCurrent ? now : new Date(y, m+1, 0, 23,59,59); // الشهر الحالي: لحظي حتى اليوم، غيره: آخر الشهر
            months.push({label:`${String(m+1).padStart(2,"0")}/${y}`+(isCurrent?" • حتى اليوم":""), cash:cashUpto(end), remain:remainUpto(end), total:cashUpto(end)+remainUpto(end)});
            m++; if(m>11){m=0;y++;}
          }
          const totals = months.map(x=>x.total);
          const maxT = Math.max(...totals), minT = Math.min(...totals);
          const avgT = totals.reduce((s,v)=>s+v,0)/(totals.length||1);
          const maxMonth = months.find(x=>x.total===maxT), minMonth = months.find(x=>x.total===minT);
          return (
            <div style={{padding:16}}>
              <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:110,background:C.greenLt,borderRadius:8,padding:10,textAlign:"center"}}><div style={{fontSize:12,color:"#1f2937"}}>أعلى شهر</div><div style={{fontWeight:900,color:C.green,fontSize:16}}>{NUM(maxT)}</div><div style={{fontSize:11,color:"#1f2937"}}>{maxMonth?.label}</div></div>
                <div style={{flex:1,minWidth:110,background:C.redLt,borderRadius:8,padding:10,textAlign:"center"}}><div style={{fontSize:12,color:"#1f2937"}}>أقل شهر</div><div style={{fontWeight:900,color:C.red,fontSize:16}}>{NUM(minT)}</div><div style={{fontSize:11,color:"#1f2937"}}>{minMonth?.label}</div></div>
                <div style={{flex:1,minWidth:110,background:C.gray,borderRadius:8,padding:10,textAlign:"center"}}><div style={{fontSize:12,color:"#1f2937"}}>المتوسط</div><div style={{fontWeight:900,color:C.ink,fontSize:16}}>{NUM(Math.round(avgT))}</div></div>
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                  <thead><tr style={{background:C.ink,color:"#fff"}}>
                    <th style={styles.th}>الشهر</th><th style={styles.th}>النقدي</th><th style={styles.th}>المتبقي</th><th style={styles.th}>الإجمالي</th><th style={styles.th}>التغيّر %</th>
                  </tr></thead>
                  <tbody>
                    {months.map((x,i)=>{
                      const prev = i>0 ? months[i-1].total : null;
                      const pct = (prev!=null && prev!==0) ? ((x.total-prev)/Math.abs(prev)*100) : null;
                      const up = pct!=null && pct>=0;
                      return (
                        <tr key={i} style={{background:i%2?C.gray:"#fff"}}>
                          <td style={{...styles.td,fontWeight:700}}>{x.label}</td>
                          <td style={styles.td}>{NUM(Math.round(x.cash))}</td>
                          <td style={{...styles.td,color:C.red}}>{NUM(Math.round(x.remain))}</td>
                          <td style={{...styles.td,fontWeight:800,color:C.ink}}>{NUM(Math.round(x.total))}</td>
                          <td style={{...styles.td,fontWeight:800,color: pct==null?"#999":(up?C.green:C.red)}}>{pct==null?"—":(up?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"%"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        })()}
      </Modal>

      {/* Statement Modal */}
      <Modal open={!!stmtInv} onClose={()=>setStmtInv(null)} title={"📋 كشف حساب — "+(stmtInv?.name||"")} titleBg={C.ink} wide>
        {stmtInv && (()=>{
          const _grp = stmtInv.__group;
          const _grpIds = _grp ? _grp.map(i=>i.id) : [stmtInv.id];
          const myCon = contracts.filter(c=>_grpIds.includes(c.investorId));
          const totalAmt   = myCon.reduce((s,c)=>s+c.amount,0);
          const totalPaid  = myCon.reduce((s,c)=>s+_getPaid(payments,c.id),0);
          const totalLeft  = myCon.reduce((s,c)=>s+Math.max(0,(c.totalInst||0)-_getPaid(payments,c.id)),0);
          const _autoC = myCon.reduce((s,c)=>{const rr=calcC(c,settings);return s-(c.amount+rr.acc+rr.inst+rr.admin);},0);
          const _paySum = (payments||[]).filter(p=>myCon.some(c=>c.id===p.contractId)).reduce((s,p)=>s+(p.amount||0),0);
          const _manSum = _grp ? _grp.reduce((s,i)=>s+((txList&&txList[i.id]||[]).reduce((ss,t)=>ss+(t.amount||0),0)),0)
            : ((txList&&txList[stmtInv.id])||[]).reduce((s,t)=>s+(t.amount||0),0);
          const _capSum = _grp ? _grp.reduce((s,i)=>s+(+i.capital||0),0) : (stmtInv.capital||0);
          const netCashStmt = _capSum + _autoC + _paySum + _manSum;
          const totalProfit= myCon.reduce((s,c)=>s+calcC(c,settings).net,0);
          return (
            <div id="stmt-print-area" style={{padding:"16px 20px"}}>
              {/* رأس الطباعة (يظهر فقط عند الطباعة) */}
              <div className="print-only-header" style={{display:"none"}}>
                <div style={{textAlign:"center",borderBottom:"2px solid #000",paddingBottom:10,marginBottom:14}}>
                  <div style={{fontSize:18,fontWeight:900}}>مؤسسة قمة الفرصة التجارية</div>
                  <div style={{fontSize:13}}>كشف حساب — {stmtInv.name}</div>
                  <div style={{fontSize:12,color:"#1f2937"}}>التاريخ: {fmtDate(new Date())}</div>
                </div>
              </div>
              {/* Type switcher */}
              <div style={{display:"flex",gap:0,marginBottom:16,background:C.slate,borderRadius:8,overflow:"hidden",width:"fit-content"}}>
                {[["brief","📄 مختصر"],["detailed","📋 مفصل"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setStmtType(k)}
                    style={{fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:15,fontWeight:700,padding:"8px 18px",border:"none",
                      cursor:"pointer",background:stmtType===k?C.ink:C.slate,color:stmtType===k?"white":C.ink2}}>
                    {l}
                  </button>
                ))}
                <button style={{...styles.btn(C.gold),fontSize:15,padding:"8px 16px",borderRadius:0}} onClick={()=>printStatement("stmt-print-area")}>🖨️ طباعة</button>
              </div>

              {/* Summary cards */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:16}}>
                <div style={{background:C.tealLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>عدد العقود</div>
                  <div style={{fontSize:20,fontWeight:800,color:C.teal}}>{myCon.length}</div>
                </div>
                <div style={{background:C.slate,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>إجمالي القيم</div>
                  <div style={{fontSize:16,fontWeight:800}}>{SAR(totalAmt)}</div>
                </div>
                <div style={{background:C.greenLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>محصّل</div>
                  <div style={{fontSize:16,fontWeight:800,color:C.green}}>{SAR(totalPaid)}</div>
                </div>
                <div style={{background:totalLeft===0?C.greenLt:C.redLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>متبقي</div>
                  <div style={{fontSize:16,fontWeight:800,color:totalLeft===0?C.green:C.red}}>{SAR(totalLeft)}</div>
                </div>
                <div style={{background:C.purpleLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>صافي ربحه</div>
                  <div style={{fontSize:16,fontWeight:800,color:C.purple}}>{SAR(totalProfit)}</div>
                </div>
              </div>

              {/* Table */}
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                  <thead>
                    {stmtType==="brief" ? (
                      <tr>{["#","العميل","قيمة العقد","الإجمالي","القسط","محصّل","متبقي","الحالة"].map(h=>(
                        <th key={h} style={styles.th}>{h}</th>
                      ))}</tr>
                    ) : (
                      <tr>{["#","العميل","الهوية","العمل","الكفيل","البضاعة","العدد","قيمة العقد","الإجمالي","القسط","محصّل","متبقي","أول قسط","آخر قسط","الربح","ع.محاسبين","ن.مؤسسة","صافي المستثمر","الحالة"].map(h=>(
                        <th key={h} style={styles.th}>{h}</th>
                      ))}</tr>
                    )}
                  </thead>
                  <tbody>
                    {myCon.length===0 ? (
                      <tr><td colSpan={20} style={{...styles.td,textAlign:"center",padding:30,color:"#1f2937"}}>لا توجد عقود</td></tr>
                    ) : myCon.map((c,i)=>{
                      const r = calcC(c,settings);
                      const paid = _getPaid(payments,c.id);
                      const left = Math.max(0,(c.totalInst||0)-paid);
                      const done = left===0 && (c.totalInst||0)>0;
                      const bg = i%2===0?C.white:C.gray;
                      if(stmtType==="brief") return (
                        <tr key={c.id} style={{background:bg}}>
                          <td style={{...styles.td,color:"#1f2937"}}>{c.num||i+1}</td>
                          <td style={{...styles.td,fontWeight:700}}>{c.client}</td>
                          <td style={styles.td}>{SAR(c.amount)}</td>
                          <td style={styles.td}>{SAR(c.totalInst||0)}</td>
                          <td style={{...styles.td,color:C.teal,fontWeight:700}}>{SAR(c.instAmt||0)}</td>
                          <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(paid)}</td>
                          <td style={{...styles.td,color:done?C.green:C.red,fontWeight:700}}>{SAR(left)}</td>
                          <td style={styles.td}><span style={styles.badge(done?C.greenLt:C.redLt,done?C.green:C.red)}>{done?"✅ مكتمل":"⏳ جاري"}</span></td>
                        </tr>
                      );
                      return (
                        <tr key={c.id} style={{background:bg}}>
                          <td style={{...styles.td,color:"#1f2937"}}>{c.num||i+1}</td>
                          <td style={{...styles.td,fontWeight:700}}>{c.client}</td>
                          <td style={{...styles.td,fontSize:13}}>{c.idNum||"—"}</td>
                          <td style={styles.td}>{c.job||"—"}</td>
                          <td style={styles.td}>{c.gName||"—"}</td>
                          <td style={styles.td}><span style={styles.badge(C.tealLt,C.teal)}>{c.goods||"—"}</span></td>
                          <td style={{...styles.td,textAlign:"center"}}>{c.qty||"—"}</td>
                          <td style={styles.td}>{SAR(c.amount)}</td>
                          <td style={styles.td}>{SAR(c.totalInst||0)}</td>
                          <td style={{...styles.td,color:C.teal,fontWeight:700}}>{SAR(c.instAmt||0)}</td>
                          <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(paid)}</td>
                          <td style={{...styles.td,color:done?C.green:C.red,fontWeight:700}}>{SAR(left)}</td>
                          <td style={{...styles.td,fontSize:13,color:C.green}}>{c.firstInst||"—"}</td>
                          <td style={{...styles.td,fontSize:13,color:C.gold}}>{c.lastInst||"—"}</td>
                          <td style={{...styles.td,color:C.green}}>{SAR(r.profit)}</td>
                          <td style={{...styles.td,color:C.red}}>{SAR(r.acc)}</td>
                          <td style={{...styles.td,color:C.gold}}>{SAR(r.inst)}</td>
                          <td style={{...styles.td,color:C.teal,fontWeight:700}}>{SAR(r.net)}</td>
                          <td style={styles.td}><span style={styles.badge(done?C.greenLt:C.redLt,done?C.green:C.red)}>{done?"✅ مكتمل":"⏳ جاري"}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                  {myCon.length>0 && (
                    <tfoot>
                      <tr style={{background:C.goldLt}}>
                        {stmtType==="brief" ? <>
                          <td colSpan={2} style={{...styles.td,fontWeight:800}}>الإجمالي</td>
                          <td style={{...styles.td,fontWeight:800}}>{SAR(totalAmt)}</td>
                          <td style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={{...styles.td,color:C.green,fontWeight:800}}>{SAR(totalPaid)}</td>
                          <td style={{...styles.td,color:C.red,fontWeight:800}}>{SAR(totalLeft)}</td>
                          <td style={styles.td}></td>
                        </> : <>
                          <td colSpan={7} style={{...styles.td,fontWeight:800}}>الإجمالي</td>
                          <td style={{...styles.td,fontWeight:800}}>{SAR(totalAmt)}</td>
                          <td style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={{...styles.td,color:C.green,fontWeight:800}}>{SAR(totalPaid)}</td>
                          <td style={{...styles.td,color:C.red,fontWeight:800}}>{SAR(totalLeft)}</td>
                          <td colSpan={3} style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={{...styles.td,color:C.teal,fontWeight:800}}>{SAR(totalProfit)}</td>
                          <td style={styles.td}></td>
                        </>}
                      </tr>
                    </tfoot>
                  )}
                </table>
              </div>
              {/* الإجمالي: النقدي + المتبقي */}
              <div style={{marginTop:16,border:"2px solid "+C.teal,borderRadius:10,overflow:"hidden"}}>
                <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px",fontSize:15,borderBottom:"1px solid "+C.border}}>
                  <span style={{color:"#1f2937",fontWeight:700}}>💵 النقدي الصافي المتوفر</span>
                  <span style={{fontWeight:800}}>{SAR(netCashStmt)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px",fontSize:15,borderBottom:"2px solid "+C.teal}}>
                  <span style={{color:"#1f2937",fontWeight:700}}>💰 المتبقي عند الزبائن</span>
                  <span style={{fontWeight:800,color:C.red}}>{SAR(totalLeft)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"12px 16px",fontSize:17,background:C.tealLt}}>
                  <span style={{fontWeight:900,color:C.teal}}>📊 الإجمالي (النقدي + المتبقي)</span>
                  <span style={{fontWeight:900,color:C.teal}}>{SAR(netCashStmt+totalLeft)}</span>
                </div>
              </div>
            </div>
          );
        })()}
      </Modal>

    </div>
  );
}

  const savePriceOverride = (id, val) => {
    const p = {...priceOverrides, [id]: val};
    setPriceOverrides(p);
    localStorage.setItem("qimma_price_ov", JSON.stringify(p));
    if(gsWrite) gsWrite("price_ov", p);
  };

  // Build rows from contracts + manual
  const contractRows = contracts.filter(c=>!c.isOldContract && c.contractType!=="migrated").map(c=>{
    const inv = investors.find(i=>String(i.id)===String(c.investorId));
    // بطاقة (سوا/موبايلي/زين) → تخصم العدد من رصيد البطاقات
    // غيرها (أسهم/جوال/سيارة) → سلعة نقدية: تخصم قيمة العقد النقدية من الإجمالي النقدي
    const isCard = (c.goods||"").trim().startsWith("بطاقة");
    if(isCard){
      return {
        id:"c_"+c.id, date:c.date, contractNum:c.num,
        contractAmount:parseFloat(c.amount)||0,
        client:c.client,
        investor:inv?invLabel(inv):"—",
        supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
        supportAcc:0,
        withdrawnQty:parseInt(c.qty)||0,
        fromContract:true,
      };
    } else {
      // سلعة نقدية: قيمتها النقدية تُخصم من الإجمالي النقدي (سالبة)، بدون لمس البطاقات
      const stockInfo = (c.goods||"").includes("أسهم") && c.stockName ? (" ("+c.stockName+(c.stockQty?" ×"+c.stockQty:"")+")") : "";
      return {
        id:"c_"+c.id, date:c.date, contractNum:c.num,
        contractAmount:parseFloat(c.amount)||0,
        client:c.client+" — "+(c.goods||"سلعة")+stockInfo,
        investor:inv?invLabel(inv):"—",
        supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
        supportAcc:-(parseFloat(c.amount)||0),  // سالبة: تخصم قيمة العقد النقدية من الإجمالي النقدي
        withdrawnQty:0,
        fromContract:true,
        cashOnly:true, isCashItem:true, itemName:c.goods,
      };
    }
  });

  // ترتيب زمني: بالتاريخ، ثم بوقت الإنشاء (timestamp) — آخر عملية تكون آخر صف
  const seqOf = r => {
    // العقد id = "c_<timestamp>"، اليدوي id = <timestamp> رقمي
    const raw = String(r.id).replace(/^c_/,"");
    const n = parseInt(raw,10);
    return isNaN(n) ? 0 : n;
  };
  const allRows = [...contractRows, ...manualRows].sort((a,b)=>{
    const d = new Date(a.date)-new Date(b.date);
    if(d!==0) return d;
    return seqOf(a)-seqOf(b);  // نفس اليوم: الأقدم إنشاءً أولاً، الأحدث آخراً
  });

  // Calculate running balance: نفصل نقدي البطاقات عن نقدي السلع
  let runningCards = 0;
  let lastPrice = 0;
  let runningGoodsCash = 0; // نقدي السلع (أسهم/سيارة) — مستقل تماماً
  const display = allRows.map(row=>{
    // سلعة نقدية مباشرة: تُضاف قيمتها لنقدي السلع فقط، ولا تلمس البطاقات إطلاقاً
    if(row.cashOnly){
      const amt=parseFloat(row.supportAcc)||0;
      runningGoodsCash += amt;
      const cardsCash = runningCards*(lastPrice||0);
      return {...row, rowPrice:0, supported:0, withdrawn:0, runningCards, cardsCash, goodsCash:runningGoodsCash, cashBalance:cardsCash+runningGoodsCash, isCashItem:true};
    }
    const rowPrice = parseFloat(priceOverrides[row.id]||row.price)||parseFloat(defaultPrice)||lastPrice||1;
    if(rowPrice) lastPrice = rowPrice;
    const supC = parseFloat(row.supportClient)||0;
    const supA = parseFloat(row.supportAcc)||0;
    const supported = supC||supA ? Math.floor((supC+supA)/rowPrice) : 0;
    const withdrawn = parseInt(row.withdrawnQty)||0;
    runningCards = runningCards + supported - withdrawn;
    const cardsCash = runningCards*rowPrice;
    return {...row, rowPrice, supported, withdrawn, runningCards, cardsCash, goodsCash:runningGoodsCash, cashBalance:cardsCash+runningGoodsCash};
  });

  return (
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:19,fontWeight:800}}>📦 البضاعة</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>

          <button style={styles.btn(C.teal)} onClick={()=>setShowAdd(s=>!s)}>➕ إضافة دعم</button>
        </div>
      </div>

      {/* Add manual row */}
      {showAdd && (
        <div style={{...styles.panel,marginBottom:16,padding:16}}>
          <div style={{fontSize:15,fontWeight:700,marginBottom:12}}>إضافة دعم حساب</div>
          {/* اختيار نوع الدعم */}
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button type="button" onClick={()=>setNewRow(p=>({...p,itemType:"cards"}))}
              style={{flex:1,padding:"11px",borderRadius:10,border:"2px solid "+(newRow.itemType==="cards"?C.teal:C.border),background:newRow.itemType==="cards"?C.tealLt:"#fff",color:newRow.itemType==="cards"?C.teal:C.ink2,fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>💳 بطاقات</button>
            <button type="button" onClick={()=>setNewRow(p=>({...p,itemType:"other"}))}
              style={{flex:1,padding:"11px",borderRadius:10,border:"2px solid "+(newRow.itemType==="other"?C.gold:C.border),background:newRow.itemType==="other"?"#fef9ec":"#fff",color:newRow.itemType==="other"?"#a87520":C.ink2,fontWeight:800,fontSize:15,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>📦 سلعة أخرى (أسهم/سيارة)</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>التاريخ</label>
              <input style={styles.input} type="date" value={newRow.date} onChange={e=>setNewRow(p=>({...p,date:e.target.value}))}/>
            </div>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>قيمة الدعم (ر.س)</label>
              <input style={styles.input} type="number" placeholder="المبلغ" value={newRow.supportAcc} onChange={e=>setNewRow(p=>({...p,supportAcc:e.target.value}))}/>
            </div>
            {newRow.itemType==="cards" ? (
              <div>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>سعر البطاقة</label>
                <input style={styles.input} type="number" placeholder="اتركه فارغ للتعبئة التلقائية" value={newRow.price} onChange={e=>setNewRow(p=>({...p,price:e.target.value}))}/>
              </div>
            ) : (
              <div>
                <label style={{fontSize:15,fontWeight:700,color:"#a87520",display:"block",marginBottom:4}}>اسم السلعة *</label>
                <input style={styles.input} type="text" placeholder="مثال: أسهم الراجحي / سيارة" value={newRow.itemName} onChange={e=>setNewRow(p=>({...p,itemName:e.target.value}))}/>
              </div>
            )}
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>ملاحظة</label>
              <input style={styles.input} type="text" placeholder="اختياري" value={newRow.note} onChange={e=>setNewRow(p=>({...p,note:e.target.value}))}/>
            </div>
          </div>
          {newRow.itemType==="other" && <div style={{fontSize:13,color:"#a87520",marginBottom:10,fontWeight:600}}>💡 قيمة الدعم ستُضاف مباشرة على الرصيد النقدي (بدون حساب بطاقات).</div>}
          <button style={styles.btn(C.teal)} onClick={()=>{
            if(!newRow.supportAcc){toast("أدخل مبلغ الدعم","error");return;}
            if(newRow.itemType==="other" && !newRow.itemName.trim()){toast("أدخل اسم السلعة","error");return;}
            if(newRow.itemType==="other"){
              saveManual([...manualRows,{id:Date.now(),date:newRow.date,contractNum:"—",contractAmount:0,client:newRow.itemName+(newRow.note?(" — "+newRow.note):""),investor:"—",supportClient:0,supportAcc:parseFloat(newRow.supportAcc)||0,withdrawnQty:0,fromContract:false,price:0,cashOnly:true,itemName:newRow.itemName}]);
            } else {
              saveManual([...manualRows,{id:Date.now(),date:newRow.date,contractNum:"—",contractAmount:0,client:newRow.note||"دعم حساب",investor:"—",supportClient:0,supportAcc:parseFloat(newRow.supportAcc)||0,withdrawnQty:0,fromContract:false,price:parseFloat(newRow.price)||0}]);
            }
            setNewRow({date:todayLocal(),supportAcc:"",note:"",price:"",itemType:"cards",itemName:""});
            setShowAdd(false);
            toast("✅ تم إضافة الدعم");
          }}>💾 حفظ</button>
        </div>
      )}

      {/* شريط التحكم: السعر الافتراضي + إظهار الأعمدة */}
      <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",marginBottom:12,padding:"12px 14px",background:"#f8fafc",borderRadius:10,border:"1px solid "+C.border}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:14,fontWeight:700,color:C.ink2}}>💳 سعر البطاقة الافتراضي:</span>
          <input type="number" value={defaultPrice} onChange={e=>saveDefaultPrice(e.target.value)} placeholder="مثال: 19.7"
            style={{width:90,border:"2px solid "+C.gold,borderRadius:6,padding:"5px 8px",fontSize:14,textAlign:"center",background:"#fffbf0",fontWeight:700}}/>
          <span style={{fontSize:12,color:"#6b7280"}}>(يمكن تعديله لأي صف)</span>
        </div>
        <div style={{position:"relative",marginRight:"auto"}}>
          <button onClick={()=>setShowColMenu(s=>!s)} style={{...styles.btn("#e5e7eb","#374151"),fontSize:13,padding:"7px 14px"}}>⚙️ الأعمدة</button>
          {showColMenu && (
            <div style={{position:"absolute",top:"110%",left:0,zIndex:20,background:"#fff",border:"1px solid "+C.border,borderRadius:10,boxShadow:"0 4px 16px rgba(0,0,0,0.15)",padding:10,minWidth:200,maxHeight:"50vh",overflowY:"auto"}}>
              <div style={{fontSize:13,fontWeight:800,color:C.ink,marginBottom:8}}>إظهار / إخفاء الأعمدة</div>
              {ALL_COLS.map(c=>(
                <label key={c} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 4px",cursor:"pointer",fontSize:14}}>
                  <input type="checkbox" checked={visCols[c]!==false} onChange={()=>toggleCol(c)}/>
                  <span>{c}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Table */}
      <div style={{overflowX:"auto",maxHeight:"75vh",overflowY:"auto",borderRadius:10,boxShadow:"0 2px 12px rgba(0,0,0,0.08)"}}>
        <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:14}}>
          <thead>
            <tr style={{background:C.ink,color:"#fff"}}>
              <th style={{padding:"8px",whiteSpace:"nowrap",fontWeight:700,textAlign:"center",position:"sticky",top:0,zIndex:10}}>التاريخ</th>
              {ALL_COLS.filter(c=>visCols[c]!==false).map((h,hi)=>{
                const isName = h==="اسم العميل";
                return <th key={h} style={{padding:"8px",whiteSpace:"nowrap",fontWeight:700,textAlign:"center",
                  position:"sticky",top:0,zIndex:isName?12:10,
                  ...(isName?{right:0,zIndex:12}:{}),
                  background:["رصيد البطاقات","نقدي البطاقات","نقدي السلع","الإجمالي النقدي"].includes(h)?"#1a6b4a":C.ink}}>{h}</th>;
              })}
              <th style={{padding:"8px",position:"sticky",top:0,zIndex:10}}></th>
            </tr>
          </thead>
          <tbody>
            {display.length===0?(
              <tr><td colSpan={ALL_COLS.length+2} style={{textAlign:"center",padding:40,color:"#1f2937"}}>لا توجد بيانات</td></tr>
            ):display.map((row,i)=>{
              const cell=(s,content)=><td style={{padding:"6px 8px",borderBottom:"1px solid #eee",...s}}>{content}</td>;
              const C_={
                "رقم العقد":cell({textAlign:"center",fontWeight:700},row.contractNum),
                "قيمة العقد":cell({textAlign:"center"},row.contractAmount>0?row.contractAmount.toLocaleString("en-US"):""),
                "اسم العميل":cell({fontWeight:700,whiteSpace:"nowrap",position:"sticky",right:0,background:i%2===0?"#fff":"#f8f8f8",zIndex:5,borderLeft:"2px solid #e2e8f0"},row.client),
                "اسم المستثمر":cell({},row.investor),
                "دعم العميل":cell({textAlign:"center",color:C.green,fontWeight:700},row.supportClient>0?row.supportClient.toLocaleString("en-US"):""),
                "دعم الحساب":cell({textAlign:"center",color:C.teal,fontWeight:700},row.supportAcc>0?row.supportAcc.toLocaleString("en-US"):""),
                "سعر البطاقة":<td style={{padding:"3px 4px",borderBottom:"1px solid #eee",textAlign:"center"}}>{row.isCashItem?<span style={{fontSize:12,color:"#a87520",fontWeight:700}}>📦 سلعة</span>:<input type="number" value={priceOverrides[row.id]||row.price||""} placeholder={String(row.rowPrice||"")} onChange={e=>savePriceOverride(row.id,e.target.value)} style={{width:60,border:"1px solid "+C.gold,borderRadius:4,padding:"3px 4px",fontSize:14,textAlign:"center",background:"#fffbf0"}}/>}</td>,
                "البطاقات المدعومة":cell({textAlign:"center",background:"#f0faf5",fontWeight:700},row.supported>0?row.supported:""),
                "البطاقات المسحوبة":cell({textAlign:"center",color:C.red,fontWeight:700},row.withdrawn>0?row.withdrawn:""),
                "رصيد البطاقات":cell({textAlign:"center",background:"#f0f0ff",fontWeight:800,color:C.teal},row.runningCards),
                "نقدي البطاقات":cell({textAlign:"center",fontWeight:700,color:"#0891b2"},(row.cardsCash||0).toLocaleString("en-US")),
                "نقدي السلع":cell({textAlign:"center",fontWeight:700,color:(row.goodsCash||0)<0?C.red:"#a87520"},(row.goodsCash||0).toLocaleString("en-US")),
                "الإجمالي النقدي":cell({textAlign:"center",background:"#fffbf0",fontWeight:800,color:row.cashBalance<0?C.red:C.gold},row.cashBalance.toLocaleString("en-US")),
              };
              return (
              <tr key={row.id||i} style={{background:i%2===0?"#fff":"#f8f8f8"}}>
                {cell({textAlign:"center"},row.date)}
                {ALL_COLS.filter(c=>visCols[c]!==false).map(c=><React.Fragment key={c}>{C_[c]}</React.Fragment>)}
                <td style={{padding:"4px",borderBottom:"1px solid #eee",textAlign:"center"}}>
                  {!row.fromContract&&<button style={{...styles.btn(C.red),fontSize:13,padding:"3px 8px"}} onClick={()=>{if(window.confirm("حذف هذا السطر؟"))saveManual(manualRows.filter(r=>r.id!==row.id));}}>🗑️</button>}
                </td>
              </tr>
            );})}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// ─── Search Page ─────────────────────────────────────────────
function SearchPage({contracts, investors, settings, payments, setPayments, toast, setPage}) {
  const [q, setQ] = useState("");
  const [payModal, setPayModal] = useState(null);
  const [payAmount, setPayAmount] = useState("");
  const [payDate, setPayDate] = useState(todayLocal());

  const results = q.length >= 2 ? contracts.filter(c =>
    c.client?.includes(q) ||
    c.gName?.includes(q) ||
    c.idNum?.includes(q) ||
    c.cPhone?.includes(q) ||
    c.gId?.includes(q) ||
    c.gPhone?.includes(q)
  ) : [];

  const active = results.filter(c => {
    const paid = _getPaid(payments, c.id);
    return paid < (c.totalInst||0);
  });
  const done = results.filter(c => {
    const paid = _getPaid(payments, c.id);
    return paid >= (c.totalInst||0);
  });

  const addPay = () => {
    if(!payAmount||!payModal) return;
    const amt = parseFloat(payAmount);
    setPayments(p=>[...p,{id:Date.now(),contractId:payModal.id,amount:amt,date:payDate}]);
    toast("✅ تم تسجيل الدفعة");
    setPayModal(null);
    setPayAmount("");
  };

  const ContractCard = ({c, isDone}) => {
    const inv = investors.find(i=>String(i.id)===String(c.investorId));
    const paid = _getPaid(payments, c.id);
    const left = Math.max(0,(c.totalInst||0)-paid);
    const pct = c.totalInst>0 ? Math.min(100,Math.round(paid/c.totalInst*100)) : 0;
    const risk = assessRisk(c, payments);
    return (
      <div style={{...styles.panel,marginBottom:12,borderRight:`4px solid ${isDone?C.green:C.teal}`}}>
        <div style={{padding:"14px 18px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div>
              <div style={{fontWeight:800,fontSize:17,color:C.ink}}>{c.client}</div>
              <div style={{fontSize:14,color:"#1f2937"}}>عقد #{c.num} | {c.date} | {inv?invLabel(inv):"—"}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end"}}>
              <span style={styles.badge(isDone?C.greenLt:C.tealLt, isDone?C.green:C.teal)}>
                {isDone?"✅ منتهي":"⏳ ساري"}
              </span>
              {!isDone && risk.level!=="—" && (
                <span style={{background:risk.color,color:"#fff",borderRadius:20,padding:"3px 12px",fontSize:12,fontWeight:800,whiteSpace:"nowrap"}}>
                  ● {risk.level}{risk.months>0?(" ("+risk.months+" شهر)"):""}
                </span>
              )}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:10,fontSize:15}}>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>إجمالي العقد</div>
              <div style={{fontWeight:800,color:C.ink}}>{SAR(c.totalInst||0)}</div>
            </div>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>رأس المال</div>
              <div style={{fontWeight:800,color:C.ink}}>{SAR(c.amount||0)}</div>
            </div>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>القسط</div>
              <div style={{fontWeight:800,color:C.ink}}>{SAR(c.instAmt||0)}</div>
            </div>
            <div style={{background:C.greenLt,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>الواصل</div>
              <div style={{fontWeight:800,color:C.green}}>{SAR(paid)}</div>
            </div>
            <div style={{background:left<=0?C.greenLt:C.redLt,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>المتبقي</div>
              <div style={{fontWeight:800,color:left<=0?C.green:C.red}}>{SAR(left)}</div>
            </div>
            <div style={{background:"#f8f8f8",borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
              <div style={{color:"#1f2937",marginBottom:2}}>نسبة السداد</div>
              <div style={{fontWeight:800,color:C.teal}}>{pct}%</div>
            </div>
          </div>
          <div style={{background:"#f0f0f0",borderRadius:99,height:6,marginBottom:10}}>
            <div style={{background:isDone?C.green:C.teal,borderRadius:99,height:6,width:pct+"%"}}></div>
          </div>
          {!isDone && (
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button style={{...styles.btn(C.teal),flex:1}} onClick={()=>{setPayModal(c);setPayAmount("");}}>
                💰 تسجيل دفعة
              </button>
              {(c.instAmt||0)>0 && (
                <button style={{...styles.btn(C.green),flex:1}} onClick={()=>{
                  const amt = parseFloat(c.instAmt)||0;
                  if(amt<=0) return;
                  const rem = Math.max(0,(c.totalInst||0)-paid);
                  const pay = Math.min(amt, rem);
                  if(!window.confirm("تسجيل سداد قسط "+SAR(pay)+" للعميل "+c.client+" بتاريخ اليوم؟")) return;
                  setPayments(p=>[...p,{id:Date.now(),contractId:c.id,amount:pay,date:todayLocal(),note:"قسط"}]);
                  toast("✅ تم تسجيل القسط");
                }}>
                  ⚡ سدّد القسط
                </button>
              )}
            </div>
          )}
        </div>
      </div>
    );
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontSize:19,fontWeight:800}}>🔍 البحث</div>
        <button style={{...styles.btn("#64748b","#fff"),fontSize:15,padding:"8px 16px"}} onClick={()=>setPage&&setPage("dashboard")}>← رجوع</button>
      </div>
      <div style={{...styles.card,marginBottom:20}}>
        <input
          style={{...styles.input,fontSize:17,padding:"12px 16px"}}
          placeholder="ابحث باسم العميل، الكفيل، رقم الهوية، أو الجوال..."
          value={q}
          onChange={e=>setQ(e.target.value)}
          autoFocus
        />
        {q.length===1 && <div style={{fontSize:15,color:"#1f2937",marginTop:6}}>اكتب حرفين على الأقل للبحث</div>}
      </div>

      {q.length>=2 && results.length===0 && (
        <div style={{...styles.panel,padding:40,textAlign:"center",color:"#1f2937"}}>لا توجد نتائج</div>
      )}

      {done.length>0 && (
        <div>
          <div style={{fontSize:16,fontWeight:800,marginBottom:12,color:C.green}}>✅ العقود المنتهية ({done.length})</div>
          {done.map(c=><ContractCard key={c.id} c={c} isDone={true}/>)}
        </div>
      )}

      {/* Pay Modal */}
      <Modal open={!!payModal} onClose={()=>setPayModal(null)} title="💰 تسجيل دفعة">
        {payModal && (
          <div style={{padding:"14px 18px"}}>
            <div style={{fontWeight:700,marginBottom:4}}>{payModal.client}</div>
            <div style={{fontSize:15,color:"#1f2937",marginBottom:16}}>المتبقي: {SAR(Math.max(0,(payModal.totalInst||0)-_getPaid(payments,payModal.id)))}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              <div>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>المبلغ</label>
                <input style={styles.input} type="number" value={payAmount} onChange={e=>setPayAmount(e.target.value)} placeholder="المبلغ"/>
              </div>
              <div>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>التاريخ</label>
                <input style={styles.input} type="date" value={payDate} onChange={e=>setPayDate(e.target.value)}/>
              </div>
            </div>
            <button style={styles.btn(C.teal)} onClick={addPay}>💾 حفظ</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

function CollectionPage({contracts, investors, settings, payments, setPayments, toast, logAct}) {
  const [colDate, setColDate] = useState(todayLocal());
  const [selInv, setSelInv] = useState(null); // المستثمر المختار (null = شاشة الاختيار)
  const [colSearch, setColSearch] = useState("");
  const [colAmts, setColAmts] = useState({});
  const [expanded, setExpanded] = useState({});
  const [doneIds, setDoneIds] = useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_done")||"[]");}catch{return[];}});
  const markDone = (id) => { const d=[...doneIds,id]; setDoneIds(d); localStorage.setItem("qimma_done",JSON.stringify(d)); };

  const gP = (cid) => (payments||[]).filter(p=>p.contractId===cid).reduce((s,p)=>s+(+p.amount||0),0);

  // ألوان المستثمرين
  const invColors=["#6366f1","#0d9488","#e11d48","#ea580c","#0284c7","#7c3aed","#059669","#b45309","#dc2626","#4f46e5","#0891b2"];
  const getInvColor=(idx)=>invColors[idx%invColors.length];

  // كل العقود النشطة مع الحسابات
  const allRows = contracts.filter(c=>!c.deleted && !doneIds.includes(c.id))
    .map(c=>{
      const paid=gP(c.id), left=Math.max(0,(c.totalInst||0)-paid);
      let lateAmt=0; const inst=c.instAmt||0;
      if(left>0 && inst>0 && c.firstInst){
        const fd=new Date(c.firstInst), nd=new Date(colDate);
        let md=(nd.getFullYear()-fd.getFullYear())*12+(nd.getMonth()-fd.getMonth());
        if(nd.getDate()>=fd.getDate()) md+=1;
        if(md<0) md=0;
        lateAmt=Math.min(Math.max(0,md*inst-paid),left);
      }
      return {...c,paid,left,lateAmt};
    })
    .filter(c=>c.left>0);

  // إحصائيات اليوم
  const dayPays=(payments||[]).filter(p=>p.date===colDate);
  const cntToday=new Set(dayPays.map(p=>p.contractId)).size;
  const sumToday=dayPays.reduce((s,p)=>s+(+p.amount||0),0);

  // تجميع حسب المستثمر لشاشة الاختيار
  const invCards = sortedInvestors(investors).map((inv,idx)=>{
    const items=allRows.filter(c=>String(c.investorId)===String(inv.id));
    const lateCount=items.filter(c=>c.lateAmt>0).length;
    const totalInst=items.reduce((s,c)=>s+(c.instAmt||0),0);
    return {inv, items, lateCount, totalInst, color:getInvColor(idx)};

  // عقود المستثمر المختار
  const selRows = selInv ? allRows
    .filter(c=>String(c.investorId)===String(selInv.id))
    .filter(c=>!colSearch||c.client.includes(colSearch)||(c.cPhone||"").includes(colSearch))
    .sort((a,b)=>(a.client||"").localeCompare(b.client||""))

  const doCollect=(c)=>{
    const amt=parseFloat(colAmts[c.id]!=null?colAmts[c.id]:c.instAmt)||0;
    if(amt<=0){toast("⚠️ المبلغ غير صحيح","warn");return;}
    const realAmt=Math.min(amt,c.left);
    if(!window.confirm("تأكيد سداد "+SAR(realAmt)+" لـ "+c.client+"؟")) return;
    const newPaid=c.paid+realAmt;

function OverduePage({contracts, investors, payments, goCollect, onFlag}) {
  const [filterInv, setFilterInv] = React.useState("all");
  const active = (contracts||[]).filter(c => !c.deleted);

  const calcOverdue = (c) => {
    const instAmt = +c.instAmt || 0;
    const totalInst = +c.totalInst || +c.amount || 0;
    if(instAmt <= 0 || !c.firstInst) return null;
    const ps = (payments||[]).filter(p => p.contractId === c.id);
    const paidTotal = ps.reduce((s,p)=>s+(+p.amount||0), 0);
    const remaining = Math.max(0, totalInst - paidTotal);
    if(remaining <= 0) return null;
    const totalCount = Math.max(1, Math.round(totalInst / instAmt));
    const first = new Date(c.firstInst);
    const now = new Date();
    let monthsElapsed = (now.getFullYear()-first.getFullYear())*12 + (now.getMonth()-first.getMonth());
    if(now.getDate() >= first.getDate()) monthsElapsed += 1;
    monthsElapsed = Math.max(0, monthsElapsed);
    const due = Math.min(monthsElapsed, totalCount);
    const paidCount = Math.floor(paidTotal / instAmt);
    const monthsBehind = Math.max(0, due - paidCount);
    const overdueAmt = monthsBehind * instAmt;
    return {monthsBehind, overdueAmt, remaining, paidTotal};
  };

  const allRows = active.map(c => ({c, o: calcOverdue(c)}));
  const autoRows = allRows.filter(x => x.o && x.o.monthsBehind >= 3);
  const manualOnly = allRows.filter(x => x.c.defaulter && (!x.o || x.o.monthsBehind < 3));
  const rows = [...autoRows, ...manualOnly].sort((a,b)=>(b.o?b.o.monthsBehind:0)-(a.o?a.o.monthsBehind:0));

  const grouped = {};
  rows.forEach(x => {
    const iid = String(x.c.investorId);
    if(filterInv!=="all" && iid!==filterInv) return;
    if(!grouped[iid]) grouped[iid]={inv:investors.find(i=>String(i.id)===iid), items:[]};
    grouped[iid].items.push(x);
  });
  // إضافة كل المستثمرين حتى لو ما عندهم متعثرين
  const invList = filterInv==="all" ? sortedInvestors(investors) : investors.filter(i=>String(i.id)===filterInv);
  invList.forEach(iv=>{
    const iid=String(iv.id);
    if(!grouped[iid]) grouped[iid]={inv:iv, items:[]};
  });
  const groups = Object.values(grouped).sort((a,b)=>{
    const na=a.inv?(a.inv.code||a.inv.name):"", nb=b.inv?(b.inv.code||b.inv.name):"";
    const ma=String(na).match(/(\d+)/), mb=String(nb).match(/(\d+)/);
    return (ma?parseInt(ma[1]):9999)-(mb?parseInt(mb[1]):9999);
  });

  const filtered = rows.filter(x=>filterInv==="all"||String(x.c.investorId)===filterInv);
  const totalDefaulters = filtered.length;
  const totalOverdue = filtered.reduce((s,x)=>s+(x.o?x.o.overdueAmt:0),0);
  const totalRemaining = filtered.reduce((s,x)=>{
    const paid=(payments||[]).filter(p=>p.contractId===x.c.id).reduce((ss,p)=>ss+(p.amount||0),0);
    return s+Math.max(0,(+x.c.totalInst||0)-paid);
  },0);
  const totalContracts = filtered.length;

  return (
    <div style={styles.main}>
      <div style={{...styles.panel,borderTop:"4px solid "+C.red}}>
        <div style={{padding:"16px 20px"}}>

            <div style={{flex:1,minWidth:100,background:C.gray,borderRadius:10,padding:"10px 14px",textAlign:"center"}}>

        const gPaid = g.items.reduce((s,x)=>(payments||[]).filter(p=>p.contractId===x.c.id).reduce((ss,p)=>ss+(p.amount||0),s),0);
        const gTotal = g.items.reduce((s,x)=>s+(+x.c.totalInst||0),0);
        const gCash = g.items.reduce((s,x)=>s+(+x.c.amount||0),0);
        return (
        <div key={g.inv?g.inv.id:"x"} style={styles.panel}>
          <div style={{...styles.panelHdr,background:"#1e2235",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{margin:0,fontSize:16,fontWeight:900,color:"#fff"}}>{g.inv?invLabel(g.inv):"—"}</h3>
            <span style={{background:C.red,color:"#fff",borderRadius:20,padding:"3px 14px",fontSize:14,fontWeight:800}}>{g.items.length} متعثر</span>
          </div>
          <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch"}}>

                    <th key={h} style={{...styles.th,padding:"10px 8px",fontSize:12,whiteSpace:"nowrap"}}>{h}</th>
                  ))}

              </thead>
              <tbody>
                {g.items.length===0 && (
                  <tr><td colSpan={7} style={{...styles.td,textAlign:"center",padding:20,color:"#9ca3af",fontSize:14}}>✅ لا يوجد متعثرون</td></tr>
                )}
                {g.items.map((x,xi)=>{
                  const {c,o} = x;
                  const paid = (payments||[]).filter(p=>p.contractId===c.id).reduce((s,p)=>s+(p.amount||0),0);
                  const left = Math.max(0,(+c.totalInst||0)-paid);
                  return (
                    <tr key={c.id} style={{background:xi%2===0?"#fff":"#f8fafc",borderBottom:"1px solid #e5e7eb"}}>

                      <td style={{...styles.td,textAlign:"center",color:C.green,fontWeight:700}}>{NUM(paid)}</td>
                      <td style={{...styles.td,textAlign:"center",color:C.red,fontWeight:700}}>{NUM(left)}</td>
                      <td style={{...styles.td,textAlign:"center",padding:4}}>

          </div>
        </div>
        );
      })}
    </div>
  );
}



// ─── البوصلة المالية (4 أسئلة) ────────────────
function CashFlowPage({contracts, investors, settings, payments, daily, dailyOpen, txList, loans, zakatTx, pending, bankTx}) {
  const SAR = v => (v||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});
  const allC = (contracts||[]).filter(c=>!c.deleted);
  const allPayments = payments||[];
  const _daily = _arr(daily);
  const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
  const profitRate = +settings.profit||50;

  // ═══ حسابات مشتركة ═══
  // كاش الصندوق
  const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
  const baseAmount = base ? (+base.amount||0) : 0;
  const baseDate = base ? base.date : "0000-00-00";
  const cashBox = baseAmount + _daily.filter(d=>d.date>=baseDate).reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
  // بنك (نفس منطق الجرد: أولاً كشف الراجحي، ثانياً القيمة اليدوية)
  const bt = _arr(bankTx);
  const cashBank = (()=>{
    if(bt.length>0) return bt[bt.length-1].balance||0;
    // fallback: القيمة اليدوية من الجرد
    try{
      const ov=JSON.parse(localStorage.getItem("qimma_jard_ov")||"{}");
      const ym=fiscalYM(new Date());
      if(ov[ym+"_accounts"]!==undefined) return +ov[ym+"_accounts"]||0;
    }catch{}
    return 0;
  })();
  // بضاعة
  const goodsData2 = (()=>{try{return JSON.parse(localStorage.getItem("qimma_goods3")||"[]");}catch{return[];}})();
  const priceOv2 = (()=>{try{return JSON.parse(localStorage.getItem("qimma_price_ov")||"{}");}catch{return{};}})();
  const defPrice3 = (()=>{try{return parseFloat(localStorage.getItem("qimma_default_price"))||0;}catch{return 0;}})();
  const goodsVal = (()=>{
    const cRows=contracts.filter(c=>!c.deleted&&(!c.isOldContract||c.contractType==='migrated')).map(c=>{
      const isCard=(c.goods||"").trim().startsWith("بطاقة");
      if(isCard) return{id:"c_"+c.id,date:c.date,supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,supportAcc:0,withdrawnQty:parseInt(c.qty)||0,price:0,cashOnly:false};
      return{id:"c_"+c.id,date:c.date,supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,supportAcc:-(parseFloat(c.amount)||0),withdrawnQty:0,price:0,cashOnly:true};
    });
    const allR=[...cRows,...goodsData2].sort((a,b)=>new Date(a.date)-new Date(b.date));
    let runCards=0,lastP=0,runGC=0;
    allR.forEach(r=>{if(r.cashOnly){runGC+=parseFloat(r.supportAcc)||0;return;}const rp=parseFloat(priceOv2[r.id]||r.price)||defPrice3||lastP||1;if(rp)lastP=rp;const sC=parseFloat(r.supportClient)||0;const sA=parseFloat(r.supportAcc)||0;const sup=sC||sA?Math.floor((sC+sA)/rp):0;runCards=runCards+sup-(parseInt(r.withdrawnQty)||0);});
    return runCards*lastP+runGC;
  })();

  // ذمم العملاء (متبقي = رأس مال + ربح)
  const remaining = allC.reduce((s,c)=>{
    const total=+c.totalInst||+c.amount||0;
    const paid=allPayments.filter(p=>p.contractId===c.id).reduce((ss,p)=>ss+(+p.amount||0),0);
    return s+Math.max(0,total-paid);
  },0);
  // تقسيم الذمم: رأس مال فعلي + ربح
  const remainingCapital = allC.reduce((s,c)=>{
    const total=+c.totalInst||+c.amount||0;
    const paid=allPayments.filter(p=>p.contractId===c.id).reduce((ss,p)=>ss+(+p.amount||0),0);
    const rem=Math.max(0,total-paid);
    if(rem<=0) return s;
    const cap=+c.amount||0;
    const prof=total-cap;
    const paidRatio=paid/Math.max(total,1);
    // الأقساط تسدد رأس المال والربح بنفس النسبة
    return s+(cap*(1-paidRatio));
  },0);
  const remainingProfit = remaining - remainingCapital;
  // سلف
  const loansVal = (loans||[]).reduce((s,l)=>{const paid=(l.payments||[]).reduce((ss,p)=>ss+p.amount,0);return s+Math.max(0,(l.amount||0)-paid);},0);
  // إجمالي الأصول
  const totalAssets = cashBox + cashBank + goodsVal + remaining + loansVal;
  // الفلوس الشغّالة = ذمم + بضاعة
  const workingMoney = remaining + goodsVal;
  const workingPct = totalAssets>0 ? Math.round(workingMoney/totalAssets*100) : 0;
  // النايم = كاش + بنك - التزامات تشغيلية (مبسّط)
  const idleCash = Math.max(0, cashBox + cashBank);

  // ═══ بطاقة ١: وين فلوسي الحين؟ ═══
  const Card1 = () => {
    const items = [
      {name:"ذمم عملاء (رأس مال)", val:remainingCapital, color:"#14b8a6"},
      {name:"ذمم عملاء (ربح)", val:remainingProfit, color:"#0d9488"},
      {name:"بضاعة", val:goodsVal, color:"#f59e0b"},
      {name:"رصيد البنك", val:cashBank, color:"#3b82f6"},
      {name:"كاش الصندوق", val:cashBox, color:"#60a5fa"},
      {name:"سلف", val:loansVal, color:"#8b5cf6"},
    ].filter(i=>i.val>0);
    const total = items.reduce((s,i)=>s+i.val,0);
    // حساب الدونات SVG
    const r=48, circ=2*Math.PI*r;
    let offset=0;
    const arcs = items.map(it=>{
      const pct=it.val/Math.max(total,1);
      const dash=pct*circ;
      const o=offset;
      offset+=dash;
      return{...it, pct:Math.round(pct*100), dash, offset:o};
    });
    const insightColor = workingPct>=70?"#2dd4bf":workingPct>=50?"#fbbf24":"#f87171";
    const insightText = workingPct>=70?"ممتاز، فلوسك شغّالة!":workingPct>=50?"مقبول، فيه مجال تشغّل أكثر":"ضعيف، كاش كثير نايم!";
    return (<div>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14}}>
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="16"/>
          {arcs.map((a,i)=><circle key={i} cx="60" cy="60" r={r} fill="none" stroke={a.color} strokeWidth="16"
            strokeDasharray={a.dash+" "+(circ-a.dash)} strokeDashoffset={-a.offset}
            transform="rotate(-90 60 60)" style={{transition:"all 0.5s"}}/>)}
          <text x="60" y="56" textAnchor="middle" style={{fontSize:16,fontWeight:900,fill:"#fff"}}>{SAR(total/1000)}K</text>
          <text x="60" y="72" textAnchor="middle" style={{fontSize:10,fill:"#64748b"}}>إجمالي</text>
        </svg>
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
          {arcs.map((a,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}>
            <div style={{width:10,height:10,borderRadius:3,background:a.color,flexShrink:0}}/>
            <span style={{color:"#94a3b8",fontWeight:500}}>{a.name}</span>
            <span style={{marginRight:"auto",fontWeight:800,color:"#e2e8f0",fontSize:13}}>{SAR(a.val)}</span>
            <span style={{fontSize:11,color:"#64748b",fontWeight:700,minWidth:28,textAlign:"left"}}>{a.pct}%</span>
          </div>)}
        </div>
      </div>
      <div style={{background:"rgba(20,184,166,0.08)",border:"1px solid rgba(20,184,166,0.15)",borderRadius:12,padding:"10px 14px",fontSize:12,color:insightColor,fontWeight:600,display:"flex",alignItems:"center",gap:8}}>
        <span>💡</span><span>نسبة الفلوس الشغّالة: <b style={{color:insightColor}}>{workingPct}%</b> — {insightText}</span>
      </div>
    </div>);
  };

  // ═══ بطاقة ٢: كم بيدخل عليّ؟ ═══
  const Card2 = () => {
    const today = new Date();
    const curY = today.getFullYear(), curM = today.getMonth();
    // حساب الأقساط المتوقعة لكل شهر (6 شهور)
    const months = [];
    for(let i=0;i<6;i++){
      const m = new Date(curY, curM+i, 1);
      const label = "شهر "+(m.getMonth()+1);
      // كل عقد نشط: قسطه الشهري يُتوقع كل شهر ما دام فيه متبقي
      let expected = 0;
      allC.forEach(c=>{
        const inst = +c.installment||0;
        if(inst<=0) return;
        const total = +c.totalInst||+c.amount||0;
        const paid = allPayments.filter(p=>p.contractId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
        const rem = total - paid;
        if(rem<=0) return;
        // كم شهر يكفي المتبقي
        const monthsLeft = Math.ceil(rem/inst);
        if(i < monthsLeft) expected += Math.min(inst, rem - (inst*i));
      });
      months.push({label, expected:Math.max(0,expected), isCurrent:i===0});
    }
    const maxVal = Math.max(...months.map(m=>m.expected),1);
    const totalExpected = months.reduce((s,m)=>s+m.expected,0);
    return (<div>
      <div style={{display:"flex",gap:4,marginBottom:14,alignItems:"flex-end",height:130}}>
        {months.map((m,i)=>{
          const h = Math.max(8, (m.expected/maxVal)*110);
          return (<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,justifyContent:"flex-end",height:"100%"}}>
            <div style={{fontSize:10,fontWeight:800,color:m.isCurrent?"#86efac":"#5eead4"}}>{SAR(m.expected/1000)}K</div>
            <div style={{width:"100%",background:"rgba(255,255,255,0.03)",borderRadius:10,display:"flex",alignItems:"flex-end",padding:3,height:115}}>
              <div style={{width:"100%",height:h,borderRadius:"8px 8px 4px 4px",background:m.isCurrent?"linear-gradient(180deg,#22c55e,#16a34a)":"linear-gradient(180deg,#14b8a6,#0d9488)",transition:"height 0.3s"}}/>
            </div>
            <div style={{fontSize:11,color:m.isCurrent?"#22c55e":"#64748b",fontWeight:700,position:"relative"}}>
              {m.label}
              {m.isCurrent && <div style={{position:"absolute",bottom:-5,left:"50%",transform:"translateX(-50%)",width:4,height:4,background:"#22c55e",borderRadius:"50%"}}/>}
            </div>
          </div>);
        })}
      </div>
      <div style={{background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.15)",borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,color:"#86efac",fontWeight:600}}>📥 إجمالي المتوقع — 6 شهور</span>
        <span style={{fontSize:17,fontWeight:900,color:"#22c55e"}}>{SAR(totalExpected)} ﷼</span>
      </div>
      <div style={{marginTop:8,fontSize:11,color:"#475569",textAlign:"center"}}>* تقديري بناءً على الأقساط الشهرية للعقود النشطة</div>
    </div>);
  };

  // ═══ بطاقة ٣: مين ما دفع؟ ═══
  const Card3 = () => {
    const today = new Date();
    // لكل عقد نشط: كم المفروض دفع حتى اليوم vs كم دفع فعلاً
    const overdueList = [];
    allC.forEach(c=>{
      const inst = +c.installment||0;
      const total = +c.totalInst||+c.amount||0;
      const paid = allPayments.filter(p=>p.contractId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
      const rem = total - paid;
      if(rem<=0 || inst<=0) return;

      let expectedPaid = 0;
      if(c.contractType==='migrated'){
        // مرحّل: نحسب من تاريخ الترحيل (أو بداية النظام)
        const migDate = c.migratedDate || c.date || c.createdAt;
        if(migDate){
          const start = new Date(migDate);
          const diffMs = today - start;
          const monthsElapsed = Math.max(0, Math.floor(diffMs/(30.44*24*60*60*1000)));
          expectedPaid = Math.min(total, inst * monthsElapsed);
        }
      } else {
        // عقد عادي: من تاريخ أول قسط
        const startDate = c.firstInstDate || c.date;
        if(startDate){
          const start = new Date(startDate);
          const diffMs = today - start;
          const monthsElapsed = Math.max(0, Math.floor(diffMs/(30.44*24*60*60*1000)));
          expectedPaid = Math.min(total, inst * monthsElapsed);
        }
      }
      const overdue = expectedPaid - paid;
      if(overdue > 0){
        const monthsLate = Math.max(1, Math.round(overdue/inst));
        const inv = (investors||[]).find(x=>x.id===c.investorId);
        overdueList.push({
          name: c.name||"—",
          overdue,
          monthsLate,
          investor: inv ? invLabel(inv) : "—",
          contractId: c.id
        });
      }
    });
    overdueList.sort((a,b)=>b.overdue-a.overdue);
    const totalOverdue = overdueList.reduce((s,o)=>s+o.overdue,0);
    const clientCount = overdueList.length;
    const top3 = overdueList.slice(0,3);
    const restCount = Math.max(0, clientCount-3);
    const restAmount = overdueList.slice(3).reduce((s,o)=>s+o.overdue,0);
    const initials = name => {
      const parts = (name||"").split(/\s+/).filter(Boolean);
      if(parts.length>=2) return parts[0][0]+"."+parts[1][0];
      return (name||"—").substring(0,2);
    };

    return (<div>
      <div style={{display:"flex",gap:10,marginBottom:14}}>
        <div style={{flex:1,borderRadius:14,padding:"14px 12px",textAlign:"center",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.15)"}}>
          <div style={{fontSize:24,fontWeight:900,color:"#ef4444"}}>{SAR(totalOverdue)}</div>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600,marginTop:2}}>﷼</div>
          <div style={{fontSize:12,fontWeight:700,color:"#fca5a5",marginTop:6}}>إجمالي المتعثّر</div>
        </div>
        <div style={{flex:1,borderRadius:14,padding:"14px 12px",textAlign:"center",background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.15)"}}>
          <div style={{fontSize:24,fontWeight:900,color:"#fbbf24"}}>{clientCount}</div>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600,marginTop:2}}>عميل</div>
          <div style={{fontSize:12,fontWeight:700,color:"#fde68a",marginTop:6}}>عملاء متأخرين</div>
        </div>
      </div>
      {clientCount===0 ? (
        <div style={{textAlign:"center",padding:20,color:"#22c55e",fontWeight:700,fontSize:14}}>🎉 ما فيه متعثّرين — ممتاز!</div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {top3.map((o,i)=><div key={i} style={{background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.1)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:"rgba(239,68,68,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:"#fca5a5",flexShrink:0}}>{initials(o.name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.name}</div>
              <div style={{fontSize:11,color:"#64748b",fontWeight:500,marginTop:2}}>{o.monthsLate} قسط متأخر · {o.investor}</div>
            </div>
            <div style={{fontSize:15,fontWeight:900,color:"#ef4444",whiteSpace:"nowrap"}}>{SAR(o.overdue)}</div>
          </div>)}

    </div>);
  };

  // ═══ بطاقة ٤: كم أنمّي فلوسي؟ ═══
  const Card4 = () => {
    const [simAmount, setSimAmount] = useState(idleCash>0?idleCash:50000);
    const [simMonths, setSimMonths] = useState(20);
    // محاكاة التدوير: رأس المال يُقسّط ثم يعاد تدويره
    const profR = profitRate/100;
    const cycleProfit = simAmount * profR;
    const cycleTotal = simAmount + cycleProfit;
    // الدورة الثانية: نفس رأس المال يُعاد تدويره بعد انتهاء المدة
    // تقريب: خلال سنة (12 شهر) مع 20 شهر تقسيط = تدوير جزئي
    const monthlyReturn = cycleTotal / simMonths;
    // بعد 12 شهر: كم رجع من الدورة الأولى
    const returned12 = Math.min(cycleTotal, monthlyReturn * 12);
    const profit12 = returned12 - (simAmount * (12/simMonths));
    // لو أعاد تدوير المرتجع
    const cycle2Capital = returned12 * 0.6; // تقريب: 60% يقدر يعيد تدويره
    const cycle2Profit = cycle2Capital * profR;
    const totalGrowth = profit12 + cycle2Profit;
    const growthPct = simAmount>0 ? Math.round(totalGrowth/simAmount*100) : 0;

    return (<div>

            <span style={{fontSize:18,fontWeight:900,color:"#c4b5fd"}}>{simMonths}</span>
            <button onClick={()=>setSimMonths(m=>Math.min(36,m+2))} style={{background:"rgba(139,92,246,0.2)",border:"none",borderRadius:8,width:28,height:28,color:"#c4b5fd",fontWeight:900,fontSize:16,cursor:"pointer"}}>+</button>
          </div>
          <div style={{fontSize:10,color:"#64748b",marginTop:2}}>شهر</div>
        </div>
      </div>

      {/* مسار النمو */}
      <div style={{position:"relative",padding:"8px 0 0",marginBottom:14}}>
        <div style={{position:"absolute",right:18,top:0,bottom:0,width:2,background:"linear-gradient(180deg,#8b5cf6,#6d28d9,#22c55e)",borderRadius:2}}/>

        <div style={{position:"relative",padding:"0 40px 18px 0"}}>
          <div style={{position:"absolute",right:12,top:4,width:14,height:14,borderRadius:"50%",background:"#8b5cf6",border:"3px solid "+C.bg}}/>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600}}>الدورة الأولى ({simMonths} شهر)</div>
          <div style={{fontSize:15,fontWeight:900,color:"#e2e8f0"}}>{SAR(simAmount)} → {SAR(cycleTotal)}</div>
          <div style={{fontSize:11,fontWeight:700,color:"#a78bfa"}}>+ {SAR(cycleProfit)} ربح ({profitRate}%)</div>
        </div>

        <div style={{position:"relative",padding:"0 40px 18px 0"}}>
          <div style={{position:"absolute",right:12,top:4,width:14,height:14,borderRadius:"50%",background:"#7c3aed",border:"3px solid "+C.bg}}/>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600}}>بعد 12 شهر (مرتجع جزئي)</div>
          <div style={{fontSize:15,fontWeight:900,color:"#e2e8f0"}}>رجع لك: {SAR(returned12)}</div>
          <div style={{fontSize:11,fontWeight:700,color:"#a78bfa"}}>+ إعادة تدوير {SAR(cycle2Capital)}</div>
        </div>

        <div style={{position:"relative",padding:"0 40px 4px 0"}}>
          <div style={{position:"absolute",right:12,top:4,width:14,height:14,borderRadius:"50%",background:"#22c55e",border:"3px solid "+C.bg,boxShadow:"0 0 12px rgba(34,197,94,0.4)"}}/>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600}}>إجمالي المكسب بعد سنة</div>
          <div style={{fontSize:16,fontWeight:900,color:"#22c55e"}}>+ {SAR(totalGrowth)} ﷼</div>
          <div style={{fontSize:11,fontWeight:700,color:"#4ade80"}}>↑ {growthPct}% نمو على رأس المال</div>
        </div>
      </div>

      <div style={{background:"linear-gradient(135deg,rgba(139,92,246,0.12),rgba(34,197,94,0.08))",border:"1px solid rgba(139,92,246,0.2)",borderRadius:14,padding:14,textAlign:"center"}}>
        <div style={{fontSize:12,color:"#a78bfa",fontWeight:600,marginBottom:4}}>🔥 لو شغّلت {SAR(simAmount)} ﷼ سنة كاملة</div>
        <div style={{fontSize:26,fontWeight:900,color:"#22c55e"}}>+ {SAR(totalGrowth)} ﷼</div>

    {id:"income", icon:"📅", q:"كم بيدخل عليّ؟",    color:"#22c55e", component:<Card2/>},
    {id:"overdue",icon:"🚨", q:"مين ما دفع؟",       color:"#ef4444", component:<Card3/>},
    {id:"growth", icon:"🚀", q:"كم أنمّي فلوسي؟",   color:"#8b5cf6", component:<Card4/>},
  ];

  return (
    <div style={{padding:16,maxWidth:900,margin:"0 auto"}}>
      <div style={{fontSize:22,fontWeight:900,textAlign:"center",marginBottom:2,color:C.ink}}>🧭 البوصلة المالية</div>
      <div style={{fontSize:13,color:"#64748b",textAlign:"center",marginBottom:20}}>أربع أسئلة — أجوبة بأرقامك الفعلية</div>

      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {cards.map((card,idx)=>(
          <div key={card.id} style={{background:"linear-gradient(145deg,#1a2744 0%,#162035 100%)",borderRadius:20,padding:20,border:"1px solid rgba(255,255,255,0.06)",boxShadow:"0 8px 32px rgba(0,0,0,0.3)",position:"relative",overflow:"hidden"}}>
            {/* خلفية مائية */}

            {/* الرأس */}

}

function ActivityPage({activity, setActivity, toast, setPage}){
  const [filter,setFilter] = React.useState("all");
  const list = _arr(activity);
  const actColor = a => {
    if(a.action.indexOf("حذف")>=0) return C.red;
    if(a.action==="إضافة"||a.action==="سداد") return C.green;
    if(a.action==="تعديل") return C.gold;
    if(a.action==="استرجاع") return C.teal;
    return C.ink;
  };
  const filtered = filter==="all" ? list : list.filter(a=>a.entity===filter);
  const entities = ["all","عقد","دفعة","مستثمر"];
  const entLabel = e => e==="all"?"الكل":e==="عقد"?"العقود":e==="دفعة"?"السدادات":"المستثمرون";
  return (
    <div style={styles.main}>
      <div style={styles.panel}>
        <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <h2 style={{margin:0,fontSize:18,fontWeight:900,color:C.ink}}>📜 سجل النشاط</h2>

          {list.length>0 && (
            <button style={{...styles.btn(C.red,"#fff"),fontSize:13,padding:"7px 12px"}} onClick={()=>{
              if(window.confirm("مسح كامل سجل النشاط؟ لا يمكن التراجع.")){ setActivity([]); toast("🗑 تم مسح السجل"); }
            }}>🗑 مسح السجل</button>
          )}
        </div>
        <div style={{padding:"12px 16px",display:"flex",gap:8,flexWrap:"wrap",borderBottom:"1px solid "+C.border}}>
          {entities.map(e=>(
            <button key={e} onClick={()=>setFilter(e)}
              style={{...styles.btn(filter===e?C.ink:"#e5e7eb", filter===e?"#fff":"#374151"),fontSize:13,padding:"6px 14px"}}>
              {entLabel(e)}

        </div>
        <div style={{padding:16}}>
          {filtered.length===0

            : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {filtered.map(a=>(
                  <div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"#fafafa",borderRadius:8,borderRight:"4px solid "+actColor(a)}}>
                    <span style={{background:actColor(a),color:"#fff",borderRadius:6,padding:"3px 10px",fontSize:13,fontWeight:800,whiteSpace:"nowrap"}}>{a.action}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:700,color:C.ink}}>{a.entity}{a.detail?(" — "+a.detail):""}</div>
                      <div style={{fontSize:12,color:"#1f2937",marginTop:2}}>🕐 {a.time}</div>

                ))}

  );
}

// ─── Main App ────────────────────────────────────────────────
function App() {
  const [page,setPage]=useState("dashboard");
  const [tabOrder,setTabOrder]=useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_tab_order")||"null");}catch{return null;}});
  const [dragTab,setDragTab]=useState(null);
  const [toastMsg,setToastMsg]=useState(null);
  const [toastType,setToastType]=useState("");

  // ═══ Google Sheets backend ═══
  const GS_URL = "https://script.google.com/macros/s/AKfycbyAH-4t0dkfSpJ3Q-0M_j8tXRrZk1bOSilSaMm-8wDA8vrIBEF-K1RNDdGIRD4oWiUAyA/exec";
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | saving | saved | error | loading

  // ═══ القراءة: من Firebase أولاً، ثم Google Sheets احتياطاً ═══
  const gsRead = async (sheet) => {
    // جرّب Firebase أولاً
    if (window._fbReady && window._fbDB) {
      try {
        const doc = await window._fbDB.collection("qima").doc(sheet).get();
        if (doc.exists) {
          const d = doc.data();
          if (d && d.payload !== undefined) {
            const parsed = typeof d.payload === "string" ? JSON.parse(d.payload) : d.payload;
            return Array.isArray(parsed) ? parsed : (parsed && typeof parsed==="object" ? parsed : null);
          }
        }
      } catch (e) { /* fallback لـ Sheets */ }
    }
    // احتياط: Google Sheets
    try {
      const res = await fetch(`${GS_URL}?action=read&sheet=${sheet}&_=${Date.now()}`, {cache:"no-store"});
      const json = await res.json();
      return Array.isArray(json.data) ? json.data : (json.data||null);
    } catch (e) { return null; }
  };

  // ═══ الكتابة: إلى Firebase (أساسي) + Google Sheets (احتياط) ═══
  const gsWrite = async (sheet, data, _retry) => {
    setSyncStatus("saving");
    let ok = false;
    // Firebase أولاً
    if (window._fbReady && window._fbDB) {
      try {
        await window._fbDB.collection("qima").doc(sheet).set({ payload: JSON.stringify(data), updatedAt: new Date().toISOString() });
        ok = true;
      } catch (e) { /* fallback */ }
    }
    // احتياط: Google Sheets (يبقى نسخة ثانية)
    try {
      const params = new URLSearchParams();
      params.append("action", "write");
      params.append("sheet", sheet);
      params.append("data", JSON.stringify(data));
      const res = await fetch(GS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: params.toString()
      });
      const json = await res.json();
      if (json.success) ok = true;
    } catch (e) { /* ما يهم لو Firebase نجح */ }

    if (ok) {
      setSyncStatus("saved");
      setTimeout(()=>setSyncStatus(s=>s==="saved"?"idle":s), 2000);
    } else {
      if (!_retry) { await new Promise(r=>setTimeout(r,1200)); return gsWrite(sheet, data, true); }
      setSyncStatus("error");
    }
  };

  // Load from localStorage with fallback (instant UI), then sync from Sheets in background
  const loadLS = (key, def) => {
    try { const v=localStorage.getItem(key); return v?JSON.parse(v):def; } catch{return def;}
  };
  const saveLS = (key, val) => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch{}
  };

  // ═══ النسخة الاحتياطية ═══
  // ربط مفاتيح التخزين بأوراق السحابة
  const BACKUP_MAP = {
    "qimma_investors":"investors", "qimma_contracts":"contracts", "qimma_settings":"settings",
    "qimma_txlist":"txlist", "qimma_loans":"loans", "qimma_zakat":"zakat",
    "qimma_pending":"pending", "qimma_payments":"payments", "qimma_goods3":"goods3",
    "qimma_jard_ov":"jard_ov", "qimma_daily":"daily", "qimma_daily_open":"daily_open",
    "qimma_activity":"activity", "qimma_monthclose":"monthclose", "qimma_price_ov":"price_ov", "qimma_banktx":"banktx"
  };
  const exportBackup = () => {
    try {
      const out = {};
      Object.keys(localStorage).forEach(k=>{ if(k.indexOf("qimma_")===0){ try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch{ out[k]=localStorage.getItem(k); } } });
      const blob = new Blob([JSON.stringify({_backup:"qima", _date:new Date().toISOString(), data:out},null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const d=new Date();
      a.href = url;
      a.download = `qima-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("✅ تم تنزيل النسخة الاحتياطية");
    } catch(e){ toast("⚠️ تعذّر التصدير","error"); }
  };
  const importBackup = async (file) => {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const data = parsed && parsed.data ? parsed.data : parsed;
      if(!data || typeof data!=="object"){ toast("⚠️ ملف غير صالح","error"); return; }
      // اكتب في الجهاز
      Object.keys(data).forEach(k=>{ if(k.indexOf("qimma_")===0){ try{ localStorage.setItem(k, JSON.stringify(data[k])); }catch{} } });
      // ادفع للسحابة (المفاتيح المعروفة فقط)
      const jobs = [];
      Object.keys(BACKUP_MAP).forEach(k=>{ if(data[k]!=null){ jobs.push(gsWrite(BACKUP_MAP[k], data[k])); } });
      await Promise.all(jobs);
      toast("✅ تم استرجاع النسخة... جارٍ التحديث");
      setTimeout(()=>window.location.reload(), 1200);
    } catch(e){ toast("⚠️ تعذّر الاستيراد - تأكد من الملف","error"); }
  };

  // ─── نسخ احتياطي تلقائي صامت (عبر Google Apps Script) ──────────
  const [autoBackupStatus, setAutoBackupStatus] = useState("");
  React.useEffect(()=>{
    const runAutoBackup = async () => {
      try {
        const sRaw = localStorage.getItem("qimma_settings");
        const s = sRaw ? JSON.parse(sRaw) : {};
        if(!s.autoBackup || !s.backupEmail || !s.backupScriptUrl) return;
        const last = localStorage.getItem("qimma_last_auto_backup");
        const now = Date.now();
        const hrs = parseFloat(s.autoBackupHours)||24;
        if(last && (now - parseInt(last)) < hrs*3600000) return;

        // جمّع البيانات
        const out = {};
        Object.keys(localStorage).forEach(k=>{ if(k.indexOf("qimma_")===0){ try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch{ out[k]=localStorage.getItem(k); } } });
        const backupData = {_backup:"qima", _date:new Date().toISOString(), data:out};

        setAutoBackupStatus("sending");
        const resp = await fetch(s.backupScriptUrl, {
          method:"POST",
          headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({email:s.backupEmail, backup:backupData})
        });
        const result = await resp.json();
        if(result.success){
          localStorage.setItem("qimma_last_auto_backup", String(Date.now()));
          setAutoBackupStatus("success");
          setTimeout(()=>setAutoBackupStatus(""),4000);
        } else {
          setAutoBackupStatus("error");
          setTimeout(()=>setAutoBackupStatus(""),5000);
        }
      } catch(e){
        setAutoBackupStatus("error");
        setTimeout(()=>setAutoBackupStatus(""),5000);
      }
    };
    setTimeout(runAutoBackup, 3000);
  },[]);

  const [investors,setInvestorsRaw]=useState(()=>{
    // تنظيف لمرة واحدة: مسح أسماء المستثمرين القديمة المخزنة محلياً لإجبار القراءة الطازجة
    if(!localStorage.getItem("qimma_inv_names_fixed")){
      localStorage.setItem("qimma_inv_names_fixed","1");
      localStorage.removeItem("qimma_investors");
      return DEFAULT_INVESTORS;
    }
    const d=loadLS("qimma_investors",DEFAULT_INVESTORS);return d&&d.length?d:DEFAULT_INVESTORS;});
  const [contracts,setContractsRaw]=useState(()=>_arr(loadLS("qimma_contracts",[])));
  const [settings,setSettingsRaw]=useState(()=>loadLS("qimma_settings",{profit:50,admin:2.5,acc:10,inst:10}));

  const setInvestors = v => {
    const d=typeof v==="function"?v(investors):v;
    const before=_arr(investors);
    setInvestorsRaw(d); saveLS("qimma_investors",d); gsWrite("investors",d);
    try {
      if(d.length>before.length){const a=d.find(x=>!before.some(y=>y.id===x.id));if(a)logAct("إضافة","مستثمر",(a.name||""));}
      else if(d.length<before.length){const r=before.find(x=>!d.some(y=>y.id===x.id));if(r)logAct("حذف","مستثمر",(r.name||""));}
      else {const ch=d.find(x=>{const o=before.find(y=>y.id===x.id);return o&&(o.name!==x.name||o.capital!==x.capital||o.fund!==x.fund);});if(ch)logAct("تعديل","مستثمر",(ch.name||""));}
    } catch(e){}
  };
  const setContracts = v => { const d=typeof v==="function"?v(contracts):v; setContractsRaw(d); saveLS("qimma_contracts",d); gsWrite("contracts",d); };
  const activeContracts = contracts.filter(c=>!c.deleted);
  const setSettings  = v => { const d=typeof v==="function"?v(settings):v;  setSettingsRaw(d);  saveLS("qimma_settings",d); gsWrite("settings",d); };
  const [invTxList,setInvTxListRaw]=useState(()=>loadLS("qimma_txlist",{}));
  const setInvTxList = v => { const d=typeof v==="function"?v(invTxList):v; setInvTxListRaw(d); saveLS("qimma_txlist",d); gsWrite("txlist",d); };
  const [loans,setLoansRaw]=useState(()=>{
    const raw=_arr(loadLS("qimma_loans",[]));
    // تجاهل أي سلف قديمة بقيمة بدون تفاصيل حقيقية (تنظيف لمرة واحدة)
    if(!localStorage.getItem("qimma_loans_cleaned")){
      localStorage.setItem("qimma_loans_cleaned","1");
      localStorage.removeItem("qimma_loans");
      localStorage.removeItem("qimma_jard_ov");
      return [];
    }
    return raw;
  });

  const setPayments = v => {
    const d=_arr(typeof v==="function"?v(payments):v);
    const before=_arr(payments);
    setPaymentsRaw(d); saveLS("qimma_payments",d); gsWrite("payments",d);
    // تسجيل تلقائي في سجل النشاط
    try {
      if(d.length>before.length){
        const added=d.find(x=>!before.some(y=>y.id===x.id));

        const removed=before.find(x=>!d.some(y=>y.id===x.id));
