    </table>
    <div class="summary">
      <div class="box"><div class="lbl">إجمالي الوارد (دائن)</div><div class="val" style="color:#080">${fmt(totalDain)}</div></div>
      <div class="box"><div class="lbl">إجمالي المنصرف (مدين)</div><div class="val" style="color:#b00">${fmt(totalMadin)}</div></div>
      <div class="box"><div class="lbl">آخر رصيد</div><div class="val">${fmt(lastBalance)}</div></div>
    </div>
    <div class="foot">طُبع بتاريخ ${new Date().toLocaleString("en-US")}</div>
    <button onclick="window.print()" style="display:block;margin:20px auto;padding:10px 30px;font-size:16px;background:#000;color:#fff;border:none;border-radius:8px;cursor:pointer">🖨️ طباعة</button>
    </body></html>`);
  win.document.close();
  setTimeout(()=>win.print(), 400);
}

function BankPage({bankTx, setBankTx, toast}) {
  const rows = _arr(bankTx);
  const fileRef = React.useRef(null);
  const [dragOver, setDragOver] = React.useState(false);
  const [bankQuery, setBankQuery] = React.useState(""); // 🔍 بحث بالاسم/الوصف
  const [bankFilter, setBankFilter] = React.useState("all");  // all | in | out | pos

  // حفظ الحركات (مع خيار الدمج أو الاستبدال) — مشترك بين Excel و PDF
  const saveParsed = (parsed) => {
    if(!parsed || parsed.length===0){ toast&&toast("لم يتم العثور على حركات","error"); return; }
    const existing = _arr(bankTx);
    if(existing.length > 0){
      const doMerge = window.confirm(
        "يوجد كشف سابق فيه "+existing.length+" حركة.\n\n"+
        "• اضغط \"موافق\" لـ➕ دمج الكشف الجديد ("+parsed.length+" حركة) مع السابق في كشف واحد.\n"+
        "• اضغط \"إلغاء\" لـ🔄 استبدال الكل بالكشف الجديد فقط."
      );
      if(doMerge){
        setBankTx([...existing, ...parsed]);
        toast&&toast("✅ تم دمج "+parsed.length+" حركة (الإجمالي "+(existing.length+parsed.length)+")");
      } else {
        setBankTx(parsed);
        toast&&toast("🔄 تم استبدال الكشف بـ "+parsed.length+" حركة");
      }
    } else {
      setBankTx(parsed);
      toast&&toast("✅ تم استيراد "+parsed.length+" حركة");
    }
  };

  // قراءة ملف Excel
  const readExcel = (file) => {
    if(typeof XLSX==="undefined"){ toast&&toast("مكتبة القراءة لم تُحمّل، تأكد من الإنترنت","error"); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
        // ابحث عن صف الرأس بمرونة عالية
        let hi = -1;
        const dateWords = ["التاريخ","تاريخ","date","Date"];
        const moneyWords = ["مدين","دائن","الرصيد","رصيد","مبلغ","المبلغ","سحب","إيداع","المسحوب","المودع","debit","credit","balance","amount"];
        for(let i=0;i<Math.min(grid.length,30);i++){
          const rowStr = (grid[i]||[]).map(c=>String(c||"").trim()).join("|");
          const hasDate = dateWords.some(w=>rowStr.includes(w));
          const hasMoney = moneyWords.some(w=>rowStr.includes(w));
          if(hasDate && hasMoney){ hi=i; break; }
        }
        // محاولة ثانية: أي صف فيه كلمة تاريخ
        if(hi<0){
          for(let i=0;i<Math.min(grid.length,30);i++){
            const rowStr = (grid[i]||[]).map(c=>String(c||"").trim()).join("|");
            if(dateWords.some(w=>rowStr.includes(w))){ hi=i; break; }
          }
        }
        if(hi<0){ toast&&toast("لم يتم التعرف على تنسيق الكشف — تأكد أن الملف فيه عمود التاريخ","error"); return; }
        const head = (grid[hi]||[]).map(c=>String(c||"").trim());
        const findCol = (...keys)=> head.findIndex(h=> keys.some(k=> h.toLowerCase().includes(k.toLowerCase())));
        let cDate = findCol("التاريخ","تاريخ","Date");
        let cDetails = findCol("تفاصيل","العملية","البيان","الوصف","Description","نوع");
        let cMadin = findCol("مدين","المسحوب","سحب","Debit","خصم");
        let cDain = findCol("دائن","المودع","إيداع","الوارد","Credit");
        let cBal = findCol("الرصيد","رصيد","Balance");
        // إذا ما لقى أعمدة مدين/دائن، جرّب عمود "المبلغ" الموحّد
        let cAmount = findCol("المبلغ","مبلغ","Amount","القيمة");
        // احتياط: المواقع الافتراضية لكشف الراجحي
        if(cDate<0) cDate = head.length>10 ? 11 : 0;
        if(cDetails<0) cDetails = head.length>10 ? 9 : 1;
        const numOf = (v)=>{ const n=parseFloat(String(v).replace(/[,،\s]/g,"").replace(/[^0-9.\-]/g,"")); return isNaN(n)?null:n; };
        const parsed = [];
        for(let i=hi+1;i<grid.length;i++){
          const r = grid[i]||[];
          const date = String(r[cDate]||"").trim();
          if(!date || date.length<4) continue; // تخطّي الصفوف الفارغة
          let madin=0, dain=0, balN=null;
          if(cMadin>=0) madin = Math.abs(numOf(r[cMadin])||0);
          if(cDain>=0) dain = Math.abs(numOf(r[cDain])||0);
          if(cBal>=0) balN = numOf(r[cBal]);
          // لو عمود مبلغ موحّد بدل مدين/دائن
          if(cMadin<0 && cDain<0 && cAmount>=0){
            const amt = numOf(r[cAmount])||0;
            if(amt<0) madin=Math.abs(amt); else dain=amt;
          }
          // لا نشترط الرصيد — لو مافيه نحطه 0
          if(balN===null) balN=0;
          // لازم يكون فيه حركة مالية أو تاريخ فعلي
          if(madin===0 && dain===0 && balN===0) continue;
          let detailRaw = String(r[cDetails]||"").trim();
          let nameText = "";
          if(cDetails>=0 && cDetails+1<r.length) nameText = String(r[cDetails+1]||"").trim();
          parsed.push({
            id: "bnk_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
            date, type: detailRaw, name: nameText,
            madin, dain, balance: balN,
          });
        }
        if(parsed.length===0){
          // رسالة مفصلة للتشخيص
          toast&&toast("الملف فيه "+grid.length+" صف، رأس في سطر "+(hi+1)+": ["+head.slice(0,6).join(", ")+"] — لكن ما لقيت حركات. جرّب تنسيق مختلف","error");
          return;
        }
        saveParsed(parsed);
      } catch(err){ toast&&toast("خطأ في قراءة ملف Excel: "+(err&&err.message||""),"error"); }
    };
    reader.readAsArrayBuffer(file);
  };

  // ═══ قارئ PDF مدمج بدون مكتبات خارجية ═══
  const extractPdfTextBuiltin = async (arrayBuffer) => {
    const bytes = new Uint8Array(arrayBuffer);
    const raw = new TextDecoder("latin1").decode(bytes);
    const streams = [];
    let pos = 0;
    while(true){
      const si = raw.indexOf("stream", pos);
      if(si<0) break;
      let start = si + 6;
      if(raw.charCodeAt(start)===13) start++;
      if(raw.charCodeAt(start)===10) start++;
      const ei = raw.indexOf("endstream", start);
      if(ei<0) break;
      const header = raw.substring(Math.max(0, si-500), si);
      const isFlate = header.includes("/FlateDecode");
      streams.push({ start, end: ei, isFlate, data: bytes.slice(start, ei) });
      pos = ei + 9;
    }
    const allText = [];
    for(const s of streams){
      let decoded = "";
      try {
        if(s.isFlate && typeof DecompressionStream !== "undefined"){
          const ds = new DecompressionStream("deflate");
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(s.data).catch(()=>{});
          writer.close().catch(()=>{});
          const chunks = [];
          while(true){ const {done,value} = await reader.read(); if(done) break; chunks.push(value); }
          const total = chunks.reduce((a,c)=>a+c.length,0);
          const result = new Uint8Array(total); let offset=0;
          for(const c of chunks){ result.set(c, offset); offset += c.length; }
          decoded = new TextDecoder("utf-8",{fatal:false}).decode(result);
        } else if(!s.isFlate) {
          decoded = new TextDecoder("utf-8",{fatal:false}).decode(s.data);
        }
      } catch(e){ continue; }
      if(!decoded) continue;
      const tjMatches = decoded.matchAll(/\(([^)]*)\)\s*Tj/g);
      for(const m of tjMatches){ const t=m[1].replace(/\\n/g," ").replace(/\\(.)/g,"$1").trim(); if(t) allText.push(t); }
      const tjArr = decoded.matchAll(/\[([^\]]*)\]\s*TJ/gi);
      for(const m of tjArr){ const parts=m[1].matchAll(/\(([^)]*)\)/g); let line=""; for(const p of parts) line+=p[1].replace(/\\(.)/g,"$1"); line=line.trim(); if(line) allText.push(line); }
    }
    return allText;
  };

  const parseRajhiText = (lines) => {
    const num = (s)=>{ const v=parseFloat(String(s).replace(/[,،\s]/g,"").replace(/[^0-9.\-]/g,"")); return isNaN(v)?null:v; };
    const parsed = [];
    let currentDate = "";
    let pendingType = "";
    for(let i=0;i<lines.length;i++){
      const line = lines[i].trim();
      if(!line) continue;
      const dateMatch = line.match(/(\d{4}[\/-]\d{2}[\/-]\d{2})/);
      if(dateMatch) currentDate = dateMatch[1];
      const amounts = line.match(/[\d,]+\.\d{2}/g);
      if(amounts && amounts.length>=2){
        const nums = amounts.map(a=>Math.abs(num(a)||0));
        let bal=nums[0],madin=0,dain=0;
        if(nums.length>=3){bal=nums[0];dain=nums[1];madin=nums[2];}
        else {bal=nums[0];dain=nums[1];}
        let type = pendingType||"غير محدد";
        let name = "";
        for(let k=1;k<=3;k++){
          const next=lines[i+k]||"";
          const engMatch=next.match(/[A-Za-z]{3,}[A-Za-z\s,.]*/);
          if(engMatch && !/SAR|TOACCT|FRACCT/.test(engMatch[0])){ name=engMatch[0].trim(); break; }
        }
        if(bal>0||madin>0||dain>0){
          parsed.push({ id:"bnk_b_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), date:currentDate, type, name, madin, dain, balance:bal });
        }
        pendingType="";
      } else {
        const arabic=line.replace(/[^\u0600-\u06FF\s]/g,"").trim();
        if(arabic.length>=3 && arabic.length<=40) pendingType=arabic;
      }
    }
    return parsed;
  };

  const readPDF = async (file) => {
    toast&&toast("⏳ جارٍ قراءة الـ PDF...");
    const reader = new FileReader();
    reader.onload = async (e) => {
      const buf = e.target.result;
      // أولاً: جرّب المكتبة الخارجية لو موجودة
      const lib = window.pdfjsLib || window["pdfjs-dist/build/pdf"];
      if(lib){
        try{
          try{ if(lib.GlobalWorkerOptions && !lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js"; }catch(x){}
          const pdf = await lib.getDocument({data:new Uint8Array(buf)}).promise;
          let items = [];
          for(let p=1;p<=pdf.numPages;p++){
            const page=await pdf.getPage(p);
            const tc=await page.getTextContent();
            const vp=page.getViewport({scale:1});
            tc.items.forEach(it=>{ const tx=it.transform; items.push({str:it.str,x:tx[4],y:vp.height-tx[5],page:p}); });
          }
          const parsed = parseRajhiPDF(items);
          if(parsed.length>0){ saveParsed(parsed); return; }
        }catch(ex){ console.warn("pdfjsLib failed, trying builtin:", ex); }
      }
      // ثانياً: القارئ المدمج (بدون مكتبة)
      try{
        const textLines = await extractPdfTextBuiltin(buf);
        if(textLines.length===0){ toast&&toast("لم أستطع استخراج نص من الـ PDF — جرّب Excel","error"); return; }
        const parsed = parseRajhiText(textLines);
        if(parsed.length>0){ saveParsed(parsed); return; }
        // لو ما لقى حركات من الأسطر، جرّب كنص كامل
        const fullText = textLines.join("\n");
        const allNums = fullText.match(/[\d,]+\.\d{2}/g);
        toast&&toast("تم استخراج "+textLines.length+" سطر و "+(allNums?allNums.length:0)+" رقم، لكن ما تعرّفت على تنسيق الراجحي — جرّب Excel","error");
      }catch(err){
        toast&&toast("خطأ في قراءة PDF: "+(err&&err.message||"")+" — جرّب Excel","error");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  // موجّه: يفرّق حسب نوع الملف (بالامتداد أو نوع MIME)
  const readFile = (file) => {
    if(!file) return;
    const name = (file.name||"").toLowerCase();
    const mime = (file.type||"").toLowerCase();
    const isPdf = name.endsWith(".pdf") || mime.indexOf("pdf")>-1;
    const isXls = name.endsWith(".xlsx")||name.endsWith(".xls")||mime.indexOf("sheet")>-1||mime.indexOf("excel")>-1;
    if(isPdf) readPDF(file);
    else if(isXls) readExcel(file);
    else if(mime.indexOf("pdf")>-1) readPDF(file);
    else toast&&toast("صيغة غير مدعومة — ارفع Excel أو PDF","error");
  };

  const lastBalance = rows.length ? rows[rows.length-1].balance : 0;
  const totalDain = rows.reduce((s,r)=>s+(+r.dain||0),0);
  const totalMadin = rows.reduce((s,r)=>s+(+r.madin||0),0);

  // ═══ تجميع تلقائي: يكتشف كل أنواع الحركات الموجودة في الكشف ويصنع تبويباً لكل نوع ═══
  // يوحّد "شراء عبر نقاط البيع أثير (محلي)" و"...Apple Pay" تحت مسمى واحد "نقاط البيع"
  const normType = (r) => {
    let t = (r.type||"").trim();
    if(!t) t = "أخرى";
    if(t.indexOf("نقاط البيع")>-1 || t.indexOf("نقاط بيع")>-1) return "نقاط البيع";
    return t;
  };
  // خريطة: النوع → {عدد، وارد، منصرف}
  const typeMap = {};
  rows.forEach(r=>{
    const k = normType(r);
    if(!typeMap[k]) typeMap[k] = {key:k, count:0, dain:0, madin:0};
    typeMap[k].count++;
    typeMap[k].dain  += (+r.dain||0);
    typeMap[k].madin += (+r.madin||0);
  });
  // ترتيب: الأكثر حركةً أولاً
  const typeGroups = Object.values(typeMap).sort((a,b)=>b.count-a.count);
  // ألوان دوّارة للتبويبات
  const palette = ["#0891b2","#7c3aed","#b45309","#0d9488","#dc2626","#2563eb","#db2777","#65a30d","#c2410c","#4f46e5","#0369a1","#9333ea"];
  const colorFor = (k) => palette[Math.abs(k.split("").reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length];

  // 🔍 تصفية بالبحث + فلتر (وارد/منصرف/نوع تلقائي)
  const _bq = bankQuery.trim().toLowerCase();
  let shownRows = rows;
  if(bankFilter==="in")  shownRows = shownRows.filter(r=>(+r.dain||0)>0);
  else if(bankFilter==="out") shownRows = shownRows.filter(r=>(+r.madin||0)>0);
  else if(bankFilter!=="all") shownRows = shownRows.filter(r=>normType(r)===bankFilter); // فلتر نوع
  if(_bq) shownRows = shownRows.filter(r =>
    ((r.name||"").toLowerCase().includes(_bq)) || ((r.type||"").toLowerCase().includes(_bq))
  );
  // إجماليات نتيجة العرض الحالي
  const qDain = shownRows.reduce((s,r)=>s+(+r.dain||0),0);
  const qMadin = shownRows.reduce((s,r)=>s+(+r.madin||0),0);

  return (
    <div>
      <div style={{...styles.card,marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,marginBottom:14}}>
          <div style={{fontSize:18,fontWeight:800,color:C.ink}}>🏦 رصيد الحساب البنكي (الراجحي)</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button style={styles.btn(C.teal)} onClick={()=>fileRef.current&&fileRef.current.click()}>📥 رفع كشف (Excel أو PDF)</button>
            {rows.length>0 && <button style={styles.btn(C.gold)} onClick={()=>printBankStatement(shownRows,lastBalance,_bq?qDain:totalDain,_bq?qMadin:totalMadin,_bq?("بحث: "+bankQuery):"")}>🖨️ طباعة الكشف</button>}
            {rows.length>0 && <button style={styles.btn(C.red)} onClick={()=>{if(window.confirm("مسح كل الحركات؟"))setBankTx([]);}}>🗑️ مسح</button>}
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" style={{display:"none"}}
            onChange={e=>{const f=e.target.files&&e.target.files[0]; readFile(f); e.target.value="";}}/>
        </div>

        {/* منطقة السحب والإفلات */}
        <div onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)}
          onDrop={e=>{e.preventDefault();setDragOver(false);const f=e.dataTransfer.files&&e.dataTransfer.files[0];readFile(f);}}
          onClick={()=>fileRef.current&&fileRef.current.click()}
          style={{border:"2px dashed "+(dragOver?C.teal:C.border),borderRadius:12,padding:"20px",textAlign:"center",cursor:"pointer",background:dragOver?C.tealLt:"#fafafa",marginBottom:8}}>
          <div style={{fontSize:15,color:C.ink2,fontWeight:600}}>📄 اسحب ملف كشف الراجحي هنا، أو اضغط للاختيار</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:4}}>Excel (.xlsx) أو PDF من تطبيق الراجحي</div>
          {rows.length>0 && <div style={{fontSize:12,color:"#0d9488",marginTop:6,fontWeight:700}}>💡 عند رفع كشف جديد سيسألك: دمج (تكملة) أم استبدال</div>}
        </div>
      </div>

      {rows.length>0 && (
        <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:16}}>
            {/* الرصيد الحالي — غير قابل للنقر */}
            <div style={{...styles.card,textAlign:"center",borderTop:"3px solid "+C.gold,padding:"12px"}}>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:4,fontWeight:600}}>💰 الرصيد الحالي</div>
              <div style={{fontSize:18,fontWeight:900,color:C.gold}}>{SAR(lastBalance)}</div>
            </div>
            {/* الوارد — قابل للنقر */}
            <div onClick={()=>setBankFilter(f=>f==="in"?"all":"in")} title="اضغط لعرض الحركات الواردة"
              style={{...styles.card,textAlign:"center",borderTop:"3px solid "+C.green,padding:"12px",cursor:"pointer",
                background: bankFilter==="in"?"#f0fdf4":"#fff", outline: bankFilter==="in"?"2px solid "+C.green:"none",transition:"all .12s"}}>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:4,fontWeight:600}}>⬆️ إجمالي الوارد</div>
              <div style={{fontSize:18,fontWeight:900,color:C.green}}>{SAR(totalDain)}</div>
              <div style={{fontSize:11,color:C.green,marginTop:3,fontWeight:700}}>اضغط للعرض</div>
            </div>
            {/* المنصرف — قابل للنقر */}
            <div onClick={()=>setBankFilter(f=>f==="out"?"all":"out")} title="اضغط لعرض الحركات المنصرفة"
              style={{...styles.card,textAlign:"center",borderTop:"3px solid "+C.red,padding:"12px",cursor:"pointer",
                background: bankFilter==="out"?"#fef2f2":"#fff", outline: bankFilter==="out"?"2px solid "+C.red:"none",transition:"all .12s"}}>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:4,fontWeight:600}}>⬇️ إجمالي المنصرف</div>
              <div style={{fontSize:18,fontWeight:900,color:C.red}}>{SAR(totalMadin)}</div>
              <div style={{fontSize:11,color:C.red,marginTop:3,fontWeight:700}}>اضغط للعرض</div>
            </div>
            {/* عدد الحركات — غير قابل للنقر */}
            <div style={{...styles.card,textAlign:"center",borderTop:"3px solid "+C.teal,padding:"12px"}}>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:4,fontWeight:600}}>📊 عدد الحركات</div>
              <div style={{fontSize:18,fontWeight:900,color:C.teal}}>{rows.length}</div>
            </div>
          </div>

          {/* ═══ تبويبات تلقائية: بطاقة لكل نوع حركة موجود في الكشف ═══ */}
          <div style={{fontSize:13,fontWeight:700,color:C.ink2,marginBottom:8}}>📁 أنواع الحركات (اضغط أي نوع لعرض حركاته)</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:16}}>
            {typeGroups.map(g=>{
              const col = colorFor(g.key);
              const active = bankFilter===g.key;
              const net = g.dain - g.madin; // موجب=وارد، سالب=منصرف
              return (
                <div key={g.key} onClick={()=>setBankFilter(f=>f===g.key?"all":g.key)} title={"اضغط لعرض: "+g.key}
                  style={{...styles.card,textAlign:"center",borderTop:"3px solid "+col,padding:"11px 10px",cursor:"pointer",
                    background: active ? col+"11" : "#fff", outline: active ? "2px solid "+col : "none",transition:"all .12s"}}>
                  <div style={{fontSize:12.5,color:"#374151",marginBottom:5,fontWeight:700,lineHeight:1.4,minHeight:34,display:"flex",alignItems:"center",justifyContent:"center"}}>{g.key}</div>
                  <div style={{fontSize:16,fontWeight:900,color:col}}>{net<0?"−":(net>0?"+":"")}{SAR(Math.abs(net))}</div>
                  <div style={{fontSize:11,color:col,marginTop:3,fontWeight:700}}>{g.count} حركة · اضغط</div>
                </div>
              );
            })}
          </div>

          {/* شارة الفلتر النشط */}
          {bankFilter!=="all" && (()=>{
            let lbl, col, bg, sum;
            if(bankFilter==="in"){ lbl="⬆️ الحركات الواردة (الإيداعات)"; col=C.green; bg="#f0fdf4"; sum=qDain; }
            else if(bankFilter==="out"){ lbl="⬇️ الحركات المنصرفة"; col=C.red; bg="#fef2f2"; sum=qMadin; }
            else { lbl="📁 "+bankFilter; col=colorFor(bankFilter); bg=col+"11"; sum=(qDain-qMadin>=0?qDain:qMadin); }
            return (
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:12,background:bg,border:"2px solid "+col,borderRadius:12,padding:"10px 14px",flexWrap:"wrap"}}>
                <span style={{fontSize:14,fontWeight:800,color:col}}>{lbl} — {shownRows.length} حركة · وارد {SAR(qDain)} · منصرف {SAR(qMadin)}</span>
                <button onClick={()=>setBankFilter("all")} style={{border:"none",background:col,color:"#fff",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:13,fontWeight:700}}>✕ إلغاء</button>
              </div>
            );
          })()}

          {/* 🔍 بحث عن اسم شخص أو نوع عملية */}
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,background:"#f8fafc",border:"2px solid "+C.border,borderRadius:12,padding:"8px 12px"}}>
            <span style={{fontSize:18}}>🔍</span>
            <input type="text" placeholder="ابحث باسم شخص أو نوع عملية (تحويل / راتب / إيداع ...)"
              value={bankQuery} onChange={e=>setBankQuery(e.target.value)}
              style={{flex:1,border:"none",outline:"none",background:"transparent",fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:15,fontWeight:600,color:C.ink}}/>
            {bankQuery && <button onClick={()=>setBankQuery("")} style={{border:"none",background:"#e2e8f0",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:14,fontWeight:700,color:"#475569"}}>✕</button>}
          </div>
          {_bq && (
            <div style={{fontSize:14,fontWeight:700,color:C.ink2,marginBottom:10}}>
              نتيجة البحث: {shownRows.length} حركة · وارد {SAR(qDain)} · منصرف {SAR(qMadin)}
            </div>
          )}

          <div style={{overflowX:"auto",borderRadius:10,boxShadow:"0 2px 12px rgba(0,0,0,0.08)"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
              <thead>
                <tr style={{background:C.ink,color:"#fff"}}>
                  {["التاريخ","تفاصيل العملية","مدين","دائن","الرصيد"].map(h=>(
                    <th key={h} style={{padding:"10px 8px",whiteSpace:"nowrap",fontWeight:700,textAlign:"center"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {shownRows.length===0 ? (
                  <tr><td colSpan={5} style={{padding:24,textAlign:"center",color:"#6b7280"}}>لا توجد حركات مطابقة</td></tr>
                ) : shownRows.map((r,i)=>(
                  <tr key={r.id||i} style={{background:i%2===0?"#fff":"#f8f8f8"}}>
                    <td style={{padding:"8px",borderBottom:"1px solid #eee",textAlign:"center",whiteSpace:"nowrap",fontWeight:600}}>{r.date}</td>
                    <td style={{padding:"8px",borderBottom:"1px solid #eee",textAlign:"right"}}>
                      <div style={{fontWeight:700,fontSize:13}}>{r.type}</div>
                      {r.name && <div style={{fontSize:12,color:"#6b7280"}}>{r.name}</div>}
                    </td>
                    <td style={{padding:"8px",borderBottom:"1px solid #eee",textAlign:"center",color:C.red,fontWeight:700}}>{r.madin>0?SAR(r.madin):""}</td>
                    <td style={{padding:"8px",borderBottom:"1px solid #eee",textAlign:"center",color:C.green,fontWeight:700}}>{r.dain>0?SAR(r.dain):""}</td>
                    <td style={{padding:"8px",borderBottom:"1px solid #eee",textAlign:"center",fontWeight:800,color:C.gold,background:"#fffbf0"}}>{SAR(r.balance)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:10,textAlign:"center"}}>💡 الرصيد الحالي ({SAR(lastBalance)}) يُربط تلقائياً بـ"رصيد الحسابات البنكية" في الجرد</div>
        </>
      )}
    </div>
  );
}

function MonthlyPortfolio({contracts, investors, settings, payments, monthClose, setMonthClose, JardComp, toast, BankComp, daily, dailyOpen, setDailyOpen}) {
  const [tab, setTab] = React.useState("ind");
  const [openMonth, setOpenMonth] = React.useState(null);
  const getPeriod = d => fiscalYM(d);
  const mLabel = ym => { const [y,m]=ym.split("-"); return "شهر "+parseInt(m)+" - "+y; };
  const allC = contracts.filter(c=>!c.deleted);
  const allMonths = [...new Set(contracts.map(c=>getPeriod(c.date)))].sort().reverse();
  // كل الأشهر تظهر — المقفلة مالياً تتوسم بشارة 🔒 فقط (لا تختفي)
  const months = allMonths;

  const calcMonth = (ym) => {
    const mc = contracts.filter(c=>getPeriod(c.date)===ym && !c.deleted);
    const tot = mc.reduce((a,c)=>{const r=calcC(c,settings);return{amt:a.amt+c.amount,profit:a.profit+r.profit,admin:a.admin+r.admin,acc:a.acc+r.acc,inst:a.inst+r.inst,net:a.net+r.net};},{amt:0,profit:0,admin:0,acc:0,inst:0,net:0});
    const collected = (payments||[]).filter(p=>p.date && getPeriod(p.date)===ym).reduce((s,p)=>s+(+p.amount||0),0);
    const [y,m]=ym.split("-").map(Number);
    const periodEnd = new Date(y, m, 20);
    // المستحق: مجموع الأقساط الواجبة حتى نهاية الشهر لكل العقود
    const due = allC.reduce((s,c)=>{
      const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
      if(inst<=0||!c.firstInst) return s;
      const first=new Date(c.firstInst); if(first>periodEnd) return s;
      const totalCount=Math.max(1,Math.round(total/inst));
      let el=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
      if(periodEnd.getDate()>=first.getDate()) el+=1;
      const dueCount=Math.min(Math.max(0,el),totalCount);
      return s+Math.max(0,Math.min(inst,(dueCount*inst)-_getPaid(payments,c.id)));
    },0);
    // نقدي/شهري + مجموع الأقساط الشهرية + الإجمالي بالفائدة
    const cashCount = mc.filter(c=>c.contractType==="defer").length;
    const monthlyCount = mc.filter(c=>c.contractType!=="defer").length;
    const totalWithProfit = mc.reduce((s,c)=>s+Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id)),0);
    const instSum = mc.reduce((s,c)=>s+(+c.instAmt||0),0);
    // محصلة المستثمرين: كل المستثمرين، ولو بدون عقود يطلع أصفار
    const invRows = sortedInvestors(investors).map(iv=>{
      const ic = mc.filter(c=>String(c.investorId)===String(iv.id));
      const cash = ic.reduce((s,c)=>s+(+c.amount||0),0);
      const total = ic.reduce((s,c)=>s+(+c.totalInst||+c.amount||0),0);
      const inst = ic.reduce((s,c)=>s+(+c.instAmt||0),0);
      // المحصّل والمستحق لعقود هذا المستثمر في هذا الشهر
      const ids = ic.map(c=>c.id);
      const coll = (payments||[]).filter(p=>p.date && getPeriod(p.date)===ym && ids.includes(p.contractId)).reduce((s,p)=>s+(+p.amount||0),0);
      const dueInv = ic.reduce((s,c)=>{
        const it=+c.instAmt||0, tt=+c.totalInst||+c.amount||0;
        if(it<=0||!c.firstInst) return s;
        const first=new Date(c.firstInst); if(first>periodEnd) return s;
        const tc=Math.max(1,Math.round(tt/it));
        let el=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
        if(periodEnd.getDate()>=first.getDate()) el+=1;
        const dc=Math.min(Math.max(0,el),tc);
        return s+Math.max(0,Math.min(it,(dc*it)-_getPaid(payments,c.id)));
      },0);
      return {name:invLabel(iv), count:ic.length, cash, total, inst, coll, due:dueInv, late:Math.max(0,dueInv-coll)};
    });

    // ═══ قوائم تفصيلية لكل بطاقة ═══
    const invName = id => { const iv=investors.find(x=>String(x.id)===String(id)); return iv?invLabel(iv):"—"; };
    const pType = c => c.contractType==="defer" ? "مبلغ مؤجل" : "قسط شهري";
    // دفعات المحصّل (كل دفعة في الشهر)
    const collectedDetail = (payments||[]).filter(p=>p.date && getPeriod(p.date)===ym).map(p=>{
      const c=allC.find(k=>k.id===p.contractId);
      return {name:c?c.client:"—", inv:c?invName(c.investorId):"—", amount:+p.amount||0, date:p.date, type:c?pType(c):"—"};
    }).sort((a,b)=>new Date(b.date)-new Date(a.date));
    // المستحق (لكل عقد له مستحق)
    const dueDetail=[], lateDetail=[];
    allC.forEach(c=>{
      const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
      if(inst<=0||!c.firstInst) return;
      const first=new Date(c.firstInst); if(first>periodEnd) return;
      const totalCount=Math.max(1,Math.round(total/inst));
      let el=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
      if(periodEnd.getDate()>=first.getDate()) el+=1;
      const dueCount=Math.min(Math.max(0,el),totalCount);
      const dueAmt=Math.max(0,Math.min(inst,(dueCount*inst)-_getPaid(payments,c.id)));
      const collForC=(payments||[]).filter(p=>p.date&&getPeriod(p.date)===ym&&p.contractId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
      if(dueAmt>0) dueDetail.push({name:c.client, inv:invName(c.investorId), amount:dueAmt, type:pType(c)});
      const lateAmt=Math.max(0,dueAmt-collForC);
      if(lateAmt>0) lateDetail.push({name:c.client, inv:invName(c.investorId), amount:lateAmt, type:pType(c)});
    });
    // عقود (للبطاقات المبنية على العقود)
    const contractRows = (list,valFn)=>list.map(c=>({name:c.client, inv:invName(c.investorId), amount:valFn(c), type:pType(c)}));
    const details = {
      count: contractRows(mc,c=>+c.amount||0),
      cashCount: contractRows(mc.filter(c=>c.contractType==="defer"),c=>+c.amount||0),
      monthlyCount: contractRows(mc.filter(c=>c.contractType!=="defer"),c=>+c.amount||0),
      amt: contractRows(mc,c=>+c.amount||0),
      totalWithProfit: contractRows(mc,c=>Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id))),
      instSum: contractRows(mc,c=>+c.instAmt||0),
      profit: contractRows(mc,c=>calcC(c,settings).profit),
      net: contractRows(mc,c=>{const r=calcC(c,settings);return r.profit-r.inst-r.acc;}),
      inst: contractRows(mc,c=>calcC(c,settings).inst),
      acc: contractRows(mc,c=>calcC(c,settings).acc),
      collected: collectedDetail,
      due: dueDetail,
      late: lateDetail,
    };
    return {mc, tot, collected, due, count:mc.length, cashCount, monthlyCount, totalWithProfit, instSum, invRows, late:Math.max(0,due-collected), details};
  };
  const totalRemaining = allC.reduce((s,c)=>s+Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id)),0);
  const closedMonths = Object.keys(monthClose||{}).sort().reverse();

  // ═══ إقفال الدورة وبدء شهر جديد ═══
  // يحفظ لقطة الشهر بالأرشيف + يحرّك رصيد بداية الصندوق لليوم بمبلغ المتبقي الحالي
  // النتيجة: المصروف/استلام المدير/الرئيس/السداد تتصفّر تلقائياً (الحركات القديمة تصير قبل نقطة البداية)
  // لا يُمسح أي شيء — كله محفوظ بالكشف الشامل والأرشيف
  const closeCycleAndReset = () => {
    // 1) حساب المتبقي الحالي في الصندوق
    const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
    const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
    const baseAmount = base ? (+base.amount||0) : 0;
    const baseDate = base ? base.date : "0000-00-00";
    const _daily = daily||[];
    const netSince = _daily.filter(d=>d.date >= baseDate)
      .reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
    const boxNow = baseAmount + netSince;

    // 2) الشهر (الدورة) الحالي حسب السنة المالية
    const nowD = new Date();
    const curYM = fiscalYM(nowD);
    const todayStr = todayLocal();

    // تأكيد
    if(!window.confirm(
      "🔒 إقفال الدورة الحالية وبدء شهر جديد؟\n\n"+
      "• سيُحفظ الشهر ("+mLabel(curYM)+") في الأرشيف\n"+
      "• الرصيد الافتتاحي الجديد = "+SAR(boxNow)+"\n"+
      "• تتصفّر: المصروف · استلام المدير · استلام الرئيس · السداد\n\n"+
      "⚠️ لا يُمسح أي شيء — كل الحركات محفوظة بالكشف الشامل.\n\n"+
      "متابعة؟"
    )) return;

    // 3) حفظ لقطة الشهر بالأرشيف
    const d = calcMonth(curYM);
    setMonthClose(p=>({...(p||{}),[curYM]:{
      closedAt:new Date().toISOString(),
      collected:d.collected, amt:d.tot.amt, profit:d.tot.profit,
      admin:d.tot.admin, acc:d.tot.acc, inst:d.tot.inst, net:d.tot.net, count:d.count,
      cycleReset:true, openingCarried:boxNow
    }}));

    // 4) تحريك نقطة بداية الصندوق لليوم بمبلغ المتبقي
    setDailyOpen(p=>({...(p&&typeof p==="object"&&!Array.isArray(p)?p:{}), __base:{date:todayStr, amount:boxNow}}));

    toast("✅ تم إقفال الدورة — بدأ شهر جديد برصيد "+SAR(boxNow));
  };

  const printAll = (rows, title) => {
    const w=window.open("","_blank"); if(!w){alert("اسمح بالنوافذ المنبثقة");return;}
    const body=rows.map(r=>"<tr><td>"+mLabel(r.ym)+"</td><td>"+SAR(r.d.collected)+"</td><td>"+SAR(r.d.tot.amt)+"</td><td>"+SAR(r.d.tot.profit)+"</td><td>"+SAR(r.d.tot.net)+"</td><td>"+r.d.count+"</td></tr>").join("");
    w.document.write("<!DOCTYPE html><html dir='rtl'><head><meta charset='utf-8'><title>"+title+"</title><style>*{font-family:Arial}body{padding:18px}h1{font-size:20px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #999;padding:7px;text-align:center}th{background:#f0f0f0}</style></head><body onload='window.print()'><h1>مؤسسة قمة الفرصة التجارية — "+title+"</h1><table><thead><tr><th>الشهر</th><th>المحصّل</th><th>قيمة العقود</th><th>الأرباح</th><th>صافي المستثمرين</th><th>عدد العقود</th></tr></thead><tbody>"+body+"</tbody></table></body></html>");
    w.document.close();
  };

  const subTabs=[{k:"ind",l:"💼 المؤشرات"},{k:"jard",l:"📦 الجرد"},{k:"bank",l:"🏦 رصيد الحساب"}];

  return (
    <div style={styles.main}>
      <div style={{display:"flex",gap:0,marginBottom:16,background:C.white,borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",width:"fit-content",flexWrap:"wrap"}}>
        {subTabs.map(t=>(
          <button key={t.k} onClick={()=>{setTab(t.k);setOpenMonth(null);}}
            style={{fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:15,fontWeight:700,padding:"10px 18px",border:"none",cursor:"pointer",background:tab===t.k?C.teal:C.white,color:tab===t.k?"#fff":C.ink2,whiteSpace:"nowrap"}}>{t.l}</button>
        ))}
      </div>

      {tab==="ind" && (openMonth ? (
        <MonthDetail ym={openMonth} calcMonth={calcMonth} mLabel={mLabel}
          investors={investors} allC={allC} payments={payments} invLabel={invLabel}
          isClosed={!!(monthClose&&monthClose[openMonth])}
          onBack={()=>setOpenMonth(null)}
          onClose={()=>{const d=calcMonth(openMonth);setMonthClose(p=>({...(p||{}),[openMonth]:{closedAt:new Date().toISOString(),collected:d.collected,amt:d.tot.amt,profit:d.tot.profit,admin:d.tot.admin,acc:d.tot.acc,inst:d.tot.inst,net:d.tot.net,count:d.count}}));toast("🔒 تم إقفال الشهر");}}
          onReopen={()=>{if(window.confirm("فتح الشهر المقفل؟")){setMonthClose(p=>{const n={...(p||{})};delete n[openMonth];return n;});toast("🔓 تم فتح الشهر");}}}
        />
      ) : (
        <div style={styles.panel}>
          <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <h2 style={{margin:0,fontSize:18,fontWeight:900,color:C.ink}}>💼 مؤشرات المحفظة الشهرية</h2>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:13,color:"#1f2937",fontWeight:700}}>المتبقي الكلي: <span style={{color:C.red,fontWeight:900}}>{SAR(totalRemaining)}</span></span>
              <button style={{...styles.btn(C.green,"#fff"),fontSize:13,padding:"7px 12px"}} onClick={closeCycleAndReset}>🔒 إقفال الدورة وبدء شهر جديد</button>
              <button style={{...styles.btn(C.gold),fontSize:13,padding:"7px 12px"}} onClick={()=>printAll(months.map(ym=>({ym,d:calcMonth(ym)})),"المؤشرات الشهرية")}>🖨️ طباعة</button>
            </div>
          </div>
          <div style={{padding:14}}>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>اضغط أي شهر لعرض تفاصيله الكاملة</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {months.map(ym=>{
                const d=calcMonth(ym); const closed=!!(monthClose&&monthClose[ym]);
                return (
                  <div key={ym} onClick={()=>setOpenMonth(ym)}
                    style={{cursor:"pointer",border:"1px solid "+C.border,borderRadius:12,padding:14,background:closed?"#f0fdf4":"#fff",borderRight:"4px solid "+(closed?C.green:C.teal)}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
                      <div style={{fontSize:16,fontWeight:900,color:C.ink}}>{mLabel(ym)} {closed&&<span style={{fontSize:12,background:C.green,color:"#fff",borderRadius:10,padding:"2px 10px",marginRight:6}}>🔒 مقفل</span>}</div>
                      <span style={{fontSize:13,color:C.teal,fontWeight:700}}>التفاصيل ›</span>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8}}>
                      {[["📋 عدد العقود",d.count,"#475569",true],["💰 القيمة النقدية",d.tot.amt,C.teal],["🧾 الإجمالي",d.totalWithProfit,"#7c3aed"],["📈 الأرباح",d.tot.profit,C.green],["💰 ربح المستثمرين",d.tot.profit-d.tot.inst-d.tot.acc,"#0891b2"],["✅ المحصّل",d.collected,C.green]].map(([l,v,col,isCount],i)=>(
                        <div key={i} style={{textAlign:"center",background:"#fff",border:"1px solid "+C.border,borderTop:"3px solid "+col,borderRadius:8,padding:"8px 6px"}}>
                          <div style={{fontSize:12,color:"#6b7280",marginBottom:3,fontWeight:600}}>{l}</div>
                          <div style={{fontSize:15,fontWeight:900,color:col}}>{isCount?v:SAR(v)}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
              {months.length===0 && <div style={{textAlign:"center",padding:30,color:"#1f2937"}}>لا توجد بيانات</div>}
            </div>
          </div>
        </div>
      ))}

      {tab==="archive" && (
        <div style={styles.panel}>
          <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <h2 style={{margin:0,fontSize:18,fontWeight:900,color:C.ink}}>🗄️ أرشيف الأشهر المقفلة</h2>

function Dashboard({contracts,investors,settings,setInvestors,daily,setDaily,dailyOpen,setDailyOpen,toast,setPage,payments,zakatTx,setZakatTx,loans,setLoans}) {
  const [detail,setDetail] = useState(null); // {title, color, rows, mode}
  // Period: starts 21st of month, ends 20th of next month
  const getPeriod = (dateStr) => fiscalYM(dateStr);
  const months=[...new Set(contracts.map(c=>getPeriod(c.date)))].sort().reverse();
  if(!months.length){const now=new Date();months.push(now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"));}
  const [sel,setSel]=useState(months[0]||"");
  const mLabel=ym=>{const[y,m]=ym.split("-");return"شهر "+parseInt(m)+" - "+y;};
  const mc=contracts.filter(c=>getPeriod(c.date)===sel);
  const tot=mc.reduce((a,c)=>{const r=calcC(c,settings);return{amt:a.amt+c.amount,profit:a.profit+r.profit,admin:a.admin+r.admin,acc:a.acc+r.acc,inst:a.inst+r.inst,net:a.net+r.net};},{amt:0,profit:0,admin:0,acc:0,inst:0,net:0});

  // ═══ مؤشرات المحفظة (لحظية) ═══
  const allC = contracts.filter(c=>!c.deleted);
  // ١. المحصّل هذا الشهر: مجموع الدفعات اللي تقع فترتها المالية = الشهر المختار
  const collectedThisMonth = (payments||[]).filter(p=>p.date && getPeriod(p.date)===sel).reduce((s,p)=>s+(+p.amount||0),0);
  // ٢. إجمالي المتبقي على الزبائن: (إجمالي كل عقد − المحصّل منه)
  const totalRemaining = allC.reduce((s,c)=>s+Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id)),0);
  // ٣. المستحق هذا الشهر: مجموع الأقساط الواجبة حتى نهاية الشهر المختار، ناقص المدفوع (بحد أقصى قسط الشهر)
  const [selY,selM]=sel.split("-").map(Number);
  const periodEnd = new Date(selY, selM, 20); // نهاية الفترة المالية للشهر المختار (20 من الشهر التالي)
  const dueThisMonth = allC.reduce((s,c)=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0||!c.firstInst) return s;
    const first=new Date(c.firstInst);
    if(first>periodEnd) return s; // ما بدأت أقساطه بعد
    const totalCount=Math.max(1,Math.round(total/inst));
    let elapsed=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
    if(periodEnd.getDate()>=first.getDate()) elapsed+=1;
    const dueCount=Math.min(Math.max(0,elapsed),totalCount);
    const dueAmt=dueCount*inst;
    const paid=_getPaid(payments,c.id);
    return s+Math.max(0,Math.min(inst, dueAmt-paid)); // المستحق المتبقي لهذا الشهر (قسط واحد كحد أقصى)
  },0);

  // ═══ تفاصيل كل مؤشر (تظهر عند الضغط) ═══
  const invNameOf = id => (investors.find(i=>String(i.id)===String(id))||{}).name || "—";
  // قائمة المحصّل: كل دفعة وقعت في الشهر المختار
  const collectedList = (payments||[]).filter(p=>p.date && getPeriod(p.date)===sel)
    .map(p=>{const c=allC.find(k=>k.id===p.contractId);return {name:c?c.client:"—", num:c?c.num:"", amount:+p.amount||0, date:p.date};})
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  // قائمة المتبقي: كل عقد عليه متبقي
  const remainingList = allC.map(c=>({name:c.client, num:c.num, inv:invNameOf(c.investorId), amount:Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id))}))
    .filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);
  // قائمة المستحق: كل عقد عليه مستحق هذا الشهر
  const dueList = allC.map(c=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0||!c.firstInst) return null;
    const first=new Date(c.firstInst);
    if(first>periodEnd) return null;
    const totalCount=Math.max(1,Math.round(total/inst));
    let elapsed=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
    if(periodEnd.getDate()>=first.getDate()) elapsed+=1;
    const dueCount=Math.min(Math.max(0,elapsed),totalCount);
    const amt=Math.max(0,Math.min(inst,(dueCount*inst)-_getPaid(payments,c.id)));
    return amt>0?{name:c.client, num:c.num, inv:invNameOf(c.investorId), amount:amt}:null;
  }).filter(Boolean).sort((a,b)=>b.amount-a.amount);

  // ═══ لوحة شغل اليوم ═══
  const invNm = id => (investors.find(i=>String(i.id)===String(id))||{}).name || "—";
  const today = new Date();
  const todayStr = today.getFullYear()+"/"+String(today.getMonth()+1).padStart(2,"0")+"/"+String(today.getDate()).padStart(2,"0");
  // المحصّل اليوم فعلياً
  const collectedToday = (payments||[]).filter(p=>{ if(!p.date) return false; const d=new Date(p.date); return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate(); }).reduce((s,p)=>s+(+p.amount||0),0);
  // العقود حسب المخاطر (غير المكتملة)
  const withRisk = allC.map(c=>({c, r:assessRisk(c,payments)})).filter(x=>x.r.level!=="—" && x.r.level!=="مكتمل");
  const troubled = withRisk.filter(x=>x.r.months>=2).sort((a,b)=>b.r.months-a.r.months); // متعثّر/متأخر
  const slightLate = withRisk.filter(x=>x.r.months===1);
  // مستحقّون هذا الأسبوع: قسطهم يحل خلال 7 أيام قادمة (تقريبياً حسب يوم أول قسط)
  const dueSoon = allC.map(c=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0||!c.firstInst) return null;
    const paid=_getPaid(payments,c.id);
    if(total>0 && paid>=total) return null;
    const first=new Date(c.firstInst);
    let nextDue;
    if(first>today){
      // أول قسط لم يبدأ بعد: تاريخ الاستحقاق هو تاريخ أول قسط نفسه (بشهره وسنته)
      nextDue=new Date(first.getFullYear(),first.getMonth(),first.getDate());
    } else {
      // بدأت الأقساط: نحسب قسط هذا الشهر أو الذي يليه بناءً على يوم الاستحقاق
      const dueDay=first.getDate();
      nextDue=new Date(today.getFullYear(),today.getMonth(),dueDay);
      if(nextDue<today) nextDue.setMonth(nextDue.getMonth()+1);
    }
    const diffDays=Math.ceil((nextDue-today)/(1000*60*60*24));
    return (diffDays>=0 && diffDays<=7) ? {c, days:diffDays, inst} : null;
  }).filter(Boolean).sort((a,b)=>a.days-b.days);

  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
        <div style={{...styles.card,textAlign:"center",borderTop:"4px solid #f97316",cursor:"pointer"}} onClick={()=>{const el=document.getElementById("dueSoonList");if(el)el.scrollIntoView({behavior:"smooth"});}}>

          <div style={{fontSize:22,fontWeight:900,color:"#f97316"}}>{dueSoon.length}</div>
        </div>
        <div style={{...styles.card,textAlign:"center",borderTop:"4px solid "+C.red,cursor:"pointer"}} onClick={()=>{const el=document.getElementById("troubledList");if(el)el.scrollIntoView({behavior:"smooth"});}}>

          <div style={{fontSize:22,fontWeight:900,color:C.red}}>{troubled.length}</div>
        </div>
      </div>
      {/* دفتر اليومية مدمج في الرئيسية */}
      <DailyPage daily={daily} setDaily={setDaily} dailyOpen={dailyOpen} setDailyOpen={setDailyOpen} contracts={contracts} settings={settings} toast={toast} zakatTx={zakatTx} setZakatTx={setZakatTx} loans={loans} setLoans={setLoans} investors={investors} payments={payments}/>

      {/* قائمة المتابعة العاجلة */}
      {troubled.length>0 && (
        <div style={{...styles.panel,marginBottom:16,borderRight:"4px solid "+C.red}}>
          <div style={{padding:"12px 16px",borderBottom:"1px solid "+C.border,fontWeight:900,color:C.red,fontSize:15}}>🚨 متابعة عاجلة ({troubled.length})</div>
          <div style={{padding:12,display:"flex",flexDirection:"column",gap:8,maxHeight:"40vh",overflowY:"auto"}}>
            {troubled.slice(0,15).map(({c,r})=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"#fef2f2",borderRadius:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:C.ink}}>{c.client} <span style={{fontSize:12,color:"#6b7280"}}>#{c.num}</span></div>
                  <div style={{fontSize:12,color:"#1f2937",marginTop:2}}>{invNm(c.investorId)}{c.cPhone?(" • "+c.cPhone):""}</div>
                </div>
                <div style={{textAlign:"left",whiteSpace:"nowrap"}}>
                  <span style={{background:r.color,color:"#fff",borderRadius:12,padding:"2px 10px",fontSize:11,fontWeight:800}}>{r.level} {r.months} شهر</span>
                  <div style={{fontSize:13,fontWeight:900,color:C.red,marginTop:4}}>{SAR(r.overdue)}</div>

      {/* أقساط قادمة خلال أسبوع */}
      {dueSoon.length>0 && (

          <div style={{padding:"12px 16px",borderBottom:"1px solid "+C.border,fontWeight:900,color:"#f97316",fontSize:15}}>⏰ أقساط تستحق خلال أسبوع ({dueSoon.length})</div>
          <div style={{padding:12,display:"flex",flexDirection:"column",gap:8,maxHeight:"40vh",overflowY:"auto"}}>
            {dueSoon.slice(0,15).map(({c,days,inst})=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"#fff7ed",borderRadius:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:C.ink}}>{c.client} <span style={{fontSize:12,color:"#6b7280"}}>#{c.num}</span></div>
                  <div style={{fontSize:12,color:"#1f2937",marginTop:2}}>{invNm(c.investorId)}</div>

  );
}

const DAILY_TYPES = [
  {key:"sadad",   label:"سداد",          sign:1,  color:"#16a34a"},
  {key:"sahb",    label:"سحب",           sign:-1, color:"#16a34a"},
  {key:"masroof", label:"مصروف",         sign:-1, color:"#dc2626"},
  {key:"estilam", label:"استلمت نقدي",   sign:-1, color:"#dc2626"},
  {key:"mgr",     label:"استلام مدير",   sign:-1, color:"#b45309"},
  {key:"acc",     label:"استلام محاسب",  sign:-1, color:"#b45309"},
  {key:"zakat",   label:"زكاة",          sign:-1, color:"#7c3aed"},
  {key:"salf",    label:"سلف",           sign:-1, color:"#7c3aed"},
];
function DailyPage({daily, setDaily, dailyOpen, setDailyOpen, contracts, settings, toast, zakatTx, setZakatTx, loans, setLoans, investors, payments}) {
  const today = todayLocal();
  const [selDay,setSelDay] = useState(today);
  const [baseInput,setBaseInput] = useState("");
  const [baseDateInput,setBaseDateInput] = useState(today);
  const [editingBase,setEditingBase] = useState(false);
  const [form,setForm] = useState({type:"sadad", amount:"", desc:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  // ═══ كشف حساب شامل: فترة (من/إلى) + بحث + فلتر نوع ═══
  const [stmtFrom,setStmtFrom] = useState("");
  const [stmtTo,setStmtTo]     = useState("");
  const [stmtQuery,setStmtQuery] = useState("");   // نص البحث (اسم/وصف)
  const [stmtTypeFilter,setStmtTypeFilter] = useState("all"); // فلتر النوع
  const [stmtShowAll,setStmtShowAll] = useState(false); // عرض كل التفاصيل أم أعلى 10

  // حركات اليوم المحدد
  const dayRows = (Array.isArray(daily)?daily:[]).filter(d=>d.date===selDay).sort((a,b)=>a.id-b.id);

  // ═══ رصيد بداية الصندوق: نقطة واحدة ثابتة ═══
  const _daily = Array.isArray(daily) ? daily : [];
  const _dailyOpen = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
  const base = _dailyOpen.__base && typeof _dailyOpen.__base==="object" ? _dailyOpen.__base : null;
  const baseAmount = base ? (+base.amount||0) : 0;
  const baseDate = base ? base.date : "0000-00-00";
  // الرصيد الافتتاحي لليوم المختار = رصيد البداية + صافي كل الحركات من تاريخ البداية حتى أمس
  const prevNet = _daily.filter(d=>d.date < selDay && d.date >= baseDate)
    .reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
  const openingBalance = baseAmount + prevNet;

  // صافي حركات اليوم
  const dayNet = dayRows.reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
  const closingBalance = openingBalance + dayNet;

  // إجماليات حسب النوع لهذا اليوم
  const sumByType = (k)=>dayRows.filter(d=>d.type===k).reduce((s,d)=>s+(d.amount||0),0);

  // نصيب المدير والمحاسب من عقود هذا اليوم
  const dayContracts = contracts.filter(c=>c.date===selDay);
  const mgrShare = dayContracts.reduce((s,c)=>s+calcC(c,settings).inst,0);
  const accShare = dayContracts.reduce((s,c)=>s+calcC(c,settings).acc,0);

  // الحساب الكامل: المستحق من عقود الدورة الحالية - المستلم من يومية الدورة الحالية
  // العقود قبل بداية الدورة (baseDate) مؤرشفة، استحقاقها احتُسب في دورة سابقة
  const cycleContracts = contracts.filter(c=>!c.date || c.date >= baseDate);
  const mgrEarnedAll = cycleContracts.reduce((s,c)=>s+calcC(c,settings).inst,0);
  const accEarnedAll = cycleContracts.reduce((s,c)=>s+calcC(c,settings).acc,0);
  const mgrTakenAll = _daily.filter(d=>d.type==="mgr" && d.date>=baseDate).reduce((s,d)=>s+(d.amount||0),0);
  const accTakenAll = _daily.filter(d=>d.type==="acc" && d.date>=baseDate).reduce((s,d)=>s+(d.amount||0),0);
  const mgrLeft = mgrEarnedAll - mgrTakenAll;
  const accLeft = accEarnedAll - accTakenAll;

  // ═══ كشف حساب شامل عبر كل الأيام (أو ضمن فترة محددة) ═══
  // يحترم بداية الدورة الحالية (baseDate): الحركات قبلها مؤرشفة ولا تظهر
  const stmtRows = _daily.filter(d=>{
    if(d.date < baseDate) return false;  // قبل بداية الدورة = مؤرشف
    if(stmtFrom && d.date < stmtFrom) return false;
    if(stmtTo   && d.date > stmtTo)   return false;
    return true;
  });
  const stmtTotals = DAILY_TYPES.map(t=>({
    ...t,
    total: stmtRows.filter(d=>d.type===t.key).reduce((s,d)=>s+(+d.amount||0),0),
    count: stmtRows.filter(d=>d.type===t.key).length,
  }));
  const stmtIn  = stmtTotals.filter(t=>t.sign>0).reduce((s,t)=>s+t.total,0);
  const stmtOut = stmtTotals.filter(t=>t.sign<0).reduce((s,t)=>s+t.total,0);
  const stmtNet = stmtIn - stmtOut;

  // ═══ الحركات التفصيلية المصفّاة (بحث + نوع) — تعرض "مَن" وراء كل حركة ═══
  // التفاصيل تعرض الكل (قديم + جديد) مع فاصل "بداية الشهر الجديد"
  // بينما الإجماليات (stmtRows) محصورة بالدورة الحالية فقط
  const stmtDetailSource = _daily.filter(d=>{
    if(stmtFrom && d.date < stmtFrom) return false;
    if(stmtTo   && d.date > stmtTo)   return false;
    return true;
  });
  const _q = stmtQuery.trim().toLowerCase();
  const stmtDetailRows = stmtDetailSource
    .filter(d => stmtTypeFilter==="all" ? true : d.type===stmtTypeFilter)
    .filter(d => !_q ? true : ((d.desc||"").toLowerCase().includes(_q)))
    .sort((a,b)=> (a.date<b.date?1:a.date>b.date?-1:0) || (b.id-a.id)); // الأحدث أولاً
  const stmtDetailTotal = stmtDetailRows.reduce((s,d)=>{
    const t=DAILY_TYPES.find(x=>x.key===d.type); return s+(t?t.sign:1)*(+d.amount||0);
  },0);
  const isFiltering = !!_q || stmtTypeFilter!=="all";

  // رقم الإيصال التسلسلي
  const getNextReceipt = () => {
    const all = Array.isArray(daily)?daily:[];
    const maxR = all.reduce((mx,d)=>Math.max(mx,d.receiptNum||0),0);
    return maxR+1;
  };

  const printDailyReceipt = (d, receiptNum) => {
    const t=DAILY_TYPES.find(x=>x.key===d.type);
    const rNum = String(receiptNum).padStart(5,"0");
    const w=window.open("","_blank");if(!w)return;

                  {!stmtShowAll && stmtDetailRows.length>10 && (

            </div>
          </div>

            <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
              <thead>
                <tr>{["نوع الحركة","عدد الحركات","الإجمالي"].map(h=>(<th key={h} style={styles.th}>{h}</th>))}</tr>

              <tbody>
                {baseAmount !== 0 && (
                  <tr style={{background:"#f0fdfa"}}>

                    <td style={{...styles.td,fontWeight:900,color:"#0d9488"}}>+{SAR(baseAmount)}</td>
                  </tr>
                )}
                {(stmtShowAll ? stmtTotals : stmtTotals.slice(0,10)).map((t,i)=>(
                  <tr key={t.key} style={{background:(baseAmount?i+1:i)%2===0?C.white:C.gray}}>
                    <td style={styles.td}><span style={styles.badge(t.color+"22",t.color)}>{t.label}</span></td>
                    <td style={{...styles.td,textAlign:"center",fontWeight:700}}>{t.count}</td>
                    <td style={{...styles.td,fontWeight:800,color:t.color}}>{t.sign<0?"−":"+"}{SAR(t.total)}</td>

                  <tr><td colSpan={3} style={{textAlign:"center",padding:12}}>
                    <button onClick={()=>setStmtShowAll(true)} style={{...styles.btn("#64748b"),fontSize:14,padding:"8px 20px"}}>عرض الكل ▼</button>
                  </td></tr>

                  <td style={{...styles.td,fontWeight:800,color:"#0d9488"}}>الصافي</td>
                  <td style={{...styles.td,fontWeight:900,fontSize:16,color:(stmtNet+(baseAmount||0))>=0?"#0d9488":C.red}}>{SAR(stmtNet+(baseAmount||0))}</td>

      {/* رصيد بداية الصندوق نُقل إلى الإعدادات */}

    </div>
  );
}

// ─── Investors Page ──────────────────────────────────────────
function InvestorsPage({investors,contracts,settings,payments,txList={},onAdd,onDelete,setInvestors,toast}) {
  const [show,setShow]=useState(false);
  const [confirmId,setConfirmId]=useState(null);
  const [stmtInv,setStmtInv]=useState(null);
  const [yearInv,setYearInv]=useState(null);
  const [stmtType,setStmtType]=useState("brief"); // brief | detailed
  const [editCapId,setEditCapId]=useState(null);
  const [editCapVal,setEditCapVal]=useState("");
  const [form,setForm]=useState({name:"",code:"",fund:"",capital:"",bidaya:"",date:""});
  const [openId,setOpenId]=useState(null);
  const [editBidId,setEditBidId]=useState(null);
  const [editBidVal,setEditBidVal]=useState("");
  const saveBidaya=(id)=>{
    if(setInvestors){
      setInvestors(prev=>prev.map(i=>i.id===id?{...i,bidaya:parseFloat(editBidVal)||0}:i));
      toast("✅ تم تعديل البداية");
    }
    setEditBidId(null); setEditBidVal("");
  };
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const saveCapital=(id)=>{
    if(setInvestors){
      setInvestors(prev=>prev.map(i=>i.id===id?{...i,capital:parseFloat(editCapVal)||0}:i));
      toast("✅ تم تعديل رأس المال");
    }
    setEditCapId(null); setEditCapVal("");
  };
  const save=()=>{
    if(!form.name){toast("أدخل اسم المستثمر","warn");return;}
    onAdd({id:Date.now(),...form,capital:parseFloat(form.capital)||0,bidaya:parseFloat(form.bidaya)||0});
    toast("✅ تمت إضافة "+form.name);
    setForm({name:"",code:"",fund:"",capital:"",bidaya:"",date:""});setShow(false);
  };
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <div style={{fontSize:19,fontWeight:800}}>👥 المستثمرون</div>
        <button style={styles.btn(C.teal)} onClick={()=>setShow(s=>!s)}>➕ إضافة مستثمر</button>
      </div>
      {show && (
        <div style={{...styles.panel,marginBottom:16}}>
          <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>إضافة مستثمر جديد</h3></div>
          <div style={{padding:"16px 20px"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:14}}>
              {[["اسم المستثمر *","name","text","الاسم الكامل"],["الرمز (اختياري)","code","text","مثال: ف3 أو ل.ن"],["الصندوق","fund","text","اسم الصندوق"],["رأس المال (ر.س)","capital","number","مثال: 100000"],["البداية (ر.س)","bidaya","number","رأس المال الحقيقي"],["تاريخ الدخول","date","date",""]].map(([l,k,t,p])=>(
                <div key={k}>
                  <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>{l}</label>
                  <input style={styles.input} type={t} placeholder={p} value={form[k]} onChange={e=>set(k,e.target.value)}/>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button style={styles.btn(C.teal)} onClick={save}>حفظ</button>
              <button style={styles.btn("transparent",C.ink2)} onClick={()=>setShow(false)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
      {(()=>{
        // ═══ ألوان البطاقات ═══
        const K = {bg:"#0e1621",panel:"#16202e",panel2:"#1b2736",line:"rgba(255,255,255,.08)",
          teal:"#2dd4bf",gold:"#fbbf24",green:"#4ade80",amber:"#fb923c",violet:"#c084fc",
          blue:"#38bdf8",red:"#fb7185",txt:"#f1f5f9",dim:"#94a3b8",dim2:"#64748b"};
        const NF = v => (v||0).toLocaleString("en-US",{maximumFractionDigits:0});
        const _now = new Date();

        // ═══ حساب بيانات مستثمر واحد ═══
        const calcInv = (inv) => {
          const myCon = contracts.filter(c=>c.investorId===inv.id);
          const bidaya = +inv.bidaya||0;
          const capital = +inv.capital||0;
          const _auto = myCon.filter(c=>!c.isOldContract&&c.contractType!=="migrated")
            .reduce((s,c)=>{const rr=calcC(c,settings);return s-(c.amount+rr.acc+rr.inst+rr.admin);},0);
          const myPays = (payments||[]).filter(p=>myCon.some(c=>c.id===p.contractId));
          const paidSum = myPays.reduce((s,p)=>s+(+p.amount||0),0);
          const manualSum = ((txList&&txList[inv.id])||[]).reduce((s,t)=>s+(+t.amount||0),0);
          const netCash = capital + _auto + paidSum + manualSum;

          let leftMonthly=0, leftDefer=0, monthlyInst=0, overCount=0, overAmt=0, activeC=0, deferC=0;
          myCon.forEach(c=>{
            const total = +c.totalInst||+c.amount||0;
            const paid = _getPaid(payments,c.id);
            const rem = Math.max(0,total-paid);
            const isDefer = c.contractType==="defer";
            if(isDefer) deferC++;
            if(rem>0){
              activeC++;
              if(isDefer) leftDefer+=rem; else leftMonthly+=rem;
              const inst = +c.instAmt||0;
              if(!isDefer && inst>0){
                monthlyInst += inst;
                const sDate = c.firstInst||c.date;
                if(sDate){
                  const mEl = Math.max(0,Math.floor((_now-new Date(sDate))/(30.44*86400000)));
                  const od = Math.min(total,inst*mEl)-paid;
                  if(od>0){ overCount++; overAmt+=od; }
                }
              }
            }
          });
          const grand = netCash + leftMonthly + leftDefer;
          const profit = myCon.reduce((s,c)=>s+calcC(c,settings).net,0);
          const commAdmin = myCon.reduce((s,c)=>s+calcC(c,settings).admin,0);
          const commAcc = myCon.reduce((s,c)=>s+calcC(c,settings).acc,0);
          const working = myCon.reduce((s,c)=>
            c.contractType==="migrated" ? s+Math.round((+c.totalInst||0)*0.5) : s+(+c.amount||0), 0);
          const totalWP = myCon.reduce((s,c)=>s+(+c.totalInst||+c.amount||0),0);
          const collectPct = totalWP>0 ? Math.round(paidSum/totalWP*100) : 0;
          const roiReal = bidaya>0 ? (profit/bidaya*100) : null;
          const roiWork = working>0 ? (profit/working*100) : null;
          const avgC = myCon.length>0 ? Math.round(myCon.reduce((s,c)=>s+(+c.amount||0),0)/myCon.length) : 0;
          const lastPay = myPays.length>0 ? myPays.map(p=>p.date).filter(Boolean).sort().pop() : null;
          return {inv,myCon,bidaya,netCash,leftMonthly,leftDefer,grand,monthlyInst,profit,
            commAdmin,commAcc,working,collectPct,roiReal,roiWork,overCount,overAmt,
            activeC,doneC:myCon.length-activeC,deferC,avgC,lastPay};
        };

        const list = sortedInvestors(investors).map(calcInv);
        // ═══ المجاميع ═══
        const T = list.reduce((a,r)=>({
          bidaya:a.bidaya+r.bidaya, netCash:a.netCash+r.netCash,
          left:a.left+r.leftMonthly+r.leftDefer, grand:a.grand+r.grand,
          inst:a.inst+r.monthlyInst, cons:a.cons+r.myCon.length
        }),{bidaya:0,netCash:0,left:0,grand:0,inst:0,cons:0});

        const shortDate = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "—";
        const pctColor = p => p>=70?K.green:p>=40?K.amber:K.red;

        return (<div style={{marginBottom:16}}>

          {/* ══════ المربع العلوي ══════ */}
          <div style={{background:"linear-gradient(140deg,#153040,#101e2b)",border:"1px solid rgba(45,212,191,.25)",
            borderRadius:18,padding:16,marginBottom:16,position:"relative",overflow:"hidden",maxWidth:640,marginLeft:"auto",marginRight:"auto"}}>
            <div style={{position:"absolute",left:-30,bottom:-30,width:110,height:110,borderRadius:"50%",
              background:"radial-gradient(circle,rgba(45,212,191,.15),transparent 70%)",pointerEvents:"none"}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:14}}>
              <span style={{fontSize:15,fontWeight:800,color:K.txt}}>إجمالي المستثمرين</span>
              <span style={{fontSize:11,color:K.dim,fontWeight:600}}>{list.length} مستثمرين · {T.cons} عقد</span>
            </div>
            <div style={{textAlign:"center",padding:"6px 0 14px"}}>
              <div style={{fontSize:11,color:K.dim,fontWeight:600,marginBottom:3}}>الإجمالي</div>
              <div style={{fontSize:34,fontWeight:700,color:K.gold,lineHeight:1.1,letterSpacing:"-.5px"}}>{NF(T.grand)}</div>
              <div style={{fontSize:11,color:K.dim2,marginTop:5}}>﷼</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:1,background:K.line,borderRadius:11,overflow:"hidden"}}>
              <div style={{background:K.panel2,padding:"9px 5px",textAlign:"center"}}>
                <div style={{fontSize:10,color:K.dim,fontWeight:600,marginBottom:4}}>البداية</div>
                <div style={{fontSize:13.5,fontWeight:700,color:K.teal}}>{T.bidaya>0?NF(T.bidaya):"—"}</div>
              </div>
              <div style={{background:K.panel2,padding:"9px 5px",textAlign:"center"}}>
                <div style={{fontSize:10,color:K.dim,fontWeight:600,marginBottom:4}}>النقدي حالياً</div>
                <div style={{fontSize:13.5,fontWeight:700,color:K.green}}>{NF(T.netCash)}</div>
              </div>
              <div style={{background:K.panel2,padding:"9px 5px",textAlign:"center"}}>
                <div style={{fontSize:10,color:K.dim,fontWeight:600,marginBottom:4}}>عند الزبائن</div>
                <div style={{fontSize:13.5,fontWeight:700,color:K.amber}}>{NF(T.left)}</div>
              </div>
            </div>
            <div style={{marginTop:11,padding:"10px 13px",background:"rgba(74,222,128,.08)",
              border:"1px solid rgba(74,222,128,.18)",borderRadius:11,display:"flex",
              alignItems:"center",justifyContent:"space-between"}}>
              <span style={{fontSize:11.5,color:"#86efac",fontWeight:600}}>📥 المتوقع شهرياً</span>
              <span style={{fontSize:16,fontWeight:700,color:K.green}}>{NF(T.inst)}</span>

          </div>

          {list.map(r=>{

                  {secLbl("الأساس")}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 15px"}}>
                    {editBidId===inv.id ? (
                      <div style={{display:"flex",gap:5,alignItems:"center",gridColumn:"1 / -1"}}>

                        <input type="number" value={editBidVal} onChange={e=>setEditBidVal(e.target.value)}

                <div style={{paddingTop:14}}>
                  {secLbl("العائد")}
                  <div style={{background:"rgba(56,189,248,.06)",border:"1px solid rgba(56,189,248,.18)",
                    borderRadius:13,padding:"12px 13px"}}>
                    <div style={{marginBottom:11}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                        <span style={{fontSize:11,color:K.dim,fontWeight:600}}>العائد الحقيقي <span style={{fontSize:9.5,color:K.dim2}}>÷ البداية</span></span>
                        <span style={{fontSize:15,fontWeight:700,color:r.roiReal!=null?K.blue:K.dim2}}>{r.roiReal!=null?r.roiReal.toFixed(1)+"%":"—"}</span>
                      </div>
                      <div style={{height:8,background:"rgba(255,255,255,.06)",borderRadius:5,overflow:"hidden"}}>

                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                        <span style={{fontSize:11,color:K.dim,fontWeight:600}}>العائد على المشغّل <span style={{fontSize:9.5,color:K.dim2}}>÷ {NF(r.working)}</span></span>
                        <span style={{fontSize:15,fontWeight:700,color:r.roiWork!=null?K.green:K.dim2}}>{r.roiWork!=null?r.roiWork.toFixed(1)+"%":"—"}</span>
                      </div>
                      <div style={{height:8,background:"rgba(255,255,255,.06)",borderRadius:5,overflow:"hidden"}}>
                        <div style={{height:"100%",width:Math.min(100,Math.max(0,(r.roiWork||0)/30*100))+"%",
                          borderRadius:5,background:"linear-gradient(90deg,#2dd4bf,#4ade80)"}}/>
                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:K.dim2,marginTop:4}}>
                        <span>30%</span><span>15%</span><span>0</span>

                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px 15px",marginTop:11}}>
                    {kvRow("صافي الربح",NF(r.profit),K.green)}

                  </div>
                </div>

                <div style={{paddingTop:14}}>
                  {secLbl("التحصيل")}
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:5}}>
                    <span style={{color:K.dim}}>محصّل من الإجمالي</span>
                    <span style={{color:pctColor(r.collectPct),fontWeight:700}}>{r.collectPct}%</span>
                  </div>
                  <div style={{height:8,background:"rgba(255,255,255,.06)",borderRadius:5,overflow:"hidden"}}>

                      background:"linear-gradient(90deg,#2dd4bf,#4ade80)"}}/>
                  </div>
                  {r.overCount>0 && <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
                    <span style={{fontSize:10,fontWeight:700,padding:"5px 10px",borderRadius:9,background:K.panel2,
                      border:"1px solid rgba(251,113,133,.4)",color:K.red}}>متعثر <b style={{fontSize:12}}>{r.overCount}</b> · {NF(r.overAmt)}</span>
                  </div>}
                </div>

                <div style={{paddingTop:14}}>
                  {secLbl("العقود")}
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>

                    {chip("منتهي",r.doneC)}
                    {r.deferC>0 && chip("مؤجل",r.deferC,"rgba(192,132,252,.3)",K.violet)}

                    fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>كشف مختصر</button>
                  <button onClick={()=>{setStmtInv(inv);setStmtType("detailed");}} style={{flex:1,padding:"9px 4px",
                    borderRadius:10,border:"1px solid "+K.line,background:K.panel2,color:K.txt,fontSize:11,
                    fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>كشف مفصل</button>
                  <button onClick={()=>setYearInv(inv)} style={{flex:1,padding:"9px 4px",borderRadius:10,
                    border:"1px solid "+K.line,background:K.panel2,color:K.txt,fontSize:11,fontWeight:700,
                    cursor:"pointer",fontFamily:"inherit"}}>كشف سنوي</button>
                  {confirmId===inv.id ? (
                    <>
                      <button onClick={()=>{onDelete(inv.id);setConfirmId(null);toast("تم الحذف");}}

                      <button onClick={()=>setConfirmId(null)} style={{padding:"9px 9px",borderRadius:10,

                        cursor:"pointer",fontFamily:"inherit"}}>✕</button>
                    </>
                  ) : (
                    <button onClick={()=>setConfirmId(inv.id)} style={{padding:"9px 11px",borderRadius:10,
                      border:"1px solid rgba(251,113,133,.3)",background:K.panel2,color:K.red,fontSize:12,
                      cursor:"pointer",fontFamily:"inherit"}}>🗑️</button>
                  )}
