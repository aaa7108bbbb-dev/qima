    }
    tryNext();
  })();
</script>
<script>
  // تحميل pdf.js عبر عدة مصادر بالتتابع (بعضها قد يكون محجوباً على بعض الشبكات)
  window._pdfjsStatus = "لم يبدأ";
  (function(){
    var sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js",
      "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.6.172/legacy/build/pdf.min.js"
    ];
    var workers = [
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js",
      "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.6.172/legacy/build/pdf.worker.min.js"
    ];
    var idx = 0;
    function ready(){ return window.pdfjsLib || window["pdfjs-dist/build/pdf"]; }
    function tryNext(){
      if(ready()){
        var lib = ready(); window.pdfjsLib = lib;
        try{ lib.GlobalWorkerOptions.workerSrc = workers[Math.max(0,idx-1)]; }catch(e){}
        window._pdfjsStatus = "محمّل ✓ (مصدر "+idx+")";
        return;
      }
      if(idx>=sources.length){ window._pdfjsStatus = "فشل — كل المصادر محجوبة ✗"; return; }
      var s = document.createElement("script");
      s.src = sources[idx]; idx++;
      s.onload = function(){ setTimeout(tryNext, 50); };
      s.onerror = function(){ window._pdfjsStatus = "المصدر "+idx+" محجوب، أجرّب التالي..."; setTimeout(tryNext, 50); };
      document.head.appendChild(s);
    }
    tryNext();
  })();
</script>
<script>
  // ═══ تحميل Firebase بالتسلسل (أضمن على الجوال) ═══
  window._fbReady = false;
  window._fbFailed = false;
  const firebaseConfig = {
    apiKey: "AIzaSyDpIOR4iSroK9I8My-ElFgamRnvFi9wHHE",
    authDomain: "qima-erp-654fa.firebaseapp.com",
    projectId: "qima-erp-654fa",
    storageBucket: "qima-erp-654fa.firebasestorage.app",
    messagingSenderId: "420467732319",
    appId: "1:420467732319:web:b3e60119decb1f0d5610ea"
  };
  function _loadScript(src){
    return new Promise(function(resolve,reject){
      var done=false;
      var s=document.createElement("script");
      s.src=src; s.async=false;
      s.onload=function(){ if(!done){done=true;resolve();} };
      s.onerror=function(){ if(!done){done=true;reject(new Error("fail "+src));} };
      // مهلة ٦ ثواني لكل سكربت — لو تعلّق، ننتقل للمصدر التالي
      setTimeout(function(){ if(!done){done=true;reject(new Error("timeout "+src));} }, 4000);
      document.head.appendChild(s);
    });
  }
  (async function(){
    // مصادر بديلة متعددة — لو حُجب مصدر، يجرّب التالي (يتجاوز حجب gstatic)
    var sources = [
      "https://cdn.jsdelivr.net/npm/firebase@10.12.2/",
      "https://unpkg.com/firebase@10.12.2/",
      "https://www.gstatic.com/firebasejs/10.12.2/",
      "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/"
    ];
    // أسماء الملفات تختلف قليلاً بين المصادر
    function files(base){
      if(base.indexOf("gstatic")>-1) return [base+"firebase-app-compat.js", base+"firebase-auth-compat.js", base+"firebase-firestore-compat.js"];
      if(base.indexOf("cloudflare")>-1) return [base+"firebase-app-compat.min.js", base+"firebase-auth-compat.min.js", base+"firebase-firestore-compat.min.js"];
      // jsdelivr / unpkg
      return [base+"firebase-app-compat.js", base+"firebase-auth-compat.js", base+"firebase-firestore-compat.js"];
    }
    var loaded=false;
    for(var i=0;i<sources.length && !loaded;i++){
      try {
        var f=files(sources[i]);
        await _loadScript(f[0]);
        await _loadScript(f[1]);
        await _loadScript(f[2]);
        if(typeof firebase==="undefined") throw new Error("firebase undefined");
        if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        window._fbAuth=firebase.auth();
        window._fbDB=firebase.firestore();
        window._fbReady=true;
        loaded=true;
        console.log("✓ Firebase حُمّل من:", sources[i]);
      } catch(e){
        console.warn("تعذّر التحميل من "+sources[i]+" — تجربة المصدر التالي...");
      }
    }
    if(!loaded){
      window._fbFailed=true;
      console.warn("كل مصادر Firebase محجوبة — البرنامج يعمل بالوضع العادي (Google Sheets)");
    }
  })();
</script>
<style>
  * { box-sizing: border-box; }
  /* تمرير أفقي داخلي لكل الجداول العريضة — بدل تحريك الصفحة كلها */
  /* الجدول وحدة واحدة (thead+tbody يتطابقان تلقائياً)، والتمرير الأفقي على الحاوية */
  .table-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  table { width: 100%; min-width: max-content; border-collapse: collapse; }
  /* خطوط شبكة كاملة (أفقية وعمودية) لكل الخلايا — مثل Excel */
  table th, table td { border: 1px solid #cbd5e1; }
  /* رأس الجدول ثابت: يلتصق بأعلى الشاشة عند تمرير الصفحة وبأعلى الحاوية عند التمرير الداخلي */
  table thead th { position: -webkit-sticky; position: sticky; top: 0; z-index: 5; }
  /* شريط تمرير واضح */
  table::-webkit-scrollbar { height: 8px; }
  table::-webkit-scrollbar-thumb { background: #c8922a; border-radius: 4px; }
  table::-webkit-scrollbar-track { background: #f1f5f9; }

<script type="text/babel-manual" data-presets="react" id="main-app-script">

function printContent(elementId) {
  var areas = ["contract-print-area","bond-print-area","cheque-print-area","bond-g-print-area","cheque-g-print-area","bond-cl-print-area","bond-gg-print-area"];

  if(!target){ window.print(); return; }
  // ننقل منطقة الطباعة إلى نهاية body ونخفي بقية التطبيق تماماً (display:none)
  // هذا يمنع الصفحات الفاضية/المكررة نهائياً
  var root = document.getElementById("root");
  var placeholder = document.createComment("print-placeholder");
  var parent = target.parentNode;
  parent.insertBefore(placeholder, target);
  var savedStyle = target.getAttribute("style") || "";
  document.body.appendChild(target);
  target.setAttribute("style", "display:block;position:static;left:0;width:100%;background:#fff;");
  target.classList.add("print-host");
  var rootDisplay = root ? root.style.display : "";
  if(root) root.style.display = "none";
  window.print();
  setTimeout(function(){
    if(root) root.style.display = rootDisplay;
    target.setAttribute("style", savedStyle);
    target.classList.remove("print-host");
    parent.insertBefore(target, placeholder);
    placeholder.remove();
  }, 300);
}

// ─── helpers ───────────────────────────────────────────────
const SAR = n => Math.round(+(n||0)).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});
// التاريخ المحلي (يحل مشكلة نقص يوم بسبب UTC في toISOString)
const todayLocal = () => {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const dateLocal = (dt) => {
  const d = new Date(dt);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
// رمز المستثمر: يُعرض الرمز إن وُجد، وإلا الاسم الكامل
const invLabel = inv => (inv && inv.code && String(inv.code).trim()) ? String(inv.code).trim() : (inv ? inv.name : "—");

const sortedInvestors = (arr) => [..._arr(arr)].sort((a,b)=>{

  return n(a)-n(b);
});
const NUM = n => (+(n||0)).toLocaleString("en-US");

function calcContract(amount, s = {profit:50, admin:2.5, acc:10, inst:10}, totalActual) {
  amount = +amount || 0;
  // إذا مُرّر الإجمالي الفعلي (من العقد) واستخدمناه: الربح = الإجمالي − النقدي
  // وإلا (توافق مع القديم): الربح = النقدي × النسبة
  const hasTotal = totalActual != null && !isNaN(+totalActual) && +totalActual > 0;
  const profit = hasTotal ? Math.max(0, (+totalActual) - amount) : amount * (s.profit/100);
  const admin  = amount * (s.admin/100);
  const acc    = profit * (s.acc/100);
  const inst   = profit * (s.inst/100);
  const net    = profit - admin - acc - inst;
  const total  = hasTotal ? (+totalActual) : (amount + profit);
  return { profit, admin, acc, inst, net, total };
}
// مساعد: يحسب العقد باستخدام إجماليه الفعلي (totalInst)
function calcC(c, settings){ if(c.isOldContract) return {profit:0,admin:0,acc:0,inst:0,net:0,total:+c.totalInst||+c.amount||0}; if(c.contractType==='migrated'){const t=+c.totalInst||0;const p=Math.round(t*0.5);return{profit:p,admin:0,acc:0,inst:0,net:p,total:t};} return calcContract(+c.amount||0, settings, c.totalInst); }

function numToWords(n) {
  n = Math.round(n);
  const ones=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hundreds=["","مائة","مئتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  if(n===0)return"صفر";
  let r="";
  if(n>=1000){const t=Math.floor(n/1000);r+=(t===1?"ألف":t===2?"ألفان":t<=10?ones[t]+" آلاف":numToWords(t)+" ألف")+" ";n%=1000;}
  if(n>=100){r+=hundreds[Math.floor(n/100)]+" ";n%=100;}
  if(n>=20){const o=n%10;r+=(o?ones[o]+" و":"")+tens[Math.floor(n/10)]+" ";n=0;}
  if(n>0)r+=ones[n]+" ";
  return r.trim();
}

function toHijri(dateStr) {

  catch{return dateStr;}
}

function addMonths(dateStr, n) {

function fiscalYM(dateInput){
  const d = new Date(dateInput);
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(dd.getDate() < 21){ dd.setMonth(dd.getMonth()-1); }
  return dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0");
}

function fmtDate(dateStr) {
  if(!dateStr)return"—";
  try{
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}/${month}/${day}`;
  }
  catch{return dateStr;}
}

    setForm(f=>({...f,[k]:v}));
    // Auto-fill if idNum entered and matches existing contract
    if(k==="idNum" && v.length>=9){

    ? Math.round(parseFloat(form.totalInst) / parseFloat(form.instAmt))
    : 0;

    const isDefer = form.contractType==="defer";

const _getPaid = (payments, cid) => (payments||[]).filter(p=>p.contractId===cid).reduce((s,p)=>s+p.amount,0);

// ═══ تقييم مخاطر العميل ═══
// يحسب عدد الأقساط المتأخرة (المستحقة وغير المدفوعة) ويعطي مستوى + لون
const assessRisk = (c, payments) => {
  const inst = +c.instAmt || 0;
  const total = +c.totalInst || +c.amount || 0;
  const paid = _getPaid(payments, c.id);
  if(total>0 && paid>=total) return {level:"مكتمل", months:0, overdue:0, color:"#3b82f6", score:0};
  if(inst<=0 || !c.firstInst) return {level:"—", months:0, overdue:0, color:"#9ca3af", score:0};
  const first = new Date(c.firstInst);
  const now = new Date();
  const totalCount = Math.max(1, Math.round(total/inst));
  // عدد الأقساط المفترض دفعها حتى اليوم
  let due = (now.getFullYear()-first.getFullYear())*12 + (now.getMonth()-first.getMonth());
  if(now.getDate() >= first.getDate()) due += 1;
  due = Math.min(Math.max(0,due), totalCount);
  const dueAmt = due * inst;
  const behindAmt = Math.max(0, dueAmt - paid);
  const monthsBehind = inst>0 ? Math.floor(behindAmt/inst) : 0;
  // المستوى حسب شهور التأخر
  let level, color, score;
  if(monthsBehind<=0){ level="منتظم"; color="#16a34a"; score=1; }
  else if(monthsBehind===1){ level="متأخر بسيط"; color="#eab308"; score=2; }
  else if(monthsBehind===2){ level="متأخر"; color="#f97316"; score=3; }
  else { level="متعثّر"; color="#dc2626"; score=4; }
  return {level, months:monthsBehind, overdue:behindAmt, color, score};
};

  const calcEarly = (c) => {
    const calc = calcC(c, settings);
    const profitFull = calc.profit||0;
    const accShare = calc.acc||0;
    const mgrShare = calc.inst||0;
    const amount = +c.amount||0;
    const instAmt = +c.instAmt||0;
    const totalInst = +c.totalInst||amount;
    const totalMonths = instAmt>0 ? Math.round(totalInst/instAmt) : 0;
    let elapsed = 0;
    if(c.firstInst){
      const f=new Date(c.firstInst), now=new Date();
      elapsed = (now.getFullYear()-f.getFullYear())*12 + (now.getMonth()-f.getMonth());
      if(now.getDate() < f.getDate()) elapsed--;
      elapsed = Math.max(0, elapsed);
    }
    const elapsedClamped = Math.min(elapsed, totalMonths);
    let pct;
    if(elapsedClamped <= 6){ pct = 50; }
    else if(totalMonths > 6){ pct = 60 + 20 * (elapsedClamped - 6) / (totalMonths - 6); }
    else { pct = 60; }
    pct = Math.max(50, Math.min(80, pct));
    const invShare = profitFull * (pct/100);
    const profitApplied = invShare + accShare + mgrShare;
    const totalReduced = amount + profitApplied;
    const paidBefore = _getPaid(payments, c.id);
    const earlyDue = Math.max(0, totalReduced - paidBefore);
    const saving = Math.max(0, totalInst - totalReduced);
    return { profitFull, accShare, mgrShare, invShare, pct, profitApplied, totalReduced, paidBefore, earlyDue, saving, elapsed:elapsedClamped, totalMonths };

      const amt = parseFloat(collectAmounts[c.id]!=null?collectAmounts[c.id]:c.instAmt)||0;
      if(amt<=0){toast("⚠️ المبلغ غير صحيح","warn");return;}
      const realAmt = Math.min(amt, c.left);
      if(!window.confirm("تأكيد سداد "+SAR(realAmt)+" لـ "+c.client+"؟")) return;
      const newPaid = c.paid + realAmt;
      setPayments(p=>[...p,{id:Date.now()+Math.floor(Math.random()*1000),contractId:c.id,amount:realAmt,date:collectDate,note:"تحصيل"}]);
      if(newPaid>=(c.totalInst||0)){ 
        toast("🎉 "+c.client+" — تم سداد العقد بالكامل!","success");
        setTimeout(()=>{
          if(window.confirm("✅ عقد "+c.client+" انتهى بالكامل.\nهل تريد إقفاله ونقله للعقود المنتهية؟")){
            markDone(c.id);
            toast("📁 تم إقفال العقد ونقله للمنتهية");
          }
        },300);
      }
      toast("✅ "+c.client+" — "+SAR(realAmt));
    };

    return (
      <div>
        {!startCollect && <button style={{...styles.btn("#e5e7eb",C.ink),marginBottom:16}} onClick={()=>setShowCollect(false)}>← رجوع للعقود</button>}
        <div style={{...styles.card,marginBottom:16,borderTop:"4px solid "+C.green}}>
          {/* تم حذف زر المتأخرون */}
          <div style={{fontSize:19,fontWeight:900,marginBottom:12}}>⚡ تحصيل سريع</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
            <label style={{fontWeight:700,fontSize:15}}>تاريخ التحصيل:</label>
            <input type="date" style={{...styles.input,width:"auto"}} value={collectDate} onChange={e=>setCollectDate(e.target.value)}/>
          </div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:140,background:C.tealLt,borderRadius:10,padding:"10px 14px",textAlign:"center"}}>
              <div style={{fontSize:13,color:C.teal,fontWeight:700,marginBottom:2}}>سُدّد في هذا التاريخ</div>
              <div style={{fontSize:22,fontWeight:900,color:C.teal}}>{countToday} زبون</div>
            </div>
            <div style={{flex:1,minWidth:140,background:"#ecfdf5",borderRadius:10,padding:"10px 14px",textAlign:"center"}}>
              <div style={{fontSize:13,color:C.green,fontWeight:700,marginBottom:2}}>إجمالي المحصّل</div>
              <div style={{fontSize:22,fontWeight:900,color:C.green}}>{SAR(sumToday)}</div>
            </div>
          </div>
        </div>
        <select style={{...styles.select,marginBottom:10}} value={collectInv} onChange={e=>setCollectInv(e.target.value)}>
          <option value="all">👥 كل المستثمرين</option>
          {sortedInvestors(investors).map(i=><option key={i.id} value={i.id}>{invLabel(i)}</option>)}
        </select>
        <input style={{...styles.input,marginBottom:14}} placeholder="🔍 بحث بالاسم أو الجوال..." value={collectSearch} onChange={e=>setCollectSearch(e.target.value)}/>
        {activeForCollect.length===0 ? (
          <div style={{...styles.card,textAlign:"center",color:"#1f2937",padding:30}}>✅ لا يوجد زبائن عليهم متبقي</div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {activeForCollect.map((c,ci)=>{
              const inv=investors.find(i=>String(i.id)===String(c.investorId));
              const amtVal = collectAmounts[c.id]!=null?collectAmounts[c.id]:String(c.instAmt||"");
              return (
                <div key={c.id} style={{...styles.card,padding:0,overflow:"hidden",borderRadius:14,border:"1px solid "+(c.lateAmt>0?"#fecaca":"#d1fae5")}}>
                  <div style={{background:c.lateAmt>0?"#fef2f2":"#f0fdf4",padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
                    <div>
                      <div style={{fontSize:17,fontWeight:800,color:C.ink}}><span style={{color:"#9ca3af",marginLeft:6,fontSize:13}}>({ci+1})</span> {c.client}</div>
                      <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{inv?invLabel(inv):"—"} {c.contractType==="defer"&&<span style={{color:"#a87520"}}> · 🕒 مؤجل</span>}{c.contractType==="migrated"&&<span style={{color:"#6366f1"}}> · 📋 مرحّل</span>}</div>
                    </div>
                    {c.lateAmt>0
                      ? <span style={{fontSize:13,fontWeight:800,color:C.red,background:"#fee2e2",padding:"4px 12px",borderRadius:20}}>متأخر {SAR(c.lateAmt)}</span>
                      : <span style={{fontSize:13,fontWeight:800,color:C.green,background:"#dcfce7",padding:"4px 12px",borderRadius:20}}>منتظم</span>}
                  </div>
                  <div style={{padding:"12px 16px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12,textAlign:"center"}}>
                      <div style={{background:"#f8fafc",borderRadius:8,padding:"8px 4px"}}><div style={{fontSize:11,color:"#6b7280"}}>القسط</div><div style={{fontSize:15,fontWeight:800,color:C.ink}}>{SAR(c.instAmt||0)}</div></div>
                      <div style={{background:"#fef2f2",borderRadius:8,padding:"8px 4px"}}><div style={{fontSize:11,color:"#6b7280"}}>المتبقي</div><div style={{fontSize:15,fontWeight:800,color:C.red}}>{SAR(c.left)}</div></div>
                      <div style={{background:"#f0fdf4",borderRadius:8,padding:"8px 4px"}}><div style={{fontSize:11,color:"#6b7280"}}>الواصل</div><div style={{fontSize:15,fontWeight:800,color:C.green}}>{SAR(c.paid)}</div></div>
                    </div>
                    <div style={{display:"flex",gap:8,alignItems:"center"}}>
                      <input type="number" style={{...styles.input,flex:1,fontWeight:700,fontSize:16,borderColor:C.teal,borderWidth:2,borderRadius:10,padding:"10px 14px"}} placeholder="المبلغ" value={amtVal}
                        onChange={e=>setCollectAmounts(p=>({...p,[c.id]:e.target.value}))}/>
                      <button style={{...styles.btn(C.green),fontSize:16,fontWeight:800,padding:"12px 24px",whiteSpace:"nowrap",borderRadius:10,boxShadow:"0 2px 8px rgba(34,197,94,0.3)"}} onClick={()=>doCollect(c)}>💰 سدّد</button>
                    </div>
                  </div>
                  {(()=>{
                    const hist=(payments||[]).filter(p=>p.contractId===c.id).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
                    if(hist.length===0) return null;
                    let running=c.totalInst||0;
                    const rows=hist.map((p,idx)=>{running-=p.amount;return {...p,remaining:Math.max(0,running),idx};});
                    return (
                      <div style={{marginTop:0,borderTop:"3px solid "+C.border,padding:"12px 16px"}}>
                        <div style={{fontSize:15,fontWeight:900,color:C.ink,marginBottom:10}}>📋 السدادات السابقة ({hist.length})</div>
                        <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                          <thead><tr style={{background:"#f1f5f9"}}>
                            <th style={{padding:"8px 6px",fontWeight:800,borderBottom:"3px solid #94a3b8",textAlign:"center"}}>#</th>
                            <th style={{padding:"8px 6px",fontWeight:800,borderBottom:"3px solid #94a3b8",textAlign:"center"}}>التاريخ</th>
                            <th style={{padding:"8px 6px",fontWeight:800,borderBottom:"3px solid #94a3b8",textAlign:"center"}}>المبلغ</th>
                            <th style={{padding:"8px 6px",fontWeight:800,borderBottom:"3px solid #94a3b8",textAlign:"center"}}>المتبقي</th>
                            <th style={{padding:"8px 6px",fontWeight:800,borderBottom:"3px solid #94a3b8",textAlign:"center"}}></th>
                          </tr></thead>
                          <tbody>{rows.map(p=>(
                            <tr key={p.id||p.idx} style={{borderBottom:"2px solid #e2e8f0"}}>
                              <td style={{padding:"8px 6px",textAlign:"center",fontWeight:700}}>{p.idx+1}</td>
                              <td style={{padding:"8px 6px",textAlign:"center",fontWeight:700}}>{fmtDate(p.date)}</td>
                              <td style={{padding:"8px 6px",textAlign:"center",fontWeight:800,color:C.green}}>{SAR(p.amount)}</td>
                              <td style={{padding:"8px 6px",textAlign:"center",fontWeight:800,color:C.red}}>{SAR(p.remaining)}</td>
                              <td style={{padding:"8px 4px",textAlign:"center"}}>
                                <span style={{display:"flex",gap:4,justifyContent:"center"}}>
                                  <button style={{...styles.btn("#e5e7eb",C.ink),fontSize:13,padding:"6px 12px",fontWeight:700}} onClick={()=>{
                                    const v=window.prompt("تعديل مبلغ السداد:",p.amount);
                                    if(v===null) return;
                                    const n=parseFloat(v);
                                    if(isNaN(n)||n<=0){toast("⚠️ مبلغ غير صحيح","warn");return;}
                                    setPayments(arr=>arr.map(x=>x.id===p.id?{...x,amount:n}:x));
                                    toast("✅ تم تعديل السداد");
                                  }}>✏️ تعديل</button>
                                  <button style={{...styles.btn(C.redLt,C.red),fontSize:13,padding:"6px 12px",fontWeight:700}} onClick={()=>{
                                    if(!window.confirm("حذف هذا السداد نهائياً؟")) return;
                                    setPayments(arr=>arr.filter(x=>x.id!==p.id));
                                    toast("🗑 حذف");
                                  }}>🗑</button>
                                </span>
                              </td>
                            </tr>
                          ))}</tbody>
                        </table>
                      </div>
                    );
                  })()}
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <button style={{...styles.btn("#0d9488","#fff"),fontSize:16,padding:"12px 20px",flex:1,justifyContent:"center",fontWeight:800}} onClick={()=>setPage("search")}>🔍 بحث شامل</button>
        <button style={{...styles.btn("#0891b2","#fff"),fontSize:16,padding:"12px 20px",flex:1,justifyContent:"center",fontWeight:800}} onClick={()=>setShowDeduct(true)}>🏦 الاستقطاعات</button>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button style={{...styles.btn(C.green),fontSize:16,padding:"10px 20px",flex:1,justifyContent:"center"}} onClick={()=>setShowNew(true)}>➕ عقد جديد</button>
        <button style={{...styles.btn("#b45309","#fff"),fontSize:16,padding:"10px 20px",flex:1,justifyContent:"center"}} onClick={()=>setShowMigrated(true)}>📦 عقد مرحّل</button>
      </div>
      {/* Investor Report */}
      <div style={{...styles.panel,marginBottom:16,padding:"14px 18px"}}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:10}}>🔍 كشف المستثمر</div>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <select style={{...styles.input,flex:1,minWidth:180}} value={invSearch} onChange={e=>setInvSearch(e.target.value)}>
            <option value="">-- اختار المستثمر --</option>
            {sortedInvestors(investors).map(i=>(
              <option key={i.id} value={i.name}>{invLabel(i)}</option>
            ))}
          </select>
          <button style={styles.btn(reportMode==="detailed"?C.teal:"#e5e7eb",reportMode==="detailed"?"#fff":C.ink)} onClick={()=>setReportMode("detailed")}>📊 مفصل</button>
          <button style={styles.btn(reportMode==="brief"?C.teal:"#e5e7eb",reportMode==="brief"?"#fff":C.ink)} onClick={()=>setReportMode("brief")}>📋 مختصر</button>
          {invSearch && invReportContracts.length>0 && (
            <button style={styles.btn(C.gold,"#fff")} onClick={()=>printInvReport()}>🖨️ طباعة</button>
          )}
        </div>
        {invSearch && invReportContracts.length===0 && (
          <div style={{color:"#1f2937",fontSize:15,textAlign:"center",padding:16}}>لا توجد عقود</div>
        )}
        {invSearch && invReportContracts.length>0 && reportMode==="detailed" && (
          <div style={{overflowX:"auto",maxHeight:"75vh",overflowY:"auto"}}>
            <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:14}}>
              <thead>
                <tr>{["#","اسم الزبون","الجوال","اسم الكفيل","جوال الكفيل","نقداً","أقساط","القسط","الواصل","المتأخر","المتبقي","🚨"].map((h,hi)=>{
                  const isName = h==="اسم الزبون";
                  return <th key={h} style={{...styles.th,whiteSpace:"nowrap",position:"sticky",top:0,zIndex:isName?12:10,...(isName?{right:0,zIndex:12}:{})}}>{h}</th>;
                })}</tr>
              </thead>
              <tbody>
                {invReportContracts.map((c,i)=>{
                  const paid = _getPaid(payments,c.id);
                  const left = Math.max(0,(c.totalInst||0)-paid);
                  // المتأخر = (الأقساط المستحقة حتى اليوم − الأقساط المدفوعة) × قيمة القسط
                  const inst = c.instAmt||0;
                  let lateAmount = 0;
                  if(left>0 && inst>0 && c.firstInst){
                    const fd = new Date(c.firstInst);
                    const nowd = new Date(today2);
                    // عدد الشهور المنقضية من أول قسط حتى اليوم
                    let monthsDue = (nowd.getFullYear()-fd.getFullYear())*12 + (nowd.getMonth()-fd.getMonth());
                    if(nowd.getDate() >= fd.getDate()) monthsDue += 1; // القسط الحالي استحق
                    if(monthsDue<0) monthsDue=0;
                    const dueAmount = monthsDue*inst;           // المفروض دفعه حتى الآن
                    lateAmount = Math.max(0, dueAmount - paid);  // المتأخر = المستحق − المدفوع
                    lateAmount = Math.min(lateAmount, left);     // لا يتجاوز المتبقي
                  }
                  return (
                    <tr key={c.id} style={{background:i%2===0?"#fff":"#f8f8f8"}}>
                      <td style={styles.td}>{i+1}</td>
                      <td style={{...styles.td,fontWeight:700,whiteSpace:"nowrap",position:"sticky",right:0,background:i%2===0?"#fff":"#f8f8f8",zIndex:5,borderLeft:"2px solid #e2e8f0"}}>{c.client}</td>
                      <td style={styles.td}>{c.cPhone||"—"}</td>
                      <td style={styles.td}>{c.gName||"—"}</td>
                      <td style={styles.td}>{c.gPhone||"—"}</td>
                      <td style={styles.td}>{SAR(c.amount||0)}</td>
                      <td style={styles.td}>{SAR(c.totalInst||0)}</td>
                      <td style={styles.td}>{SAR(c.instAmt||0)}</td>
                      <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(paid)}</td>
                      <td style={{...styles.td,color:lateAmount>0?C.red:"#9ca3af",fontWeight:700}}>{lateAmount>0?SAR(lateAmount):"—"}</td>
                      <td style={{...styles.td,color:left>0?C.red:C.green,fontWeight:700}}>{SAR(left)}</td>
                      <td style={{...styles.td,padding:4}}><button onClick={()=>onUpdate({...c,defaulter:!c.defaulter})} title={c.defaulter?"إزالة من المتعثرين":"نقل للمتعثرين"} style={{border:"none",background:"none",cursor:"pointer",fontSize:18,opacity:c.defaulter?1:0.3}}>{c.defaulter?"🚨":"⚪"}</button></td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr style={{background:"#fffbf0",fontWeight:800}}>
                  <td colSpan={5} style={{...styles.td}}>الإجمالي</td>
                  <td style={styles.td}>{SAR(invReportContracts.reduce((s,c)=>s+(c.amount||0),0))}</td>
                  <td style={styles.td}>{SAR(invReportContracts.reduce((s,c)=>s+(c.totalInst||0),0))}</td>
                  <td style={styles.td}>{SAR(invReportContracts.reduce((s,c)=>s+(c.instAmt||0),0))}</td>
                  <td style={{...styles.td,color:C.green}}>{SAR(invReportContracts.reduce((s,c)=>s+_getPaid(payments,c.id),0))}</td>
                  <td style={styles.td}>—</td>
                  <td style={{...styles.td,color:C.red}}>{SAR(invReportContracts.reduce((s,c)=>s+Math.max(0,(c.totalInst||0)-_getPaid(payments,c.id)),0))}</td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
        {invSearch && invReportContracts.length>0 && reportMode==="brief" && (
          <div style={{overflowX:"auto",maxHeight:"75vh",overflowY:"auto"}}>
            <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:15}}>
              <thead>
                <tr>{["اسم الزبون","رقم الجوال","القسط","ملاحظات"].map((h,hi)=>{
                  const isName = h==="اسم الزبون";
                  return <th key={h} style={{...styles.th,position:"sticky",top:0,zIndex:isName?12:10,...(isName?{right:0,zIndex:12}:{})}}>{h}</th>;
                })}</tr>
              </thead>
              <tbody>
                {invReportContracts.map((c,i)=>(
                  <tr key={c.id} style={{background:i%2===0?"#fff":"#f8f8f8"}}>
                    <td style={{...styles.td,fontWeight:700,whiteSpace:"nowrap",position:"sticky",right:0,background:i%2===0?"#fff":"#f8f8f8",zIndex:5,borderLeft:"2px solid #e2e8f0"}}>{c.client}</td>
                    <td style={styles.td}>{c.cPhone||"—"}</td>
                    <td style={styles.td}>{SAR(c.instAmt||0)}</td>
                    <td style={{...styles.td,textAlign:"center"}}></td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr style={{background:"#fffbf0",fontWeight:800}}>
                  <td colSpan={2} style={styles.td}>الإجمالي</td>
                  <td style={styles.td}>{SAR(invReportContracts.reduce((s,c)=>s+(c.instAmt||0),0))}</td>
                  <td style={styles.td}></td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </div>

      <div style={{fontSize:19,fontWeight:800,marginBottom:10}}>📋 العقود</div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <input style={{...styles.input,flex:1,minWidth:140,fontSize:15}} placeholder="🔍 بحث..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <select style={{...styles.input,flex:1,minWidth:140,fontSize:15,cursor:"pointer"}} value={filterInv} onChange={e=>setFilterInv(e.target.value)}>
          <option value="">🏢 كل المستثمرين</option>
          {sortedInvestors(investors).map(i=><option key={i.id} value={i.id}>{invLabel(i)}</option>)}
        </select>
        {filterInv && <button style={{...styles.btn(C.red,"#fff"),fontSize:13,padding:"6px 10px"}} onClick={()=>setFilterInv("")}>✕</button>}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={()=>setStatusTab("active")} style={{...styles.btn(statusTab==="active"?C.teal:"#e5e7eb",statusTab==="active"?"#fff":C.ink),fontSize:15,padding:"6px 14px"}}>
          📋 مستمرة ({activeCount})
        </button>
        <button onClick={()=>setStatusTab("done")} style={{...styles.btn(statusTab==="done"?C.green:"#e5e7eb",statusTab==="done"?"#fff":C.ink),fontSize:15,padding:"6px 14px"}}>
          ✅ منتهية ({completedCount})
        </button>
        <button onClick={()=>setStatusTab("defer")} style={{...styles.btn(statusTab==="defer"?"#a87520":"#e5e7eb",statusTab==="defer"?"#fff":C.ink),fontSize:15,padding:"6px 14px"}}>
          🕒 المؤجل ({deferCount})
        </button>
        <button onClick={()=>setStatusTab("deleted")} style={{...styles.btn(statusTab==="deleted"?C.red:"#e5e7eb",statusTab==="deleted"?"#fff":C.ink),fontSize:15,padding:"6px 14px"}}>
          🗑️ محذوفة ({deletedCount})
        </button>
      </div>
      <div style={styles.panel}>
        <div style={{overflowX:"auto",maxHeight:"75vh",overflowY:"auto",position:"relative"}}>
          <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:15}}>
            <thead>
              <tr>{["#","التاريخ","العميل","الهوية","العمل","الكفيل","البضاعة","العدد","المستثمر","القيمة","الإجمالي","القسط","أول قسط","الربح",""].map((h,hi)=>(
                <th key={h} style={{...styles.th,position:"sticky",top:0,zIndex:hi===2?12:10,
                  ...(hi===2?{position:"sticky",right:0,zIndex:12}:{})
                }}>{h}</th>
              ))}</tr>
            </thead>
            <tbody>
              {sortedFiltered.length===0 ? (
                <tr><td colSpan={15} style={{...styles.td,textAlign:"center",padding:40,color:"#1f2937"}}>لا توجد عقود — أضف عقداً جديداً</td></tr>
              ) : sortedFiltered.map((c,i,arr)=>{
                const inv=investors.find(x=>String(x.id)===String(c.investorId));
                const r=calcC(c,settings);
                const isOld = baseDateC!=="0000-00-00" && (c.date||"9999") < baseDateC;
                const prev = i>0 ? arr[i-1] : null;
                const showSep = baseDateC!=="0000-00-00" && isOld && (i===0 || !prev || (prev.date||"9999") >= baseDateC);
                const bg = isOld ? "#f8fafc" : (i%2===0?C.white:C.gray);
                const stickyCell = {position:"sticky",right:0,background:bg,zIndex:5,borderLeft:"2px solid "+C.border};
                return (
                  <React.Fragment key={c.id}>
                    {showSep && (
                      <tr>
                        <td colSpan={15} style={{background:"linear-gradient(90deg,#1e3a5f,#0f2544)",color:"#fff",textAlign:"center",fontWeight:900,fontSize:14,padding:"10px 12px",letterSpacing:0.5}}>
                          🔵 نهاية الشهر السابق — العقود التالية من دورة سابقة
                        </td>
                      </tr>
                    )}
                    <tr style={{background:bg,opacity:isOld?0.65:1}}>
                    <td style={{...styles.td,color:"#1f2937"}}>{c.num||i+1}</td>
                    <td style={{...styles.td,color:"#1f2937"}}>{c.date}</td>
                    <td style={{...styles.td,fontWeight:700,whiteSpace:"nowrap",...stickyCell}}><span onClick={()=>setCardModal(c)} style={{color:C.teal,cursor:"pointer",textDecoration:"underline"}}>{c.client}</span></td>

              const w = window.open("","_blank");

              let allHtml = "";

function PendingPage({pending, setPending}) {

  const [form,setForm]=useState({name:"",amount:"",date:today,note:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const save=()=>{
    if(!form.name||!form.amount){return;}
    setPending(p=>[...p,{id:Date.now(),...form,amount:parseFloat(form.amount)}]);
    setForm({name:"",amount:"",date:today,note:""});
  };

  const total = pending.reduce((s,p)=>s+p.amount,0);

  return (
    <div>
      <div style={{fontSize:19,fontWeight:800,marginBottom:16}}>📌 المتبقي من الاستقطاعات</div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:20}}>

        <KpiCard label="عدد الأشخاص" value={NUM(pending.length)} color={C.teal}/>

      {/* Add */}

        <div style={{padding:"14px 18px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
            {[["اسم الشخص / الجهة","name","text","الاسم أو وصف الحوالة"],
              ["المبلغ (ر.س)","amount","number","مثال: 500"],
              ["التاريخ","date","date",""],
              ["ملاحظة","note","text","اختياري"]].map(([l,k,t,p])=>(
              <div key={k}>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>{l}</label>

      </div>

      {/* Table */}
      <div style={styles.panel}>
        <div style={styles.panelHdr}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700}}>📋 سجل المتبقي</h3>

        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
            <thead>

              ) : pending.map((p,i)=>(
                <tr key={p.id} style={{background:i%2===0?C.white:C.gray}}>

// ─── Loans Page ──────────────────────────────────────────────
function LoansPage({loans, setLoans}) {
  const today = todayLocal();
  const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const [form,setForm]=useState({name:"",amount:"",monthly:"",date:today,note:""});
  const [selLoan,setSelLoan]=useState(null);
  const [payForm,setPayForm]=useState({amount:"",date:today,note:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const save=()=>{
    if(!form.name||!form.amount){return;}
    setLoans(p=>[...p,{id:Date.now(),...form,amount:parseFloat(form.amount),monthly:parseFloat(form.monthly)||0,payments:[]}]);
    setForm({name:"",amount:"",monthly:"",date:today,note:""});
  };

  const addPayment=(loan)=>{
    if(!payForm.amount){return;}
    const updated = {...loan, payments:[...(loan.payments||[]),{id:Date.now(),date:payForm.date,amount:parseFloat(payForm.amount),note:payForm.note}]};
    setLoans(p=>p.map(l=>l.id===loan.id?updated:l));
    setPayForm({amount:"",date:today,note:""});
    setSelLoan(null);
  };

  const totalOut = loans.reduce((s,l)=>{
    const paid = (l.payments||[]).reduce((ss,p)=>ss+p.amount,0);
    return s + Math.max(0, l.amount - paid);
  },0);
  const totalPaid = loans.reduce((s,l)=>(l.payments||[]).reduce((ss,p)=>ss+p.amount,0)+s,0);

  return (
    <div>
      <div style={{fontSize:19,fontWeight:800,marginBottom:16}}>🤝 السلف</div>

      {/* Summary */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:20}}>
        <KpiCard label="إجمالي المتبقي" value={SAR(totalOut)} color={C.red}/>
        <KpiCard label="إجمالي المدفوع" value={SAR(totalPaid)} color={C.green}/>
        <KpiCard label="عدد السلف" value={NUM(loans.length)} color={C.teal}/>
      </div>

      {/* Add loan */}
      <div style={{...styles.panel,marginBottom:16}}>
        <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>➕ تسجيل سلفة جديدة</h3></div>
        <div style={{padding:"14px 18px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
            {[["اسم الشخص","name","text","اسم المقترض"],["المبلغ الكلي (ر.س)","amount","number","مثال: 5000"],["القسط الشهري المقترح","monthly","number","مثال: 500"],["التاريخ","date","date",""],["ملاحظة","note","text","اختياري"]].map(([l,k,t,p])=>(
              <div key={k}>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>{l}</label>
                <input style={styles.input} type={t} placeholder={p} value={form[k]} onChange={e=>set(k,e.target.value)}/>
              </div>
            ))}
          </div>
          <button style={styles.btn(C.teal)} onClick={save}>💾 تسجيل السلفة</button>
        </div>
      </div>

      {/* Loans list */}
      <div>
        {loans.length===0 ? (
          <div style={{...styles.panel,padding:40,textAlign:"center",color:"#1f2937"}}>لا توجد سلف مسجلة</div>
        ) : loans.map(l=>{
          const paid = (l.payments||[]).reduce((s,p)=>s+p.amount,0);
          const remaining = Math.max(0, l.amount - paid);
          const pct = l.amount>0 ? Math.min(100, Math.round(paid/l.amount*100)) : 0;
          return (
            <div key={l.id} style={{...styles.panel,marginBottom:16}}>
              <div style={{padding:"14px 18px"}}>
                {/* Header */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                  <div>
                    <div style={{fontWeight:800,fontSize:17,color:C.ink,marginBottom:4}}>{l.name}</div>
                    <div style={{fontSize:14,color:"#1f2937"}}>{l.date} {l.note?"| "+l.note:""}</div>
                  </div>
                  <button style={{...styles.btn(C.red),fontSize:14,padding:"4px 10px"}}
                    onClick={()=>{if(window.confirm("حذف هذه السلفة؟"))setLoans(p=>p.filter(x=>x.id!==l.id));}}>🗑️</button>
                </div>
                {/* Progress */}
                <div style={{display:"flex",justifyContent:"space-between",fontSize:15,marginBottom:6}}>
                  <span style={{color:"#1f2937"}}>المبلغ الكلي: <strong>{SAR(l.amount)}</strong></span>
                  <span style={{color:C.green}}>مدفوع: <strong>{SAR(paid)}</strong></span>
                  <span style={{color:remaining>0?C.red:C.green}}>متبقي: <strong>{SAR(remaining)}</strong></span>
                </div>
                <div style={{background:"#f0f0f0",borderRadius:99,height:8,marginBottom:8}}>
                  <div style={{background:C.green,borderRadius:99,height:8,width:pct+"%",transition:"width 0.3s"}}></div>
                </div>
                {l.monthly>0 && <div style={{fontSize:14,color:"#1f2937",marginBottom:10}}>القسط المقترح: {SAR(l.monthly)} / شهر</div>}
                {/* Payments history */}
                {(l.payments||[]).length>0 && (
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:15,fontWeight:700,marginBottom:6}}>سجل الدفعات:</div>
                    {(l.payments||[]).map(p=>{
                      const d = new Date(p.date);
                      const monthName = MONTHS[d.getMonth()]+" "+d.getFullYear();
                      return (
                        <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #f0f0f0",fontSize:15}}>
                          <span style={{color:"#1f2937"}}>{monthName} — {p.date}{p.note?" | "+p.note:""}</span>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span style={{color:C.green,fontWeight:700}}>+{SAR(p.amount)}</span>
                            <button style={{...styles.btn(C.red),fontSize:13,padding:"2px 7px"}}
                              onClick={()=>{if(window.confirm("حذف هذه الدفعة؟"))setLoans(prev=>prev.map(x=>x.id===l.id?{...x,payments:(x.payments||[]).filter(pp=>pp.id!==p.id)}:x));}}>🗑️</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
                {/* Add payment */}
                {selLoan===l.id ? (
                  <div style={{background:"#f8f8f8",borderRadius:10,padding:12}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
                      <div>
                        <label style={{fontSize:14,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>المبلغ</label>
                        <input style={styles.input} type="number" placeholder={l.monthly||"المبلغ"} value={payForm.amount} onChange={e=>setPayForm(f=>({...f,amount:e.target.value}))}/>
                      </div>
                      <div>
                        <label style={{fontSize:14,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>التاريخ</label>
                        <input style={styles.input} type="date" value={payForm.date} onChange={e=>setPayForm(f=>({...f,date:e.target.value}))}/>
                      </div>
                      <div>
                        <label style={{fontSize:14,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>ملاحظة</label>
                        <input style={styles.input} type="text" placeholder="اختياري" value={payForm.note} onChange={e=>setPayForm(f=>({...f,note:e.target.value}))}/>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button style={styles.btn(C.teal)} onClick={()=>addPayment(l)}>💾 حفظ الدفعة</button>
                      <button style={styles.btn("#e5e7eb",C.ink)} onClick={()=>setSelLoan(null)}>إلغاء</button>
                    </div>
                  </div>
                ) : remaining>0 ? (
                  <button style={styles.btn(C.teal)} onClick={()=>{setSelLoan(l.id);setPayForm({amount:l.monthly||"",date:today,note:""});}}>
                    💰 تسجيل دفعة
                  </button>
                ) : (
                  <div style={{color:C.green,fontWeight:700,fontSize:15}}>✅ تم السداد الكامل</div>
                )}
              </div>
            </div>
          );
        })}
      </div>

    </div>
  );
}

function ZakatPage({investors, contracts, settings, zakatTx, setZakatTx}) {

  const totalOut = zakatTx.filter(t=>t.type==="pay").reduce((s,t)=>s+t.amount,0);

function AccountsPage({contracts, investors, setInvestors, settings, txList, setTxList, loans, setLoans, zakatTx, setZakatTx, pending, setPending, payments, toast}) {
  const [subTab, setSubTab] = useState("inv");
  const [selInv, setSelInv] = useState(investors[0]?.id||null);
  const [invSubTab, setInvSubTab] = useState("inv");
  const [form, setForm] = useState({type:"deposit", amount:"", note:"", date:todayLocal()});
  const set = (k,v) => {
    setForm(f=>({...f,[k]:v}));
    // Auto-fill if idNum entered and matches existing contract
    if(k==="idNum" && v.length>=9){
      const prev = contracts.find(c=>c.idNum===v);
      if(prev){
        setForm(f=>({...f, idNum:v, client:prev.client||f.client, job:prev.job||f.job, cPhone:prev.cPhone||f.cPhone}));
        toast("✅ تم تعبئة بيانات العميل تلقائياً");
      }
    }
  };

  const inv = investors.find(i=>i.id===selInv);
  const myTx = (txList[selInv]||[]);

  // Auto-transactions from contracts
  const myContracts = contracts.filter(c=>c.investorId===selInv);
  const autoTx = myContracts.filter(c=>!c.isOldContract && c.contractType!=="migrated").map(c=>{
    const r = calcC(c, settings);
    // ينخصم: قيمة العقد النقدية + عمولة المحاسبين + نصيب المؤسسة + الرسوم الإدارية
    const deduct = c.amount + r.acc + r.inst + r.admin;
    return {
      id:"auto_"+c.id, date:c.date, auto:true,
      type:"contract",
      amount:-deduct,
      note:c.client,
      breakdown:"نقدي: "+SAR(c.amount)+" | محاسبين: "+SAR(r.acc)+" | مؤسسة: "+SAR(r.inst)+" | رسوم: "+SAR(r.admin),
      admin:r.admin, acc:r.acc, inst:r.inst, net:r.net
    };
  });

  // Auto payments grouped by month
  const paysByMonth = {};
  (payments||[]).forEach(p=>{
    const c = myContracts.find(x=>x.id===p.contractId);
    if(!c) return;
    const d = new Date(p.date);
    const ym = fiscalYM(d);
    if(!paysByMonth[ym]) paysByMonth[ym]={amount:0, count:0, date:ym+"-01"};
    paysByMonth[ym].amount += p.amount;
    paysByMonth[ym].count  += 1;
  });
  const mNames=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const autoPayments = Object.entries(paysByMonth).map(([ym,v])=>{
    const [y,m]=ym.split("-");
    return {
      id:"pay_"+ym, date:v.date, auto:true,
      type:"installments",
      amount:v.amount,
      note:"أقساط "+mNames[parseInt(m)-1]+" "+y+" ("+v.count+" قسط)"
    };
  });

  // Merge and sort all transactions
  const allTx = [...autoTx, ...autoPayments, ...myTx].sort((a,b)=>new Date(a.date)-new Date(b.date));

  // Running balance
  let balance = inv?.capital || 0;
  const rows = allTx.map(tx=>{
    balance += tx.amount;
    return {...tx, balance};
  });

  const addTx = () => {
    if(!form.amount||!form.date){return;}
    const txType = TX_TYPES.find(t=>t.key===form.type);
    const amt = parseFloat(form.amount) * txType.sign;
    const newTx = {id:Date.now(), date:form.date, type:form.type,
      amount:amt, note:form.note||txType.label};
    setTxList(p=>({...p,[selInv]:[...(p[selInv]||[]), newTx]}));
    setForm(f=>({...f, amount:"", note:""}));
  };

  const delTx = (id) => { if(!window.confirm("حذف هذه الحركة؟"))return; setTxList(p=>({...p,[selInv]:(p[selInv]||[]).filter(t=>t.id!==id)})); };

  const finalBalance = rows.length>0 ? rows[rows.length-1].balance : (inv?.capital||0);
  const totalDeposits = allTx.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
  const totalWithdraws = allTx.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
  const [acctSearch,setAcctSearch] = useState("");
  const filteredRows = acctSearch ? rows.filter(tx=>(tx.note||"").includes(acctSearch)||(tx.type||"").includes(acctSearch)||(tx.date||"").includes(acctSearch)) : rows;

  const subTabs = [
    {key:"list",  label:"👥 المستثمرون"},
    {key:"inv",   label:"💰 حسابات المستثمرين"},
    {key:"special", label:"🏢 حسابات خاصة"},
  ];

  return (
    <div>
      <div style={{fontSize:19,fontWeight:800,marginBottom:16}}>💰 الحسابات</div>

      {/* Sub tabs */}
      <div style={{display:"flex",gap:0,marginBottom:20,background:C.white,borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",width:"fit-content"}}>
        {subTabs.map(t=>(
          <button key={t.key} onClick={()=>setSubTab(t.key)}
            style={{fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:15,fontWeight:700,padding:"10px 16px",border:"none",
              cursor:"pointer",background:subTab===t.key?C.teal:C.white,color:subTab===t.key?"white":C.ink2,
              transition:"all 0.2s",whiteSpace:"nowrap"}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Commissions sub-page */}
      {subTab==="list" && <InvestorsPage investors={investors} contracts={contracts} settings={settings} payments={payments} txList={txList} onAdd={inv=>setInvestors(p=>[...p,inv])} onDelete={id=>setInvestors(p=>p.filter(i=>i.id!==id))} setInvestors={setInvestors} toast={toast}/>}

      {/* حسابات خاصة */}
      {subTab==="special" && (()=>{
        const K = {panel:"#16202e",panel2:"#1b2736",line:"rgba(255,255,255,.08)",
          teal:"#2dd4bf",gold:"#fbbf24",green:"#4ade80",amber:"#fb923c",violet:"#c084fc",
          blue:"#38bdf8",red:"#fb7185",txt:"#f1f5f9",dim:"#94a3b8",dim2:"#64748b"};
        const NF = v => (v||0).toLocaleString("en-US",{maximumFractionDigits:0});
        const _now = new Date();
        const specialNames = ["1","2","4","7","8","9","11"];
        const specialInvs = sortedInvestors(investors.filter(inv=>{
          const nm = (inv.name||"").trim();
          return specialNames.some(n=>nm.includes("الفرصة "+n)||nm.includes("الفرصة"+n)||nm.endsWith(" "+n)||nm.endsWith(n));
        }));
        // تجميع كل السبعة
        let bidaya=0,netCash=0,leftMonthly=0,leftDefer=0,monthlyInst=0,profit=0,commAdmin=0,commAcc=0,
            working=0,paidAll=0,totalWP=0,overCount=0,overAmt=0,activeC=0,doneC=0,deferC=0,consAll=0,amtAll=0,lastPay=null;
        specialInvs.forEach(inv=>{
          const myCon=contracts.filter(c=>c.investorId===inv.id);
          consAll+=myCon.length;
          bidaya+=(+inv.bidaya||0);
          const _auto=myCon.filter(c=>!c.isOldContract&&c.contractType!=="migrated")
            .reduce((s,c)=>{const rr=calcC(c,settings);return s-(c.amount+rr.acc+rr.inst+rr.admin);},0);
          const myPays=(payments||[]).filter(p=>myCon.some(c=>c.id===p.contractId));
          const paidSum=myPays.reduce((s,p)=>s+(+p.amount||0),0);
          const manualSum=((txList&&txList[inv.id])||[]).reduce((s,t)=>s+(+t.amount||0),0);
          netCash+=(+inv.capital||0)+_auto+paidSum+manualSum;
          paidAll+=paidSum;
          const lp=myPays.map(p=>p.date).filter(Boolean).sort().pop();
          if(lp&&(!lastPay||lp>lastPay)) lastPay=lp;
          myCon.forEach(c=>{
            const total=+c.totalInst||+c.amount||0, paid=_getPaid(payments,c.id), rem=Math.max(0,total-paid);
            const isDefer=c.contractType==="defer";
            totalWP+=total; amtAll+=(+c.amount||0);
            if(isDefer) deferC++;
            profit+=calcC(c,settings).net; commAdmin+=calcC(c,settings).admin; commAcc+=calcC(c,settings).acc;

// ─── Monthly Jard ────────────────────────────────────────────
function JardPage({contracts,investors,settings,txList,loans,zakatTx,pending,payments,gsWrite,daily,dailyOpen,bankTx}) {
  const today = new Date();
  const currentYM = fiscalYM(today);
  const months = [...new Set(contracts.map(c=>fiscalYM(c.date)))].sort().reverse();
  if(!months.includes(currentYM)) months.unshift(currentYM);
  const [selMonth,setSelMonth]=useState(months[0]);
  const [overrides,setOverrides]=useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_jard_ov")||"{}");}catch{return {};}});

  const mLabel=ym=>{const[y,m]=ym.split("-");return"شهر "+parseInt(m)+" - "+y;};
  const mc = contracts.filter(c=>fiscalYM(c.date)===selMonth);

  // Goods data for cards balance
  const goodsData = (() => {
    try{ return JSON.parse(localStorage.getItem("qimma_goods3")||"[]"); }catch{ return []; }
  })();
  const priceOv = (() => {
    try{ return JSON.parse(localStorage.getItem("qimma_price_ov")||"{}"); }catch{ return {}; }
  })();
  const defPrice2 = (() => {
    try{ return parseFloat(localStorage.getItem("qimma_default_price"))||0; }catch{ return 0; }
  })();

  const getVal = (key) => {
    // البطاقات والزكاة والاستقطاعات: تلقائية دائماً (تتجاهل أي قيمة يدوية قديمة)
    const alwaysAuto = ["cards","zakat","deductions","cash","accounts"];
    if(!alwaysAuto.includes(key) && overrides[selMonth+"_"+key]!==undefined) return overrides[selMonth+"_"+key];
    // رصيد الحسابات البنكية: آخر رصيد من كشف الراجحي المستورد
    if(key==="accounts") {
      const bt = _arr(bankTx);
      if(bt.length > 0) return bt[bt.length-1].balance || 0;
      // لو ما فيه كشف، يرجع للقيمة اليدوية القديمة إن وُجدت
      return overrides[selMonth+"_accounts"] !== undefined ? overrides[selMonth+"_accounts"] : 0;
    }
    // الرصيد النقدي: يُسحب مباشرة من رصيد الصندوق (رصيد البداية + كل حركات اليومية)
    if(key==="cash") {
      const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
      const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
      const baseAmount = base ? (+base.amount||0) : 0;
      const baseDate = base ? base.date : "0000-00-00";
      const net = (daily||[]).filter(d=>d.date >= baseDate)
        .reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
      return baseAmount + net;
    }
    // سحب تلقائي من الصفحات المرتبطة
    if(key==="loans") {
      return (loans||[]).reduce((s,l)=>{
        const paid=(l.payments||[]).reduce((ss,p)=>ss+p.amount,0);
        return s+Math.max(0,(l.amount||0)-paid);
      },0);
    }
    if(key==="zakat")   return (zakatTx||[]).reduce((s,t)=>s+(t.type==="collect"?t.amount:-t.amount),0);
    if(key==="deductions") return (pending||[]).reduce((s,p)=>s+p.amount,0);
    if(key==="cards") {
      // مطابقة كشف البضاعة (GoodsPage) بالضبط: نميّز البطاقة عن السلعة النقدية،
      // ونرجّع الإجمالي النقدي = نقدي البطاقات + نقدي السلع (العمود الأخير في الكشف).
      const cRows = contracts.filter(c=>!c.isOldContract && c.contractType!=='migrated').map(c=>{
        const isCard = (c.goods||"").trim().startsWith("بطاقة");
        if(isCard){
          return {
            id:"c_"+c.id, date:c.date,
            supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
            supportAcc:0,
            withdrawnQty:parseInt(c.qty)||0,
            price:0, cashOnly:false,
          };
        }
        // سلعة نقدية (أسهم/سيارة/جوال): قيمتها النقدية تُخصم من نقدي السلع، بلا لمس البطاقات
        return {
          id:"c_"+c.id, date:c.date,
          supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
          supportAcc:-(parseFloat(c.amount)||0),
          withdrawnQty:0,
          price:0, cashOnly:true,
        };
      });
      const seqOf2 = r => { const n=parseInt(String(r.id).replace(/^c_/,""),10); return isNaN(n)?0:n; };
      const allR = [...cRows,...goodsData].sort((a,b)=>{
        const d=new Date(a.date)-new Date(b.date);
        if(d!==0) return d;
        return seqOf2(a)-seqOf2(b);
      });
      let runCards=0; let lastPrice2=0; let runGoodsCash=0;
      allR.forEach(r=>{
        if(r.cashOnly){
          runGoodsCash += parseFloat(r.supportAcc)||0;
          return;
        }
        const rowPrice=parseFloat(priceOv[r.id]||r.price)||defPrice2||lastPrice2||1;
        if(rowPrice) lastPrice2=rowPrice;
        const supC=parseFloat(r.supportClient)||0;
        const supA=parseFloat(r.supportAcc)||0;
        const supported=supC||supA?Math.floor((supC+supA)/rowPrice):0;
        const withdrawn=parseInt(r.withdrawnQty)||0;
        runCards=runCards+supported-withdrawn;
      });
      const cardsCash = runCards*lastPrice2;
      return cardsCash + runGoodsCash;
    }
    return 0;
  };
  const setVal = (key,v) => setOverrides(p=>{
    const newOv={...p,[selMonth+"_"+key]:parseFloat(v)||0};
    localStorage.setItem("qimma_jard_ov",JSON.stringify(newOv));
    gsWrite("jard_ov",newOv);
    return newOv;
  });
  const getInv = (id) => {
    const key = selMonth+"_inv_"+id;
    if(overrides[key]!==undefined) return overrides[key];
    const inv = investors.find(i=>i.id===id);
    const capital = inv?.capital||0;
    const myContracts = contracts.filter(c=>c.investorId===id);
    const myManualTx = (txList[id]||[]);
    const autoDeduct = myContracts.filter(c=>!c.isOldContract && c.contractType!=="migrated").reduce((s,c)=>{
      const r=calcC(c,settings);
      return s-(c.amount+r.acc+r.inst+r.admin);
    },0);
    const autoPaid = (payments||[]).filter(p=>myContracts.find(c=>c.id===p.contractId)).reduce((s,p)=>s+p.amount,0);
    const manualTotal = myManualTx.reduce((s,t)=>s+t.amount,0);
    return capital + autoDeduct + autoPaid + manualTotal;
  };
  const setInv = (id,sign,v) => {
    const key = selMonth+"_inv_"+id;
    setOverrides(p=>{
      const newOv={...p,[key]: sign===1 ? (parseFloat(v)||0) : -(parseFloat(v)||0)};
      localStorage.setItem("qimma_jard_ov",JSON.stringify(newOv));
      gsWrite("jard_ov",newOv);
      return newOv;
    });
  };

  // بنود "له عندي" (التزامات)
  const invRows = [
    {key:"deductions", name:"المتبقي من الاستقطاعات",  sign:1,  hint:"ناس لهم فلوس عندي"},
    {key:"zakat",      name:"صندوق الزكاة",            sign:1,  hint:"زكاة مدفوعة مقدماً"},
  ];
  // بنود "لي عنده" (أصول)

// ─── Dashboard ───────────────────────────────────────────────
// ─── Monthly Portfolio Page (المحفظة الشهرية) ───────────────
// ─── طباعة كشف الحساب البنكي (الراجحي) بالأسماء وآخر رصيد ───
// ─── تحليل نصوص PDF لكشف الراجحي إلى حركات (يعتمد على مواقع الأعمدة x) ───
function parseRajhiPDF(items){
  const num = (s) => { const v=parseFloat(String(s).replace(/,/g,"").replace(/[^0-9.\-]/g,"")); return isNaN(v)?null:v; };
  const isDate = (s) => /\d{4}\/\d{2}\/\d{2}/.test(String(s));
  const rev = (s) => s.split("").reverse().join("");
  // تطبيع الحروف العربية من أشكال العرض (Presentation Forms) إلى الأساسية
  const norm = (s) => { try{ return s.normalize("NFKC"); }catch(e){ return s; } };
  // أنواع معروفة: [كلمات مفتاحية يجب توفرها كلها, التسمية] — مرن ضد أخطاء الاستخراج
  const TYPE_DEFS = [
    [["رسوم","حواله","فوريه","صادره"],"رسوم حوالة فورية صادرة"],
    [["حواله","فوريه","صادره"],"حوالة فورية صادرة"],
    [["حوالات","فوريه","وارده"],"حوالات فورية واردة"],
    [["فوريه","وارده"],"حوالات فورية واردة"],
    [["عمليه","تحويل","داخليه"],"عملية تحويل داخلية"],
    [["تحويل","داخليه"],"عملية تحويل داخلية"],
    [["صراف","الي"],"التحويل للحساب الصراف الآلي"],
    [["نقاط","البيع"],"نقاط البيع"],
    [["مدفوعات","سداد"],"مدفوعات سداد"],
    [["ايداع","شيك","مقاصه"],"إيداع شيك مقاصة"],
    [["ايداع","بشيك"],"إيداع بشيك"],
    [["ايداع","شيك"],"إيداع شيك"],
    [["ايداع","نقدي"],"إيداع نقدي"],
    [["رسوم","الامر","المستديم"],"رسوم الأمر المستديم"],
    [["امر","مستديم"],"أمر مستديم"],
    [["المستديم"],"الأمر المستديم"],
    [["تحويل"],"تحويل"],
    [["سداد"],"سداد"],
    [["رسوم"],"رسوم"],
  ];
  const hasArabic = (s)=>/[\u0600-\u06FF\uFB50-\uFEFF]/.test(s);
  const unify = (x)=> x.replace(/\u0640/g,"").replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
  const matchType = (raw)=>{
    let base = unify(norm(raw).replace(/[^\u0600-\u06FF]/g,""));
    const cands = [base, unify(rev(base))];
    for(const [keys,label] of TYPE_DEFS){
      for(const c of cands){
        if(keys.every(k=> c.indexOf(unify(k))>-1)) return label;
      }
    }
    return null;
  };

  // اجمع في صفوف حسب y
  items = items.filter(it=>it.str && it.str.trim()!=="");
  const rowsY = [];
  const TOL = 4;
  items.forEach(it=>{
    let row = rowsY.find(r=> r.page===it.page && Math.abs(r.y-it.y)<=TOL);
    if(!row){ row={page:it.page, y:it.y, cells:[]}; rowsY.push(row); }
    row.cells.push(it);
  });
  rowsY.forEach(r=>{ r.cells.sort((a,b)=>a.x-b.x); r.text = r.cells.map(c=>c.str).join(" "); });
  rowsY.sort((a,b)=> a.page-b.page || a.y-b.y);

  // دالة: هل هذا صف مبالغ؟ (فيه SAR مرتين+ أو 3 أرقام عشرية)
  const moneyRow = (r) => {
    const sar = (r.text.match(/SAR/g)||[]).length;
    const nums = r.cells.filter(c=>/^[\d,]+\.\d{2}$/.test(c.str.trim())).length;
    return sar>=2 || nums>=2;
  };
  // استخرج المبالغ الثلاثة من صف مبالغ حسب x: رصيد(x<130) دائن(130-215) مدين(215-310)
  const extractMoney = (r) => {
    let bal=null, dain=0, madin=0;
    r.cells.forEach(c=>{
      const v = num(c.str);
      if(v===null || !/^[\d,]+\.\d{2}$/.test(c.str.trim())) return;
      if(c.x < 130) bal = v;
      else if(c.x < 215) dain = v;
      else if(c.x < 320) madin = v;
    });
    return {bal, dain, madin};
  };

  const parsed = [];
  for(let i=0;i<rowsY.length;i++){
    const r = rowsY[i];
    if(!moneyRow(r)) continue;
    const {bal, dain, madin} = extractMoney(r);
    if(bal===null) continue;

    // التاريخ: في نفس الصف (x>480) أو الصفوف القريبة
    let date = "";
    const findDate = (rr)=>{ rr && rr.cells.forEach(c=>{ const m=String(c.str).match(/\d{4}\/\d{2}\/\d{2}/); if(m && !date) date=m[0]; }); };
    findDate(r);
    for(let k=1;k<=2 && !date;k++){ findDate(rowsY[i-k]); findDate(rowsY[i+k]); }

    // النوع: كلمات عربية في العمود الأوسط (x بين 355 و 495) من الصفوف القريبة (±3)
    // نتجاهل الصفوف التي فيها "ملاحظة"/"الوقت"/أرقام حساب طويلة
    let typeText = "";
    const collectType = (rr)=>{
      if(!rr || typeText) return;
      const midCells = rr.cells.filter(c=> c.x>=350 && c.x<=500 && hasArabic(c.str));
      if(midCells.length===0) return;
      const joined = midCells.map(c=>c.str).join("");
      // تجاهل سطر الملاحظة (فيه ملاحظة/الوقت أو أرقام طويلة)
      const nj = norm(joined);
      if(/ملاحظة|الوقت/.test(nj) || /ملاحظة|الوقت/.test(rev(nj))) return;
      if(/\d{9,}/.test(joined)) return;
      const matched = matchType(joined);
      if(matched){ typeText = matched; return; }
      // fallback: نص عربي مطبّع قصير
      const cleaned = norm(joined).replace(/[^\u0600-\u06FF]/g,"");
      if(cleaned && cleaned.length<=30){ typeText = rev(cleaned); }
    };
    collectType(r);
    for(let k=1;k<=3 && !typeText;k++){ collectType(rowsY[i-k]); collectType(rowsY[i+k]); }

    // الاسم: من سطر الملاحظة أو الإنجليزي القريب
    let nameText = "";
    const collectName = (rr)=>{
      if(!rr || nameText) return;
      // سطر إنجليزي (اسم متجر/شخص دولي)
      const engCells = rr.cells.filter(c=>/[A-Za-z]{3,}/.test(c.str) && !/SAR|TOACCT|FRACCT|SANCBK|SAALBI/.test(c.str));
      if(engCells.length){
        const eng = engCells.map(c=>c.str).join(" ").replace(/[^A-Za-z, ]/g," ").replace(/\s+/g," ").trim();
        if(eng.length>=3 && eng.length<=45){ nameText = eng; return; }
      }
      // اسم عربي من سطر الملاحظة (بعد آخر شرطة)
      const noteCell = rr.cells.find(c=>{ const n=norm(c.str); return /ملاحظة/.test(n)||/ملاحظة/.test(rev(n)); });
      if(noteCell){
        let parts = norm(noteCell.str).split(/[\/\-]/).map(x=>x.trim()).filter(Boolean);
        let cand = parts[0]||"";
        cand = cand.replace(/[A-Za-z0-9:*]/g,"").replace(/ملاحظة/g,"").trim();
        if(hasArabic(cand) && cand.length>=2 && cand.length<=25){ nameText = rev(cand); }
      }
    };
    for(let k=1;k<=3 && !nameText;k++){ collectName(rowsY[i+k]); collectName(rowsY[i-k]); }

    parsed.push({
      id: "bnk_pdf_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      date: date||"",
      type: typeText||"غير محدد",
      name: nameText||"",
      madin: Math.abs(madin)||0,
      dain: Math.abs(dain)||0,
      balance: bal,
    });
  }
  return parsed;
}
