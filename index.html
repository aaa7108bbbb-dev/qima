                      <div style={{fontSize:"clamp(15px,1.8vw,24px)",fontWeight:700,color:K.gold}}>{NF(r.leftMonthly)}</div>
                    </div>
                    <div style={{background:K.panel2,padding:"clamp(10px,1.5vw,18px) clamp(12px,1.5vw,20px)"}}>
                      <div style={{fontSize:"clamp(11px,1.2vw,16px)",color:"#fff",fontWeight:600,marginBottom:3}}>المؤجلة</div>
                      <div style={{fontSize:"clamp(15px,1.8vw,24px)",fontWeight:700,color:r.leftDefer>0?K.gold:K.dim2}}>{r.leftDefer>0?NF(r.leftDefer):"—"}</div>
                    </div>
                    <div style={{background:"linear-gradient(135deg,rgba(200,146,42,.12),rgba(200,146,42,.05))",gridColumn:"1/-1",padding:"clamp(10px,1.5vw,18px) clamp(12px,1.5vw,20px)"}}>
                      <div style={{fontSize:"clamp(11px,1.2vw,16px)",color:"#fff",fontWeight:600,marginBottom:3}}>الإجمالي</div>
                      <div style={{fontSize:"clamp(17px,2.2vw,30px)",fontWeight:800,color:K.gold}}>{NF(r.grand)}</div>
                    </div>
                  </div>
                </div>
                <div>
                  {secLbl("العائد")}
                  <div style={{background:"rgba(200,146,42,.05)",border:"1px solid rgba(200,146,42,.15)",borderRadius:12,padding:"11px 12px",marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                      <span style={{fontSize:"clamp(11px,1.2vw,16px)",color:"#fff",fontWeight:600}}>العائد الحقيقي <span style={{fontSize:"clamp(9px,1vw,13px)",color:K.dim2}}>÷ البداية</span></span>
                      <span style={{fontSize:"clamp(16px,1.8vw,24px)",fontWeight:800,color:r.roiReal!=null?K.gold:K.dim2}}>{r.roiReal!=null?r.roiReal.toFixed(1)+"%":"—"}</span>
                    </div>
                    <div style={{height:7,background:"rgba(255,255,255,.06)",borderRadius:4,overflow:"hidden",marginBottom:10}}>
                      <div style={{height:"100%",width:Math.min(100,Math.max(0,r.roiReal||0))+"%",borderRadius:4,background:"linear-gradient(90deg,#a87520,#c8922a)"}}/>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:5}}>
                      <span style={{fontSize:"clamp(11px,1.2vw,16px)",color:"#fff",fontWeight:600}}>العائد على المشغّل <span style={{fontSize:"clamp(9px,1vw,13px)",color:K.dim2}}>÷ {NF(r.working)}</span></span>
                      <span style={{fontSize:"clamp(16px,1.8vw,24px)",fontWeight:800,color:r.roiWork!=null?K.gold:K.dim2}}>{r.roiWork!=null?r.roiWork.toFixed(1)+"%":"—"}</span>
                    </div>
                    <div style={{height:7,background:"rgba(255,255,255,.06)",borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",width:Math.min(100,Math.max(0,r.roiWork||0))+"%",borderRadius:4,background:"linear-gradient(90deg,#a87520,#c8922a)"}}/>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:1,background:"rgba(255,255,255,.06)",borderRadius:11,overflow:"hidden",marginBottom:14}}>
                    <div style={{background:K.panel2,padding:"clamp(9px,1.2vw,16px) 8px",textAlign:"center"}}>
                      <div style={{fontSize:"clamp(10px,1.1vw,15px)",color:"#fff",fontWeight:600,marginBottom:3}}>صافي الربح</div>
                      <div style={{fontSize:"clamp(14px,1.7vw,22px)",fontWeight:700,color:K.gold}}>{NF(r.profit)}</div>
                    </div>
                    <div style={{background:K.panel2,padding:"clamp(9px,1.2vw,16px) 8px",textAlign:"center"}}>
                      <div style={{fontSize:"clamp(10px,1.1vw,15px)",color:"#fff",fontWeight:600,marginBottom:3}}>القسط الشهري</div>
                      <div style={{fontSize:"clamp(14px,1.7vw,22px)",fontWeight:700,color:K.gold}}>{NF(r.monthlyInst)}</div>
                    </div>
                  </div>
                </div>
                <div>
                  {secLbl("التحصيل")}
                  <div style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"clamp(11px,1.2vw,16px)",marginBottom:5}}>
                      <span style={{color:"#fff",fontWeight:600}}>محصّل من الإجمالي</span>
                      <span style={{color:K.gold,fontWeight:700}}>{r.collectPct}%</span>
                    </div>
                    <div style={{height:7,background:"rgba(255,255,255,.06)",borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",width:Math.min(100,r.collectPct)+"%",borderRadius:4,background:"linear-gradient(90deg,#a87520,#c8922a)"}}/>
                    </div>
                    {r.overCount>0 && <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
                      <span style={{fontSize:10,fontWeight:700,padding:"5px 10px",borderRadius:9,background:K.panel2,
                        border:"1px solid rgba(251,113,133,.4)",color:K.red}}>متعثر <b style={{fontSize:12}}>{r.overCount}</b> · {NF(r.overAmt)}</span>
                    </div>}
                  </div>
                </div>
                <div>
                  {secLbl("العقود")}
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
                    {chip("نشط",r.activeC,"rgba(200,146,42,.3)",K.gold)}
                    {chip("منتهي",r.doneC,"rgba(200,146,42,.3)",K.gold)}
                    {r.deferC>0 && chip("مؤجل",r.deferC,"rgba(200,146,42,.3)",K.gold)}
                    {chip("متوسط العقد",NF(r.avgC),"rgba(200,146,42,.3)",K.gold)}
                  </div>
                </div>
                <div style={{height:1,background:K.line,marginBottom:10}}/>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>{setStmtInv(inv);setStmtType("brief");}} style={{flex:1,padding:"9px 4px",borderRadius:10,border:"1px solid rgba(200,146,42,.3)",background:K.panel2,color:"#c8922a",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>كشف مختصر</button>
                  <button onClick={()=>{setStmtInv(inv);setStmtType("detailed");}} style={{flex:1,padding:"9px 4px",borderRadius:10,border:"1px solid rgba(200,146,42,.3)",background:K.panel2,color:"#c8922a",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>كشف مفصل</button>
                  <button onClick={()=>setYearInv(inv)} style={{flex:1,padding:"9px 4px",borderRadius:10,border:"1px solid rgba(200,146,42,.3)",background:K.panel2,color:"#c8922a",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>كشف سنوي</button>
                </div>
              </div>)}
            </div>);
          })}
          </div>
        </div>);
      })()}
      {/* Statement Modal */}
      <Modal open={!!yearInv} onClose={()=>setYearInv(null)} title={"📅 كشف سنوي — "+(yearInv?.name||"")} titleBg={C.gold} wide>
        {yearInv && (()=>{
          const myCon = contracts.filter(c=>c.investorId===yearInv.id);
          const myTx = (txList[yearInv.id]||[]);
          const capital = yearInv.capital||0;
          // النقدي حتى نهاية تاريخ معيّن
          const cashUpto = (end) => {
            let v = capital;
            myCon.forEach(c=>{ if(new Date(c.date) <= end){ const r=calcC(c,settings); v -= (c.amount + r.acc + r.inst + r.admin); } });
            (payments||[]).forEach(p=>{ if(myCon.find(c=>c.id===p.contractId) && new Date(p.date) <= end){ v += (+p.amount||0); } });
            myTx.forEach(t=>{ if(t.date && new Date(t.date) <= end){ v += (+t.amount||0); } });
            return v;
          };
          // المتبقي عند الناس حتى نهاية تاريخ
          const remainUpto = (end) => {
            let v = 0;
            myCon.forEach(c=>{ if(new Date(c.date) <= end){
              const tot = +c.totalInst || +c.amount || 0;
              const paid = (payments||[]).filter(p=>p.contractId===c.id && new Date(p.date)<=end).reduce((s,p)=>s+(+p.amount||0),0);
              v += Math.max(0, tot - paid);
            }});
            return v;
          };
          // نطاق الشهور: من أقدم عقد إلى اليوم
          let earliest = new Date();
          myCon.forEach(c=>{ const d=new Date(c.date); if(d<earliest) earliest=d; });
          if(myCon.length===0) earliest = new Date();
          const now = new Date();
          const months = [];
          let y=earliest.getFullYear(), m=earliest.getMonth();
          while(y<now.getFullYear() || (y===now.getFullYear() && m<=now.getMonth())){
            const isCurrent = (y===now.getFullYear() && m===now.getMonth());
            const end = isCurrent ? now : new Date(y, m+1, 0, 23,59,59); // الشهر الحالي: لحظي حتى اليوم، غيره: آخر الشهر
            months.push({label:`${String(m+1).padStart(2,"0")}/${y}`+(isCurrent?" • حتى اليوم":""), cash:cashUpto(end), remain:remainUpto(end), total:cashUpto(end)+remainUpto(end)});
            m++; if(m>11){m=0;y++;}
          }
          const totals = months.map(x=>x.total);
          const maxT = Math.max(...totals), minT = Math.min(...totals);
          const avgT = totals.reduce((s,v)=>s+v,0)/(totals.length||1);
          const maxMonth = months.find(x=>x.total===maxT), minMonth = months.find(x=>x.total===minT);
          return (
            <div style={{padding:16}}>
              <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:110,background:C.greenLt,borderRadius:8,padding:10,textAlign:"center"}}><div style={{fontSize:12,color:"#1f2937"}}>أعلى شهر</div><div style={{fontWeight:900,color:C.green,fontSize:16}}>{NUM(maxT)}</div><div style={{fontSize:11,color:"#1f2937"}}>{maxMonth?.label}</div></div>
                <div style={{flex:1,minWidth:110,background:C.redLt,borderRadius:8,padding:10,textAlign:"center"}}><div style={{fontSize:12,color:"#1f2937"}}>أقل شهر</div><div style={{fontWeight:900,color:C.red,fontSize:16}}>{NUM(minT)}</div><div style={{fontSize:11,color:"#1f2937"}}>{minMonth?.label}</div></div>
                <div style={{flex:1,minWidth:110,background:C.gray,borderRadius:8,padding:10,textAlign:"center"}}><div style={{fontSize:12,color:"#1f2937"}}>المتوسط</div><div style={{fontWeight:900,color:C.ink,fontSize:16}}>{NUM(Math.round(avgT))}</div></div>
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                  <thead><tr style={{background:C.ink,color:"#fff"}}>
                    <th style={styles.th}>الشهر</th><th style={styles.th}>النقدي</th><th style={styles.th}>المتبقي</th><th style={styles.th}>الإجمالي</th><th style={styles.th}>التغيّر %</th>
                  </tr></thead>
                  <tbody>
                    {months.map((x,i)=>{
                      const prev = i>0 ? months[i-1].total : null;
                      const pct = (prev!=null && prev!==0) ? ((x.total-prev)/Math.abs(prev)*100) : null;
                      const up = pct!=null && pct>=0;
                      return (
                        <tr key={i} style={{background:i%2?C.gray:"#fff"}}>
                          <td style={{...styles.td,fontWeight:700}}>{x.label}</td>
                          <td style={styles.td}>{NUM(Math.round(x.cash))}</td>
                          <td style={{...styles.td,color:C.red}}>{NUM(Math.round(x.remain))}</td>
                          <td style={{...styles.td,fontWeight:800,color:C.ink}}>{NUM(Math.round(x.total))}</td>
                          <td style={{...styles.td,fontWeight:800,color: pct==null?"#999":(up?C.green:C.red)}}>{pct==null?"—":(up?"▲ ":"▼ ")+Math.abs(pct).toFixed(1)+"%"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        })()}
      </Modal>

      {/* Statement Modal */}
      <Modal open={!!stmtInv} onClose={()=>setStmtInv(null)} title={"📋 كشف حساب — "+(stmtInv?.name||"")} titleBg={C.ink} wide>
        {stmtInv && (()=>{
          const _grp = stmtInv.__group;
          const _grpIds = _grp ? _grp.map(i=>i.id) : [stmtInv.id];
          const myCon = _sortContracts(contracts.filter(c=>_grpIds.includes(c.investorId) && c.contractType!=="defer"));
          const totalAmt   = myCon.reduce((s,c)=>s+c.amount,0);
          const totalPaid  = myCon.reduce((s,c)=>s+_getPaid(payments,c.id),0);
          const totalLeft  = myCon.reduce((s,c)=>s+Math.max(0,(c.totalInst||0)-_getPaid(payments,c.id)),0);
          const _autoC = myCon.reduce((s,c)=>{const rr=calcC(c,settings);return s-(c.amount+rr.acc+rr.inst+rr.admin);},0);
          const _paySum = (payments||[]).filter(p=>myCon.some(c=>c.id===p.contractId)).reduce((s,p)=>s+(p.amount||0),0);
          const _manSum = _grp ? _grp.reduce((s,i)=>s+((txList&&txList[i.id]||[]).reduce((ss,t)=>ss+(t.amount||0),0)),0)
            : ((txList&&txList[stmtInv.id])||[]).reduce((s,t)=>s+(t.amount||0),0);
          const _capSum = _grp ? _grp.reduce((s,i)=>s+(+i.capital||0),0) : (stmtInv.capital||0);
          const netCashStmt = _capSum + _autoC + _paySum + _manSum;
          const totalProfit= myCon.reduce((s,c)=>s+calcC(c,settings).net,0);
          return (
            <div id="stmt-print-area" style={{padding:"16px 20px"}}>
              {/* رأس الطباعة (يظهر فقط عند الطباعة) */}
              <div className="print-only-header" style={{display:"none"}}>
                <div style={{textAlign:"center",borderBottom:"2px solid #000",paddingBottom:10,marginBottom:14}}>
                  <div style={{fontSize:18,fontWeight:900}}>مؤسسة قمة الفرصة التجارية</div>
                  <div style={{fontSize:13}}>كشف حساب — {stmtInv.name}</div>
                  <div style={{fontSize:12,color:"#1f2937"}}>التاريخ: {fmtDate(new Date())}</div>
                </div>
              </div>
              {/* Type switcher */}
              <div style={{display:"flex",gap:0,marginBottom:16,background:C.slate,borderRadius:8,overflow:"hidden",width:"fit-content"}}>
                {[["brief","📄 مختصر"],["detailed","📋 مفصل"]].map(([k,l])=>(
                  <button key={k} onClick={()=>setStmtType(k)}
                    style={{fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:15,fontWeight:700,padding:"8px 18px",border:"none",
                      cursor:"pointer",background:stmtType===k?C.ink:C.slate,color:stmtType===k?"white":C.ink2}}>
                    {l}
                  </button>
                ))}
                <button style={{...styles.btn(C.gold),fontSize:15,padding:"8px 16px",borderRadius:0}} onClick={()=>printStatement("stmt-print-area")}>🖨️ طباعة</button>
              </div>

              {/* Summary cards */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:16}}>
                <div style={{background:C.tealLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>عدد العقود</div>
                  <div style={{fontSize:20,fontWeight:800,color:C.teal}}>{myCon.length}</div>
                </div>
                <div style={{background:C.slate,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>إجمالي القيم</div>
                  <div style={{fontSize:16,fontWeight:800}}>{SAR(totalAmt)}</div>
                </div>
                <div style={{background:C.greenLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>محصّل</div>
                  <div style={{fontSize:16,fontWeight:800,color:C.green}}>{SAR(totalPaid)}</div>
                </div>
                <div style={{background:totalLeft===0?C.greenLt:C.redLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>متبقي</div>
                  <div style={{fontSize:16,fontWeight:800,color:totalLeft===0?C.green:C.red}}>{SAR(totalLeft)}</div>
                </div>
                <div style={{background:C.purpleLt,borderRadius:8,padding:"10px",textAlign:"center"}}>
                  <div style={{fontSize:13,color:"#1f2937",marginBottom:3}}>صافي ربحه</div>
                  <div style={{fontSize:16,fontWeight:800,color:C.purple}}>{SAR(totalProfit)}</div>
                </div>
              </div>

              {/* Table */}
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                  <thead>
                    {stmtType==="brief" ? (
                      <tr>{["#","العميل","قيمة العقد","الإجمالي","القسط","محصّل","متبقي","الحالة"].map(h=>(
                        <th key={h} style={styles.th}>{h}</th>
                      ))}</tr>
                    ) : (
                      <tr>{["#","العميل","الهوية","العمل","الكفيل","البضاعة","العدد","قيمة العقد","الإجمالي","القسط","محصّل","متبقي","أول قسط","آخر قسط","الربح","ع.محاسبين","ن.مؤسسة","صافي المستثمر","الحالة"].map(h=>(
                        <th key={h} style={styles.th}>{h}</th>
                      ))}</tr>
                    )}
                  </thead>
                  <tbody>
                    {myCon.length===0 ? (
                      <tr><td colSpan={20} style={{...styles.td,textAlign:"center",padding:30,color:"#1f2937"}}>لا توجد عقود</td></tr>
                    ) : myCon.map((c,i)=>{
                      const r = calcC(c,settings);
                      const paid = _getPaid(payments,c.id);
                      const left = Math.max(0,(c.totalInst||0)-paid);
                      const done = left===0 && (c.totalInst||0)>0;
                      const bg = i%2===0?C.white:C.gray;
                      if(stmtType==="brief") return (
                        <tr key={c.id} style={{background:bg}}>
                          <td style={{...styles.td,color:"#1f2937"}}>{c.num||i+1}</td>
                          <td style={{...styles.td,fontWeight:700}}>{c.client}</td>
                          <td style={styles.td}>{SAR(c.amount)}</td>
                          <td style={styles.td}>{SAR(c.totalInst||0)}</td>
                          <td style={{...styles.td,color:C.teal,fontWeight:700}}>{SAR(c.instAmt||0)}</td>
                          <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(paid)}</td>
                          <td style={{...styles.td,color:done?C.green:C.red,fontWeight:700}}>{SAR(left)}</td>
                          <td style={styles.td}><span style={styles.badge(done?C.greenLt:C.redLt,done?C.green:C.red)}>{done?"✅ مكتمل":"⏳ جاري"}</span></td>
                        </tr>
                      );
                      return (
                        <tr key={c.id} style={{background:bg}}>
                          <td style={{...styles.td,color:"#1f2937"}}>{c.num||i+1}</td>
                          <td style={{...styles.td,fontWeight:700}}>{c.client}</td>
                          <td style={{...styles.td,fontSize:13}}>{c.idNum||"—"}</td>
                          <td style={styles.td}>{c.job||"—"}</td>
                          <td style={styles.td}>{c.gName||"—"}</td>
                          <td style={styles.td}><span style={styles.badge(C.tealLt,C.teal)}>{c.goods||"—"}</span></td>
                          <td style={{...styles.td,textAlign:"center"}}>{c.qty||"—"}</td>
                          <td style={styles.td}>{SAR(c.amount)}</td>
                          <td style={styles.td}>{SAR(c.totalInst||0)}</td>
                          <td style={{...styles.td,color:C.teal,fontWeight:700}}>{SAR(c.instAmt||0)}</td>
                          <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(paid)}</td>
                          <td style={{...styles.td,color:done?C.green:C.red,fontWeight:700}}>{SAR(left)}</td>
                          <td style={{...styles.td,fontSize:13,color:C.green}}>{c.firstInst||"—"}</td>
                          <td style={{...styles.td,fontSize:13,color:C.gold}}>{c.lastInst||"—"}</td>
                          <td style={{...styles.td,color:C.green}}>{SAR(r.profit)}</td>
                          <td style={{...styles.td,color:C.red}}>{SAR(r.acc)}</td>
                          <td style={{...styles.td,color:C.gold}}>{SAR(r.inst)}</td>
                          <td style={{...styles.td,color:C.teal,fontWeight:700}}>{SAR(r.net)}</td>
                          <td style={styles.td}><span style={styles.badge(done?C.greenLt:C.redLt,done?C.green:C.red)}>{done?"✅ مكتمل":"⏳ جاري"}</span></td>
                        </tr>
                      );
                    })}
                  </tbody>
                  {myCon.length>0 && (
                    <tfoot>
                      <tr style={{background:C.goldLt}}>
                        {stmtType==="brief" ? <>
                          <td colSpan={2} style={{...styles.td,fontWeight:800}}>الإجمالي</td>
                          <td style={{...styles.td,fontWeight:800}}>{SAR(totalAmt)}</td>
                          <td style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={{...styles.td,color:C.green,fontWeight:800}}>{SAR(totalPaid)}</td>
                          <td style={{...styles.td,color:C.red,fontWeight:800}}>{SAR(totalLeft)}</td>
                          <td style={styles.td}></td>
                        </> : <>
                          <td colSpan={7} style={{...styles.td,fontWeight:800}}>الإجمالي</td>
                          <td style={{...styles.td,fontWeight:800}}>{SAR(totalAmt)}</td>
                          <td style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={{...styles.td,color:C.green,fontWeight:800}}>{SAR(totalPaid)}</td>
                          <td style={{...styles.td,color:C.red,fontWeight:800}}>{SAR(totalLeft)}</td>
                          <td colSpan={3} style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={styles.td}></td>
                          <td style={{...styles.td,color:C.teal,fontWeight:800}}>{SAR(totalProfit)}</td>
                          <td style={styles.td}></td>
                        </>}
                      </tr>
                    </tfoot>
                  )}
                </table>
              </div>
              {/* الإجمالي: النقدي + المتبقي */}
              <div style={{marginTop:16,border:"2px solid "+C.teal,borderRadius:10,overflow:"hidden"}}>
                <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px",fontSize:15,borderBottom:"1px solid "+C.border}}>
                  <span style={{color:"#1f2937",fontWeight:700}}>💵 النقدي الصافي المتوفر</span>
                  <span style={{fontWeight:800}}>{SAR(netCashStmt)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px",fontSize:15,borderBottom:"2px solid "+C.teal}}>
                  <span style={{color:"#1f2937",fontWeight:700}}>💰 المتبقي عند الزبائن</span>
                  <span style={{fontWeight:800,color:C.red}}>{SAR(totalLeft)}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"12px 16px",fontSize:17,background:C.tealLt}}>
                  <span style={{fontWeight:900,color:C.teal}}>📊 الإجمالي (النقدي + المتبقي)</span>
                  <span style={{fontWeight:900,color:C.teal}}>{SAR(netCashStmt+totalLeft)}</span>
                </div>
              </div>
            </div>
          );
        })()}
      </Modal>

    </div>
  );
}

// ─── Settings Page ───────────────────────────────────────────
function SettingsPage({settings,onSave,toast,exportBackup,importBackup,payments,setPayments,dailyOpen,setDailyOpen,setPage,investors,contracts,setInvestors,gsWrite,saveLS,loadLS}) {
  // 🔒 تشفير الرمز السري
  const hashPin = async (pin) => {
    const enc = new TextEncoder().encode(pin+"qima_salt_2024");
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  };
  const [settingsPin] = useState(()=>{ try{ return localStorage.getItem("qimma_settings_pin")||"1234"; }catch(e){ return "1234"; } });
  const [pinInput,setPinInput] = useState("");
  const [unlocked,setUnlocked] = useState(false);
  const [pinError,setPinError] = useState(false);
  const [showChangePin,setShowChangePin] = useState(false);
  const [newPin,setNewPin] = useState("");
  const [confirmPin,setConfirmPin] = useState("");
  const [currentPin,setCurrentPin] = useState(settingsPin);

  const checkPin = async ()=>{
    // دعم الرمز القديم (نص عادي) والجديد (مشفر)
    if(currentPin.length===64){
      const h = await hashPin(pinInput);
      if(h===currentPin){ setUnlocked(true); setPinError(false); }
      else { setPinError(true); setPinInput(""); }
    } else {
      if(pinInput===currentPin){ setUnlocked(true); setPinError(false); }
      else { setPinError(true); setPinInput(""); }
    }
  };
  const changePin = async ()=>{
    if(!newPin||newPin.length<4){ toast&&toast("الرقم السري لازم 4 خانات على الأقل","error"); return; }
    if(newPin!==confirmPin){ toast&&toast("الرقم السري غير متطابق","error"); return; }
    const hashed = await hashPin(newPin);
    try{ localStorage.setItem("qimma_settings_pin",hashed); }catch(e){}
    setCurrentPin(hashed);
    setShowChangePin(false); setNewPin(""); setConfirmPin("");
    toast&&toast("✅ تم تغيير الرقم السري وتشفيره");
  };

  const [s,setS]=useState({...settings});
  const upd = (k,v) => { const ns={...s,[k]:v}; setS(ns); onSave(ns); };
  const r=calcContract(10000,s);
  // رصيد بداية الصندوق
  const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
  const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
  const baseAmount = base ? (+base.amount||0) : 0;
  const baseDate = base ? base.date : "";
  const [baseInput,setBaseInput] = useState(base?String(baseAmount):"");
  const [baseDateInput,setBaseDateInput] = useState(baseDate||todayLocal());
  const [editingBase,setEditingBase] = useState(false);
  const [mgrPhone,setMgrPhone] = useState(()=>{ try{ return localStorage.getItem("qimma_mgr_phone")||""; }catch(e){ return ""; } });
  const [bizPhone,setBizPhone] = useState(()=>{ try{ return localStorage.getItem("qimma_biz_phone")||""; }catch(e){ return ""; } });

  if(!unlocked){
    return (
      <div style={{minHeight:"60vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:16,padding:"32px 24px",boxShadow:"0 4px 24px rgba(0,0,0,0.12)",textAlign:"center",maxWidth:340,width:"100%"}}>
          <div style={{fontSize:48,marginBottom:12}}>🔒</div>
          <div style={{fontSize:18,fontWeight:800,color:"#1f2937",marginBottom:8}}>الإعدادات مقفلة</div>
          <div style={{fontSize:14,color:"#6b7280",marginBottom:20}}>أدخل الرقم السري للدخول</div>
          <input type="password" inputMode="numeric" maxLength={8} placeholder="الرقم السري"
            value={pinInput} onChange={e=>{ setPinInput(e.target.value); setPinError(false); }}
            onKeyDown={e=>{ if(e.key==="Enter") checkPin(); }}
            style={{width:"100%",padding:"14px",fontSize:22,textAlign:"center",border:"2px solid "+(pinError?"#dc2626":"#d1d5db"),borderRadius:12,marginBottom:12,fontWeight:800,letterSpacing:8,fontFamily:"monospace",outline:"none",boxSizing:"border-box"}}/>
          {pinError && <div style={{color:"#dc2626",fontSize:14,fontWeight:700,marginBottom:10}}>رقم سري خاطئ</div>}
          <button onClick={checkPin}
            style={{width:"100%",padding:"14px",fontSize:17,fontWeight:800,background:"#0d9488",color:"#fff",border:"none",borderRadius:12,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>
            🔓 فتح الإعدادات
          </button>
          <div style={{fontSize:12,color:"#9ca3af",marginTop:16}}>أدخل الرمز السري</div>
        </div>
      </div>
    );
  }
  return (
    <div>
      <div style={{fontSize:19,fontWeight:800,marginBottom:16}}>⚙️ الإعدادات</div>

      {/* 🔒 تغيير الرقم السري */}
      <div style={{...styles.panel,marginBottom:16,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:15,fontWeight:700}}>🔒 الرقم السري للإعدادات</span>
          <button onClick={()=>setShowChangePin(v=>!v)} style={{...styles.btn("#475569","#fff"),fontSize:14,padding:"7px 14px"}}>{showChangePin?"✕ إلغاء":"✏️ تغيير"}</button>
        </div>
        {showChangePin && (
          <div style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:"#6b7280",display:"block",marginBottom:4}}>الرقم الجديد</label>
              <input type="password" inputMode="numeric" maxLength={8} value={newPin} onChange={e=>setNewPin(e.target.value)} placeholder="4 خانات+" style={{...styles.input,width:120,textAlign:"center",letterSpacing:6,fontFamily:"monospace"}}/>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:"#6b7280",display:"block",marginBottom:4}}>تأكيد</label>
              <input type="password" inputMode="numeric" maxLength={8} value={confirmPin} onChange={e=>setConfirmPin(e.target.value)} placeholder="أعد الإدخال" style={{...styles.input,width:120,textAlign:"center",letterSpacing:6,fontFamily:"monospace"}}/>
            </div>
            <button onClick={changePin} style={styles.btn("#0d9488")}>💾 حفظ</button>
          </div>
        )}
      </div>
      <button style={{...styles.btn("#475569","#fff"),width:"100%",justifyContent:"center",fontSize:16,padding:"12px",marginBottom:16}} onClick={()=>setPage&&setPage("activity")}>📜 سجل النشاط</button>

      {/* 📱 رقم جوال المدير */}
      <div style={{...styles.card,marginBottom:16,background:"#f0fdf4",border:"1px solid #16a34a"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:1}}>
            <label style={{fontSize:14,fontWeight:800,color:"#166534",display:"block",marginBottom:6}}>📱 رقم جوال المدير (للإشعارات)</label>
            <input type="tel" placeholder="05xxxxxxxx" style={{...styles.input,width:"100%",fontSize:16,fontWeight:700,direction:"ltr"}} value={mgrPhone} onChange={e=>{setMgrPhone(e.target.value);try{localStorage.setItem("qimma_mgr_phone",e.target.value)}catch(x){}}}/>
          </div>
        </div>
        <div style={{fontSize:12,color:"#6b7280",marginTop:6}}>يُستخدم لإرسال ملخص السدادات اليومية عبر واتساب</div>
      </div>

      {/* 📱 رقم واتساب المؤسسة */}
      <div style={{...styles.card,marginBottom:16,background:"#eff6ff",border:"1px solid #3b82f6"}}>
        <div style={{flex:1}}>
          <label style={{fontSize:14,fontWeight:800,color:"#1e40af",display:"block",marginBottom:6}}>📱 رقم واتساب المؤسسة</label>
          <input type="tel" placeholder="05xxxxxxxx" style={{...styles.input,width:"100%",fontSize:16,fontWeight:700,direction:"ltr"}} value={bizPhone} onChange={e=>{setBizPhone(e.target.value);try{localStorage.setItem("qimma_biz_phone",e.target.value)}catch(x){}}}/>
        </div>
        <div style={{fontSize:12,color:"#6b7280",marginTop:6}}>يُستخدم لإرسال كشوفات الزبائن عبر واتساب</div>
      </div>

      {/* رصيد بداية الصندوق */}
      <div style={{...styles.card,marginBottom:16,background:"#fffbf0",border:"1px solid "+C.gold}}>
        {base && !editingBase ? (
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
            <div>
              <span style={{fontSize:14,fontWeight:800,color:"#8a6200"}}>💰 رصيد بداية الصندوق: </span>
              <span style={{fontSize:18,fontWeight:900,color:C.ink}}>{SAR(baseAmount)}</span>
              <span style={{fontSize:13,color:"#1f2937",marginRight:8}}>({baseDate})</span>
            </div>
            <button style={{...styles.btn("#f3f4f6","#6b7280"),fontSize:13,padding:"5px 12px"}}
              onClick={()=>{setBaseInput(String(baseAmount));setBaseDateInput(baseDate);setEditingBase(true);}}>✏️ تعديل</button>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"flex-end",gap:10,flexWrap:"wrap"}}>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>💰 المبلغ</label>
              <input type="number" placeholder="مثال: 15000" style={{...styles.input,width:150}} value={baseInput} onChange={e=>setBaseInput(e.target.value)}/>
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>التاريخ</label>
              <input type="date" style={{...styles.input,width:170}} value={baseDateInput} onChange={e=>setBaseDateInput(e.target.value)}/>
            </div>
            <button style={{...styles.btn(C.teal,"#fff"),fontSize:14,padding:"9px 20px"}}
              onClick={()=>{
                const amt=parseFloat(baseInput);
                if(isNaN(amt)){toast("أدخل مبلغاً صحيحاً","warn");return;}
                if(!baseDateInput){toast("اختر التاريخ","warn");return;}
                setDailyOpen(p=>({...(p&&typeof p==="object"&&!Array.isArray(p)?p:{}), __base:{date:baseDateInput,amount:amt}}));
                setEditingBase(false); toast("✅ تم الحفظ");
              }}>💾 حفظ</button>
            {editingBase && <button style={{...styles.btn(C.red,"#fff"),fontSize:13,padding:"9px 14px"}} onClick={()=>setEditingBase(false)}>إلغاء</button>}
          </div>
        )}
      </div>

      <div style={{...styles.panel,marginBottom:16}}>
        <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>بيانات المؤسسة</h3></div>
        <div style={{padding:"16px 20px"}}>          <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>رقم السجل التجاري</label>
          <input style={{...styles.input,maxWidth:280,borderColor:C.gold,fontWeight:700}} type="text"
            placeholder="مثال: 1010xxxxxx"
            value={s.regNum||""} onChange={e=>setS(prev=>({...prev,regNum:e.target.value}))}/>
          <div style={{fontSize:14,color:"#1f2937",marginTop:5}}>يظهر هذا الرقم تلقائياً في كل عقد مطبوع</div>
          <div style={{marginTop:16}}>
            <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>بداية ترقيم العقود</label>
            <input style={{...styles.input,maxWidth:160,borderColor:C.teal,fontWeight:700}} type="number" min="1"
              placeholder="مثال: 1"
              value={s.startNum||1} onChange={e=>setS(prev=>({...prev,startNum:parseInt(e.target.value)||1}))}/>
            <div style={{fontSize:14,color:"#1f2937",marginTop:5}}>رقم أول عقد جديد (يُطبق فقط إذا لم توجد عقود)</div>
          </div>
        </div>
      </div>

      <div style={styles.panel}>
        <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>نسب التوزيع</h3></div>
        <div style={{padding:"16px 20px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14,marginBottom:16}}>
            {[["نسبة ربح العقد %","profit","من قيمة العقد"],["الرسوم الإدارية %","admin","من قيمة العقد"],["عمولة المحاسبين %","acc","من الربح"],["نصيب المؤسسة %","inst","من الربح"]].map(([l,k,hint])=>(
              <div key={k}>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>{l}</label>
                <input style={styles.input} type="number" value={s[k]} onChange={e=>setS(prev=>({...prev,[k]:parseFloat(e.target.value)||0}))}/>
                <div style={{fontSize:14,color:"#1f2937",marginTop:3}}>{hint}</div>
              </div>
            ))}
          </div>
          <div style={styles.calcBox}>
            <div style={{fontSize:15,fontWeight:700,color:C.gold,marginBottom:10}}>مثال توضيحي — عقد 10,000 ريال</div>
            <CalcRow label="الربح" value={SAR(r.profit)} color="#5cd98a"/>
            <CalcRow label="الرسوم الإدارية" value={SAR(r.admin)} color="#ff8080"/>
            <CalcRow label="عمولة المحاسبين" value={SAR(r.acc)} color="#ff8080"/>
            <CalcRow label="نصيب المؤسسة" value={SAR(r.inst)} color="#ff8080"/>
            <CalcRow label="صافي ربح المستثمر" value={SAR(r.net)} color={C.gold} total bold/>
          </div>
          <div style={{display:"flex",gap:10,marginTop:16}}>
            <button style={styles.btn(C.teal)} onClick={()=>{onSave(s);toast("✅ تم حفظ الإعدادات");}}>💾 حفظ</button>
          </div>
        </div>
      </div>

      <div style={{...styles.panel,marginTop:16}}>
        <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>💾 النسخة الاحتياطية</h3></div>
        <div style={{padding:"16px 20px"}}>
          <div style={{fontSize:14,color:C.ink,marginBottom:14,lineHeight:1.7}}>
            احفظ نسخة من كل بياناتك (المستثمرين، العقود، السدادات، البضاعة...) في ملف على جهازك. احتفظ به في مكان آمن — يحميك لو صار أي خطأ أو حذف بالغلط.
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <button style={styles.btn(C.green)} onClick={exportBackup}>⬇️ تنزيل نسخة احتياطية</button>
            <label style={{...styles.btn(C.gold),cursor:"pointer",margin:0}}>
              ⬆️ استرجاع من ملف
              <input type="file" accept=".json,application/json" style={{display:"none"}}
                onChange={e=>{ const f=e.target.files&&e.target.files[0]; if(f){ if(window.confirm("سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. متأكد؟")){ importBackup(f); } } e.target.value=""; }}/>
            </label>
          </div>
          <div style={{fontSize:13,color:C.red,marginTop:12,fontWeight:700}}>⚠️ الاسترجاع يستبدل كل البيانات الحالية بالكامل.</div>

          {/* إعدادات النسخ التلقائي */}
          <div style={{marginTop:24,paddingTop:20,borderTop:"2px dashed "+C.border}}>
            <div style={{fontSize:15,fontWeight:800,color:C.ink,marginBottom:12}}>🔄 نسخ احتياطي تلقائي للإيميل</div>
            <div style={{fontSize:13,color:"#555",marginBottom:14,lineHeight:1.7}}>يرسل نسخة من كل بياناتك لإيميلك تلقائياً كل فترة بدون أي تدخل منك.</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <button
                style={{...styles.btn(s.autoBackup?C.green:"#e5e7eb",s.autoBackup?"#fff":C.ink),fontSize:14,padding:"8px 16px"}}
                onClick={()=>upd("autoBackup",!s.autoBackup)}>
                {s.autoBackup?"✅ مفعّل":"⬜ معطّل"}
              </button>
              {s.autoBackup && (
                <select style={{...styles.select,flex:1}} value={s.autoBackupHours||"24"} onChange={e=>upd("autoBackupHours",e.target.value)}>
                  <option value="12">كل 12 ساعة</option>
                  <option value="24">كل 24 ساعة</option>
                  <option value="48">كل 48 ساعة</option>
                  <option value="72">كل 3 أيام</option>
                  <option value="168">كل أسبوع</option>
                </select>
              )}
            </div>
            {s.autoBackup && (<>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:13,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>📧 الإيميل</label>
                <input style={styles.input} type="email" placeholder="example@gmail.com" value={s.backupEmail||""} onChange={e=>upd("backupEmail",e.target.value)}/>
              </div>
              <div style={{marginBottom:10}}>
                <label style={{fontSize:13,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>🔗 رابط السكربت (Google Apps Script)</label>
                <input style={styles.input} type="url" dir="ltr" placeholder="https://script.google.com/macros/s/..." value={s.backupScriptUrl||""} onChange={e=>upd("backupScriptUrl",e.target.value)}/>
                <div style={{fontSize:11,color:"#999",marginTop:4,lineHeight:1.6}}>أنشئ سكربت Google جديد والصق الرابط هنا. اسأل Claude عن طريقة إنشاء السكربت.</div>
              </div>
              <div style={{fontSize:12,color:C.green,fontWeight:700}}>✅ آخر نسخة: {localStorage.getItem("qimma_last_auto_backup")?new Date(parseInt(localStorage.getItem("qimma_last_auto_backup"))).toLocaleString("ar-SA"):"لم تُرسل بعد"}</div>
              <button style={{...styles.btn(C.teal,"#fff"),fontSize:13,padding:"8px 14px",marginTop:8}} onClick={async()=>{
                if(!s.backupEmail||!s.backupScriptUrl){toast("حدد الإيميل ورابط السكربت أولاً","error");return;}
                try{
                  const out={};Object.keys(localStorage).forEach(k=>{if(k.indexOf("qimma_")===0){try{out[k]=JSON.parse(localStorage.getItem(k));}catch{out[k]=localStorage.getItem(k);}}});
                  toast("⏳ جارٍ الإرسال...");
                  const resp=await fetch(s.backupScriptUrl,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({email:s.backupEmail,backup:{_backup:"qima",_date:new Date().toISOString(),data:out}})});
                  const r=await resp.json();
                  if(r.success){localStorage.setItem("qimma_last_auto_backup",String(Date.now()));toast("✅ تم الإرسال بنجاح! تفقّد إيميلك");}
                  else toast("⚠️ فشل الإرسال: "+(r.error||"خطأ"),"error");
                }catch(e){toast("⚠️ تعذّر الاتصال بالسكربت","error");}
              }}>📤 إرسال تجريبي الآن</button>
            </>)}
          </div>

          <div style={{marginTop:24,paddingTop:20,borderTop:"2px dashed "+C.border}}>
            <div style={{fontSize:15,fontWeight:800,color:C.red,marginBottom:8}}>🗑️ تصفير الدفعات (المحصّل)</div>
            <div style={{fontSize:13,color:"#1f2937",marginBottom:12}}>يحذف جميع الدفعات المسجّلة (سداد/تحصيل الأقساط). لا يمس دفتر اليومية ولا العقود ولا المستثمرين. مناسب لبدء التحصيل من الصفر بعد التجربة.</div>
            <button style={styles.btn(C.red,"#fff")} onClick={()=>{
              const cnt=(payments||[]).length;
              if(cnt===0){ toast&&toast("لا توجد دفعات مسجّلة"); return; }
              if(window.confirm("سيتم حذف جميع الدفعات المسجّلة نهائياً ("+cnt+" دفعة). سيرجع المحصّل إلى صفر. دفتر اليومية والعقود لن تتأثر.\n\nهل أنت متأكد؟")){
                if(window.confirm("تأكيد أخير: هذا الإجراء لا يمكن التراجع عنه. متابعة الحذف؟")){
                  setPayments([]); toast&&toast("🗑️ تم تصفير جميع الدفعات");
                }
              }
            }}>🗑️ حذف جميع الدفعات وتصفير المحصّل</button>
          </div>
        </div>
      </div>

      {/* ═══ الصناديق ═══ */}
      {investors && <FundsPanel investors={investors} contracts={contracts} settings={settings} setInvestors={setInvestors} toast={toast}/>}

      {/* ═══ الدفتر الخاص (مخفي) ═══ */}
      <PrivateNotes toast={toast} gsWrite={gsWrite} saveLS={saveLS} loadLS={loadLS}/>
    </div>
  );
}

function PrivateNotes({toast, gsWrite, saveLS, loadLS}){
  const [pvtOpen,setPvtOpen] = useState(false);
  const [pvtPin,setPvtPin] = useState("");
  const [pvtUnlocked,setPvtUnlocked] = useState(false);
  const [pvtErr,setPvtErr] = useState(false);
  const [loans,setLoans] = useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_pvt_loans")||"[]");}catch{return[];}});
  const [form,setForm] = useState({name:"",amount:""});
  const [payForm,setPayForm] = useState({id:null,amount:"",note:""});
  const PVT_PIN_KEY = "qimma_pvt_pin";
  const savedPvtPin = (()=>{try{return localStorage.getItem(PVT_PIN_KEY)||"";}catch{return"";}})();

  const hashP = async (p) => {
    const enc = new TextEncoder().encode(p+"qima_pvt_salt");
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  };
  const checkPvt = async () => {
    if(!savedPvtPin){
      if(pvtPin.length<4){setPvtErr(true);return;}
      const h = await hashP(pvtPin);
      localStorage.setItem(PVT_PIN_KEY,h);
      setPvtUnlocked(true);setPvtErr(false);
      toast&&toast("✅ تم تعيين رمز الدفتر الخاص");
    } else {
      const h = await hashP(pvtPin);
      if(h===savedPvtPin){setPvtUnlocked(true);setPvtErr(false);}
      else{setPvtErr(true);setPvtPin("");}
    }
  };
  const save = d => {
    setLoans(d);
    localStorage.setItem("qimma_pvt_loans",JSON.stringify(d));
    if(saveLS) saveLS("qimma_pvt_loans",d);
    if(gsWrite) gsWrite("pvt_loans",d);
  };
  const NF = n => Math.round(+(n||0)).toLocaleString("en-US");
  const addLoan = () => {
    if(!form.name||!form.amount||parseFloat(form.amount)<=0)return;
    save([...loans,{id:Date.now(),name:form.name,amount:parseFloat(form.amount),date:todayLocal(),payments:[],note:""}]);
    setForm({name:"",amount:""});
  };
  const addPayment = () => {
    if(!payForm.id||!payForm.amount||parseFloat(payForm.amount)<=0)return;
    save(loans.map(l=>l.id===payForm.id?{...l,payments:[...l.payments,{id:Date.now(),amount:parseFloat(payForm.amount),date:todayLocal(),note:payForm.note}]}:l));
    setPayForm({id:null,amount:"",note:""});
  };
  const delLoan = id => {if(window.confirm("حذف السلفة بالكامل؟"))save(loans.filter(l=>l.id!==id));};
  const delPay = (lid,pid) => {if(window.confirm("حذف الدفعة؟"))save(loans.map(l=>l.id===lid?{...l,payments:l.payments.filter(p=>p.id!==pid)}:l));};
  const totalGiven = loans.reduce((s,l)=>s+l.amount,0);
  const totalPaid = loans.reduce((s,l)=>s+l.payments.reduce((s2,p)=>s2+p.amount,0),0);
  const totalLeft = totalGiven - totalPaid;

  const iS = {padding:"10px 14px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:15,fontFamily:"inherit",outline:"none",boxSizing:"border-box"};

  return (
    <div style={{marginTop:30}}>
      <button onClick={()=>setPvtOpen(!pvtOpen)} style={{background:"transparent",border:"none",cursor:"pointer",padding:12,opacity:0.4,marginTop:20}}>
        <span style={{fontSize:13,color:"#94a3b8",letterSpacing:4}}>· · ·</span>
      </button>
      {pvtOpen && !pvtUnlocked && (
        <div style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(0,0,0,.08)",maxWidth:400,margin:"10px auto",textAlign:"center",padding:24}}>
          <div style={{fontSize:28,marginBottom:8}}>🔐</div>
          <div style={{fontSize:15,fontWeight:700,color:"#1f2937",marginBottom:4}}>الدفتر الخاص</div>
          <div style={{fontSize:12,color:"#6b7280",marginBottom:16}}>{savedPvtPin?"أدخل الرمز":"عيّن رمز جديد (4 أرقام على الأقل)"}</div>
          <input type="password" inputMode="numeric" maxLength={8} placeholder="الرمز السري"
            value={pvtPin} onChange={e=>{setPvtPin(e.target.value);setPvtErr(false);}}
            onKeyDown={e=>{if(e.key==="Enter")checkPvt();}}
            style={{width:"100%",padding:12,fontSize:20,textAlign:"center",border:"2px solid "+(pvtErr?"#dc2626":"#d1d5db"),borderRadius:10,fontWeight:800,letterSpacing:6,fontFamily:"monospace",outline:"none",boxSizing:"border-box",marginBottom:10}}/>
          {pvtErr && <div style={{color:"#dc2626",fontSize:13,fontWeight:700,marginBottom:8}}>رمز خاطئ</div>}
          <button onClick={checkPvt} style={{width:"100%",padding:12,fontSize:15,fontWeight:800,background:"#1a1a2e",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit"}}>فتح</button>
        </div>
      )}
      {pvtOpen && pvtUnlocked && (
        <div style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(0,0,0,.08)",maxWidth:700,margin:"10px auto",padding:20}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontSize:17,fontWeight:800,color:"#1a1a2e"}}>🔐 الدفتر الخاص</div>
            <button onClick={()=>{setPvtUnlocked(false);setPvtPin("");setPvtOpen(false);}} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",color:"#6b7280",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>قفل</button>
          </div>

          {/* الإجماليات */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:1,background:"#e2e8f0",borderRadius:11,overflow:"hidden",marginBottom:16}}>
            <div style={{background:"#f0fdf4",padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:11,color:"#16a34a",fontWeight:600}}>إجمالي السلف</div>
              <div style={{fontSize:16,fontWeight:800,color:"#16a34a"}}>{NF(totalGiven)}</div>
            </div>
            <div style={{background:"#eff6ff",padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:11,color:"#2563eb",fontWeight:600}}>المسدد</div>
              <div style={{fontSize:16,fontWeight:800,color:"#2563eb"}}>{NF(totalPaid)}</div>
            </div>
            <div style={{background:"#fef2f2",padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:11,color:"#dc2626",fontWeight:600}}>المتبقي</div>
              <div style={{fontSize:16,fontWeight:800,color:"#dc2626"}}>{NF(totalLeft)}</div>
            </div>
          </div>

          {/* إضافة سلفة */}
          <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
            <input placeholder="اسم الشخص" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
              style={{...iS,flex:2,minWidth:140}}/>
            <input placeholder="المبلغ" type="number" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}
              onKeyDown={e=>{if(e.key==="Enter")addLoan();}}
              style={{...iS,flex:1,minWidth:100}}/>
            <button onClick={addLoan} style={{padding:"10px 18px",borderRadius:10,border:"none",background:"#c8922a",color:"#fff",fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>➕ إضافة</button>
          </div>

          {/* قائمة السلف */}
          {loans.length===0 && <div style={{textAlign:"center",color:"#94a3b8",padding:24,fontSize:14}}>لا توجد سلف مسجلة</div>}
          {loans.map(l=>{
            const paid = l.payments.reduce((s,p)=>s+p.amount,0);
            const left = l.amount - paid;
            const done = left <= 0;
            return (
              <div key={l.id} style={{background:done?"#f0fdf4":"#f8fafc",borderRadius:12,padding:14,marginBottom:10,border:"1px solid "+(done?"#86efac":"#e2e8f0")}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div>
                    <span style={{fontWeight:800,fontSize:16,color:"#1f2937"}}>{l.name}</span>
                    {done && <span style={{marginRight:8,fontSize:11,color:"#16a34a",fontWeight:700,background:"#dcfce7",padding:"2px 8px",borderRadius:6}}>✓ مسدد</span>}
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#94a3b8"}}>{l.date}</span>
                    <button onClick={()=>delLoan(l.id)} style={{background:"none",border:"none",color:"#ef4444",fontSize:14,cursor:"pointer"}}>✕</button>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
                  <div><div style={{fontSize:10,color:"#6b7280"}}>السلفة</div><div style={{fontSize:15,fontWeight:700,color:"#1f2937"}}>{NF(l.amount)}</div></div>
                  <div><div style={{fontSize:10,color:"#6b7280"}}>المسدد</div><div style={{fontSize:15,fontWeight:700,color:"#2563eb"}}>{NF(paid)}</div></div>
                  <div><div style={{fontSize:10,color:"#6b7280"}}>المتبقي</div><div style={{fontSize:15,fontWeight:700,color:left>0?"#dc2626":"#16a34a"}}>{NF(left)}</div></div>
                </div>
                {/* شريط التقدم */}
                <div style={{height:6,background:"#e2e8f0",borderRadius:4,overflow:"hidden",marginBottom:8}}>
                  <div style={{height:"100%",width:Math.min(100,l.amount>0?(paid/l.amount*100):0)+"%",borderRadius:4,background:done?"#16a34a":"#c8922a"}}/>
                </div>
                {/* الدفعات */}
                {l.payments.length>0 && (
                  <div style={{marginBottom:8}}>
                    {l.payments.map((p,pi)=>(
                      <div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12,padding:"4px 0",borderBottom:"1px solid #f1f5f9"}}>
                        <span style={{color:"#6b7280"}}>{pi+1}. {p.date}{p.note?" — "+p.note:""}</span>
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <span style={{fontWeight:700,color:"#2563eb"}}>{NF(p.amount)}</span>
                          <button onClick={()=>delPay(l.id,p.id)} style={{background:"none",border:"none",color:"#ef4444",fontSize:11,cursor:"pointer"}}>✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {/* إضافة دفعة */}
                {!done && (
                  payForm.id===l.id ? (
                    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <input placeholder="المبلغ" type="number" value={payForm.amount} onChange={e=>setPayForm(f=>({...f,amount:e.target.value}))}
                        onKeyDown={e=>{if(e.key==="Enter")addPayment();}}
                        style={{...iS,flex:1,minWidth:80,fontSize:14,padding:"8px 10px"}}/>
                      <input placeholder="ملاحظة (اختياري)" value={payForm.note} onChange={e=>setPayForm(f=>({...f,note:e.target.value}))}
                        style={{...iS,flex:2,minWidth:100,fontSize:14,padding:"8px 10px"}}/>
                      <button onClick={addPayment} style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#2563eb",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>سداد</button>
                      <button onClick={()=>setPayForm({id:null,amount:"",note:""})} style={{padding:"8px 10px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",color:"#6b7280",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
                    </div>
                  ) : (
                    <button onClick={()=>setPayForm({id:l.id,amount:"",note:""})} style={{padding:"6px 14px",borderRadius:8,border:"1px solid #e2e8f0",background:"#fff",color:"#2563eb",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>💰 تسديد دفعة</button>
                  )
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ═══ صفحة الزبائن ═══
function PastClientsPage({toast, pastClients, setPastClients, contracts}){
  const clients = pastClients || [];
  const [search, setSearch] = useState("");
  const [mode, setMode] = useState("manual"); // manual | paste | file
  const [addOpen, setAddOpen] = useState(clients.length===0); // مطوية إذا فيه زبائن، مفتوحة إذا القائمة فاضية
  const [manual, setManual] = useState({name:"", phone:""});
  const [pasteText, setPasteText] = useState("");
  const [previewRows, setPreviewRows] = useState([]); // [{id,name,phone,include}]
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({name:"", phone:""});
  const [showMsg, setShowMsg] = useState(false);
  const [msg, setMsg] = useState("السلام عليكم ورحمة الله\nنسعد بخدمتكم من جديد ..\n\nمؤسسة قمة الفرصه التجاريه\n0555171283");
  const fileRef = React.useRef(null);

  const save = d => setPastClients(_numberDupNames(_arr(d)));

  // ── تطبيع رقم الجوال السعودي (الدالة المشتركة) ──
  const normPhone = _normSaPhone;
  const isName = (v) => {
    const s = String(v==null?"":v).trim();
    return s.length>=2 && /[\u0600-\u06FFa-zA-Z]/.test(s) && !normPhone(s);
  };
  const cellsToRow = (cells) => {
    let phone="", name="";
    for(const c of cells){ const p=normPhone(c); if(p && !phone) phone=p; }
    for(const c of cells){ const s=String(c==null?"":c).trim(); if(!name && isName(s)) name=s; }
    if(phone||name) return {name, phone};
    return null;
  };
  const parseDelimited = (text) => {
    const rows=[];
    text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(l=>l.trim()).forEach(line=>{
      const cells = line.split(/[,;\t|]/).map(c=>c.replace(/^["']|["']$/g,"").trim());
      const row = cellsToRow(cells);
      if(row) rows.push(row);
    });
    return rows;
  };

  // ── معاينة من اللصق ──
  const previewFromPaste = () => {
    if(!pasteText.trim()){ toast("الصق نص أولاً — اسم وجوال بكل سطر","warn"); return; }
    const rows = parseDelimited(pasteText);
    if(rows.length===0){ toast("لم يتم التعرف على أي بيانات بالنص الملصق","error"); return; }
    setPreviewRows(rows.map(r=>({...r, id:Math.random(), include:true})));
    toast("تم التعرف على "+rows.length+" صف — راجعها قبل الحفظ");
  };

  // ── معاينة من ملف CSV/Excel (اكتشاف النوع من محتوى الملف لا من الاسم) ──
  const onFilePicked = async (e) => {
    const files = e.target.files;
    if(!files || !files.length){ return; }
    e.target.value = "";
    let collected = [];
    let diag = "";
    for(const f of files){
      try{
        const buf = await f.arrayBuffer();
        const b = new Uint8Array(buf);
        const isZip = b[0]===0x50 && b[1]===0x4B;   // PK.. => xlsx
        const isOle = b[0]===0xD0 && b[1]===0xCF;   // xls قديم
        const isPdf = b[0]===0x25 && b[1]===0x50 && b[2]===0x44 && b[3]===0x46;
        if(isPdf){ toast("ملفات PDF غير مدعومة — استخدم CSV أو Excel أو الصق النص مباشرة","error"); continue; }
        if(isZip || isOle){
          if(typeof XLSX==="undefined"){ toast("مكتبة Excel لم تُحمّل — أعد تحميل الصفحة وحاول مجدداً","error"); continue; }
          const wb = XLSX.read(b, {type:"array"});
          wb.SheetNames.forEach(sn=>{
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, defval:""});
            if(!diag && rows.length) diag = JSON.stringify(rows.slice(0,3));
            rows.forEach(r=>{ const row=cellsToRow(Array.isArray(r)?r:Object.values(r)); if(row) collected.push(row); });
          });
        } else {
          let text = new TextDecoder("utf-8").decode(b);
          if(text.indexOf("\uFFFD")>=0){ try{ text = new TextDecoder("windows-1256").decode(b); }catch(e2){} }
          if(!diag) diag = text.slice(0,200);
          collected = collected.concat(parseDelimited(text));
        }
      }catch(err){ toast("خطأ بقراءة "+f.name+": "+err.message, "error"); }
    }
    if(collected.length===0){ toast("لم يُقرأ أي صف من الملف. أول ما بداخله: "+(diag||"(فارغ)"), "error"); return; }
    setPreviewRows(collected.map(r=>({...r, id:Math.random(), include:true})));
    toast("تم استخراج "+collected.length+" صف من الملف — راجعها قبل الحفظ");
  };

  const toggleRow = (id) => setPreviewRows(p=>p.map(r=>r.id===id?{...r,include:!r.include}:r));
  const toggleAllRows = (val) => setPreviewRows(p=>p.map(r=>({...r,include:val})));
  const confirmImport = () => {
    const toAdd = previewRows.filter(r=>r.include).map(r=>({id:Date.now()+Math.random(), name:(r.name||"").trim(), phone:r.phone||""}));
    if(!toAdd.length){ toast("لا يوجد صفوف محددة للاستيراد","warn"); return; }
    save([...clients, ...toAdd]);
    toast("تم إضافة "+toAdd.length+" جهة اتصال");
    setPreviewRows([]);
    setPasteText("");
  };
  const cancelPreview = () => setPreviewRows([]);

  // ── استيراد عملاء العقود دفعة واحدة ──
  // يجيب الكل. لا يحذف ولا يدمج. يتجاهل فقط السجل المطابق تماماً (نفس الاسم ونفس الجوال)
  // لأن إضافته تكرار محض. الأسماء المتشابهة تُرقَّم تلقائياً بعد الحفظ.
  const importFromContracts = () => {
    const src = (contracts||[]).filter(c=>c && !c.deleted);
    if(!src.length){ toast("لا توجد عقود في البرنامج","warn"); return; }
    const exact = new Set(clients.map(c=>_baseName(c.name)+"|"+normPhone(c.phone)));
    const rows = [];
    src.forEach(c=>{
      const phone = normPhone(c.cPhone);
      const name  = _baseName(c.client);
      if(!phone && !name) return;                 // سجل فارغ تماماً
      const key = name+"|"+phone;
      if(exact.has(key)) return;                  // مطابق تماماً — موجود مسبقاً
      exact.add(key);
      rows.push({name, phone});
    });
    if(!rows.length){ toast("كل عملاء العقود موجودين مسبقاً بنفس الاسم والجوال","warn"); return; }
    setPreviewRows(rows.map(r=>({...r, id:Math.random(), include:true})));
    setAddOpen(true);
    toast("جاهز لاستيراد "+rows.length+" سجل من العقود — راجعهم ثم احفظ");
  };

  // ── إضافة يدوية مباشرة ──
  const addManual = () => {
    const phone = manual.phone ? normPhone(manual.phone) : "";
    if(!manual.name.trim() && !phone){ toast("أدخل اسم أو رقم جوال صحيح","warn"); return; }
    if(manual.phone && !phone){ toast("رقم الجوال غير صحيح — الصيغة 05XXXXXXXX","error"); return; }
    save([...clients, {id:Date.now()+Math.random(), name:manual.name.trim(), phone}]);
    setManual({name:"", phone:""});
    toast("تمت الإضافة");
  };

  // ── تعديل / حذف ──
  const startEdit = c => { setEditId(c.id); setEditForm({name:c.name||"", phone:c.phone||""}); };
  const saveEdit = () => {
    const phone = editForm.phone ? normPhone(editForm.phone) : "";
    if(editForm.phone && !phone){ toast("رقم الجوال غير صحيح — الصيغة 05XXXXXXXX","error"); return; }
    save(clients.map(c=>c.id===editId?{...c, name:editForm.name.trim(), phone}:c));
    setEditId(null);
    toast("تم التحديث");
  };
  const del = id => save(clients.filter(c=>c.id!==id));
  const clearAll = () => { if(window.confirm("حذف جميع الزبائن؟ لا يمكن التراجع.")){ save([]); toast("تم حذف الكل"); } };

  const sendWA = (phone) => {
    const p = phone.startsWith("05") ? "966"+phone.slice(1) : phone;
    window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg), "_blank");
  };

  const exportCSV = () => {
    const esc = v => '"'+String(v||"").replace(/"/g,'""')+'"';
    const head = ["الاسم","الجوال"];
    const rows = clients.map(c=>[c.name||"", c.phone||""]);
    const csv = "\uFEFF" + [head.map(esc).join(","), ...rows.map(r=>r.map(esc).join(","))].join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="الزبائن.csv"; a.click();
    toast("تم التصدير");
  };

  const filtered = (search ? clients.filter(c=>{const s=search.trim().toLowerCase();return (c.name||"").toLowerCase().includes(s)||(c.phone||"").includes(s);}) : clients).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ar"));

  return (
    <div style={{maxWidth:1100,margin:"0 auto"}}>
      <div style={{fontSize:22,fontWeight:900,color:C.gold,marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
        📇 الزبائن
        <span style={{fontSize:13,fontWeight:600,color:"#64748b"}}>{clients.length} زبون</span>
      </div>

      {/* ═══ إضافة زبائن (قابل للطي) ═══ */}
      <div style={{...styles.panel}}>
        <div style={{...styles.panelHdr,cursor:"pointer"}} onClick={()=>setAddOpen(!addOpen)}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700}}>➕ إضافة زبائن وأدوات القائمة</h3>
          <span style={{fontSize:13,fontWeight:800,color:C.gold}}>{addOpen?"إخفاء ▲":"إظهار ▼"}</span>
        </div>
        <div style={{padding:"14px 18px",display:addOpen?"block":"none"}}>
          {/* تبديل الطريقة */}
          <div style={{marginBottom:14}}>
            <button style={styles.goodsBtn(mode==="manual")} onClick={()=>setMode("manual")}>✍️ إضافة يدوية</button>
            <button style={styles.goodsBtn(mode==="paste")} onClick={()=>setMode("paste")}>📋 لصق قائمة</button>
            <button style={styles.goodsBtn(mode==="file")} onClick={()=>setMode("file")}>📊 رفع CSV / Excel</button>
            <button style={styles.goodsBtn(mode==="contracts")} onClick={()=>setMode("contracts")}>📥 استيراد من العقود</button>
          </div>

          {mode==="manual" && (
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
              <div style={{flex:"1 1 200px"}}>
                <label style={{fontSize:14,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>الاسم</label>
                <input style={styles.input} value={manual.name} onChange={e=>setManual(f=>({...f,name:e.target.value}))}
                  onKeyDown={e=>{if(e.key==="Enter")addManual();}} placeholder="اسم العميل"/>
              </div>
              <div style={{flex:"1 1 160px"}}>
                <label style={{fontSize:14,fontWeight:700,color:C.ink2,display:"block",marginBottom:4}}>الجوال</label>
                <input style={styles.input} value={manual.phone} onChange={e=>setManual(f=>({...f,phone:e.target.value}))}
                  onKeyDown={e=>{if(e.key==="Enter")addManual();}} placeholder="05XXXXXXXX"/>
              </div>
              <button style={styles.btn(C.teal)} onClick={addManual}>💾 إضافة</button>
            </div>
          )}

          {mode==="paste" && (
            <div>
              <div style={{fontSize:13,color:"#64748b",marginBottom:8}}>الصق الأسماء والأرقام من أي مكان (إكسل، ملاحظات، واتساب) — سطر لكل زبون، الاسم والرقم مفصولين بفاصلة أو تاب</div>
              <textarea style={{...styles.input,minHeight:120,fontFamily:"monospace",resize:"vertical"}}
                placeholder={"محمد عبدالله, 0512345678\nسعد الحربي, 0523456789"}
                value={pasteText} onChange={e=>setPasteText(e.target.value)}/>
              <button style={{...styles.btn(C.teal),marginTop:10}} onClick={previewFromPaste}>🔍 معاينة</button>
            </div>
          )}

          {mode==="file" && (
            <div>
              <input ref={fileRef} type="file" multiple style={{display:"none"}} onChange={onFilePicked}/>
              <button onClick={()=>fileRef.current && fileRef.current.click()}
                style={{padding:"12px 24px",borderRadius:12,border:"2px solid "+C.gold,background:C.goldLt,color:C.gold,fontSize:16,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
                📊 اختر ملف CSV أو Excel
              </button>
              <div style={{fontSize:12,color:"#64748b",marginTop:8}}>يدعم عدة ملفات مرة وحدة. الملفات تُعاين قبل الحفظ ولا تُحفظ تلقائياً.</div>
            </div>
          )}

          {mode==="contracts" && (
            <div>
              <div style={{fontSize:13,color:"#64748b",marginBottom:10}}>
                يسحب أسماء وجوالات كل عملاء العقود دفعة واحدة. لا يحذف ولا يدمج أي سجل — والأسماء المتشابهة تُرقَّم تلقائياً (عبدالله 1، عبدالله 2).
              </div>
              {(()=>{ 
                const src=(contracts||[]).filter(c=>c && !c.deleted);
                const exact=new Set(clients.map(c=>_baseName(c.name)+"|"+normPhone(c.phone)));
                const fresh=new Set();
                src.forEach(c=>{
                  const k=_baseName(c.client)+"|"+normPhone(c.cPhone);
                  if(k!=="|" && !exact.has(k)) fresh.add(k);
                });
                return (
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:12}}>
                    <div style={{background:"#f8fafc",borderRadius:10,padding:"10px 16px",border:"1px solid "+C.border}}>
                      <div style={{fontSize:11,color:"#64748b"}}>عقود في البرنامج</div>
                      <div style={{fontSize:18,fontWeight:900,color:C.ink}}>{src.length}</div>
                    </div>
                    <div style={{background:"#fffbf0",borderRadius:10,padding:"10px 16px",border:"1px solid "+C.gold}}>
                      <div style={{fontSize:11,color:"#92600a"}}>سيُضاف</div>
                      <div style={{fontSize:18,fontWeight:900,color:C.gold}}>{fresh.size}</div>
                    </div>
                  </div>
                );
              })()}
              <button style={styles.btn(C.teal)} onClick={importFromContracts}>📥 استيراد عملاء العقود</button>
            </div>
          )}

          {/* ═══ أدوات القائمة — داخل نفس اللوحة المخفية ═══ */}
          {clients.length>0 && (
            <div style={{marginTop:16,paddingTop:14,borderTop:"1px solid "+C.border}}>
              <div style={{fontSize:13,fontWeight:800,color:C.ink2,marginBottom:10}}>أدوات القائمة</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                <input style={{...styles.input,maxWidth:280}} placeholder="🔍 بحث بالاسم أو الجوال" value={search} onChange={e=>setSearch(e.target.value)}/>
                <button style={styles.btn("#fff",C.ink2)} onClick={()=>setShowMsg(!showMsg)}>✏️ تعديل رسالة واتساب</button>
                <button style={styles.btn("#fff",C.ink2)} onClick={exportCSV}>📥 تصدير CSV</button>
                <button style={{...styles.btn(C.redLt,C.red)}} onClick={clearAll}>🗑 حذف الكل</button>
              </div>
              {showMsg && (
                <div style={{marginTop:12}}>
                  <div style={{fontSize:14,fontWeight:700,color:C.ink,marginBottom:8}}>نص رسالة واتساب</div>
                  <textarea style={{...styles.input,minHeight:100}} value={msg} onChange={e=>setMsg(e.target.value)}/>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ═══ معاينة قبل الحفظ ═══ */}
      {previewRows.length>0 && (
        <div style={{...styles.panel, border:"2px solid "+C.gold}}>
          <div style={styles.panelHdr}>
            <h3 style={{margin:0,fontSize:15,fontWeight:700}}>🔍 معاينة — {previewRows.filter(r=>r.include).length} من {previewRows.length} محدد</h3>
            <div style={{display:"flex",gap:8}}>
              <button style={{...styles.btn("#e5e7eb",C.ink),fontSize:13,padding:"5px 10px"}} onClick={()=>toggleAllRows(true)}>تحديد الكل</button>
              <button style={{...styles.btn("#e5e7eb",C.ink),fontSize:13,padding:"5px 10px"}} onClick={()=>toggleAllRows(false)}>إلغاء الكل</button>
            </div>
          </div>
          <div style={{padding:"10px 18px",maxHeight:320,overflowY:"auto"}}>
            {previewRows.map(r=>(
              <label key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid "+C.border,cursor:"pointer",opacity:r.include?1:0.4}}>
                <input type="checkbox" checked={r.include} onChange={()=>toggleRow(r.id)}/>
                <span style={{flex:1,fontWeight:700,color:C.ink}}>{r.name || "— بدون اسم —"}</span>
                <span style={{fontFamily:"monospace",color:r.phone?C.ink2:"#c0392b"}}>{r.phone || "— بدون رقم —"}</span>
              </label>
            ))}
          </div>
          <div style={{padding:"12px 18px",borderTop:"1px solid "+C.border,display:"flex",gap:8}}>
            <button style={styles.btn(C.green)} onClick={confirmImport}>✅ حفظ المحدد ({previewRows.filter(r=>r.include).length})</button>
            <button style={styles.btn("#e5e7eb",C.ink)} onClick={cancelPreview}>إلغاء</button>
          </div>
        </div>
      )}

      {clients.length>0 && <>
        {/* ═══ القائمة ═══ */}
        <div style={styles.panel}>
          {filtered.length===0 ? (
            <div style={{padding:40,textAlign:"center",color:"#64748b"}}>لا توجد نتائج مطابقة</div>
          ) : filtered.map(c=>(
            <div key={c.id} style={{padding:"12px 18px",borderBottom:"1px solid "+C.border,display:"flex",alignItems:"center",gap:12}}>
              {editId===c.id ? (
                <>
                  <input style={{...styles.input,flex:1}} value={editForm.name} onChange={e=>setEditForm(f=>({...f,name:e.target.value}))}/>
                  <input style={{...styles.input,flex:1}} value={editForm.phone} onChange={e=>setEditForm(f=>({...f,phone:e.target.value}))}/>
                  <button style={styles.btn(C.teal)} onClick={saveEdit}>💾</button>
                  <button style={styles.btn("#e5e7eb",C.ink)} onClick={()=>setEditId(null)}>✕</button>
                </>
              ) : (
                <>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:800,fontSize:16,color:C.ink}}>{c.name || "— بدون اسم —"}</div>
                    <div style={{fontFamily:"monospace",fontSize:14,color:"#64748b"}}>{c.phone || "— بدون رقم —"}</div>
                  </div>
                  {c.phone && <button style={{...styles.btn("#25D366"),fontSize:13,padding:"6px 12px"}} onClick={()=>sendWA(c.phone)}>💬 واتساب</button>}

                </>
              )}
            </div>
          ))}
        </div>
      </>}

      {clients.length===0 && previewRows.length===0 && (
        <div style={{...styles.panel,padding:40,textAlign:"center",color:"#64748b"}}>لا يوجد زبائن بعد — أضف يدوياً أو الصق قائمة أو ارفع ملف من الأعلى</div>
      )}
    </div>
  );
}
