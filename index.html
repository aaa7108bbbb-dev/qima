  // كاش الصندوق
  const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
  const baseAmount = base ? (+base.amount||0) : 0;
  const baseDate = base ? base.date : "0000-00-00";
  const cashBox = baseAmount + _daily.filter(d=>d.date>=baseDate).reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
  // بنك (نفس منطق الجرد: أولاً كشف الراجحي، ثانياً القيمة اليدوية)
  const bt = _arr(bankTx);
  const cashBank = (()=>{
    if(bt.length>0) return bt[bt.length-1].balance||0;
    // fallback: القيمة اليدوية من الجرد
    try{
      const ov=JSON.parse(localStorage.getItem("qimma_jard_ov")||"{}");
      const ym=fiscalYM(new Date());
      if(ov[ym+"_accounts"]!==undefined) return +ov[ym+"_accounts"]||0;
    }catch{}
    return 0;
  })();
  // بضاعة
  const goodsData2 = (()=>{try{return JSON.parse(localStorage.getItem("qimma_goods3")||"[]");}catch{return[];}})();
  const priceOv2 = (()=>{try{return JSON.parse(localStorage.getItem("qimma_price_ov")||"{}");}catch{return{};}})();
  const defPrice3 = (()=>{try{return parseFloat(localStorage.getItem("qimma_default_price"))||0;}catch{return 0;}})();
  const goodsVal = (()=>{
    const cRows=contracts.filter(c=>!c.deleted&&(!c.isOldContract||c.contractType==='migrated')).map(c=>{
      const isCard=(c.goods||"").trim().startsWith("بطاقة");
      if(isCard) return{id:"c_"+c.id,date:c.date,supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,supportAcc:0,withdrawnQty:parseInt(c.qty)||0,price:0,cashOnly:false};
      return{id:"c_"+c.id,date:c.date,supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,supportAcc:-(parseFloat(c.amount)||0),withdrawnQty:0,price:0,cashOnly:true};
    });
    const allR=[...cRows,...goodsData2].sort((a,b)=>new Date(a.date)-new Date(b.date));
    let runCards=0,lastP=0,runGC=0;
    allR.forEach(r=>{if(r.cashOnly){runGC+=parseFloat(r.supportAcc)||0;return;}const rp=parseFloat(priceOv2[r.id]||r.price)||defPrice3||lastP||1;if(rp)lastP=rp;const sC=parseFloat(r.supportClient)||0;const sA=parseFloat(r.supportAcc)||0;const sup=sC||sA?Math.floor((sC+sA)/rp):0;runCards=runCards+sup-(parseInt(r.withdrawnQty)||0);});
    return runCards*lastP+runGC;
  })();

  // ذمم العملاء (متبقي = رأس مال + ربح)
  const remaining = allC.reduce((s,c)=>{
    const total=+c.totalInst||+c.amount||0;
    const paid=allPayments.filter(p=>p.contractId===c.id).reduce((ss,p)=>ss+(+p.amount||0),0);
    return s+Math.max(0,total-paid);
  },0);
  // تقسيم الذمم: رأس مال فعلي + ربح
  const remainingCapital = allC.reduce((s,c)=>{
    const total=+c.totalInst||+c.amount||0;
    const paid=allPayments.filter(p=>p.contractId===c.id).reduce((ss,p)=>ss+(+p.amount||0),0);
    const rem=Math.max(0,total-paid);
    if(rem<=0) return s;
    const cap=+c.amount||0;
    const prof=total-cap;
    const paidRatio=paid/Math.max(total,1);
    // الأقساط تسدد رأس المال والربح بنفس النسبة
    return s+(cap*(1-paidRatio));
  },0);
  const remainingProfit = remaining - remainingCapital;
  // سلف
  const loansVal = (loans||[]).reduce((s,l)=>{const paid=(l.payments||[]).reduce((ss,p)=>ss+p.amount,0);return s+Math.max(0,(l.amount||0)-paid);},0);
  // إجمالي الأصول
  const totalAssets = cashBox + cashBank + goodsVal + remaining + loansVal;
  // الفلوس الشغّالة = ذمم + بضاعة
  const workingMoney = remaining + goodsVal;
  const workingPct = totalAssets>0 ? Math.round(workingMoney/totalAssets*100) : 0;
  // النايم = كاش + بنك - التزامات تشغيلية (مبسّط)
  const idleCash = Math.max(0, cashBox + cashBank);

  // ═══ بطاقة ١: وين فلوسي الحين؟ ═══
  const Card1 = () => {
    const items = [
      {name:"ذمم عملاء (رأس مال)", val:remainingCapital, color:"#14b8a6"},
      {name:"ذمم عملاء (ربح)", val:remainingProfit, color:"#0d9488"},
      {name:"بضاعة", val:goodsVal, color:"#f59e0b"},
      {name:"رصيد البنك", val:cashBank, color:"#3b82f6"},
      {name:"كاش الصندوق", val:cashBox, color:"#60a5fa"},
      {name:"سلف", val:loansVal, color:"#8b5cf6"},
    ].filter(i=>i.val>0);
    const total = items.reduce((s,i)=>s+i.val,0);
    // حساب الدونات SVG
    const r=48, circ=2*Math.PI*r;
    let offset=0;
    const arcs = items.map(it=>{
      const pct=it.val/Math.max(total,1);
      const dash=pct*circ;
      const o=offset;
      offset+=dash;
      return{...it, pct:Math.round(pct*100), dash, offset:o};
    });
    const insightColor = workingPct>=70?"#2dd4bf":workingPct>=50?"#fbbf24":"#f87171";
    const insightText = workingPct>=70?"ممتاز، فلوسك شغّالة!":workingPct>=50?"مقبول، فيه مجال تشغّل أكثر":"ضعيف، كاش كثير نايم!";
    return (<div>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14}}>
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="16"/>
          {arcs.map((a,i)=><circle key={i} cx="60" cy="60" r={r} fill="none" stroke={a.color} strokeWidth="16"
            strokeDasharray={a.dash+" "+(circ-a.dash)} strokeDashoffset={-a.offset}
            transform="rotate(-90 60 60)" style={{transition:"all 0.5s"}}/>)}
          <text x="60" y="56" textAnchor="middle" style={{fontSize:16,fontWeight:900,fill:"#fff"}}>{SAR(total/1000)}K</text>
          <text x="60" y="72" textAnchor="middle" style={{fontSize:10,fill:"#64748b"}}>إجمالي</text>
        </svg>
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:6}}>
          {arcs.map((a,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}>
            <div style={{width:10,height:10,borderRadius:3,background:a.color,flexShrink:0}}/>
            <span style={{color:"#94a3b8",fontWeight:500}}>{a.name}</span>
            <span style={{marginRight:"auto",fontWeight:800,color:"#e2e8f0",fontSize:13}}>{SAR(a.val)}</span>
            <span style={{fontSize:11,color:"#64748b",fontWeight:700,minWidth:28,textAlign:"left"}}>{a.pct}%</span>
          </div>)}
        </div>
      </div>
      <div style={{background:"rgba(20,184,166,0.08)",border:"1px solid rgba(20,184,166,0.15)",borderRadius:12,padding:"10px 14px",fontSize:12,color:insightColor,fontWeight:600,display:"flex",alignItems:"center",gap:8}}>
        <span>💡</span><span>نسبة الفلوس الشغّالة: <b style={{color:insightColor}}>{workingPct}%</b> — {insightText}</span>
      </div>
    </div>);
  };

  // ═══ بطاقة ٢: كم بيدخل عليّ؟ ═══
  const Card2 = () => {
    const today = new Date();
    const curY = today.getFullYear(), curM = today.getMonth();
    // حساب الأقساط المتوقعة لكل شهر (6 شهور)
    const months = [];
    for(let i=0;i<6;i++){
      const m = new Date(curY, curM+i, 1);
      const label = "شهر "+(m.getMonth()+1);
      // كل عقد نشط: قسطه الشهري يُتوقع كل شهر ما دام فيه متبقي
      let expected = 0;
      allC.forEach(c=>{
        const inst = +c.installment||0;
        if(inst<=0) return;
        const total = +c.totalInst||+c.amount||0;
        const paid = allPayments.filter(p=>p.contractId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
        const rem = total - paid;
        if(rem<=0) return;
        // كم شهر يكفي المتبقي
        const monthsLeft = Math.ceil(rem/inst);
        if(i < monthsLeft) expected += Math.min(inst, rem - (inst*i));
      });
      months.push({label, expected:Math.max(0,expected), isCurrent:i===0});
    }
    const maxVal = Math.max(...months.map(m=>m.expected),1);
    const totalExpected = months.reduce((s,m)=>s+m.expected,0);
    return (<div>
      <div style={{display:"flex",gap:4,marginBottom:14,alignItems:"flex-end",height:130}}>
        {months.map((m,i)=>{
          const h = Math.max(8, (m.expected/maxVal)*110);
          return (<div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,justifyContent:"flex-end",height:"100%"}}>
            <div style={{fontSize:10,fontWeight:800,color:m.isCurrent?"#86efac":"#5eead4"}}>{SAR(m.expected/1000)}K</div>
            <div style={{width:"100%",background:"rgba(255,255,255,0.03)",borderRadius:10,display:"flex",alignItems:"flex-end",padding:3,height:115}}>
              <div style={{width:"100%",height:h,borderRadius:"8px 8px 4px 4px",background:m.isCurrent?"linear-gradient(180deg,#22c55e,#16a34a)":"linear-gradient(180deg,#14b8a6,#0d9488)",transition:"height 0.3s"}}/>
            </div>
            <div style={{fontSize:11,color:m.isCurrent?"#22c55e":"#64748b",fontWeight:700,position:"relative"}}>
              {m.label}
              {m.isCurrent && <div style={{position:"absolute",bottom:-5,left:"50%",transform:"translateX(-50%)",width:4,height:4,background:"#22c55e",borderRadius:"50%"}}/>}
            </div>
          </div>);
        })}
      </div>
      <div style={{background:"rgba(34,197,94,0.08)",border:"1px solid rgba(34,197,94,0.15)",borderRadius:12,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:12,color:"#86efac",fontWeight:600}}>📥 إجمالي المتوقع — 6 شهور</span>
        <span style={{fontSize:17,fontWeight:900,color:"#22c55e"}}>{SAR(totalExpected)} ﷼</span>
      </div>
      <div style={{marginTop:8,fontSize:11,color:"#475569",textAlign:"center"}}>* تقديري بناءً على الأقساط الشهرية للعقود النشطة</div>
    </div>);
  };

  // ═══ بطاقة ٣: مين ما دفع؟ ═══
  const Card3 = () => {
    const today = new Date();
    // لكل عقد نشط: كم المفروض دفع حتى اليوم vs كم دفع فعلاً
    const overdueList = [];
    allC.forEach(c=>{
      const inst = +c.installment||0;
      const total = +c.totalInst||+c.amount||0;
      const paid = allPayments.filter(p=>p.contractId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
      const rem = total - paid;
      if(rem<=0 || inst<=0) return;

      let expectedPaid = 0;
      if(c.contractType==='migrated'){
        // مرحّل: نحسب من تاريخ الترحيل (أو بداية النظام)
        const migDate = c.migratedDate || c.date || c.createdAt;
        if(migDate){
          const start = new Date(migDate);
          const diffMs = today - start;
          const monthsElapsed = Math.max(0, Math.floor(diffMs/(30.44*24*60*60*1000)));
          expectedPaid = Math.min(total, inst * monthsElapsed);
        }
      } else {
        // عقد عادي: من تاريخ أول قسط
        const startDate = c.firstInstDate || c.date;
        if(startDate){
          const start = new Date(startDate);
          const diffMs = today - start;
          const monthsElapsed = Math.max(0, Math.floor(diffMs/(30.44*24*60*60*1000)));
          expectedPaid = Math.min(total, inst * monthsElapsed);
        }
      }
      const overdue = expectedPaid - paid;
      if(overdue > 0){
        const monthsLate = Math.max(1, Math.round(overdue/inst));
        const inv = (investors||[]).find(x=>x.id===c.investorId);
        overdueList.push({
          name: c.name||"—",
          overdue,
          monthsLate,
          investor: inv ? invLabel(inv) : "—",
          contractId: c.id
        });
      }
    });
    overdueList.sort((a,b)=>b.overdue-a.overdue);
    const totalOverdue = overdueList.reduce((s,o)=>s+o.overdue,0);
    const clientCount = overdueList.length;
    const top3 = overdueList.slice(0,3);
    const restCount = Math.max(0, clientCount-3);
    const restAmount = overdueList.slice(3).reduce((s,o)=>s+o.overdue,0);
    const initials = name => {
      const parts = (name||"").split(/\s+/).filter(Boolean);
      if(parts.length>=2) return parts[0][0]+"."+parts[1][0];
      return (name||"—").substring(0,2);
    };

    return (<div>
      <div style={{display:"flex",gap:10,marginBottom:14}}>
        <div style={{flex:1,borderRadius:14,padding:"14px 12px",textAlign:"center",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.15)"}}>
          <div style={{fontSize:24,fontWeight:900,color:"#ef4444"}}>{SAR(totalOverdue)}</div>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600,marginTop:2}}>﷼</div>
          <div style={{fontSize:12,fontWeight:700,color:"#fca5a5",marginTop:6}}>إجمالي المتعثّر</div>
        </div>
        <div style={{flex:1,borderRadius:14,padding:"14px 12px",textAlign:"center",background:"rgba(251,191,36,0.1)",border:"1px solid rgba(251,191,36,0.15)"}}>
          <div style={{fontSize:24,fontWeight:900,color:"#fbbf24"}}>{clientCount}</div>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600,marginTop:2}}>عميل</div>
          <div style={{fontSize:12,fontWeight:700,color:"#fde68a",marginTop:6}}>عملاء متأخرين</div>
        </div>
      </div>
      {clientCount===0 ? (
        <div style={{textAlign:"center",padding:20,color:"#22c55e",fontWeight:700,fontSize:14}}>🎉 ما فيه متعثّرين — ممتاز!</div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {top3.map((o,i)=><div key={i} style={{background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.1)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:"rgba(239,68,68,0.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:"#fca5a5",flexShrink:0}}>{initials(o.name)}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.name}</div>
              <div style={{fontSize:11,color:"#64748b",fontWeight:500,marginTop:2}}>{o.monthsLate} قسط متأخر · {o.investor}</div>
            </div>
            <div style={{fontSize:15,fontWeight:900,color:"#ef4444",whiteSpace:"nowrap"}}>{SAR(o.overdue)}</div>
          </div>)}
          {restCount>0 && <div style={{background:"rgba(239,68,68,0.03)",border:"1px dashed rgba(239,68,68,0.1)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,opacity:0.6}}>
            <div style={{width:36,height:36,borderRadius:10,background:"rgba(239,68,68,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,color:"#fca5a5",flexShrink:0}}>+{restCount}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:"#64748b"}}>{restCount} عملاء آخرين</div>
            </div>
            <div style={{fontSize:14,fontWeight:900,color:"#94a3b8"}}>{SAR(restAmount)}</div>
          </div>}
        </div>
      )}
      {clientCount>0 && <div style={{marginTop:8,fontSize:11,color:"#475569",textAlign:"center"}}>* تقديري بمقارنة المدفوع بالمتوقع حسب عدد الأشهر</div>}
    </div>);
  };

  // ═══ بطاقة ٤: كم أنمّي فلوسي؟ ═══
  const Card4 = () => {
    const [simAmount, setSimAmount] = useState(idleCash>0?idleCash:50000);
    const [simMonths, setSimMonths] = useState(20);
    // محاكاة التدوير: رأس المال يُقسّط ثم يعاد تدويره
    const profR = profitRate/100;
    const cycleProfit = simAmount * profR;
    const cycleTotal = simAmount + cycleProfit;
    // الدورة الثانية: نفس رأس المال يُعاد تدويره بعد انتهاء المدة
    // تقريب: خلال سنة (12 شهر) مع 20 شهر تقسيط = تدوير جزئي
    const monthlyReturn = cycleTotal / simMonths;
    // بعد 12 شهر: كم رجع من الدورة الأولى
    const returned12 = Math.min(cycleTotal, monthlyReturn * 12);
    const profit12 = returned12 - (simAmount * (12/simMonths));
    // لو أعاد تدوير المرتجع
    const cycle2Capital = returned12 * 0.6; // تقريب: 60% يقدر يعيد تدويره
    const cycle2Profit = cycle2Capital * profR;
    const totalGrowth = profit12 + cycle2Profit;
    const growthPct = simAmount>0 ? Math.round(totalGrowth/simAmount*100) : 0;

    return (<div>
      <div style={{display:"flex",gap:10,marginBottom:16}}>
        <div style={{flex:1,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"10px 14px",textAlign:"center"}}>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600,marginBottom:4}}>المبلغ</div>
          <input type="number" value={simAmount} onChange={e=>setSimAmount(+e.target.value||0)}
            style={{width:"100%",background:"transparent",border:"none",textAlign:"center",fontSize:18,fontWeight:900,color:"#c4b5fd",outline:"none",fontFamily:"inherit"}}/>
        </div>
        <div style={{flex:1,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"10px 14px",textAlign:"center"}}>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600,marginBottom:4}}>مدة التقسيط</div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <button onClick={()=>setSimMonths(m=>Math.max(6,m-2))} style={{background:"rgba(139,92,246,0.2)",border:"none",borderRadius:8,width:28,height:28,color:"#c4b5fd",fontWeight:900,fontSize:16,cursor:"pointer"}}>−</button>
            <span style={{fontSize:18,fontWeight:900,color:"#c4b5fd"}}>{simMonths}</span>
            <button onClick={()=>setSimMonths(m=>Math.min(36,m+2))} style={{background:"rgba(139,92,246,0.2)",border:"none",borderRadius:8,width:28,height:28,color:"#c4b5fd",fontWeight:900,fontSize:16,cursor:"pointer"}}>+</button>
          </div>
          <div style={{fontSize:10,color:"#64748b",marginTop:2}}>شهر</div>
        </div>
      </div>

      {/* مسار النمو */}
      <div style={{position:"relative",padding:"8px 0 0",marginBottom:14}}>
        <div style={{position:"absolute",right:18,top:0,bottom:0,width:2,background:"linear-gradient(180deg,#8b5cf6,#6d28d9,#22c55e)",borderRadius:2}}/>

        <div style={{position:"relative",padding:"0 40px 18px 0"}}>
          <div style={{position:"absolute",right:12,top:4,width:14,height:14,borderRadius:"50%",background:"#8b5cf6",border:"3px solid "+C.bg}}/>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600}}>الدورة الأولى ({simMonths} شهر)</div>
          <div style={{fontSize:15,fontWeight:900,color:"#e2e8f0"}}>{SAR(simAmount)} → {SAR(cycleTotal)}</div>
          <div style={{fontSize:11,fontWeight:700,color:"#a78bfa"}}>+ {SAR(cycleProfit)} ربح ({profitRate}%)</div>
        </div>

        <div style={{position:"relative",padding:"0 40px 18px 0"}}>
          <div style={{position:"absolute",right:12,top:4,width:14,height:14,borderRadius:"50%",background:"#7c3aed",border:"3px solid "+C.bg}}/>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600}}>بعد 12 شهر (مرتجع جزئي)</div>
          <div style={{fontSize:15,fontWeight:900,color:"#e2e8f0"}}>رجع لك: {SAR(returned12)}</div>
          <div style={{fontSize:11,fontWeight:700,color:"#a78bfa"}}>+ إعادة تدوير {SAR(cycle2Capital)}</div>
        </div>

        <div style={{position:"relative",padding:"0 40px 4px 0"}}>
          <div style={{position:"absolute",right:12,top:4,width:14,height:14,borderRadius:"50%",background:"#22c55e",border:"3px solid "+C.bg,boxShadow:"0 0 12px rgba(34,197,94,0.4)"}}/>
          <div style={{fontSize:11,color:"#64748b",fontWeight:600}}>إجمالي المكسب بعد سنة</div>
          <div style={{fontSize:16,fontWeight:900,color:"#22c55e"}}>+ {SAR(totalGrowth)} ﷼</div>
          <div style={{fontSize:11,fontWeight:700,color:"#4ade80"}}>↑ {growthPct}% نمو على رأس المال</div>
        </div>
      </div>

      <div style={{background:"linear-gradient(135deg,rgba(139,92,246,0.12),rgba(34,197,94,0.08))",border:"1px solid rgba(139,92,246,0.2)",borderRadius:14,padding:14,textAlign:"center"}}>
        <div style={{fontSize:12,color:"#a78bfa",fontWeight:600,marginBottom:4}}>🔥 لو شغّلت {SAR(simAmount)} ﷼ سنة كاملة</div>
        <div style={{fontSize:26,fontWeight:900,color:"#22c55e"}}>+ {SAR(totalGrowth)} ﷼</div>
        <div style={{fontSize:12,color:"#86efac",fontWeight:700,marginTop:2}}>نمو {growthPct}% — لا تخلّي فلوسك تنام!</div>
      </div>
    </div>);
  };

  // ═══ الأيقونات والألوان لكل بطاقة ═══
  const cards = [
    {id:"money",  icon:"💰", q:"وين فلوسي الحين؟",  color:"#14b8a6", component:<Card1/>},
    {id:"income", icon:"📅", q:"كم بيدخل عليّ؟",    color:"#22c55e", component:<Card2/>},
    {id:"overdue",icon:"🚨", q:"مين ما دفع؟",       color:"#ef4444", component:<Card3/>},
    {id:"growth", icon:"🚀", q:"كم أنمّي فلوسي؟",   color:"#8b5cf6", component:<Card4/>},
  ];

  return (
    <div style={{padding:16,maxWidth:1200,margin:"0 auto"}}>
      <div style={{fontSize:22,fontWeight:900,textAlign:"center",marginBottom:2,color:C.ink}}>🧭 البوصلة المالية</div>
      <div style={{fontSize:13,color:"#64748b",textAlign:"center",marginBottom:20}}>أربع أسئلة — أجوبة بأرقامك الفعلية</div>

      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        {cards.map((card,idx)=>(
          <div key={card.id} style={{background:"linear-gradient(145deg,#1a2744 0%,#162035 100%)",borderRadius:20,padding:20,border:"1px solid rgba(255,255,255,0.06)",boxShadow:"0 8px 32px rgba(0,0,0,0.3)",position:"relative",overflow:"hidden"}}>
            {/* خلفية مائية */}
            <div style={{position:"absolute",top:0,right:0,width:120,height:120,borderRadius:"0 0 0 100%",background:card.color,opacity:0.04}}/>
            {/* الرأس */}
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <div style={{width:42,height:42,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,background:card.color+"22"}}>{card.icon}</div>
              <div style={{fontSize:17,fontWeight:900,color:"#fff"}}>{card.q}</div>
              <div style={{fontSize:13,color:"#475569",fontWeight:800,marginRight:"auto",background:"#1e293b",padding:"2px 10px",borderRadius:20}}>{idx+1}</div>
            </div>
            {/* المحتوى */}
            {card.component}
          </div>
        ))}
      </div>
    </div>
  );
}

function ActivityPage({activity, setActivity, toast, setPage}){
  const [filter,setFilter] = React.useState("all");

  const actColor = a => {
    if(a.action.indexOf("حذف")>=0) return C.red;
    if(a.action==="إضافة"||a.action==="سداد") return C.green;
    if(a.action==="تعديل") return C.gold;
    if(a.action==="استرجاع") return C.teal;
    return C.ink;
  };
  const filtered = filter==="all" ? list : list.filter(a=>a.entity===filter);
  const entities = ["all","عقد","دفعة","مستثمر"];
  const entLabel = e => e==="all"?"الكل":e==="عقد"?"العقود":e==="دفعة"?"السدادات":"المستثمرون";
  return (
    <div style={styles.main}>
      <div style={styles.panel}>
        <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <h2 style={{margin:0,fontSize:18,fontWeight:900,color:C.ink}}>📜 سجل النشاط</h2>
          <button style={{...styles.btn("#64748b","#fff"),fontSize:14,padding:"7px 14px"}} onClick={()=>setPage&&setPage("settings")}>← رجوع للإعدادات</button>
          {list.length>0 && (
            <button style={{...styles.btn(C.red,"#fff"),fontSize:13,padding:"7px 12px"}} onClick={()=>{
              if(window.confirm("مسح كامل سجل النشاط؟ لا يمكن التراجع.")){ setActivity([]); toast("🗑 تم مسح السجل"); }
            }}>🗑 مسح السجل</button>
          )}
        </div>
        <div style={{padding:"12px 16px",display:"flex",gap:8,flexWrap:"wrap",borderBottom:"1px solid "+C.border}}>
          {entities.map(e=>(
            <button key={e} onClick={()=>setFilter(e)}
              style={{...styles.btn(filter===e?C.ink:"#e5e7eb", filter===e?"#fff":"#374151"),fontSize:13,padding:"6px 14px"}}>
              {entLabel(e)}
            </button>
          ))}
        </div>
        <div style={{padding:16}}>
          {filtered.length===0
            ? <div style={{textAlign:"center",padding:30,color:"#1f2937"}}>لا توجد حركات مسجّلة</div>
            : <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {filtered.map(a=>(
                  <div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",background:"#fafafa",borderRadius:8,borderRight:"4px solid "+actColor(a)}}>
                    <span style={{background:actColor(a),color:"#fff",borderRadius:6,padding:"3px 10px",fontSize:13,fontWeight:800,whiteSpace:"nowrap"}}>{a.action}</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:700,color:C.ink}}>{a.entity}{a.detail?(" — "+a.detail):""}</div>
                      <div style={{fontSize:12,color:"#1f2937",marginTop:2}}>🕐 {a.time}</div>
                    </div>
                  </div>
                ))}
              </div>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page,setPage]=useState("dashboard");
  const [tabOrder,setTabOrder]=useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_tab_order")||"null");}catch{return null;}});
  const [dragTab,setDragTab]=useState(null);
  const [toastMsg,setToastMsg]=useState(null);
  const [toastType,setToastType]=useState("");

  // ═══ Google Sheets backend ═══
  const GS_URL = "https://script.google.com/macros/s/AKfycbyAH-4t0dkfSpJ3Q-0M_j8tXRrZk1bOSilSaMm-8wDA8vrIBEF-K1RNDdGIRD4oWiUAyA/exec";
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | saving | saved | error | loading

  // ═══ القراءة: من Firebase أولاً، ثم Google Sheets احتياطاً ═══
  const gsRead = async (sheet) => {
    // جرّب Firebase أولاً
    if (window._fbReady && window._fbDB) {
      try {
        const doc = await window._fbDB.collection("qima").doc(sheet).get();
        if (doc.exists) {
          const d = doc.data();
          if (d && d.payload !== undefined) {
            const parsed = typeof d.payload === "string" ? JSON.parse(d.payload) : d.payload;
            return Array.isArray(parsed) ? parsed : (parsed && typeof parsed==="object" ? parsed : null);
          }
        }
      } catch (e) { /* fallback لـ Sheets */ }
    }
    // احتياط: Google Sheets
    try {
      const res = await fetch(`${GS_URL}?action=read&sheet=${sheet}&_=${Date.now()}`, {cache:"no-store"});
      const json = await res.json();
      return Array.isArray(json.data) ? json.data : (json.data||null);
    } catch (e) { return null; }
  };

  // ═══ الكتابة: إلى Firebase (أساسي) + Google Sheets (احتياط) ═══
  const gsWrite = async (sheet, data, _retry) => {
    setSyncStatus("saving");
    let ok = false;
    // Firebase أولاً
    if (window._fbReady && window._fbDB) {
      try {
        await window._fbDB.collection("qima").doc(sheet).set({ payload: JSON.stringify(data), updatedAt: new Date().toISOString() });
        ok = true;
      } catch (e) { /* fallback */ }
    }
    // احتياط: Google Sheets (يبقى نسخة ثانية)
    try {
      const params = new URLSearchParams();
      params.append("action", "write");
      params.append("sheet", sheet);
      params.append("data", JSON.stringify(data));
      const res = await fetch(GS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: params.toString()
      });
      const json = await res.json();
      if (json.success) ok = true;
    } catch (e) { /* ما يهم لو Firebase نجح */ }

    if (ok) {
      setSyncStatus("saved");
      setTimeout(()=>setSyncStatus(s=>s==="saved"?"idle":s), 2000);
    } else {
      if (!_retry) { await new Promise(r=>setTimeout(r,1200)); return gsWrite(sheet, data, true); }
      setSyncStatus("error");
    }
  };

  // Load from localStorage with fallback (instant UI), then sync from Sheets in background
  const loadLS = (key, def) => {
    try { const v=localStorage.getItem(key); return v?JSON.parse(v):def; } catch{return def;}
  };
  const saveLS = (key, val) => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch{}
  };

  // ═══ النسخة الاحتياطية ═══
  // ربط مفاتيح التخزين بأوراق السحابة
  const BACKUP_MAP = {
    "qimma_investors":"investors", "qimma_contracts":"contracts", "qimma_settings":"settings",
    "qimma_txlist":"txlist", "qimma_loans":"loans", "qimma_zakat":"zakat",
    "qimma_pending":"pending", "qimma_payments":"payments", "qimma_goods3":"goods3",
    "qimma_jard_ov":"jard_ov", "qimma_daily":"daily", "qimma_daily_open":"daily_open",
    "qimma_activity":"activity", "qimma_monthclose":"monthclose", "qimma_price_ov":"price_ov", "qimma_banktx":"banktx",
    "qimma_pvt_loans":"pvt_loans"
  };
  const exportBackup = () => {
    try {
      const out = {};
      Object.keys(localStorage).forEach(k=>{ if(k.indexOf("qimma_")===0){ try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch{ out[k]=localStorage.getItem(k); } } });
      const blob = new Blob([JSON.stringify({_backup:"qima", _date:new Date().toISOString(), data:out},null,2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const d=new Date();
      a.href = url;
      a.download = `qima-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("✅ تم تنزيل النسخة الاحتياطية");
    } catch(e){ toast("⚠️ تعذّر التصدير","error"); }
  };
  const importBackup = async (file) => {
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const data = parsed && parsed.data ? parsed.data : parsed;
      if(!data || typeof data!=="object"){ toast("⚠️ ملف غير صالح","error"); return; }
      // اكتب في الجهاز
      Object.keys(data).forEach(k=>{ if(k.indexOf("qimma_")===0){ try{ localStorage.setItem(k, JSON.stringify(data[k])); }catch{} } });
      // ادفع للسحابة (المفاتيح المعروفة فقط)
      const jobs = [];
      Object.keys(BACKUP_MAP).forEach(k=>{ if(data[k]!=null){ jobs.push(gsWrite(BACKUP_MAP[k], data[k])); } });
      await Promise.all(jobs);
      toast("✅ تم استرجاع النسخة... جارٍ التحديث");
      setTimeout(()=>window.location.reload(), 1200);
    } catch(e){ toast("⚠️ تعذّر الاستيراد - تأكد من الملف","error"); }
  };

  // ─── نسخ احتياطي تلقائي صامت (عبر Google Apps Script) ──────────
  const [autoBackupStatus, setAutoBackupStatus] = useState("");
  React.useEffect(()=>{
    const runAutoBackup = async () => {
      try {
        const sRaw = localStorage.getItem("qimma_settings");
        const s = sRaw ? JSON.parse(sRaw) : {};
        if(!s.autoBackup || !s.backupEmail || !s.backupScriptUrl) return;
        const last = localStorage.getItem("qimma_last_auto_backup");
        const now = Date.now();
        const hrs = parseFloat(s.autoBackupHours)||24;
        if(last && (now - parseInt(last)) < hrs*3600000) return;

        // جمّع البيانات
        const out = {};
        Object.keys(localStorage).forEach(k=>{ if(k.indexOf("qimma_")===0){ try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch{ out[k]=localStorage.getItem(k); } } });
        const backupData = {_backup:"qima", _date:new Date().toISOString(), data:out};

        setAutoBackupStatus("sending");
        const resp = await fetch(s.backupScriptUrl, {
          method:"POST",
          headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({email:s.backupEmail, backup:backupData})
        });
        const result = await resp.json();
        if(result.success){
          localStorage.setItem("qimma_last_auto_backup", String(Date.now()));
          setAutoBackupStatus("success");
          setTimeout(()=>setAutoBackupStatus(""),4000);
        } else {
          setAutoBackupStatus("error");
          setTimeout(()=>setAutoBackupStatus(""),5000);
        }
      } catch(e){
        setAutoBackupStatus("error");
        setTimeout(()=>setAutoBackupStatus(""),5000);
      }
    };
    setTimeout(runAutoBackup, 3000);
  },[]);

  const [investors,setInvestorsRaw]=useState(()=>{
    // تنظيف لمرة واحدة: مسح أسماء المستثمرين القديمة المخزنة محلياً لإجبار القراءة الطازجة
    if(!localStorage.getItem("qimma_inv_names_fixed")){
      localStorage.setItem("qimma_inv_names_fixed","1");
      localStorage.removeItem("qimma_investors");
      return DEFAULT_INVESTORS;
    }
    const d=loadLS("qimma_investors",DEFAULT_INVESTORS);return d&&d.length?d:DEFAULT_INVESTORS;});
  const [contracts,setContractsRaw]=useState(()=>_arr(loadLS("qimma_contracts",[])));
  const [settings,setSettingsRaw]=useState(()=>loadLS("qimma_settings",{profit:50,admin:2.5,acc:10,inst:10}));

  const setInvestors = v => {
    const d=typeof v==="function"?v(investors):v;
    const before=_arr(investors);
    setInvestorsRaw(d); saveLS("qimma_investors",d); gsWrite("investors",d);
    try {
      if(d.length>before.length){const a=d.find(x=>!before.some(y=>y.id===x.id));if(a)logAct("إضافة","مستثمر",(a.name||""));}
      else if(d.length<before.length){const r=before.find(x=>!d.some(y=>y.id===x.id));if(r)logAct("حذف","مستثمر",(r.name||""));}
      else {const ch=d.find(x=>{const o=before.find(y=>y.id===x.id);return o&&(o.name!==x.name||o.capital!==x.capital||o.fund!==x.fund);});if(ch)logAct("تعديل","مستثمر",(ch.name||""));}
    } catch(e){}
  };
  const setContracts = v => { const d=typeof v==="function"?v(contracts):v; setContractsRaw(d); saveLS("qimma_contracts",d); gsWrite("contracts",d); };
  const activeContracts = contracts.filter(c=>!c.deleted);
  const setSettings  = v => { const d=typeof v==="function"?v(settings):v;  setSettingsRaw(d);  saveLS("qimma_settings",d); gsWrite("settings",d); };
  const [invTxList,setInvTxListRaw]=useState(()=>loadLS("qimma_txlist",{}));
  const setInvTxList = v => { const d=typeof v==="function"?v(invTxList):v; setInvTxListRaw(d); saveLS("qimma_txlist",d); gsWrite("txlist",d); };
  const [loans,setLoansRaw]=useState(()=>{
    const raw=_arr(loadLS("qimma_loans",[]));
    // تجاهل أي سلف قديمة بقيمة بدون تفاصيل حقيقية (تنظيف لمرة واحدة)
    if(!localStorage.getItem("qimma_loans_cleaned")){
      localStorage.setItem("qimma_loans_cleaned","1");
      localStorage.removeItem("qimma_loans");
      localStorage.removeItem("qimma_jard_ov");
      return [];
    }
    return raw;
  });
  const setLoans = v => { const d=_arr(typeof v==="function"?v(loans):v); setLoansRaw(d); saveLS("qimma_loans",d); gsWrite("loans",d); };
  const [pastClients,setPastClientsRaw]=useState(()=>_arr(loadLS("qimma_past_clients",[])));
  const setPastClients = v => { const d=_arr(typeof v==="function"?v(pastClients):v); setPastClientsRaw(d); saveLS("qimma_past_clients",d); gsWrite("pastClients",d); };
  // ── يضيف عميل العقد الجديد تلقائياً إلى الزبائن ──
  // لا يتخطى إلا السجل المطابق تماماً (نفس الاسم ونفس الجوال). الأسماء المتشابهة تُرقَّم.
  const addPastClientFromContract = (c) => {
    const phone = _normSaPhone(c && c.cPhone);
    const name  = _baseName(c && c.client);
    if(!phone && !name) return;
    const list = _arr(pastClients);
    const dup = list.some(x => _baseName(x.name)===name && _normSaPhone(x.phone)===phone);
    if(dup) return;
    setPastClients(_numberDupNames([...list, {id: Date.now()+Math.random(), name, phone}]));
  };
  const [zakatTx,setZakatTxRaw]=useState(()=>_arr(loadLS("qimma_zakat",[])));
  const setZakatTx = v => { const d=_arr(typeof v==="function"?v(zakatTx):v); setZakatTxRaw(d); saveLS("qimma_zakat",d); gsWrite("zakat",d); };
  const [pending,setPendingRaw]=useState(()=>_arr(loadLS("qimma_pending",[])));
  const setPending = v => { const d=_arr(typeof v==="function"?v(pending):v); setPendingRaw(d); saveLS("qimma_pending",d); gsWrite("pending",d); };
  const [activity,setActivityRaw]=useState(()=>_arr(loadLS("qimma_activity",[])));
  const setActivity = v => { const d=_arr(typeof v==="function"?v(activity):v); setActivityRaw(d); saveLS("qimma_activity",d); gsWrite("activity",d); };
  const [monthClose,setMonthCloseRaw]=useState(()=>{try{return JSON.parse(loadLS("qimma_monthclose","{}"))||{};}catch{return {};}});
  const setMonthClose = v => { const d=(typeof v==="function"?v(monthClose):v)||{}; setMonthCloseRaw(d); saveLS("qimma_monthclose",JSON.stringify(d)); gsWrite("monthclose",d); };
  const [bankTx,setBankTxRaw]=useState(()=>{try{return JSON.parse(loadLS("qimma_banktx","[]"))||[];}catch{return [];}});
  const setBankTx = v => { const d=_arr(typeof v==="function"?v(bankTx):v); setBankTxRaw(d); saveLS("qimma_banktx",JSON.stringify(d)); gsWrite("banktx",d); };
  const [payments,setPaymentsRaw]=useState(()=>_arr(loadLS("qimma_payments",[])));
  const setPayments = v => {
    const d=_arr(typeof v==="function"?v(payments):v);
    const before=_arr(payments);
    setPaymentsRaw(d); saveLS("qimma_payments",d); gsWrite("payments",d);
    // تسجيل تلقائي في سجل النشاط
    try {
      if(d.length>before.length){
        const added=d.find(x=>!before.some(y=>y.id===x.id));
        if(added){const c=contracts.find(k=>k.id===added.contractId);logAct("سداد","دفعة",(SAR(added.amount||0)+(c?(" — "+c.client+" #"+c.num):"")));}
      } else if(d.length<before.length){
        const removed=before.find(x=>!d.some(y=>y.id===x.id));
        if(removed){const c=contracts.find(k=>k.id===removed.contractId);logAct("حذف سداد","دفعة",(SAR(removed.amount||0)+(c?(" — "+c.client+" #"+c.num):"")));}
      }
    } catch(e){}
  };
  // تسجيل حركة في سجل النشاط (يبقى آخر 500 حركة، الأحدث أولاً)
  const logAct = (action, entity, detail) => {
    const now = new Date();
    const stamp = now.getFullYear()+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+String(now.getDate()).padStart(2,"0")+" "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    setActivity(prev => [{id:Date.now()+"_"+Math.floor(Math.random()*1000), action, entity, detail:detail||"", time:stamp}, ..._arr(prev)].slice(0,500));
  };
  const [daily,setDailyRaw]=useState(()=>_arr(loadLS("qimma_daily",[])));
  const setDaily = v => { const d=_arr(typeof v==="function"?v(daily):v); setDailyRaw(d); saveLS("qimma_daily",d); gsWrite("daily",d); };
  const [dailyOpen,setDailyOpenRaw]=useState(()=>{const v=loadLS("qimma_daily_open",{});return (v&&typeof v==="object"&&!Array.isArray(v))?v:{};});
  const setDailyOpen = v => { const d=typeof v==="function"?v(dailyOpen):v; setDailyOpenRaw(d); saveLS("qimma_daily_open",d); gsWrite("daily_open",d); };
  const [completionAlert,setCompletionAlert]=useState(null);
  const [doneIds,setDoneIdsRaw]=useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_done")||"[]");}catch{return[];}});
  const setDoneIds = v => { const d=_arr(typeof v==="function"?v(doneIds):v); setDoneIdsRaw(d); localStorage.setItem("qimma_done",JSON.stringify(d)); gsWrite("doneIds",d); };
  const markDone = (id) => { setDoneIds(prev=>[...prev,id]); };

  const toast=(msg,type="success")=>{setToastMsg(msg);setToastType(type);setTimeout(()=>setToastMsg(null),3000);};

  // ═══ انتظار جاهزية Firebase قبل أول قراءة ═══
  // Firebase يُحمَّل من الشبكة بشكل غير متزامن. بدون هذا الانتظار تبدأ القراءة
  // و_fbReady لسه false، فيسقط النظام على نسخة Google Sheets القديمة ويُرجِع
  // السجلات المحذوفة. ننتظر حتى يجهز (أو يفشل) بحد أقصى 12 ثانية.
  const waitForFirebase = async (maxMs=12000) => {
    const started = Date.now();
    while(!window._fbReady && !window._fbFailed && (Date.now()-started) < maxMs){
      await new Promise(r=>setTimeout(r,120));
    }
    return !!window._fbReady;
  };

  // On first load, try syncing from Google Sheets (overwrite local if remote has newer data)
  useEffect(()=>{
    let _unsubSnap = null;
    (async ()=>{
      setSyncStatus("loading");
      await waitForFirebase();
      const [inv, con, set, tx, ln, zk, pd, pay, gd, jov, dly, dlyo, act, mcl, pov, btx, dids, pcl] = await Promise.all([
        gsRead("investors"), gsRead("contracts"), gsRead("settings"),
        gsRead("txlist"), gsRead("loans"), gsRead("zakat"),
        gsRead("pending"), gsRead("payments"), gsRead("goods3"), gsRead("jard_ov"),
        gsRead("daily"), gsRead("daily_open"), gsRead("activity"), gsRead("monthclose"), gsRead("price_ov"), gsRead("banktx"),
        gsRead("doneIds"), gsRead("pastClients")
      ]);
      if (inv) { setInvestorsRaw(inv); saveLS("qimma_investors", inv); }
      if (con) { setContractsRaw(con); saveLS("qimma_contracts", con); }
      if (set) { setSettingsRaw(set); saveLS("qimma_settings", set); }
      if (tx)  { setInvTxListRaw(tx); saveLS("qimma_txlist", tx); }
      if (ln)  { setLoansRaw(ln); saveLS("qimma_loans", ln); }
      if (zk)  { setZakatTxRaw(zk); saveLS("qimma_zakat", zk); }
      if (pd)  { setPendingRaw(pd); saveLS("qimma_pending", pd); }
      if (pay) { setPaymentsRaw(pay); saveLS("qimma_payments", pay); }
      if (gd)  { localStorage.setItem("qimma_goods3", JSON.stringify(gd)); }
      if (pov) { localStorage.setItem("qimma_price_ov", JSON.stringify(pov)); }
      if (jov) { localStorage.setItem("qimma_jard_ov", JSON.stringify(jov)); }
      if (dly) { setDailyRaw(_arr(dly)); saveLS("qimma_daily", _arr(dly)); }
      if (dlyo && !Array.isArray(dlyo)) { setDailyOpenRaw(dlyo); saveLS("qimma_daily_open", dlyo); }
      if (act) { setActivityRaw(_arr(act)); saveLS("qimma_activity", _arr(act)); }
      if (mcl && typeof mcl==="object" && !Array.isArray(mcl)) { setMonthCloseRaw(mcl); saveLS("qimma_monthclose", JSON.stringify(mcl)); }
      if (btx) { setBankTxRaw(_arr(btx)); saveLS("qimma_banktx", JSON.stringify(_arr(btx))); }
      if (dids) { setDoneIdsRaw(_arr(dids)); localStorage.setItem("qimma_done", JSON.stringify(_arr(dids))); }
      if (pcl) { setPastClientsRaw(_arr(pcl)); saveLS("qimma_past_clients", _arr(pcl)); }
      setSyncStatus("idle");

      // ═══ مزامنة لحظية: Firestore onSnapshot ═══
      if (window._fbReady && window._fbDB) {
        let isFirstSnap = true;
        _unsubSnap = window._fbDB.collection("qima").onSnapshot(snapshot => {
          if (isFirstSnap) { isFirstSnap = false; return; }
          snapshot.docChanges().forEach(change => {
            if (change.doc.metadata.hasPendingWrites) return;
            const sheet = change.doc.id;
            const raw = change.doc.data();
            if (!raw || raw.payload === undefined) return;
            let data;
            try { data = typeof raw.payload === "string" ? JSON.parse(raw.payload) : raw.payload; } catch(e) { return; }
            if (data == null) return;
            switch(sheet) {
              case "investors": setInvestorsRaw(data); saveLS("qimma_investors", data); break;
              case "contracts": setContractsRaw(data); saveLS("qimma_contracts", data); break;
              case "settings": setSettingsRaw(data); saveLS("qimma_settings", data); break;
              case "txlist": setInvTxListRaw(data); saveLS("qimma_txlist", data); break;
              case "loans": setLoansRaw(_arr(data)); saveLS("qimma_loans", _arr(data)); break;
              case "zakat": setZakatTxRaw(_arr(data)); saveLS("qimma_zakat", _arr(data)); break;
              case "pending": setPendingRaw(_arr(data)); saveLS("qimma_pending", _arr(data)); break;
              case "payments": setPaymentsRaw(_arr(data)); saveLS("qimma_payments", _arr(data)); break;
              case "daily": setDailyRaw(_arr(data)); saveLS("qimma_daily", _arr(data)); break;
              case "daily_open": if(data && !Array.isArray(data)) { setDailyOpenRaw(data); saveLS("qimma_daily_open", data); } break;
              case "activity": setActivityRaw(_arr(data)); saveLS("qimma_activity", _arr(data)); break;
              case "monthclose": if(typeof data==="object" && !Array.isArray(data)) { setMonthCloseRaw(data); saveLS("qimma_monthclose", JSON.stringify(data)); } break;
              case "banktx": setBankTxRaw(_arr(data)); saveLS("qimma_banktx", JSON.stringify(_arr(data))); break;
              case "doneIds": setDoneIdsRaw(_arr(data)); localStorage.setItem("qimma_done", JSON.stringify(_arr(data))); break;
              case "pastClients": setPastClientsRaw(_arr(data)); saveLS("qimma_past_clients", _arr(data)); break;
              case "goods3": localStorage.setItem("qimma_goods3", JSON.stringify(data)); break;
              case "price_ov": localStorage.setItem("qimma_price_ov", JSON.stringify(data)); break;
              case "jard_ov": localStorage.setItem("qimma_jard_ov", JSON.stringify(data)); break;
            }
          });
        });
      }
    })();
    return () => { if (_unsubSnap) _unsubSnap(); };
  }, []);

  const TABS=[
    {id:"dashboard",label:"🏠",name:"الرئيسية",color:"#1e3a5f"},
    {id:"contracts",label:"📋",name:"العقود",color:"#7c3aed"},
    {id:"collect",label:"⚡",name:"التحصيل",color:"#0d9488"},
    {id:"portfolio",label:"📊",name:"المحفظة الشهرية",color:"#0d9488"},
    {id:"qimaai",label:"🤖",name:"قمة AI",color:"#6d28d9"},
    {id:"pastclients",label:"📇",name:"الزبائن",color:"#c8922a"},
    {id:"settings",label:"⚙️",name:"الإعدادات",color:"#4b5563"},
  ];
  // ترتيب التبويبات حسب المحفوظ
  const orderedTabs = (()=>{
    if(!tabOrder) return TABS;
    const byId={}; TABS.forEach(t=>byId[t.id]=t);
    const out=[]; tabOrder.forEach(id=>{if(byId[id]){out.push(byId[id]);delete byId[id];}});
    TABS.forEach(t=>{if(byId[t.id])out.push(t);});
    return out;
  })();
  const saveTabOrder=(arr)=>{const ids=arr.map(t=>t.id);setTabOrder(ids);try{localStorage.setItem("qimma_tab_order",JSON.stringify(ids));}catch(e){}};
  const onTabDrop=(toIdx)=>{
    if(dragTab===null||dragTab===toIdx) return;
    const arr=[...orderedTabs]; const [m]=arr.splice(dragTab,1); arr.splice(toIdx,0,m);
    saveTabOrder(arr); setDragTab(null);
  };

  return (
    <div style={styles.body}>
      <div className="noprint" style={{...styles.header,position:"sticky",top:0,zIndex:101}}>

        {/* الوسط: اسم المؤسسة بخط فخم */}
        <div style={{flex:1,textAlign:"center",padding:"0 8px",minWidth:0}}>
          <div style={{fontWeight:900,fontSize:"clamp(18px,4.4vw,28px)",letterSpacing:"0.5px",
            color:"#c8922a",lineHeight:1.2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
            مؤسسة قمة الفرصة التجارية
          </div>
          <div style={{width:"clamp(50px,16vw,100px)",height:2.5,background:"linear-gradient(90deg,transparent,#c8922a,transparent)",
            margin:"5px auto 0",borderRadius:2}}/>
        </div>

        {/* يسار: الحالة + خروج */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
          <button onClick={()=>{if(window.confirm("تسجيل الخروج؟")){window._fbAuth&&window._fbAuth.signOut();location.reload();}}}
            style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(252,165,165,0.3)",borderRadius:9,
              padding:"6px 13px",fontSize:13,fontWeight:700,color:"#fca5a5",cursor:"pointer",
              fontFamily:"IBM Plex Sans Arabic,Arial",whiteSpace:"nowrap"}}>خروج</button>
          <div style={{display:"flex",alignItems:"center",gap:4,fontSize:11.5,fontWeight:700,whiteSpace:"nowrap",
            color: syncStatus==="error"?"#ff8080":syncStatus==="saving"?C.gold:syncStatus==="loading"?C.gold:"#5cd98a"}}>
            <span style={{fontSize:8}}>●</span>
            {syncStatus==="saving" ? "جارٍ المزامنة" : syncStatus==="loading" ? "جارٍ التحميل" : syncStatus==="error" ? "محفوظ محلياً" : "متصل"}
          </div>
        </div>
      </div>

      {syncStatus==="error" && (
        <div style={{background:"#c0392b",color:"#fff",padding:"12px 16px",textAlign:"center",fontWeight:800,fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          ⚠️ بياناتك محفوظة على جهازك، لكن لم تكتمل المزامنة السحابية. تأكد من الإنترنت — ستُرفع تلقائياً عند عودة الاتصال.
        </div>
      )}

      <nav className="noprint" style={{...styles.nav,position:"sticky",top:52,zIndex:100}}>
        {orderedTabs.map((t,idx)=>{
          const on = page===t.id;
          return (
          <button key={t.id} draggable
            onDragStart={()=>setDragTab(idx)}
            onDragOver={e=>e.preventDefault()}
            onDrop={()=>onTabDrop(idx)}
            onClick={()=>setPage(t.id)}
            style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"clamp(5px,1.2vw,8px)",
              padding:"clamp(3px,1vw,7px) 2px",border:"none",cursor:"grab",background:"none",width:"100%",
              fontFamily:"IBM Plex Sans Arabic,Arial,sans-serif",opacity:dragTab===idx?0.4:1,
              WebkitTapHighlightColor:"transparent"}}>
            <div style={{width:"clamp(52px,14vw,78px)",aspectRatio:"1",borderRadius:"clamp(13px,3vw,20px)",
              background:on?"linear-gradient(150deg,#c8922a,#a87520)":"rgba(255,255,255,0.055)",
              display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s",
              padding:"clamp(11px,2.8vw,17px)",
              border:"2px solid #c8922a",
              boxShadow:on?"0 6px 24px rgba(200,146,42,0.45)":"none"}}>
              <NavIcon id={t.id} on={on}/>
            </div>
            <span style={{fontSize:"clamp(12px,3vw,16px)",fontWeight:800,
              color:"#c8922a",whiteSpace:"nowrap",lineHeight:1.25,
              letterSpacing:"0.5px"}}>{t.name}</span>
            <div style={{width:on?"clamp(14px,3.5vw,20px)":0,height:2,borderRadius:2,
              background:"#c8922a",transition:"width 0.2s"}}/>
          </button>
          );
        })}
      </nav>

      <div style={styles.main}>
        {/* المتعثرون انتقلت لتبويب داخل التحصيل */}
        {page==="dashboard" && <Dashboard contracts={activeContracts} investors={investors} settings={settings} setInvestors={setInvestors} daily={daily} setDaily={setDaily} dailyOpen={dailyOpen} setDailyOpen={setDailyOpen} toast={toast} setPage={setPage} payments={payments} zakatTx={zakatTx} setZakatTx={setZakatTx} loans={loans} setLoans={setLoans}/>}
        {page==="search" && <SearchPage contracts={activeContracts} investors={investors} settings={settings} payments={payments} setPayments={setPayments} toast={toast} setPage={setPage}/>}
        {page==="qimaai" && <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,zIndex:999,background:"#f4f4f6",overflowY:"auto"}}><QimaAI contracts={contracts} investors={investors} payments={payments} setPayments={setPayments} settings={settings} doneIds={doneIds} markDone={markDone} daily={daily} setDaily={setDaily} loans={loans} zakatTx={zakatTx} pending={pending} bankTx={bankTx} invTxList={invTxList} monthClose={monthClose} dailyOpen={dailyOpen} toast={toast} logAct={logAct} goBack={()=>setPage("dashboard")}/></div>}
        {page==="pastclients" && <PastClientsPage toast={toast} pastClients={pastClients} setPastClients={setPastClients} contracts={contracts}/>}
        {page==="collect" && <CollectionPage contracts={contracts} investors={investors} settings={settings} payments={payments} setPayments={setPayments} toast={toast} logAct={logAct} doneIds={doneIds} markDone={markDone} setContracts={setContracts} activeContracts={activeContracts}/>}
        {page==="contracts" && <ContractsPage contracts={contracts} investors={investors} settings={settings} onDelete={id=>{const c=contracts.find(x=>x.id===id);setContracts(p=>p.map(c=>c.id===id?{...c,deleted:true}:c));logAct("حذف","عقد",(c?("#"+c.num+" — "+c.client):""));}} onRestore={id=>{const c=contracts.find(x=>x.id===id);setContracts(p=>p.map(c=>c.id===id?{...c,deleted:false}:c));logAct("استرجاع","عقد",(c?("#"+c.num+" — "+c.client):""));}} onUpdate={updated=>{setContracts(p=>p.map(c=>c.id===updated.id?updated:c));logAct("تعديل","عقد",("#"+updated.num+" — "+updated.client));}} payments={payments} setPayments={setPayments} toast={toast} completionAlert={completionAlert} setCompletionAlert={setCompletionAlert} onSaveNew={c=>{setContracts(p=>[...p,c]);addPastClientFromContract(c);logAct("إضافة","عقد",("#"+c.num+" — "+c.client));}} setInvTxList={setInvTxList} logAct={logAct} dailyOpen={dailyOpen} doneIds={doneIds} markDone={markDone} setPage={setPage}/>}
        {page==="portfolio" && <MonthlyPortfolio contracts={activeContracts} investors={investors} settings={settings} payments={payments} monthClose={monthClose} setMonthClose={setMonthClose} toast={toast} daily={daily} dailyOpen={dailyOpen} setDailyOpen={setDailyOpen} JardComp={<JardPage contracts={activeContracts} investors={investors} settings={settings} txList={invTxList} loans={loans} zakatTx={zakatTx} pending={pending} payments={payments} gsWrite={gsWrite} daily={daily} dailyOpen={dailyOpen} bankTx={bankTx}/>} BankComp={<BankPage bankTx={bankTx} setBankTx={setBankTx} toast={toast} contracts={contracts} investors={investors} payments={payments} setPayments={setPayments} doneIds={doneIds} daily={daily} setDaily={setDaily} logAct={logAct}/>} CashComp={<CashFlowPage contracts={activeContracts} investors={investors} settings={settings} payments={payments} daily={daily} dailyOpen={dailyOpen} txList={invTxList} loans={loans} zakatTx={zakatTx} pending={pending} bankTx={bankTx}/>}/>}
        {page==="accounts" && <AccountsPage contracts={activeContracts} investors={investors} setInvestors={setInvestors} settings={settings} txList={invTxList} setTxList={setInvTxList} loans={loans} setLoans={setLoans} zakatTx={zakatTx} setZakatTx={setZakatTx} pending={pending} setPending={setPending} payments={payments} toast={toast} goBack={()=>setPage("contracts")}/>}
        {page==="goods" && <GoodsPage investors={investors} contracts={activeContracts} toast={toast} gsWrite={gsWrite} goBack={()=>setPage("contracts")}/>}
        {/* البوصلة المالية انتقلت لتبويب داخل المحفظة الشهرية */}
        {page==="activity" && <ActivityPage activity={activity} setActivity={setActivity} toast={toast} setPage={setPage}/>}
        {page==="settings" && <SettingsPage settings={settings} onSave={setSettings} toast={toast} exportBackup={exportBackup} importBackup={importBackup} payments={payments} setPayments={setPayments} dailyOpen={dailyOpen} setDailyOpen={setDailyOpen} setPage={setPage} investors={investors} contracts={activeContracts} setInvestors={setInvestors} gsWrite={gsWrite} saveLS={saveLS} loadLS={loadLS}/>}
      </div>

      <Toast msg={toastMsg} type={toastType}/>

      {/* مؤشر النسخ الاحتياطي التلقائي */}
      {autoBackupStatus && (
        <div style={{position:"fixed",top:12,left:"50%",transform:"translateX(-50%)",zIndex:9999,
          background:autoBackupStatus==="sending"?"#1e40af":autoBackupStatus==="success"?"#15803d":"#b91c1c",
          color:"#fff",padding:"10px 20px",borderRadius:12,fontSize:14,fontWeight:700,
          boxShadow:"0 4px 20px rgba(0,0,0,0.3)",display:"flex",alignItems:"center",gap:8}}>
          {autoBackupStatus==="sending" && <><span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>⏳</span> جارٍ إرسال النسخة الاحتياطية...</>}
          {autoBackupStatus==="success" && <>✅ تم إرسال النسخة الاحتياطية لإيميلك</>}
          {autoBackupStatus==="error" && <>⚠️ تعذّر إرسال النسخة — تحقق من الإعدادات</>}
        </div>
      )}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:null,info:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){this.setState({err,info});}
  render(){
    if(this.state.err){
      return React.createElement('div',{style:{padding:20,fontFamily:'monospace',direction:'ltr',textAlign:'left',background:'#fff',color:'#b00',fontSize:13,whiteSpace:'pre-wrap',lineHeight:1.6}},
        '⚠️ خطأ في البرنامج:\n\n'+(this.state.err&&this.state.err.toString())+'\n\n'+
        (this.state.err&&this.state.err.stack?this.state.err.stack.split('\n').slice(0,8).join('\n'):'')+'\n\n'+
        (this.state.info&&this.state.info.componentStack?this.state.info.componentStack.split('\n').slice(0,8).join('\n'):'')
      );
    }
    return this.props.children;
  }
}

function LoginGate() {
  const [user, setUser] = React.useState(undefined); // undefined=جارٍ الفحص، null=غير مسجّل
  const [email, setEmail] = React.useState("");
  const [pass, setPass] = React.useState("");
  const [err, setErr] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [mode, setMode] = React.useState("login"); // login | signup

  React.useEffect(()=>{
    let unsub = null;
    let tries = 0;
    const check = () => {
      if(window._fbFailed){ setUser("nofirebase"); return; }   // فشل التحميل → ادخل عادي (Google Sheets)
      if(window._fbReady && window._fbAuth){
        unsub = window._fbAuth.onAuthStateChanged(u=>setUser(u||null));
        return;
      }
      if(tries < 100){ tries++; setTimeout(check, 150); }       // ينتظر المصادر المتعددة (٣٠ ثانية)
      else { setUser("nofirebase"); }                           // مهلة → ادخل عادي
    };
    check();
    return ()=>{ if(unsub) unsub(); };
  },[]);

  const doAuth = async () => {
    setErr(""); setBusy(true);
    try {
      if(mode==="signup") await window._fbAuth.createUserWithEmailAndPassword(email.trim(), pass);
      else await window._fbAuth.signInWithEmailAndPassword(email.trim(), pass);
    } catch(e){
      const m = {
        "auth/invalid-email":"البريد غير صحيح",
        "auth/user-not-found":"الحساب غير موجود",
        "auth/wrong-password":"كلمة السر خاطئة",
        "auth/invalid-credential":"البريد أو كلمة السر خاطئة",
        "auth/email-already-in-use":"البريد مستخدم — سجّل دخول",
        "auth/weak-password":"كلمة السر قصيرة (٦ أحرف على الأقل)",
      }[e.code] || "خطأ: "+(e.message||e.code);
      setErr(m);
    }
    setBusy(false);
  };

  // لو Firebase غير جاهز، ادخل مباشرة (احتياط)
  if(user==="nofirebase") return <ErrorBoundary><App/></ErrorBoundary>;
  if(user===undefined) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:18,color:"#0f1e33"}}>⏳ جارٍ التحميل...</div>;
  if(user) return <ErrorBoundary><App/></ErrorBoundary>;

  // شاشة الدخول
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f1e33,#1e293b)",fontFamily:"IBM Plex Sans Arabic,Arial",padding:20}}>
      <div style={{background:"#fff",borderRadius:18,padding:"34px 28px",width:"100%",maxWidth:380,boxShadow:"0 10px 40px rgba(0,0,0,0.3)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:26,fontWeight:900,color:"#0f1e33"}}>مؤسسة قمة الفرصة</div>
          <div style={{fontSize:15,color:"#64748b",marginTop:4}}>نظام إدارة التقسيط والمستثمرين</div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:14,fontWeight:700,color:"#334155",display:"block",marginBottom:6}}>البريد الإلكتروني</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com"
            style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"2px solid #e2e8f0",fontSize:15,fontFamily:"IBM Plex Sans Arabic,Arial",boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:18}}>
          <label style={{fontSize:14,fontWeight:700,color:"#334155",display:"block",marginBottom:6}}>كلمة السر</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"
            onKeyDown={e=>e.key==="Enter"&&doAuth()}
            style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"2px solid #e2e8f0",fontSize:15,fontFamily:"IBM Plex Sans Arabic,Arial",boxSizing:"border-box"}}/>
        </div>
        {err && <div style={{background:"#fef2f2",color:"#dc2626",padding:"10px 12px",borderRadius:8,fontSize:14,marginBottom:14,fontWeight:600}}>⚠️ {err}</div>}
        <button onClick={doAuth} disabled={busy||!email||!pass}
          style={{width:"100%",padding:"13px",borderRadius:10,border:"none",background:busy?"#94a3b8":"#c8922a",color:"#fff",fontSize:16,fontWeight:800,cursor:busy?"default":"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>
          {busy?"⏳ جارٍ...":(mode==="signup"?"إنشاء حساب":"تسجيل الدخول")}
        </button>
        <div style={{textAlign:"center",marginTop:16,fontSize:13,color:"#94a3b8"}}>
          🔒 نظام مغلق — للمستخدمين المصرّح لهم فقط
        </div>
      </div>
    </div>
  );
}

const _rootEl = document.getElementById('root');
_rootEl.setAttribute("data-app-rendered","1"); // إعلام طبقة التشخيص أن التطبيق بدأ
const root = ReactDOM.createRoot(_rootEl);
root.render(<ErrorBoundary><LoginGate /></ErrorBoundary>);
</script>
<script>
/* ═══ ضمان تشغيل Babel: لو لم يحوّل السكربت تلقائياً، حوّله يدوياً ═══ */
(function(){
  function appStarted(){
    var r=document.getElementById("root");
    return r && r.getAttribute("data-app-rendered")==="1";
  }
  function runManually(){
    if(appStarted()) return;
    if(typeof Babel==="undefined"){ console.warn("Babel غير جاهز بعد"); return; }
    var el=document.getElementById("main-app-script");
    if(!el){ console.warn("لم يُعثر على سكربت التطبيق"); return; }
    try{
      console.log("↻ تحويل التطبيق يدوياً عبر Babel...");
      var out=Babel.transform(el.textContent,{presets:["react"]}).code;
      // تشغيل الكود في نفس النطاق لالتقاط الخطأ الحقيقي (بدل appendChild الذي يخفيه كـ Script error)
      (0, eval)(out);
      console.log("✓ اكتمل التحويل والتشغيل اليدوي");
    }catch(err){
      var box=document.getElementById("root");
      if(box && !appStarted()){
        var msg=(err&&(err.message||String(err)))||"خطأ تحويل غير معروف";
        var stack=(err&&err.stack)||"";
        box.innerHTML='<div dir="rtl" style="min-height:100vh;background:#fff5f5;padding:24px 16px;font-family:Arial,sans-serif;color:#111"><div style="max-width:640px;margin:0 auto;background:#fff;border:2px solid #dc2626;border-radius:14px;padding:20px"><div style="font-size:22px;font-weight:900;color:#dc2626;margin-bottom:10px">⚠️ خطأ في كود التطبيق</div><div style="font-size:15px;color:#334155;margin-bottom:14px">انسخ النص وأرسله للمطوّر:</div><div id="diag-box" style="background:#0f172a;color:#fca5a5;padding:12px 14px;border-radius:10px;font-size:13px;font-family:monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;margin-bottom:12px">'+msg+"\n\n"+stack+'</div><button onclick="try{navigator.clipboard.writeText(document.getElementById(\'diag-box\').innerText);this.textContent=\'✓ تم النسخ\'}catch(e){}" style="width:100%;padding:12px;border-radius:10px;border:none;background:#c8922a;color:#fff;font-size:15px;font-weight:800;cursor:pointer">📋 نسخ نص الخطأ</button></div></div>';
      }
      console.error("خطأ تحويل Babel:",err);
    }
  }
  // التحويل التلقائي معطّل (النوع text/babel-manual) — نشغّل يدوياً مرة واحدة عند جهوزية Babel
  var _ran=false;
  function tryRun(){
    if(_ran||appStarted()) return;
    if(typeof Babel==="undefined" || typeof React==="undefined" || typeof ReactDOM==="undefined"){ return; }
    _ran=true;
    runManually();
  }
  var _iv=setInterval(function(){ tryRun(); if(_ran||appStarted()) clearInterval(_iv); }, 200);
  if(document.readyState==="complete"){ tryRun(); }
  else { window.addEventListener("load", tryRun); }
  setTimeout(function(){ clearInterval(_iv); }, 25000);
})();
</script>
<script>
// ── تنظيف Service Worker القديم وذاكرته المؤقتة ──
// المشكلة: إلغاء التسجيل وحده لا يمسح الذاكرة المخزّنة، والصفحة المعروضة
// تكون قد جاءت من العامل القديم قبل تشغيل هذا الكود. فنمسح الاثنين معاً
// ثم نعيد التحميل مرة واحدة فقط (بحارس يمنع التكرار اللانهائي).
(function(){
  if(!('serviceWorker' in navigator)) return;
  var FLAG = 'qimma_sw_purged';
  var jobs = [];

  jobs.push(
    navigator.serviceWorker.getRegistrations()
      .then(function(regs){
        return Promise.all(regs.map(function(r){ return r.unregister(); }))
          .then(function(){ return regs.length > 0; });
      })
      .catch(function(){ return false; })
  );

  if(window.caches && caches.keys){
    jobs.push(
      caches.keys()
        .then(function(keys){
          return Promise.all(keys.map(function(k){ return caches.delete(k); }))
            .then(function(){ return keys.length > 0; });
        })
        .catch(function(){ return false; })
    );
  }

  Promise.all(jobs).then(function(results){
    var cleaned = results.some(Boolean);
    // أعد التحميل مرة واحدة فقط إذا وُجد ما يُنظَّف فعلاً
    if(cleaned && !sessionStorage.getItem(FLAG)){
      try{ sessionStorage.setItem(FLAG, '1'); }catch(e){}
      location.reload();
    }
  }).catch(function(){});
})();
</script>
