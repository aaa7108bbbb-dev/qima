function MonthlyPortfolio({contracts, investors, settings, payments, monthClose, setMonthClose, JardComp, toast, BankComp, CashComp, daily, dailyOpen, setDailyOpen}) {
  const [tab, setTab] = React.useState("ind");
  const [openMonth, setOpenMonth] = React.useState(null);
  const getPeriod = d => fiscalYM(d);
  const mLabel = ym => { const [y,m]=ym.split("-"); return "شهر "+parseInt(m)+" - "+y; };
  const allC = contracts.filter(c=>!c.deleted);
  const allMonths = [...new Set(contracts.map(c=>getPeriod(c.date)))].sort().reverse();
  // كل الأشهر تظهر — المقفلة مالياً تتوسم بشارة 🔒 فقط (لا تختفي)
  const months = allMonths;

  const calcMonth = (ym) => {
    const mc = contracts.filter(c=>getPeriod(c.date)===ym && !c.deleted);
    const tot = mc.reduce((a,c)=>{const r=calcC(c,settings);return{amt:a.amt+c.amount,profit:a.profit+r.profit,admin:a.admin+r.admin,acc:a.acc+r.acc,inst:a.inst+r.inst,net:a.net+r.net};},{amt:0,profit:0,admin:0,acc:0,inst:0,net:0});
    const collected = (payments||[]).filter(p=>p.date && getPeriod(p.date)===ym).reduce((s,p)=>s+(+p.amount||0),0);
    const [y,m]=ym.split("-").map(Number);
    const periodEnd = new Date(y, m, 20);
    // المستحق: مجموع الأقساط الواجبة حتى نهاية الشهر لكل العقود
    const due = allC.reduce((s,c)=>{
      const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
      if(inst<=0||!c.firstInst) return s;
      const first=new Date(c.firstInst); if(first>periodEnd) return s;
      const totalCount=Math.max(1,Math.round(total/inst));
      let el=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
      if(periodEnd.getDate()>=first.getDate()) el+=1;
      const dueCount=Math.min(Math.max(0,el),totalCount);
      return s+Math.max(0,Math.min(inst,(dueCount*inst)-_getPaid(payments,c.id)));
    },0);
    // نقدي/شهري + مجموع الأقساط الشهرية + الإجمالي بالفائدة
    const cashCount = mc.filter(c=>c.contractType==="defer").length;
    const monthlyCount = mc.filter(c=>c.contractType!=="defer").length;
    const totalWithProfit = mc.reduce((s,c)=>s+Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id)),0);
    const instSum = mc.reduce((s,c)=>s+(+c.instAmt||0),0);
    // محصلة المستثمرين: كل المستثمرين، ولو بدون عقود يطلع أصفار
    const invRows = sortedInvestors(investors).map(iv=>{
      const ic = mc.filter(c=>String(c.investorId)===String(iv.id));
      const cash = ic.reduce((s,c)=>s+(+c.amount||0),0);
      const total = ic.reduce((s,c)=>s+(+c.totalInst||+c.amount||0),0);
      const inst = ic.reduce((s,c)=>s+(+c.instAmt||0),0);
      // المحصّل والمستحق لعقود هذا المستثمر في هذا الشهر
      const ids = ic.map(c=>c.id);
      const coll = (payments||[]).filter(p=>p.date && getPeriod(p.date)===ym && ids.includes(p.contractId)).reduce((s,p)=>s+(+p.amount||0),0);
      const dueInv = ic.reduce((s,c)=>{
        const it=+c.instAmt||0, tt=+c.totalInst||+c.amount||0;
        if(it<=0||!c.firstInst) return s;
        const first=new Date(c.firstInst); if(first>periodEnd) return s;
        const tc=Math.max(1,Math.round(tt/it));
        let el=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
        if(periodEnd.getDate()>=first.getDate()) el+=1;
        const dc=Math.min(Math.max(0,el),tc);
        return s+Math.max(0,Math.min(it,(dc*it)-_getPaid(payments,c.id)));
      },0);
      return {name:invLabel(iv), count:ic.length, cash, total, inst, coll, due:dueInv, late:Math.max(0,dueInv-coll)};
    });

    // ═══ قوائم تفصيلية لكل بطاقة ═══
    const invName = id => { const iv=investors.find(x=>String(x.id)===String(id)); return iv?invLabel(iv):"—"; };
    const pType = c => c.contractType==="defer" ? "مبلغ مؤجل" : "قسط شهري";
    // دفعات المحصّل (كل دفعة في الشهر)
    const collectedDetail = (payments||[]).filter(p=>p.date && getPeriod(p.date)===ym).map(p=>{
      const c=allC.find(k=>k.id===p.contractId);
      return {name:c?c.client:"—", inv:c?invName(c.investorId):"—", amount:+p.amount||0, date:p.date, type:c?pType(c):"—"};
    }).sort((a,b)=>new Date(b.date)-new Date(a.date));
    // المستحق (لكل عقد له مستحق)
    const dueDetail=[], lateDetail=[];
    allC.forEach(c=>{
      const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
      if(inst<=0||!c.firstInst) return;
      const first=new Date(c.firstInst); if(first>periodEnd) return;
      const totalCount=Math.max(1,Math.round(total/inst));
      let el=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
      if(periodEnd.getDate()>=first.getDate()) el+=1;
      const dueCount=Math.min(Math.max(0,el),totalCount);
      const dueAmt=Math.max(0,Math.min(inst,(dueCount*inst)-_getPaid(payments,c.id)));
      const collForC=(payments||[]).filter(p=>p.date&&getPeriod(p.date)===ym&&p.contractId===c.id).reduce((s,p)=>s+(+p.amount||0),0);
      if(dueAmt>0) dueDetail.push({name:c.client, inv:invName(c.investorId), amount:dueAmt, type:pType(c)});
      const lateAmt=Math.max(0,dueAmt-collForC);
      if(lateAmt>0) lateDetail.push({name:c.client, inv:invName(c.investorId), amount:lateAmt, type:pType(c)});
    });
    // عقود (للبطاقات المبنية على العقود)
    const contractRows = (list,valFn)=>list.map(c=>({name:c.client, inv:invName(c.investorId), amount:valFn(c), type:pType(c)}));
    const details = {
      count: contractRows(mc,c=>+c.amount||0),
      cashCount: contractRows(mc.filter(c=>c.contractType==="defer"),c=>+c.amount||0),
      monthlyCount: contractRows(mc.filter(c=>c.contractType!=="defer"),c=>+c.amount||0),
      amt: contractRows(mc,c=>+c.amount||0),
      totalWithProfit: contractRows(mc,c=>Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id))),
      instSum: contractRows(mc,c=>+c.instAmt||0),
      profit: contractRows(mc,c=>calcC(c,settings).profit),
      net: contractRows(mc,c=>{const r=calcC(c,settings);return r.profit-r.inst-r.acc;}),
      inst: contractRows(mc,c=>calcC(c,settings).inst),
      acc: contractRows(mc,c=>calcC(c,settings).acc),
      collected: collectedDetail,
      due: dueDetail,
      late: lateDetail,
    };
    return {mc, tot, collected, due, count:mc.length, cashCount, monthlyCount, totalWithProfit, instSum, invRows, late:Math.max(0,due-collected), details};
  };
  const totalRemaining = allC.reduce((s,c)=>s+Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id)),0);
  const closedMonths = Object.keys(monthClose||{}).sort().reverse();

  // ═══ إقفال الدورة وبدء شهر جديد ═══
  // يحفظ لقطة الشهر بالأرشيف + يحرّك رصيد بداية الصندوق لليوم بمبلغ المتبقي الحالي
  // النتيجة: المصروف/استلام المدير/الرئيس/السداد تتصفّر تلقائياً (الحركات القديمة تصير قبل نقطة البداية)
  // لا يُمسح أي شيء — كله محفوظ بالكشف الشامل والأرشيف
  const closeCycleAndReset = () => {
    // 1) حساب المتبقي الحالي في الصندوق
    const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
    const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
    const baseAmount = base ? (+base.amount||0) : 0;
    const baseDate = base ? base.date : "0000-00-00";
    const _daily = daily||[];
    const netSince = _daily.filter(d=>d.date >= baseDate)
      .reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
    const boxNow = baseAmount + netSince;

    // 2) الشهر (الدورة) الحالي حسب السنة المالية
    const nowD = new Date();
    const curYM = fiscalYM(nowD);
    const todayStr = todayLocal();

    // تأكيد
    if(!window.confirm(
      "🔒 إقفال الدورة الحالية وبدء شهر جديد؟\n\n"+
      "• سيُحفظ الشهر ("+mLabel(curYM)+") في الأرشيف\n"+
      "• الرصيد الافتتاحي الجديد = "+SAR(boxNow)+"\n"+
      "• تتصفّر: المصروف · استلام المدير · استلام الرئيس · السداد\n\n"+
      "⚠️ لا يُمسح أي شيء — كل الحركات محفوظة بالكشف الشامل.\n\n"+
      "متابعة؟"
    )) return;

    // 3) حفظ لقطة الشهر بالأرشيف
    const d = calcMonth(curYM);
    setMonthClose(p=>({...(p||{}),[curYM]:{
      closedAt:new Date().toISOString(),
      collected:d.collected, amt:d.tot.amt, profit:d.tot.profit,
      admin:d.tot.admin, acc:d.tot.acc, inst:d.tot.inst, net:d.tot.net, count:d.count,
      cycleReset:true, openingCarried:boxNow
    }}));

    // 4) تحريك نقطة بداية الصندوق لليوم بمبلغ المتبقي
    setDailyOpen(p=>({...(p&&typeof p==="object"&&!Array.isArray(p)?p:{}), __base:{date:todayStr, amount:boxNow}}));

    toast("✅ تم إقفال الدورة — بدأ شهر جديد برصيد "+SAR(boxNow));
  };

  const printAll = (rows, title) => {
    const w=window.open("","_blank"); if(!w){alert("اسمح بالنوافذ المنبثقة");return;}
    const body=rows.map(r=>"<tr><td>"+mLabel(r.ym)+"</td><td>"+SAR(r.d.collected)+"</td><td>"+SAR(r.d.tot.amt)+"</td><td>"+SAR(r.d.tot.profit)+"</td><td>"+SAR(r.d.tot.net)+"</td><td>"+r.d.count+"</td></tr>").join("");
    w.document.write("<!DOCTYPE html><html dir='rtl'><head><meta charset='utf-8'><title>"+title+"</title><style>*{font-family:Arial}body{padding:18px;color:#000}h1{font-size:20px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #000;padding:7px;text-align:center;font-weight:600}th{background:#fff;color:#000;font-weight:900;border-bottom:2px solid #000}</style></head><body onload='window.print()'><h1>مؤسسة قمة الفرصة التجارية — "+title+"</h1><table><thead><tr><th>الشهر</th><th>المحصّل</th><th>قيمة العقود</th><th>الأرباح</th><th>صافي المستثمرين</th><th>عدد العقود</th></tr></thead><tbody>"+body+"</tbody></table></body></html>");
    w.document.close();
  };

  const subTabs=[
    {k:"ind",l:"المؤشرات",icon:'<path d="M3.5 7.5h17v12h-17Z"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/>'},
    {k:"jard",l:"الجرد",icon:'<path d="M3.6 7.6h16.8v12H3.6Z"/><path d="M3.6 11.6h16.8M12 7.6v12"/>'},
    {k:"bank",l:"رصيد الحساب",icon:'<path d="M4 8.6v9.9a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8.4a1 1 0 0 0-1-1H6a2 2 0 0 1 0-4h11.4"/>'},
    {k:"cash",l:"البوصلة المالية",icon:'<circle cx="12" cy="12" r="8.4"/><path d="M15.7 8.3 13.1 13.1 8.3 15.7l2.6-4.8Z"/>'}
  ];

  return (
    <div style={styles.main}>
      <div style={{display:"flex",gap:0,marginBottom:16,background:C.white,borderRadius:12,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",width:"fit-content",flexWrap:"wrap"}}>
        {subTabs.map(t=>{
          const on = tab===t.k;
          return (
          <button key={t.k} onClick={()=>{setTab(t.k);setOpenMonth(null);}}
            style={{fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:15,fontWeight:700,padding:"11px 18px",border:"none",cursor:"pointer",background:on?"linear-gradient(135deg,#1a1a2e,#0f3460)":C.white,color:on?"#e0b85c":C.ink2,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:7,transition:"all .15s"}}>
            <svg width="17" height="17" viewBox="0 0 24 24"><g fill="none" stroke={on?"#e0b85c":"#8b93a7"} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:t.icon}}/></svg>
            {t.l}</button>
        );})}
      </div>

      {tab==="ind" && (openMonth ? (
        <MonthDetail ym={openMonth} calcMonth={calcMonth} mLabel={mLabel}
          investors={investors} allC={allC} payments={payments} invLabel={invLabel}
          isClosed={!!(monthClose&&monthClose[openMonth])}
          onBack={()=>setOpenMonth(null)}
          onClose={()=>{const d=calcMonth(openMonth);setMonthClose(p=>({...(p||{}),[openMonth]:{closedAt:new Date().toISOString(),collected:d.collected,amt:d.tot.amt,profit:d.tot.profit,admin:d.tot.admin,acc:d.tot.acc,inst:d.tot.inst,net:d.tot.net,count:d.count}}));toast("🔒 تم إقفال الشهر");}}
          onReopen={()=>{if(window.confirm("فتح الشهر المقفل؟")){setMonthClose(p=>{const n={...(p||{})};delete n[openMonth];return n;});toast("🔓 تم فتح الشهر");}}}
        />
      ) : (
        <div style={styles.panel}>
          <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <h2 style={{margin:0,fontSize:18,fontWeight:900,color:C.ink,display:"flex",alignItems:"center",gap:8}}>
              <svg width="20" height="20" viewBox="0 0 24 24"><g fill="none" stroke="#c8922a" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M3.5 7.5h17v12h-17Z"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5"/></g></svg>
              مؤشرات المحفظة الشهرية</h2>
            <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:13,color:"#1f2937",fontWeight:700}}>المتبقي الكلي: <span style={{color:C.red,fontWeight:900}}>{SAR(totalRemaining)}</span></span>
              <button style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",color:"#e0b85c",border:"none",borderRadius:10,fontSize:13,fontWeight:800,padding:"7px 12px",cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial",display:"inline-flex",alignItems:"center",gap:6}} onClick={closeCycleAndReset}>
                <svg width="15" height="15" viewBox="0 0 24 24"><g fill="none" stroke="#e0b85c" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g></svg>
                إقفال الدورة وبدء شهر جديد</button>
              <button style={{...styles.btn(C.gold),fontSize:13,padding:"7px 12px",display:"inline-flex",alignItems:"center",gap:6}} onClick={()=>printAll(months.map(ym=>({ym,d:calcMonth(ym)})),"المؤشرات الشهرية")}>
                <svg width="15" height="15" viewBox="0 0 24 24"><g fill="none" stroke="#fff" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M7 9V4h10v5M6 18H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1M7 15h10v5H7Z"/></g></svg>
                طباعة</button>
            </div>
          </div>
          <div style={{padding:14}}>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>اضغط أي شهر لعرض تفاصيله الكاملة</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {months.map(ym=>{
                const d=calcMonth(ym); const closed=!!(monthClose&&monthClose[ym]);
                return (
                  <div key={ym} onClick={()=>setOpenMonth(ym)}
                    style={{cursor:"pointer",border:"1px solid "+C.border,borderRadius:12,padding:14,background:closed?"#f0fdf4":"#fff",borderRight:"4px solid "+(closed?C.green:"#1a1a2e")}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
                      <div style={{fontSize:16,fontWeight:900,color:C.ink}}>{mLabel(ym)} {closed&&<span style={{fontSize:12,background:C.green,color:"#fff",borderRadius:10,padding:"2px 10px",marginRight:6}}>مقفل</span>}</div>
                      <span style={{fontSize:13,color:"#c8922a",fontWeight:700}}>التفاصيل ›</span>
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8}}>
                      {[["عدد العقود",d.count,"#1a1a2e",true],["القيمة النقدية",d.tot.amt,"#c8922a"],["الإجمالي",d.totalWithProfit,"#1a1a2e"],["الأرباح",d.tot.profit,C.green],["ربح المستثمرين",d.tot.profit-d.tot.inst-d.tot.acc,C.green],["المحصّل",d.collected,C.green]].map(([l,v,col,isCount],i)=>(
                        <div key={i} style={{textAlign:"center",background:"#fff",border:"1px solid "+C.border,borderTop:"3px solid #1a1a2e",borderRadius:8,padding:"8px 6px"}}>
                          <div style={{fontSize:12,color:"#64748b",marginBottom:3,fontWeight:600}}>{l}</div>
                          <div style={{fontSize:15,fontWeight:900,color:col}}>{isCount?v:SAR(v)}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
              {months.length===0 && <div style={{textAlign:"center",padding:30,color:"#1f2937"}}>لا توجد بيانات</div>}
            </div>
          </div>
        </div>
      ))}

      {tab==="archive" && (
        <div style={styles.panel}>
          <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <h2 style={{margin:0,fontSize:18,fontWeight:900,color:C.ink}}>🗄️ أرشيف الأشهر المقفلة</h2>
            {closedMonths.length>0 && <button style={{...styles.btn(C.gold),fontSize:13,padding:"7px 12px"}} onClick={()=>printAll(closedMonths.map(ym=>({ym,d:{collected:monthClose[ym].collected,tot:{amt:monthClose[ym].amt,profit:monthClose[ym].profit,net:monthClose[ym].net},count:monthClose[ym].count}})),"أرشيف الأشهر المقفلة")}>🖨️ طباعة الأرشيف</button>}
          </div>
          <div style={{padding:14,overflowX:"auto"}}>
            {closedMonths.length===0
              ? <div style={{textAlign:"center",padding:30,color:"#1f2937"}}>لا توجد أشهر مقفلة بعد. اقفل شهراً من تبويب المؤشرات.</div>
              : <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
                  <thead><tr>{["الشهر","المحصّل","قيمة العقود","الأرباح","نصيب المدير","نصيب المحاسب","صافي المستثمرين","عدد العقود"].map(h=><th key={h} style={{...styles.th,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
                  <tbody>
                    {closedMonths.map(ym=>{const c=monthClose[ym];return(
                      <tr key={ym}>
                        <td style={{...styles.td,fontWeight:800}}>{mLabel(ym)}</td>
                        <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(c.collected)}</td>
                        <td style={styles.td}>{SAR(c.amt)}</td>
                        <td style={{...styles.td,color:C.green}}>{SAR(c.profit)}</td>
                        <td style={styles.td}>{SAR(c.inst)}</td>
                        <td style={styles.td}>{SAR(c.acc)}</td>
                        <td style={{...styles.td,color:"#0891b2",fontWeight:700}}>{SAR(c.net)}</td>
                        <td style={{...styles.td,textAlign:"center"}}>{c.count}</td>
                      </tr>
                    );})}
                  </tbody>
                </table>}
          </div>
        </div>
      )}

      {tab==="jard" && JardComp}
      {tab==="bank" && BankComp}
      {tab==="cash" && CashComp}
    </div>
  );
}

function MonthDetail({ym, calcMonth, mLabel, isClosed, onBack, onClose, onReopen, investors, allC, payments, invLabel}) {
  const d = calcMonth(ym);
  const [cardDetail,setCardDetail] = React.useState(null);
  const [cardOrder,setCardOrder] = React.useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_cardorder")||"null");}catch{return null;}});
  const [dragIdx,setDragIdx] = React.useState(null);
  const cards=[
    ["عدد العقود",d.count,"#475569",true,"count"],
    ["عقود مؤجلة",d.cashCount,"#0891b2",true,"cashCount"],
    ["عقود شهرية",d.monthlyCount,C.teal,true,"monthlyCount"],
    ["النقدي (القيمة)",d.tot.amt,C.teal,false,"amt"],
    ["الإجمالي (بالفائدة)",d.totalWithProfit,"#7c3aed",false,"totalWithProfit"],
    ["مجموع الأقساط",d.instSum,"#9a6a00",false,"instSum"],
    ["الأرباح",d.tot.profit,C.green,false,"profit"],
    ["المحصّل",d.collected,C.green,false,"collected"],
    ["المستحق",d.due,"#9a6a00",false,"due"],
    ["المتعثّر",d.late,C.red,false,"late"],
    ["ربح المستثمرين",d.tot.profit - d.tot.inst - d.tot.acc,"#0891b2",false,"net"],
    ["ربح المدير",d.tot.inst,"#9a6a00",false,"inst"],
    ["ربح المحاسب",d.tot.acc,"#4f46e5",false,"acc"],
  ];
  // ترتيب البطاقات حسب المحفوظ (بالمفتاح)، والجديدة تنضاف بالنهاية
  const orderedCards = (()=>{
    if(!cardOrder) return cards;
    const byKey={}; cards.forEach(c=>byKey[c[4]]=c);
    const out=[]; cardOrder.forEach(k=>{if(byKey[k]){out.push(byKey[k]);delete byKey[k];}});
    cards.forEach(c=>{if(byKey[c[4]])out.push(c);});
    return out;
  })();
  const saveOrder = (arr)=>{ const ks=arr.map(c=>c[4]); setCardOrder(ks); try{localStorage.setItem("qimma_cardorder",JSON.stringify(ks));}catch(e){} };
  const onDrop = (toIdx)=>{
    if(dragIdx===null||dragIdx===toIdx) return;
    const arr=[...orderedCards]; const [moved]=arr.splice(dragIdx,1); arr.splice(toIdx,0,moved);
    saveOrder(arr); setDragIdx(null);
  };
  const th={padding:"10px 8px",textAlign:"center",fontSize:13,fontWeight:800,background:"#1e293b",color:"#fff",whiteSpace:"nowrap"};
  const td={padding:"9px 8px",textAlign:"center",fontSize:14,borderBottom:"1px solid "+C.border};
  const printReport = () => {
    const w=window.open("","_blank"); if(!w){alert("اسمح بالنوافذ");return;}
    const cardsHtml=cards.map(c=>"<div class='cc'><div class='cl'>"+c[0]+"</div><div class='cv'>"+(c[3]?c[1]:SAR(c[1]))+"</div></div>").join("");
    const rowsHtml=d.invRows.map(r=>"<tr><td style='text-align:right;font-weight:bold'>"+r.name+"</td><td>"+r.count+"</td><td>"+SAR(r.cash)+"</td><td>"+SAR(r.total)+"</td><td>"+SAR(r.inst)+"</td><td>"+SAR(r.coll)+"</td><td>"+SAR(r.due)+"</td><td style='color:#b91c1c'>"+SAR(r.late)+"</td></tr>").join("");
    w.document.write("<!DOCTYPE html><html dir='rtl'><head><meta charset='utf-8'><title>تقرير "+mLabel(ym)+"</title><style>*{font-family:Arial;box-sizing:border-box}body{padding:18px;color:#000}h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:18px 0 8px}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cc{border:1px solid #000;border-radius:8px;padding:8px;text-align:center}.cl{font-size:12px;color:#555}.cv{font-size:16px;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #000;padding:6px;text-align:center;font-weight:600}th{background:#fff;color:#000;font-weight:900;border-bottom:2px solid #000}@media print{@page{size:A4 landscape;margin:8mm}}</style></head><body onload='window.print()'><h1>مؤسسة قمة الفرصة التجارية</h1><div>تقرير "+mLabel(ym)+"</div><h2>مؤشرات الشهر</h2><div class='g'>"+cardsHtml+"</div><h2>محصلة المستثمرين</h2><table><thead><tr><th>المستثمر</th><th>عدد العقود</th><th>النقدي</th><th>الإجمالي</th><th>الأقساط</th><th>المحصّل</th><th>المستحق</th><th>المتعثّر</th></tr></thead><tbody>"+rowsHtml+"</tbody></table></body></html>");
    w.document.close();
  };
  return (
    <div style={styles.panel}>
      <div style={{...styles.panelHdr,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <button onClick={onBack} style={{...styles.btn("#e5e7eb","#374151"),fontSize:14,padding:"7px 14px"}}>‹ رجوع</button>

            <svg width="15" height="15" viewBox="0 0 24 24"><g fill="none" stroke="#e0b85c" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M7 9V4h10v5M6 18H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1M7 15h10v5H7Z"/></g></svg>
            طباعة التقرير</button>
          {isClosed
            ? <button onClick={onReopen} style={{background:"linear-gradient(135deg,#1a1a2e,#0f3460)",color:"#e0b85c",border:"none",borderRadius:10,fontSize:14,fontWeight:800,padding:"8px 16px",cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial",display:"inline-flex",alignItems:"center",gap:6}}>
                <svg width="15" height="15" viewBox="0 0 24 24"><g fill="none" stroke="#e0b85c" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7-2.6"/></g></svg>
                فتح الشهر</button>
            : <button onClick={onClose} style={{...styles.btn(C.green,"#fff"),fontSize:14,padding:"8px 16px",display:"inline-flex",alignItems:"center",gap:6}}>
                <svg width="15" height="15" viewBox="0 0 24 24"><g fill="none" stroke="#fff" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g></svg>
                إقفال هذا الشهر</button>}
        </div>
      </div>
      <div style={{padding:16}}>
        <div style={{fontSize:12,color:"#9ca3af",marginBottom:8}}>اسحب البطاقات لإعادة ترتيبها — يُحفظ الترتيب تلقائياً</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:24}}>
          {orderedCards.map(([l,v,col,isCount,key],i)=>{
            const rows=(d.details&&d.details[key])||[];
            return (
            <div key={key} draggable
              onDragStart={()=>setDragIdx(i)}
              onDragOver={e=>e.preventDefault()}
              onDrop={()=>onDrop(i)}

              style={{...styles.card,textAlign:"center",borderTop:"4px solid #1a1a2e",cursor:"grab",opacity:dragIdx===i?0.5:1}}>
              <div style={{fontSize:13,color:"#1a1a2e",marginBottom:6,fontWeight:700}}>{l}</div>
              <div style={{fontSize:22,fontWeight:900,color:"#c8922a"}}>{isCount?v:SAR(v)}</div>
              {rows.length>0 && <div style={{fontSize:11,color:"#64748b",marginTop:4,fontWeight:700}}>التفاصيل ({rows.length}) ›</div>}

        {/* مودال تفاصيل البطاقة */}

                    <div>

                      <div style={{fontSize:12,color:"#1f2937",marginTop:2}}>{r.inv}{r.type?(" • "+r.type):""}{r.date?(" • "+fmtDate(r.date)):""}</div>
                    </div>
                    <div style={{fontWeight:900,fontSize:15,color:cardDetail.color,whiteSpace:"nowrap"}}>{cardDetail.isCount?SAR(r.amount):SAR(r.amount)}</div>

              <div style={{display:"flex",justifyContent:"space-between",padding:"12px",marginTop:10,background:cardDetail.color,color:"#fff",borderRadius:8,fontWeight:900,fontSize:16}}>
                <span>الإجمالي ({cardDetail.rows.length})</span>
                <span>{SAR(cardDetail.rows.reduce((s,r)=>s+(r.amount||0),0))}</span>
              </div>
            </div>
          )}
        </Modal>

        <div style={{fontSize:17,fontWeight:900,color:C.ink,borderRight:"4px solid "+C.gold,paddingRight:12,marginBottom:12}}>محصلة المستثمرين</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",borderRadius:10,overflow:"hidden"}}>
            <thead><tr>
              <th style={th}>المستثمر</th><th style={th}>عدد العقود</th><th style={th}>النقدي</th>
              <th style={th}>الإجمالي</th><th style={th}>الأقساط</th><th style={th}>المحصّل</th>
              <th style={th}>المستحق</th><th style={th}>المتعثّر</th>
            </tr></thead>
            <tbody>
              {d.invRows.map((r,i)=>(
                <tr key={i} style={{background:i%2?"#fafafa":"#fff"}}>
                  <td style={{...td,textAlign:"right",fontWeight:800,color:C.ink}}>{r.name}</td>
                  <td style={{...td,fontWeight:700}}>{r.count}</td>
                  <td style={td}>{SAR(r.cash)}</td>
                  <td style={{...td,color:"#7c3aed"}}>{SAR(r.total)}</td>
                  <td style={{...td,color:"#9a6a00"}}>{SAR(r.inst)}</td>
                  <td style={{...td,color:C.green,fontWeight:700}}>{SAR(r.coll)}</td>
                  <td style={td}>{SAR(r.due)}</td>
                  <td style={{...td,color:r.late>0?C.red:"#9ca3af",fontWeight:r.late>0?800:400}}>{SAR(r.late)}</td>
                </tr>
              ))}
              {d.invRows.length===0 && <tr><td colSpan={8} style={{...td,padding:24,color:"#6b7280"}}>لا يوجد مستثمرون</td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{fontSize:17,fontWeight:900,color:C.ink,borderRight:"4px solid #2563eb",paddingRight:12,marginTop:28,marginBottom:12}}>إجمالي المتبقي لكل مستثمر</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",borderRadius:10,overflow:"hidden"}}>
            <thead><tr>
              <th style={th}>المستثمر</th><th style={th}>عدد العقود</th><th style={th}>رأس المال</th>
              <th style={th}>الإجمالي بالفائدة</th><th style={th}>المحصّل</th>
              <th style={th}>المتبقي</th><th style={th}>نسبة التحصيل</th>
            </tr></thead>
            <tbody>
              {sortedInvestors(investors).map((iv,i)=>{
                const ic=allC.filter(c=>String(c.investorId)===String(iv.id));
                const cash=ic.reduce((s,c)=>s+(+c.amount||0),0);
                const total=ic.reduce((s,c)=>s+(+c.totalInst||+c.amount||0),0);
                const paid=ic.reduce((s,c)=>s+_getPaid(payments,c.id),0);
                const rem=Math.max(0,total-paid);
                const pct=total>0?Math.round((paid/total)*100):0;
                return(<tr key={i} style={{background:i%2?"#fafafa":"#fff"}}>
                  <td style={{...td,textAlign:"right",fontWeight:800}}>{invLabel(iv)}</td>
                  <td style={{...td,fontWeight:700}}>{ic.length}</td>
                  <td style={td}>{SAR(cash)}</td>
                  <td style={{...td,color:"#7c3aed"}}>{SAR(total)}</td>
                  <td style={{...td,color:C.green,fontWeight:700}}>{SAR(paid)}</td>
                  <td style={{...td,color:rem>0?C.red:C.green,fontWeight:800}}>{SAR(rem)}</td>
                  <td style={{...td,fontWeight:700}}><div style={{background:"#e5e7eb",borderRadius:6,overflow:"hidden",height:18,position:"relative"}}><div style={{background:pct>=80?"#34d399":pct>=50?"#fbbf24":"#f87171",height:"100%",width:pct+"%",borderRadius:6,transition:"width 0.5s"}}/><span style={{position:"absolute",top:0,right:0,left:0,textAlign:"center",fontSize:11,lineHeight:"18px",fontWeight:800}}>{pct}%</span></div></td>
                </tr>);
              })}
            </tbody>
            <tfoot><tr style={{background:"#f1f5f9"}}>
              {(()=>{const tc=allC,cash=tc.reduce((s,c)=>s+(+c.amount||0),0),total=tc.reduce((s,c)=>s+(+c.totalInst||+c.amount||0),0),paid=tc.reduce((s,c)=>s+_getPaid(payments,c.id),0),rem=Math.max(0,total-paid),pct=total>0?Math.round((paid/total)*100):0;return(<><td style={{...td,fontWeight:900}}>المجموع</td><td style={{...td,fontWeight:900}}>{tc.length}</td><td style={{...td,fontWeight:900}}>{SAR(cash)}</td><td style={{...td,fontWeight:900,color:"#7c3aed"}}>{SAR(total)}</td><td style={{...td,fontWeight:900,color:C.green}}>{SAR(paid)}</td><td style={{...td,fontWeight:900,color:rem>0?C.red:C.green}}>{SAR(rem)}</td><td style={{...td,fontWeight:900}}>{pct}%</td></>);})()}
            </tr></tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}

function Dashboard({contracts,investors,settings,setInvestors,daily,setDaily,dailyOpen,setDailyOpen,toast,setPage,payments,zakatTx,setZakatTx,loans,setLoans}) {
  const [detail,setDetail] = useState(null); // {title, color, rows, mode}
  // Period: starts 21st of month, ends 20th of next month
  const getPeriod = (dateStr) => fiscalYM(dateStr);
  const months=[...new Set(contracts.map(c=>getPeriod(c.date)))].sort().reverse();
  if(!months.length){const now=new Date();months.push(now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0"));}
  const [sel,setSel]=useState(months[0]||"");
  const mLabel=ym=>{const[y,m]=ym.split("-");return"شهر "+parseInt(m)+" - "+y;};
  const mc=contracts.filter(c=>getPeriod(c.date)===sel);
  const tot=mc.reduce((a,c)=>{const r=calcC(c,settings);return{amt:a.amt+c.amount,profit:a.profit+r.profit,admin:a.admin+r.admin,acc:a.acc+r.acc,inst:a.inst+r.inst,net:a.net+r.net};},{amt:0,profit:0,admin:0,acc:0,inst:0,net:0});

  // ═══ مؤشرات المحفظة (لحظية) ═══
  const allC = contracts.filter(c=>!c.deleted);
  // ١. المحصّل هذا الشهر: مجموع الدفعات اللي تقع فترتها المالية = الشهر المختار
  const collectedThisMonth = (payments||[]).filter(p=>p.date && getPeriod(p.date)===sel).reduce((s,p)=>s+(+p.amount||0),0);
  // ٢. إجمالي المتبقي على الزبائن: (إجمالي كل عقد − المحصّل منه)
  const totalRemaining = allC.reduce((s,c)=>s+Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id)),0);
  // ٣. المستحق هذا الشهر: مجموع الأقساط الواجبة حتى نهاية الشهر المختار، ناقص المدفوع (بحد أقصى قسط الشهر)
  const [selY,selM]=sel.split("-").map(Number);
  const periodEnd = new Date(selY, selM, 20); // نهاية الفترة المالية للشهر المختار (20 من الشهر التالي)
  const dueThisMonth = allC.reduce((s,c)=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0||!c.firstInst) return s;
    const first=new Date(c.firstInst);
    if(first>periodEnd) return s; // ما بدأت أقساطه بعد
    const totalCount=Math.max(1,Math.round(total/inst));
    let elapsed=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
    if(periodEnd.getDate()>=first.getDate()) elapsed+=1;
    const dueCount=Math.min(Math.max(0,elapsed),totalCount);
    const dueAmt=dueCount*inst;
    const paid=_getPaid(payments,c.id);
    return s+Math.max(0,Math.min(inst, dueAmt-paid)); // المستحق المتبقي لهذا الشهر (قسط واحد كحد أقصى)
  },0);

  // ═══ تفاصيل كل مؤشر (تظهر عند الضغط) ═══
  const invNameOf = id => (investors.find(i=>String(i.id)===String(id))||{}).name || "—";
  // قائمة المحصّل: كل دفعة وقعت في الشهر المختار
  const collectedList = (payments||[]).filter(p=>p.date && getPeriod(p.date)===sel)
    .map(p=>{const c=allC.find(k=>k.id===p.contractId);return {name:c?c.client:"—", num:c?c.num:"", amount:+p.amount||0, date:p.date};})
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  // قائمة المتبقي: كل عقد عليه متبقي
  const remainingList = allC.map(c=>({name:c.client, num:c.num, inv:invNameOf(c.investorId), amount:Math.max(0,(+c.totalInst||+c.amount||0)-_getPaid(payments,c.id))}))
    .filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);
  // قائمة المستحق: كل عقد عليه مستحق هذا الشهر
  const dueList = allC.map(c=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0||!c.firstInst) return null;
    const first=new Date(c.firstInst);
    if(first>periodEnd) return null;
    const totalCount=Math.max(1,Math.round(total/inst));
    let elapsed=(periodEnd.getFullYear()-first.getFullYear())*12+(periodEnd.getMonth()-first.getMonth());
    if(periodEnd.getDate()>=first.getDate()) elapsed+=1;
    const dueCount=Math.min(Math.max(0,elapsed),totalCount);
    const amt=Math.max(0,Math.min(inst,(dueCount*inst)-_getPaid(payments,c.id)));
    return amt>0?{name:c.client, num:c.num, inv:invNameOf(c.investorId), amount:amt}:null;
  }).filter(Boolean).sort((a,b)=>b.amount-a.amount);

  // ═══ لوحة شغل اليوم ═══
  const invNm = id => (investors.find(i=>String(i.id)===String(id))||{}).name || "—";
  const today = new Date();
  const todayStr = today.getFullYear()+"/"+String(today.getMonth()+1).padStart(2,"0")+"/"+String(today.getDate()).padStart(2,"0");
  // المحصّل اليوم فعلياً
  const collectedToday = (payments||[]).filter(p=>{ if(!p.date) return false; const d=new Date(p.date); return d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate(); }).reduce((s,p)=>s+(+p.amount||0),0);
  // العقود حسب المخاطر (غير المكتملة)
  const withRisk = allC.map(c=>({c, r:assessRisk(c,payments)})).filter(x=>x.r.level!=="—" && x.r.level!=="مكتمل");
  const troubled = withRisk.filter(x=>x.r.months>=2).sort((a,b)=>b.r.months-a.r.months); // متعثّر/متأخر
  const slightLate = withRisk.filter(x=>x.r.months===1);
  // مستحقّون هذا الأسبوع: قسطهم يحل خلال 7 أيام قادمة (تقريبياً حسب يوم أول قسط)
  const dueSoon = allC.map(c=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0||!c.firstInst) return null;
    const paid=_getPaid(payments,c.id);
    if(total>0 && paid>=total) return null;
    const first=new Date(c.firstInst);
    let nextDue;
    if(first>today){
      // أول قسط لم يبدأ بعد: تاريخ الاستحقاق هو تاريخ أول قسط نفسه (بشهره وسنته)
      nextDue=new Date(first.getFullYear(),first.getMonth(),first.getDate());
    } else {
      // بدأت الأقساط: نحسب قسط هذا الشهر أو الذي يليه بناءً على يوم الاستحقاق
      const dueDay=first.getDate();
      nextDue=new Date(today.getFullYear(),today.getMonth(),dueDay);
      if(nextDue<today) nextDue.setMonth(nextDue.getMonth()+1);
    }
    const diffDays=Math.ceil((nextDue-today)/(1000*60*60*24));
    return (diffDays>=0 && diffDays<=7) ? {c, days:diffDays, inst} : null;
  }).filter(Boolean).sort((a,b)=>a.days-b.days);

  // ═══ أقساط الشهر / المنجز — مربوطة بالإقفال الشهري ═══
  const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
  const _base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
  const cycleStart = _base && _base.date ? _base.date : null; // تاريخ آخر إقفال (بداية الدورة)
  // تواريخ الدورة للعرض: من بداية الدورة إلى نفس اليوم الشهر القادم
  const cycleFrom = cycleStart ? new Date(cycleStart) : new Date(today.getFullYear(), today.getMonth(), 21);
  const cycleTo = new Date(cycleFrom.getFullYear(), cycleFrom.getMonth()+1, cycleFrom.getDate());
  const arMonths=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const fmtCycle = d => d.getDate()+" "+arMonths[d.getMonth()];
  const cycleLabel = fmtCycle(cycleFrom)+" ← "+fmtCycle(cycleTo);

  // الهدف: قسط شهر واحد لكل عقد نشط (له متبقي)
  const targetRows = allC.map(c=>{
    const inst=+c.instAmt||0, total=+c.totalInst||+c.amount||0;
    if(inst<=0) return null;
    const paid=_getPaid(payments,c.id);
    const rem=Math.max(0,total-paid);
    if(rem<=0) return null;
    if(c.contractType==="defer") return null; // المؤجل ما له قسط شهري
    const due=Math.min(inst,rem);
    // هل سُدّد ضمن الدورة الحالية؟
    const paidInCycle=(payments||[]).filter(p=>p.contractId===c.id && p.date && (!cycleStart || p.date>=cycleStart))
      .reduce((s,p)=>s+(+p.amount||0),0);
    return {c, due, paidInCycle, isPaid:paidInCycle>0};
  }).filter(Boolean).sort((a,b)=>b.due-a.due);

  const targetAmount = targetRows.reduce((s,r)=>s+r.due,0);
  const targetCount = targetRows.length;
  // المنجز: السدادات المسجّلة في الدورة الحالية لعقود الهدف
  const doneRows = targetRows.filter(r=>r.isPaid);
  const doneAmount = doneRows.reduce((s,r)=>s+Math.min(r.due,r.paidInCycle),0);
  const doneCount = doneRows.length;
  const remCount = targetCount - doneCount;
  const remAmount = targetAmount - doneAmount;
  const donePct = targetAmount>0 ? Math.round(doneAmount/targetAmount*100) : 0;

  const SARf = v => (v||0).toLocaleString("en-US",{maximumFractionDigits:0});
  const shortD = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "";

  return (
    <div>
      {/* شريط دورة الشهر */}
      <div style={{background:C.white,borderRadius:12,padding:"9px 14px",marginBottom:11,display:"flex",
        alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}>
        <span style={{fontSize:14}}>🗓️</span>
        <span style={{fontSize:12.5,fontWeight:700,color:C.ink2}}>دورة الشهر:</span>
        <span style={{fontSize:13,fontWeight:800,color:C.teal}}>{cycleLabel}</span>
      </div>

      {/* المربعين: أقساط الشهر / المنجز */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11,marginBottom:11}}>
        <div onClick={()=>setDetail({mode:"target"})}
          style={{background:"#fff",border:"1px solid #e6eaf0",borderRadius:16,padding:"16px 15px",cursor:"pointer",
          position:"relative",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.04)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div style={{fontSize:12.5,fontWeight:700,color:"#64748b"}}>أقساط الشهر</div>
            <div style={{width:32,height:32,borderRadius:9,background:"#fefbf3",border:"1px solid #f0e0c0",
              display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="17" height="17" viewBox="0 0 24 24"><g fill="none" stroke="#c8922a" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/></g><circle cx="12" cy="12" r="1.5" fill="#a87520"/></svg>
            </div>
          </div>
          <div style={{fontSize:29,fontWeight:800,lineHeight:1,letterSpacing:"-.5px",color:"#1a1a2e"}}>{SARf(targetAmount)}</div>
          <div style={{fontSize:11.5,color:"#64748b",marginTop:8,fontWeight:600}}>{targetCount} قسط</div>
          <div style={{position:"absolute",bottom:0,right:0,left:0,height:3,background:"#c8922a"}}/>
        </div>
        <div onClick={()=>setDetail({mode:"done"})}
          style={{background:"#fff",border:"1px solid #e6eaf0",borderRadius:16,padding:"16px 15px",cursor:"pointer",
          position:"relative",overflow:"hidden",boxShadow:"0 2px 10px rgba(0,0,0,.04)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
            <div style={{fontSize:12.5,fontWeight:700,color:"#64748b"}}>المنجز منها</div>

const DAILY_TYPES = [
  {key:"sadad",   label:"سداد",          sign:1,  color:"#16a34a"},
  {key:"sahb",    label:"سحب",           sign:-1, color:"#16a34a"},
  {key:"masroof", label:"مصروف",         sign:-1, color:"#dc2626"},
  {key:"estilam", label:"استلمت نقدي",   sign:-1, color:"#dc2626"},
  {key:"mgr",     label:"استلام مدير",   sign:-1, color:"#b45309"},
  {key:"acc",     label:"استلام محاسب",  sign:-1, color:"#b45309"},
  {key:"zakat",   label:"زكاة",          sign:-1, color:"#7c3aed"},
  {key:"salf",    label:"سلف",           sign:-1, color:"#7c3aed"},
];
function DailyPage({daily, setDaily, dailyOpen, setDailyOpen, contracts, settings, toast, zakatTx, setZakatTx, loans, setLoans, investors, payments}) {
  const today = todayLocal();
  const [selDay,setSelDay] = useState(today);
  const [baseInput,setBaseInput] = useState("");
  const [baseDateInput,setBaseDateInput] = useState(today);
  const [editingBase,setEditingBase] = useState(false);
  const [form,setForm] = useState({type:"sadad", amount:"", desc:"", channel:"cash"});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  // ═══ كشف حساب شامل: فترة (من/إلى) + بحث + فلتر نوع ═══
  const [stmtFrom,setStmtFrom] = useState("");
  const [stmtTo,setStmtTo]     = useState("");
  const [stmtQuery,setStmtQuery] = useState("");   // نص البحث (اسم/وصف)
  const [stmtTypeFilter,setStmtTypeFilter] = useState("all"); // فلتر النوع
  const [stmtShowAll,setStmtShowAll] = useState(false); // عرض كل التفاصيل أم أعلى 10

  // حركات اليوم المحدد
  const dayRows = (Array.isArray(daily)?daily:[]).filter(d=>d.date===selDay).sort((a,b)=>a.id-b.id);

  // ═══ رصيد بداية الصندوق: نقطة واحدة ثابتة ═══
  const _daily = Array.isArray(daily) ? daily : [];
  const _dailyOpen = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
  const base = _dailyOpen.__base && typeof _dailyOpen.__base==="object" ? _dailyOpen.__base : null;
  const baseAmount = base ? (+base.amount||0) : 0;
  const baseDate = base ? base.date : "0000-00-00";
  // الرصيد الافتتاحي لليوم المختار = رصيد البداية + صافي كل الحركات النقدية من تاريخ البداية حتى أمس
  const prevNet = _daily.filter(d=>d.date < selDay && d.date >= baseDate && d.channel!=="transfer")
    .reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
  const openingBalance = baseAmount + prevNet;

  // صافي حركات اليوم (النقدية فقط)
  const dayNet = dayRows.filter(d=>d.channel!=="transfer").reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
  const closingBalance = openingBalance + dayNet;

  // إجماليات حسب النوع لهذا اليوم
  const sumByType = (k)=>dayRows.filter(d=>d.type===k).reduce((s,d)=>s+(d.amount||0),0);

  // نصيب المدير والمحاسب من عقود هذا اليوم
  const dayContracts = contracts.filter(c=>c.date===selDay);
  const mgrShare = dayContracts.reduce((s,c)=>s+calcC(c,settings).inst,0);
  const accShare = dayContracts.reduce((s,c)=>s+calcC(c,settings).acc,0);

  // الحساب الكامل: المستحق من عقود الدورة الحالية - المستلم من يومية الدورة الحالية
  // العقود قبل بداية الدورة (baseDate) مؤرشفة، استحقاقها احتُسب في دورة سابقة
  const cycleContracts = contracts.filter(c=>!c.date || c.date >= baseDate);
  const mgrEarnedAll = cycleContracts.reduce((s,c)=>s+calcC(c,settings).inst,0);
  const accEarnedAll = cycleContracts.reduce((s,c)=>s+calcC(c,settings).acc,0);
  const mgrTakenAll = _daily.filter(d=>d.type==="mgr" && d.date>=baseDate).reduce((s,d)=>s+(d.amount||0),0);
  const accTakenAll = _daily.filter(d=>d.type==="acc" && d.date>=baseDate).reduce((s,d)=>s+(d.amount||0),0);
  const mgrLeft = mgrEarnedAll - mgrTakenAll;
  const accLeft = accEarnedAll - accTakenAll;

  // ═══ كشف حساب شامل عبر كل الأيام (أو ضمن فترة محددة) ═══
  // يحترم بداية الدورة الحالية (baseDate): الحركات قبلها مؤرشفة ولا تظهر
  const stmtRows = _daily.filter(d=>{
    if(d.date < baseDate) return false;  // قبل بداية الدورة = مؤرشف
    if(stmtFrom && d.date < stmtFrom) return false;
    if(stmtTo   && d.date > stmtTo)   return false;
    return true;
  });
  const stmtTotals = DAILY_TYPES.map(t=>({
    ...t,
    total: stmtRows.filter(d=>d.type===t.key).reduce((s,d)=>s+(+d.amount||0),0),
    count: stmtRows.filter(d=>d.type===t.key).length,
  }));
  const stmtIn  = stmtTotals.filter(t=>t.sign>0).reduce((s,t)=>s+t.total,0);
  const stmtOut = stmtTotals.filter(t=>t.sign<0).reduce((s,t)=>s+t.total,0);
  const stmtNet = stmtIn - stmtOut;

  // ═══ الحركات التفصيلية المصفّاة (بحث + نوع) — تعرض "مَن" وراء كل حركة ═══
  // التفاصيل تعرض الكل (قديم + جديد) مع فاصل "بداية الشهر الجديد"
  // بينما الإجماليات (stmtRows) محصورة بالدورة الحالية فقط
  const stmtDetailSource = _daily.filter(d=>{
    if(stmtFrom && d.date < stmtFrom) return false;
    if(stmtTo   && d.date > stmtTo)   return false;
    return true;
  });
  const _q = stmtQuery.trim().toLowerCase();
  const stmtDetailRows = stmtDetailSource
    .filter(d => stmtTypeFilter==="all" ? true : d.type===stmtTypeFilter)
    .filter(d => !_q ? true : ((d.desc||"").toLowerCase().includes(_q)))

        const NF = v => (v||0).toLocaleString("en-US",{maximumFractionDigits:0});
        const _now = new Date();

        // ═══ حساب بيانات مستثمر واحد ═══
        const calcInv = (inv) => {
          const myCon = contracts.filter(c=>c.investorId===inv.id);
          const bidaya = +inv.bidaya||0;
          const capital = +inv.capital||0;
          const _auto = myCon.filter(c=>!c.isOldContract&&c.contractType!=="migrated")
            .reduce((s,c)=>{const rr=calcC(c,settings);return s-(c.amount+rr.acc+rr.inst+rr.admin);},0);
          const myPays = (payments||[]).filter(p=>myCon.some(c=>c.id===p.contractId));
          const paidSum = myPays.reduce((s,p)=>s+(+p.amount||0),0);
          const manualSum = ((txList&&txList[inv.id])||[]).reduce((s,t)=>s+(+t.amount||0),0);
          const netCash = capital + _auto + paidSum + manualSum;

          let leftMonthly=0, leftDefer=0, monthlyInst=0, overCount=0, overAmt=0, activeC=0, deferC=0;
          myCon.forEach(c=>{
            const total = +c.totalInst||+c.amount||0;
            const paid = _getPaid(payments,c.id);
            const rem = Math.max(0,total-paid);
            const isDefer = c.contractType==="defer";
            if(isDefer) deferC++;
            if(rem>0){
              activeC++;
              if(isDefer) leftDefer+=rem; else leftMonthly+=rem;
              const inst = +c.instAmt||0;
              if(!isDefer && inst>0){
                monthlyInst += inst;
                const sDate = c.firstInst||c.date;
                if(sDate){
                  const mEl = Math.max(0,Math.floor((_now-new Date(sDate))/(30.44*86400000)));
                  const od = Math.min(total,inst*mEl)-paid;
                  if(od>0){ overCount++; overAmt+=od; }
                }
              }
            }
          });
          const grand = netCash + leftMonthly + leftDefer;
          const profit = myCon.reduce((s,c)=>s+calcC(c,settings).net,0);
          const commAdmin = myCon.reduce((s,c)=>s+calcC(c,settings).admin,0);
          const commAcc = myCon.reduce((s,c)=>s+calcC(c,settings).acc,0);
          const working = myCon.reduce((s,c)=>
            c.contractType==="migrated" ? s+Math.round((+c.totalInst||0)*0.5) : s+(+c.amount||0), 0);
          const totalWP = myCon.reduce((s,c)=>s+(+c.totalInst||+c.amount||0),0);
          const collectPct = totalWP>0 ? Math.round(paidSum/totalWP*100) : 0;
          const roiReal = bidaya>0 ? (profit/bidaya*100) : null;
          const roiWork = working>0 ? (profit/working*100) : null;
          const avgC = myCon.length>0 ? Math.round(myCon.reduce((s,c)=>s+(+c.amount||0),0)/myCon.length) : 0;
          const lastPay = myPays.length>0 ? myPays.map(p=>p.date).filter(Boolean).sort().pop() : null;
          return {inv,myCon,bidaya,netCash,leftMonthly,leftDefer,grand,monthlyInst,profit,
            commAdmin,commAcc,working,collectPct,roiReal,roiWork,overCount,overAmt,
            activeC,doneC:myCon.length-activeC,deferC,avgC,lastPay};
        };

        const list = sortedInvestors(investors).map(calcInv);
        // ═══ المجاميع ═══
        const T = list.reduce((a,r)=>({

              <span style={{fontSize:11.5,color:K.gold,fontWeight:600}}>📥 المتوقع شهرياً</span>
              <span style={{fontSize:16,fontWeight:700,color:K.gold}}>{NF(T.inst)}</span>
            </div>
          </div>

          {/* ══════ بطاقات المستثمرين ══════ */}
          <div style={{display:"flex",flexDirection:"column",gap:11,maxWidth:1200,margin:"0 auto",width:"100%"}}>
          {list.map(r=>{
            const inv=r.inv, isOpen=openId===inv.id;
            const secLbl = t => (<div style={{fontSize:10,color:K.dim2,fontWeight:700,letterSpacing:".7px",

              {t}<span style={{flex:1,height:1,background:K.line}}/></div>);
            const kvRow = (k,v,col) => (<div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:12}}>
              <span style={{color:K.dim,fontWeight:500}}>{k}</span>

            const chip = (label,val,bc,vc) => (<span style={{fontSize:"clamp(10px,1.1vw,15px)",fontWeight:700,padding:"clamp(5px,0.7vw,10px) clamp(10px,1.2vw,18px)",
              borderRadius:9,background:K.panel2,border:"1px solid "+(bc||K.line),color:vc||K.gold}}>
              {label} <b style={{fontSize:"clamp(12px,1.3vw,18px)",color:vc||K.gold}}>{val}</b></span>);
            return (
            <div key={inv.id} style={{background:K.panel,border:"1px solid "+K.line,borderRadius:17,overflow:"hidden"}}>
              {/* رأس البطاقة */}
              <div data-inv-card="" onClick={()=>setOpenId(isOpen?null:inv.id)}
                style={{padding:"14px 15px",display:"flex",alignItems:"center",gap:11,cursor:"pointer"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div data-inv-name="" style={{fontSize:14,fontWeight:800,color:"#c8922a",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{inv.name}</div>
                  <div data-inv-sub="" style={{fontSize:11,color:K.dim,marginTop:2}}>{r.myCon.length} عقد · آخر سداد {shortDate(r.lastPay)}</div>
                </div>
                <div style={{textAlign:"left",flexShrink:0}}>
                  <div data-inv-total="" style={{fontSize:17,fontWeight:800,color:"#c8922a"}}>{NF(r.grand)}</div>
                  <div style={{fontSize:9,color:K.dim2}}>الإجمالي</div>
                </div>
                <span style={{color:K.dim2,fontSize:11,transform:isOpen?"rotate(180deg)":"none",transition:".25s"}}>▼</span>

              {/* جسم البطاقة */}
              {isOpen && (
              <div style={{padding:"0 15px 15px",borderTop:"1px solid "+K.line}}>
                <div style={{paddingTop:14}}>
                  {secLbl("الوضع الحالي")}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:1,background:"rgba(255,255,255,.06)",borderRadius:11,overflow:"hidden",marginBottom:14}}>
                    <div style={{background:K.panel2,padding:"clamp(10px,1.5vw,18px) clamp(12px,1.5vw,20px)"}}>
                      <div style={{fontSize:"clamp(11px,1.2vw,16px)",color:"#fff",fontWeight:600,marginBottom:3}}>البداية</div>
                      <div style={{fontSize:"clamp(15px,1.8vw,24px)",fontWeight:700,color:K.gold}}>{r.bidaya>0?NF(r.bidaya):"—"}</div>
                    </div>
                    <div style={{background:K.panel2,padding:"clamp(10px,1.5vw,18px) clamp(12px,1.5vw,20px)"}}>
                      <div style={{fontSize:"clamp(11px,1.2vw,16px)",color:"#fff",fontWeight:600,marginBottom:3}}>النقدي حالياً</div>
                      <div style={{fontSize:"clamp(15px,1.8vw,24px)",fontWeight:700,color:r.netCash>=0?K.gold:K.red}}>{NF(r.netCash)}</div>

                    <div style={{background:K.panel2,padding:"clamp(10px,1.5vw,18px) clamp(12px,1.5vw,20px)"}}>
