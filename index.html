class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:null,info:null};}
  static getDerivedStateFromError(err){return {err};}
  componentDidCatch(err,info){this.setState({err,info});}
  render(){
    if(this.state.err){
      return React.createElement('div',{style:{padding:20,fontFamily:'monospace',direction:'ltr',textAlign:'left',background:'#fff',color:'#b00',fontSize:13,whiteSpace:'pre-wrap',lineHeight:1.6}},
        '⚠️ خطأ في البرنامج:\n\n'+(this.state.err&&this.state.err.toString())+'\n\n'+
        (this.state.err&&this.state.err.stack?this.state.err.stack.split('\n').slice(0,8).join('\n'):'')+'\n\n'+
        (this.state.info&&this.state.info.componentStack?this.state.info.componentStack.split('\n').slice(0,8).join('\n'):'')
      );
    }
    return this.props.children;
  }
}

function LoginGate() {
  const [user, setUser] = React.useState(undefined); // undefined=جارٍ الفحص، null=غير مسجّل
  const [email, setEmail] = React.useState("");
  const [pass, setPass] = React.useState("");
  const [err, setErr] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [mode, setMode] = React.useState("login"); // login | signup

  React.useEffect(()=>{
    let unsub = null;
    let tries = 0;
    const check = () => {
      if(window._fbFailed){ setUser("nofirebase"); return; }   // فشل التحميل → ادخل عادي (Google Sheets)
      if(window._fbReady && window._fbAuth){
        unsub = window._fbAuth.onAuthStateChanged(u=>setUser(u||null));
        return;
      }
      if(tries < 100){ tries++; setTimeout(check, 150); }       // ينتظر المصادر المتعددة (٣٠ ثانية)
      else { setUser("nofirebase"); }                           // مهلة → ادخل عادي
    };
    check();
    return ()=>{ if(unsub) unsub(); };
  },[]);

  const doAuth = async () => {
    setErr(""); setBusy(true);
    try {
      if(mode==="signup") await window._fbAuth.createUserWithEmailAndPassword(email.trim(), pass);
      else await window._fbAuth.signInWithEmailAndPassword(email.trim(), pass);
    } catch(e){
      const m = {
        "auth/invalid-email":"البريد غير صحيح",
        "auth/user-not-found":"الحساب غير موجود",
        "auth/wrong-password":"كلمة السر خاطئة",
        "auth/invalid-credential":"البريد أو كلمة السر خاطئة",
        "auth/email-already-in-use":"البريد مستخدم — سجّل دخول",
        "auth/weak-password":"كلمة السر قصيرة (٦ أحرف على الأقل)",
      }[e.code] || "خطأ: "+(e.message||e.code);
      setErr(m);
    }
    setBusy(false);
  };

  // لو Firebase غير جاهز، ادخل مباشرة (احتياط)
  if(user==="nofirebase") return <ErrorBoundary><App/></ErrorBoundary>;
  if(user===undefined) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"IBM Plex Sans Arabic,Arial",fontSize:18,color:"#0f1e33"}}>⏳ جارٍ التحميل...</div>;
  if(user) return <ErrorBoundary><App/></ErrorBoundary>;

  // شاشة الدخول
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f1e33,#1e293b)",fontFamily:"IBM Plex Sans Arabic,Arial",padding:20}}>
      <div style={{background:"#fff",borderRadius:18,padding:"34px 28px",width:"100%",maxWidth:380,boxShadow:"0 10px 40px rgba(0,0,0,0.3)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:26,fontWeight:900,color:"#0f1e33"}}>مؤسسة قمة الفرصة</div>
          <div style={{fontSize:15,color:"#64748b",marginTop:4}}>نظام إدارة التقسيط والمستثمرين</div>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:14,fontWeight:700,color:"#334155",display:"block",marginBottom:6}}>البريد الإلكتروني</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="example@email.com"
            style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"2px solid #e2e8f0",fontSize:15,fontFamily:"IBM Plex Sans Arabic,Arial",boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:18}}>
          <label style={{fontSize:14,fontWeight:700,color:"#334155",display:"block",marginBottom:6}}>كلمة السر</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"
            onKeyDown={e=>e.key==="Enter"&&doAuth()}
            style={{width:"100%",padding:"12px 14px",borderRadius:10,border:"2px solid #e2e8f0",fontSize:15,fontFamily:"IBM Plex Sans Arabic,Arial",boxSizing:"border-box"}}/>
        </div>
        {err && <div style={{background:"#fef2f2",color:"#dc2626",padding:"10px 12px",borderRadius:8,fontSize:14,marginBottom:14,fontWeight:600}}>⚠️ {err}</div>}
        <button onClick={doAuth} disabled={busy||!email||!pass}
          style={{width:"100%",padding:"13px",borderRadius:10,border:"none",background:busy?"#94a3b8":"#c8922a",color:"#fff",fontSize:16,fontWeight:800,cursor:busy?"default":"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}}>
          {busy?"⏳ جارٍ...":(mode==="signup"?"إنشاء حساب":"تسجيل الدخول")}
        </button>
        <div style={{textAlign:"center",marginTop:16,fontSize:13,color:"#94a3b8"}}>
          🔒 نظام مغلق — للمستخدمين المصرّح لهم فقط
        </div>
      </div>
    </div>
  );
}

const _rootEl = document.getElementById('root');
_rootEl.setAttribute("data-app-rendered","1"); // إعلام طبقة التشخيص أن التطبيق بدأ
const root = ReactDOM.createRoot(_rootEl);
root.render(<ErrorBoundary><LoginGate /></ErrorBoundary>);
</script>
<script>
/* ═══ ضمان تشغيل Babel: لو لم يحوّل السكربت تلقائياً، حوّله يدوياً ═══ */
(function(){
  function appStarted(){
    var r=document.getElementById("root");
    return r && r.getAttribute("data-app-rendered")==="1";
  }
  function runManually(){
    if(appStarted()) return;
    if(typeof Babel==="undefined"){ console.warn("Babel غير جاهز بعد"); return; }
    var el=document.getElementById("main-app-script");
    if(!el){ console.warn("لم يُعثر على سكربت التطبيق"); return; }
    try{
      console.log("↻ تحويل التطبيق يدوياً عبر Babel...");
      var out=Babel.transform(el.textContent,{presets:["react"]}).code;
      // تشغيل الكود في نفس النطاق لالتقاط الخطأ الحقيقي (بدل appendChild الذي يخفيه كـ Script error)
      (0, eval)(out);
      console.log("✓ اكتمل التحويل والتشغيل اليدوي");
    }catch(err){
      var box=document.getElementById("root");
      if(box && !appStarted()){
        var msg=(err&&(err.message||String(err)))||"خطأ تحويل غير معروف";
        var stack=(err&&err.stack)||"";
        box.innerHTML='<div dir="rtl" style="min-height:100vh;background:#fff5f5;padding:24px 16px;font-family:Arial,sans-serif;color:#111"><div style="max-width:640px;margin:0 auto;background:#fff;border:2px solid #dc2626;border-radius:14px;padding:20px"><div style="font-size:22px;font-weight:900;color:#dc2626;margin-bottom:10px">⚠️ خطأ في كود التطبيق</div><div style="font-size:15px;color:#334155;margin-bottom:14px">انسخ النص وأرسله للمطوّر:</div><div id="diag-box" style="background:#0f172a;color:#fca5a5;padding:12px 14px;border-radius:10px;font-size:13px;font-family:monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;margin-bottom:12px">'+msg+"\n\n"+stack+'</div><button onclick="try{navigator.clipboard.writeText(document.getElementById(\'diag-box\').innerText);this.textContent=\'✓ تم النسخ\'}catch(e){}" style="width:100%;padding:12px;border-radius:10px;border:none;background:#c8922a;color:#fff;font-size:15px;font-weight:800;cursor:pointer">📋 نسخ نص الخطأ</button></div></div>';
      }
      console.error("خطأ تحويل Babel:",err);
    }
  }
  // التحويل التلقائي معطّل (النوع text/babel-manual) — نشغّل يدوياً مرة واحدة عند جهوزية Babel
  var _ran=false;
  function tryRun(){
    if(_ran||appStarted()) return;
    if(typeof Babel==="undefined" || typeof React==="undefined" || typeof ReactDOM==="undefined"){ return; }
    _ran=true;
    runManually();
  }
  var _iv=setInterval(function(){ tryRun(); if(_ran||appStarted()) clearInterval(_iv); }, 200);
  if(document.readyState==="complete"){ tryRun(); }
  else { window.addEventListener("load", tryRun); }
  setTimeout(function(){ clearInterval(_iv); }, 25000);
})();
</script>
