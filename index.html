    }
    tryNext();
  })();
</script>
<script>
  // تحميل pdf.js عبر عدة مصادر بالتتابع (بعضها قد يكون محجوباً على بعض الشبكات)
  window._pdfjsStatus = "لم يبدأ";
  (function(){
    var sources = [
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js",
      "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.6.172/legacy/build/pdf.min.js"
    ];
    var workers = [
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js",
      "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js",
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.6.172/legacy/build/pdf.worker.min.js"
    ];
    var idx = 0;
    function ready(){ return window.pdfjsLib || window["pdfjs-dist/build/pdf"]; }
    function tryNext(){
      if(ready()){
        var lib = ready(); window.pdfjsLib = lib;
        try{ lib.GlobalWorkerOptions.workerSrc = workers[Math.max(0,idx-1)]; }catch(e){}
        window._pdfjsStatus = "محمّل ✓ (مصدر "+idx+")";
        return;
      }
      if(idx>=sources.length){ window._pdfjsStatus = "فشل — كل المصادر محجوبة ✗"; return; }
      var s = document.createElement("script");
      s.src = sources[idx]; idx++;
      s.onload = function(){ setTimeout(tryNext, 50); };
      s.onerror = function(){ window._pdfjsStatus = "المصدر "+idx+" محجوب، أجرّب التالي..."; setTimeout(tryNext, 50); };
      document.head.appendChild(s);
    }
    tryNext();
  })();
</script>
<script>
  // ═══ تحميل Firebase بالتسلسل (أضمن على الجوال) ═══
  window._fbReady = false;
  window._fbFailed = false;
  const firebaseConfig = {
    apiKey: "AIzaSyDpIOR4iSroK9I8My-ElFgamRnvFi9wHHE",
    authDomain: "qima-erp-654fa.firebaseapp.com",
    projectId: "qima-erp-654fa",
    storageBucket: "qima-erp-654fa.firebasestorage.app",
    messagingSenderId: "420467732319",
    appId: "1:420467732319:web:b3e60119decb1f0d5610ea"
  };
  function _loadScript(src){
    return new Promise(function(resolve,reject){
      var done=false;
      var s=document.createElement("script");
      s.src=src; s.async=false;
      s.onload=function(){ if(!done){done=true;resolve();} };
      s.onerror=function(){ if(!done){done=true;reject(new Error("fail "+src));} };
      // مهلة ٦ ثواني لكل سكربت — لو تعلّق، ننتقل للمصدر التالي
      setTimeout(function(){ if(!done){done=true;reject(new Error("timeout "+src));} }, 4000);
      document.head.appendChild(s);
    });
  }
  (async function(){
    // مصادر بديلة متعددة — لو حُجب مصدر، يجرّب التالي (يتجاوز حجب gstatic)
    var sources = [
      "https://cdn.jsdelivr.net/npm/firebase@10.12.2/",
      "https://unpkg.com/firebase@10.12.2/",
      "https://www.gstatic.com/firebasejs/10.12.2/",
      "https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/"
    ];
    // أسماء الملفات تختلف قليلاً بين المصادر
    function files(base){
      if(base.indexOf("gstatic")>-1) return [base+"firebase-app-compat.js", base+"firebase-auth-compat.js", base+"firebase-firestore-compat.js"];
      if(base.indexOf("cloudflare")>-1) return [base+"firebase-app-compat.min.js", base+"firebase-auth-compat.min.js", base+"firebase-firestore-compat.min.js"];
      // jsdelivr / unpkg
      return [base+"firebase-app-compat.js", base+"firebase-auth-compat.js", base+"firebase-firestore-compat.js"];
    }
    var loaded=false;
    for(var i=0;i<sources.length && !loaded;i++){
      try {
        var f=files(sources[i]);
        await _loadScript(f[0]);
        await _loadScript(f[1]);
        await _loadScript(f[2]);
        if(typeof firebase==="undefined") throw new Error("firebase undefined");
        if(!firebase.apps||!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        window._fbAuth=firebase.auth();
        window._fbDB=firebase.firestore();
        window._fbReady=true;
        loaded=true;
        console.log("✓ Firebase حُمّل من:", sources[i]);
      } catch(e){
        console.warn("تعذّر التحميل من "+sources[i]+" — تجربة المصدر التالي...");
      }
    }
    if(!loaded){
      window._fbFailed=true;
      console.warn("كل مصادر Firebase محجوبة — البرنامج يعمل بالوضع العادي (Google Sheets)");
    }
  })();
</script>
<style>
  * { box-sizing: border-box; }
  /* تمرير أفقي داخلي لكل الجداول العريضة — بدل تحريك الصفحة كلها */
  /* الجدول وحدة واحدة (thead+tbody يتطابقان تلقائياً)، والتمرير الأفقي على الحاوية */
  .table-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  table { width: 100%; min-width: max-content; border-collapse: collapse; }
  /* خطوط شبكة كاملة (أفقية وعمودية) لكل الخلايا — مثل Excel */
  table th, table td { border: 1px solid #cbd5e1; }
  /* رأس الجدول ثابت: يلتصق بأعلى الشاشة عند تمرير الصفحة وبأعلى الحاوية عند التمرير الداخلي */
  table thead th { position: -webkit-sticky; position: sticky; top: 0; z-index: 5; }
  /* شريط تمرير واضح */
  table::-webkit-scrollbar { height: 8px; }
  table::-webkit-scrollbar-thumb { background: #c8922a; border-radius: 4px; }
  table::-webkit-scrollbar-track { background: #f1f5f9; }

// تحجيم أعمدة الجداول
document.addEventListener('mousedown', function(e) {
  if (!e.target.classList.contains('col-resizer')) return;
  const th = e.target.parentElement;
  const table = th.closest('table');
  if (!table) return;
  table.style.tableLayout = 'fixed';
  const startX = e.clientX;
  const startW = th.offsetWidth;
  e.target.classList.add('active');
  const onMove = function(ev) {
    const dir = document.documentElement.dir === 'rtl' ? -1 : 1;
    const diff = (ev.clientX - startX) * dir;
    th.style.width = Math.max(40, startW + diff) + 'px';
  };
  const onUp = function() {
    e.target.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});
// إضافة resizer لكل th عند تحميل الصفحة وعند تغيير DOM
function addResizers() {
  document.querySelectorAll('table th:not(.resizable)').forEach(function(th) {
    th.classList.add('resizable');
    var div = document.createElement('div');
    div.className = 'col-resizer';
    th.appendChild(div);
  });
}
setInterval(addResizers, 2000);
</script>

function printContent(elementId) {
  var areas = ["contract-print-area","bond-print-area","cheque-print-area","bond-g-print-area","cheque-g-print-area","bond-cl-print-area","bond-gg-print-area"];
  var target = document.getElementById(elementId);
  if(!target){ window.print(); return; }
  // ننقل منطقة الطباعة إلى نهاية body ونخفي بقية التطبيق تماماً (display:none)
  // هذا يمنع الصفحات الفاضية/المكررة نهائياً
  var root = document.getElementById("root");
  var placeholder = document.createComment("print-placeholder");
  var parent = target.parentNode;
  parent.insertBefore(placeholder, target);
  var savedStyle = target.getAttribute("style") || "";
  document.body.appendChild(target);
  target.setAttribute("style", "display:block;position:static;left:0;width:100%;background:#fff;");
  target.classList.add("print-host");
  var rootDisplay = root ? root.style.display : "";
  if(root) root.style.display = "none";
  window.print();
  setTimeout(function(){
    if(root) root.style.display = rootDisplay;
    target.setAttribute("style", savedStyle);
    target.classList.remove("print-host");
    parent.insertBefore(target, placeholder);
    placeholder.remove();
  }, 300);
}

function calcContract(amount, s = {profit:50, admin:2.5, acc:10, inst:10}, totalActual) {
  amount = +amount || 0;
  // إذا مُرّر الإجمالي الفعلي (من العقد) واستخدمناه: الربح = الإجمالي − النقدي
  // وإلا (توافق مع القديم): الربح = النقدي × النسبة
  const hasTotal = totalActual != null && !isNaN(+totalActual) && +totalActual > 0;
  const profit = hasTotal ? Math.max(0, (+totalActual) - amount) : amount * (s.profit/100);
  const admin  = amount * (s.admin/100);
  const acc    = profit * (s.acc/100);
  const inst   = profit * (s.inst/100);
  const net    = profit - admin - acc - inst;
  const total  = hasTotal ? (+totalActual) : (amount + profit);
  return { profit, admin, acc, inst, net, total };
}
// مساعد: يحسب العقد باستخدام إجماليه الفعلي (totalInst)
function calcC(c, settings){ if(c.isOldContract) return {profit:0,admin:0,acc:0,inst:0,net:0,total:+c.totalInst||+c.amount||0}; if(c.contractType==='migrated'){const t=+c.totalInst||0;const p=Math.round(t*0.5);return{profit:p,admin:0,acc:0,inst:0,net:p,total:t};} return calcContract(+c.amount||0, settings, c.totalInst); }

function numToWords(n) {
  n = Math.round(n);
  const ones=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const tens=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hundreds=["","مائة","مئتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  if(n===0)return"صفر";
  let r="";
  if(n>=1000){const t=Math.floor(n/1000);r+=(t===1?"ألف":t===2?"ألفان":t<=10?ones[t]+" آلاف":numToWords(t)+" ألف")+" ";n%=1000;}
  if(n>=100){r+=hundreds[Math.floor(n/100)]+" ";n%=100;}
  if(n>=20){const o=n%10;r+=(o?ones[o]+" و":"")+tens[Math.floor(n/10)]+" ";n=0;}
  if(n>0)r+=ones[n]+" ";
  return r.trim();
}

function toHijri(dateStr) {
  if(!dateStr)return"..../.../14....";
  try{return new Date(dateStr).toLocaleDateString("ar-SA-u-ca-islamic",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\u200f/g,"");}
  catch{return dateStr;}
}

function addMonths(dateStr, n) {
  if(!dateStr)return"";
  const d=new Date(dateStr);
  d.setMonth(d.getMonth()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// الشهر المالي يبدأ من يوم 21: أي يوم قبل 21 يُحسب على الشهر السابق
function fiscalYM(dateInput){
  const d = new Date(dateInput);
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  if(dd.getDate() < 21){ dd.setMonth(dd.getMonth()-1); }
  return dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0");
}

function fmtDate(dateStr) {
  if(!dateStr)return"—";
  try{
    const d = new Date(dateStr);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}/${month}/${day}`;
  }
  catch{return dateStr;}
}

// ─── styles ────────────────────────────────────────────────
// ═══ ترقيم الأسماء المكررة في قائمة الزبائن ═══
// أي اسم يتكرر يصير "عبدالله 1"، "عبدالله 2" ... حتى تفرّق بينهم.
// يجرّد الرقم القديم أولاً فهو آمن للتكرار (لا ينتج "عبدالله 1 1").
// لا يحذف ولا يدمج أي سجل إطلاقاً — الحذف يدوي فقط.
const _baseName = n => String(n==null?"":n).trim().replace(/\s+\d+$/,"").trim();
const _numberDupNames = (list) => {
  if(!Array.isArray(list)) return list;
  const total = {};
  list.forEach(c => { const b=_baseName(c && c.name); if(b) total[b]=(total[b]||0)+1; });
  const seen = {};
  return list.map(c => {
    const b = _baseName(c && c.name);
    if(!b) return c;                            // بلا اسم: يُترك كما هو
    if(total[b] === 1) return {...c, name:b};    // اسم فريد: بلا رقم
    seen[b] = (seen[b]||0)+1;
    return {...c, name: b+" "+seen[b]};
  });
};

// ═══ تطبيع رقم الجوال السعودي — مشترك بين الزبائن والإضافة التلقائية ═══
// يقبل 05XXXXXXXX / 5XXXXXXXX / 966... / 00966... ويُرجع "" لو الرقم غير صالح
const _normSaPhone = v => {
  let s = String(v==null?"":v).replace(/[^\d]/g,"");
  if(!s) return "";
  if(s.startsWith("00966")) s = "0"+s.slice(5);
  else if(s.startsWith("966")) s = "0"+s.slice(3);
  else if(s.startsWith("5") && s.length===9) s = "0"+s;
  return /^05\d{8}$/.test(s) ? s : "";
};

// تُظهرها تحت بنك "مقاصة" عند الفلترة والطباعة، والعقد نفسه يبقى كما هو.
const _bankOf = c => (c && c.bankName) ? c.bankName : ((c && c.payMethod === "المقاصة") ? "مقاصة" : "");

// ─── Contracts Page ──────────────────────────────────────────
const _getPaid = (payments, cid) => (payments||[]).filter(p=>p.contractId===cid).reduce((s,p)=>s+p.amount,0);
// ترتيب موحد: المرحلة أولاً ثم حسب التاريخ
const _sortContracts = (arr) => [...arr].sort((a,b)=>{
  const am = a.contractType==="migrated"?0:1;
  const bm = b.contractType==="migrated"?0:1;
  if(am!==bm) return am-bm;
  return (a.date||"").localeCompare(b.date||"");
});

// يحسب عدد الأقساط المتأخرة (المستحقة وغير المدفوعة) ويعطي مستوى + لون
const assessRisk = (c, payments) => {
  const inst = +c.instAmt || 0;
  const total = +c.totalInst || +c.amount || 0;
  const paid = _getPaid(payments, c.id);
  if(total>0 && paid>=total) return {level:"مكتمل", months:0, overdue:0, color:"#3b82f6", score:0};
  if(inst<=0 || !c.firstInst) return {level:"—", months:0, overdue:0, color:"#9ca3af", score:0};
  const first = new Date(c.firstInst);
  const now = new Date();
  const totalCount = Math.max(1, Math.round(total/inst));
  // عدد الأقساط المفترض دفعها حتى اليوم
  let due = (now.getFullYear()-first.getFullYear())*12 + (now.getMonth()-first.getMonth());
  if(now.getDate() >= first.getDate()) due += 1;
  due = Math.min(Math.max(0,due), totalCount);
  const dueAmt = due * inst;
  const behindAmt = Math.max(0, dueAmt - paid);
  const monthsBehind = inst>0 ? Math.floor(behindAmt/inst) : 0;
  // المستوى حسب شهور التأخر
  let level, color, score;
  if(monthsBehind<=0){ level="منتظم"; color="#16a34a"; score=1; }
  else if(monthsBehind===1){ level="متأخر بسيط"; color="#eab308"; score=2; }
  else if(monthsBehind===2){ level="متأخر"; color="#f97316"; score=3; }
  else { level="متعثّر"; color="#dc2626"; score=4; }
  return {level, months:monthsBehind, overdue:behindAmt, color, score};
};

                    if(nowd.getDate() >= fd.getDate()) monthsDue += 1; // القسط الحالي استحق

                    const dueAmount = monthsDue*inst;           // المفروض دفعه حتى الآن

// ─── Pending Page ────────────────────────────────────────────
function PendingPage({pending, setPending}) {
  const today = todayLocal();
  const [form,setForm]=useState({name:"",amount:"",date:today,note:""});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const save=()=>{
    if(!form.name||!form.amount){return;}
    setPending(p=>[...p,{id:Date.now(),...form,amount:parseFloat(form.amount)}]);
    setForm({name:"",amount:"",date:today,note:""});
  };

  const total = pending.reduce((s,p)=>s+p.amount,0);

  return (
    <div>
      <div style={{fontSize:19,fontWeight:800,marginBottom:16}}>📌 المتبقي من الاستقطاعات</div>
      <div style={{...styles.card,marginBottom:16,background:C.yellowLt||"#fffbf0",border:"1px solid "+C.gold}}>
        <div style={{fontSize:15,color:"#8a6200"}}>أرصدة معلقة لأشخاص أو حوالات غير محددة المصدر</div>
      </div>

      {/* Summary */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:20}}>
        <KpiCard label="إجمالي المتبقي" value={SAR(total)} color={C.red}/>
        <KpiCard label="عدد الأشخاص" value={NUM(pending.length)} color={C.teal}/>
      </div>

      {/* Add */}
      <div style={{...styles.panel,marginBottom:16}}>
        <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>➕ إضافة مبلغ معلق</h3></div>
        <div style={{padding:"14px 18px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
            {[["اسم الشخص / الجهة","name","text","الاسم أو وصف الحوالة"],
              ["المبلغ (ر.س)","amount","number","مثال: 500"],
              ["التاريخ","date","date",""],
              ["ملاحظة","note","text","اختياري"]].map(([l,k,t,p])=>(
              <div key={k}>
                <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>{l}</label>
                <input style={styles.input} type={t} placeholder={p} value={form[k]} onChange={e=>set(k,e.target.value)}/>
              </div>
            ))}
          </div>
          <button style={styles.btn(C.teal)} onClick={save}>💾 إضافة</button>
        </div>
      </div>

      {/* Table */}
      <div style={styles.panel}>
        <div style={styles.panelHdr}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700}}>📋 سجل المتبقي</h3>
          <span style={{fontSize:15,fontWeight:800,color:C.red}}>{SAR(total)}</span>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
            <thead>
              <tr>{["التاريخ","الاسم / الجهة","المبلغ","ملاحظة",""].map(h=>(
                <th key={h} style={styles.th}>{h}</th>
              ))}</tr>
            </thead>
            <tbody>
              {pending.length===0 ? (

const TX_TYPES = [
  {key:"deposit",   label:"دعم مستثمر",        color:"#1a7a4a", sign:1},
  {key:"withdraw",  label:"سحب",              color:"#c0392b", sign:-1},
  {key:"installments",label:"أقساط واردة",    color:"#0d7377", sign:1},
  {key:"expenses",  label:"مصروفات",          color:"#c0392b", sign:-1},
  {key:"contract",  label:"خصم عقد",          color:"#7030A0", sign:-1},
];

function DeductionsSheet({contracts, investors, payments}){
  const [checked,setChecked]=useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_deduct_check")||"{}");}catch{return{};}});
  const toggle=id=>{const n={...checked,[id]:!checked[id]};setChecked(n);localStorage.setItem("qimma_deduct_check",JSON.stringify(n));};
  const [payF,setPayF]=useState(new Set(["استقطاع"])); // فلتر نوع السداد - متعدد
  const [bankF,setBankF]=useState(""); // فلتر البنك (للشيكات والاستقطاع)
  const [sortBy,setSortBy]=useState(""); // ترتيب الكشف: "" | inv | bank
  const [dayF,setDayF]=useState(""); // فلتر يوم الاستحقاق
  const [statusF,setStatusF]=useState(new Set(["شهري","مستمر"])); // فلتر حالة العقد — مخفي
  const [showStatusF,setShowStatusF]=useState(false); // إظهار/إخفاء فلتر الحالة
  const getDueDay=c=>{if(!c.firstInst)return""; return String(new Date(c.firstInst).getDate());};
  const togglePay = f => {
    if(f==="الكل"){ setPayF(new Set(["الكل"])); setBankF(""); return; }
    const n = new Set(payF); n.delete("الكل");
    if(n.has(f)) n.delete(f); else n.add(f);
    if(n.size===0) n.add("استقطاع");
    setPayF(n); setBankF("");
  };
  const toggleStatus = s => {
    const n = new Set(statusF);
    if(n.has(s)) n.delete(s); else n.add(s);
    if(n.size===0) n.add("شهري");
    setStatusF(n);
  };
  // تصنيف حالة العقد
  const _cStatus = c => {
    if(c.contractType==="defer") return "مؤجل";
    if(c.contractType==="migrated") return "مستمر";
    // منتهي: المحصّل >= الإجمالي
    const paid = _getPaid(payments, c.id);
    if(paid >= (c.totalInst||0) && (c.totalInst||0)>0) return "منتهي";
    return "شهري";
  };
  // البنك يظهر مع الشيكات والمقاصة والاستقطاع
  const showBanks = payF.has("شيكات") || payF.has("المقاصة") || payF.has("استقطاع");
  // كل العقود حسب الفلتر
  const _dispBank = x => {
    const pm=x.payMethod||"نقدي"; const pt=x.payType;
    if(pt==="deduction"||pm==="استقطاع") return "استقطاع";
    if(pm==="شيكات"||pm==="المقاصة") return _bankOf(x)||"—";
    return pm;
  };
  const _rawRows=contracts.filter(c=>{
    if(c.deleted) return false;
    if(!statusF.has(_cStatus(c))) return false;
    const pm=c.payMethod||"نقدي";
    const pt=c.payType;
    if(payF.has("الكل")) { /* لا فلتر */ }
    else {
      let match=false;
      if(payF.has("استقطاع") && pt==="deduction") match=true;
      if(!match) payF.forEach(f=>{ if(f!=="استقطاع" && pm===f) match=true; });
      if(!match) return false;
    }
    if(showBanks && bankF && _bankOf(c)!==bankF) return false;
    if(dayF && getDueDay(c)!==dayF) return false;
    return true;
  }).map(c=>{
    const inv=investors.find(i=>String(i.id)===String(c.investorId));
    const paid=_getPaid(payments,c.id);
    const left=Math.max(0,(c.totalInst||0)-paid);
    return {...c, invName:inv?invLabel(inv):"—", paid, left, dueDay:getDueDay(c)};
  });
  // ترتيب موحد: الراجحي→الأهلي→باقي البنوك بالكثرة→نقدي→تحويل→صرافة→استقطاع
  const fixedOrder = {"الراجحي":1,"الأهلي":2};
  const payMethodOrder = {"نقدي":90,"تحويل":91,"صرافة":92,"استقطاع":93};
  const bankCounts = {};
  _rawRows.forEach(function(c){ var b=_dispBank(c); if(!fixedOrder[b]&&!payMethodOrder[b]) bankCounts[b]=(bankCounts[b]||0)+1; });
  const dynamicBanks = Object.entries(bankCounts).sort(function(a,b){return b[1]-a[1];});
  const dynamicOrder = {}; dynamicBanks.forEach(function(e,i){ dynamicOrder[e[0]]=10+i; });
  function uniRank(x){ var b=_dispBank(x); return fixedOrder[b]||dynamicOrder[b]||payMethodOrder[b]||89; }
  function bankSortFn(x,y){ return uniRank(x)-uniRank(y) || String(_dispBank(x)).localeCompare(String(_dispBank(y)),"ar"); }
  function invNumFn(x){ var m=String(x.invName||"").match(/(\d+)/); return m?parseInt(m[1]):9999; }
  // بناء dRows
  var sortedArr = _rawRows.slice();
  if(sortBy==="inv"){
    sortedArr.sort(function(a,b){
      var d=invNumFn(a)-invNumFn(b);
      if(d!==0) return d;
      var bk=bankSortFn(a,b);
      return bk!==0 ? bk : String(a.client||"").localeCompare(String(b.client||""),"ar");
    });
  } else if(sortBy==="bank"){
    sortedArr.sort(function(a,b){
      var bk=bankSortFn(a,b);
      if(bk!==0) return bk;
      var d=invNumFn(a)-invNumFn(b);
      return d!==0 ? d : String(a.client||"").localeCompare(String(b.client||""),"ar");
    });
  }
  var dRows = sortedArr;
  const totalInst=dRows.reduce((s,c)=>s+(c.instAmt||0),0);
  const payLabel=payF.has("الكل")?"جميع الأنواع":[...payF].join(" + ");
  const sortLabel = sortBy==="inv" ? " — مرتب حسب المستثمر" : sortBy==="bank" ? " — مرتب حسب البنك" : "";
  const titleLabel=(payF.has("استقطاع")&&payF.size===1?"كشف حسابات الاستقطاع البنكي":"كشف "+payLabel)+(bankF?" — بنك "+bankF:"")+(dayF?" — يوم "+dayF:"")+sortLabel;

  const printSheet=()=>{
    const fmt=n=>Math.round(+(n||0)).toLocaleString("en-US");
    const isCheck = payF.has("شيكات")||payF.has("المقاصة");
    const cNum = c => { if(c.contractType==="migrated"){ if(c.oldNum) return c.oldNum; const m=String(c.note||"").match(/عقد\s*(\d+)/); return m?m[1]:"—"; } return c.num||"—"; };
    const cleanInv = name => { const m=String(name||"").match(/(\d+)/); return m?"فرصة "+m[1]:name||"—"; };
    // ترتيب موحد للطباعة
    const _dispBankP = x => {
      const pm=x.payMethod||"نقدي"; const pt=x.payType;
      if(pt==="deduction"||pm==="استقطاع") return "استقطاع";
      if(pm==="شيكات"||pm==="المقاصة") return _bankOf(x)||"—";
      return pm;
    };
    const fxOrd = {"الراجحي":1,"الأهلي":2};
    const pmOrd = {"نقدي":90,"تحويل":91,"صرافة":92,"استقطاع":93};
    const bCts = {}; dRows.forEach(c=>{ const b=_dispBankP(c); if(!fxOrd[b]&&!pmOrd[b]) bCts[b]=(bCts[b]||0)+1; });
    const dBks = Object.entries(bCts).sort((a,b)=>b[1]-a[1]);
    const dOrd = {}; dBks.forEach(([b],i)=>{ dOrd[b]=10+i; });
    const uRankP = x => { const b=_dispBankP(x); return fxOrd[b]||dOrd[b]||pmOrd[b]||89; };
    const _bankSortP = (x,y)=> uRankP(x)-uRankP(y) || String(_dispBankP(x)).localeCompare(String(_dispBankP(y)),"ar");
    const invNum = x=>{ const m=String(x.invName||"").match(/(\d+)/); return m?parseInt(m[1]):9999; };
    const printRows = [...dRows].sort((a,b)=>{
      if(sortBy==="bank"){
        const bk=_bankSortP(a,b);
        if(bk!==0) return bk;
        const d=invNum(a)-invNum(b);
        return d!==0 ? d : String(a.client||"").localeCompare(String(b.client||""),"ar");
      }
      const d=invNum(a)-invNum(b);
      if(d!==0) return d;
      const bk=_bankSortP(a,b);
      return bk!==0 ? bk : String(a.client||"").localeCompare(String(b.client||""),"ar");
    });
    // الطباعة الموحدة: كل عقد يُفحص نوعه على حدة
    // الأعمدة ثابتة: # | اسم الزبون | رقم الجوال | رقم العقد | رقم الشيك | البنك | المستثمر | القسط | ملاحظات
    // رقم الشيك يظهر فاضي فقط لعقود الشيكات/المقاصة
    // البنك: شيكات/مقاصة=اسم البنك، استقطاع="استقطاع"، نقدي/تحويل/صرافة=نوع السداد
    const hasChecks = printRows.some(c=>c.payMethod==="شيكات"||c.payMethod==="المقاصة");
    let body="";
    body=printRows.map((c,i)=>{
      const pm=c.payMethod||"نقدي";
      const isRowCheck = pm==="شيكات"||pm==="المقاصة";
      const isRowDeduct = c.payType==="deduction"||pm==="استقطاع";
      const bankVal = isRowDeduct ? "استقطاع" : isRowCheck ? (_bankOf(c)||"—") : pm;
      const checkCol = hasChecks ? `<td>${isRowCheck?"":""}</td>` : "";
      return `<tr><td>${i+1}</td><td>${c.client}</td><td>${c.cPhone||"—"}</td><td>${cNum(c)}</td>${checkCol}<td>${bankVal}</td><td>${cleanInv(c.invName)}</td><td class="amt">${fmt(c.instAmt)}</td><td></td></tr>`;
    }).join("");
    const colCount = hasChecks ? 9 : 8;
    const win=window.open("","_blank");
    win.document.write(`<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>كشف الاستقطاعات</title>
    <style>body{font-family:Arial;padding:22px;color:#000}.header{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:14px}.org{font-size:17px;font-weight:900}.sub{font-size:12px}.title{text-align:center;font-size:19px;font-weight:900;border:2px solid #000;padding:10px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:14px;border:2px solid #000}th,td{border:1px solid #000;padding:7px 10px;text-align:right;white-space:nowrap}th{font-weight:900;border-bottom:2px solid #000;font-size:13px}td.amt{font-weight:bold;text-align:left}.foot{text-align:center;color:#444;font-size:11px;margin-top:16px;border-top:1px solid #000;padding-top:8px}@media print{button{display:none}}</style>
    </head><body>
    <div class="header"><div><div class="org">مؤسسة قمة الفرصة التجارية</div><div class="sub">بريدة - شارع الثلاثين</div><div class="sub">ج: 0555171283  ت: 0163839323</div></div>
    <div style="text-align:left"><div class="sub">كشف الاستقطاعات</div><div class="sub">التاريخ: ${(()=>{const d=new Date();return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");})()}</div></div></div>
    <div class="title">${titleLabel}</div>
    <table style="width:auto"><thead><tr><th>#</th><th>اسم الزبون</th><th>رقم الجوال</th><th>رقم العقد</th>${hasChecks?`<th>رقم الشيك</th>`:""}<th>البنك</th><th>المستثمر</th><th>القسط</th><th style="min-width:120px">ملاحظات</th></tr></thead>
    <tbody>${body||`<tr><td colspan="${colCount}" style="text-align:center;color:#666">لا يوجد بيانات</td></tr>`}
    <tr style="font-weight:900;border-top:2px solid #000"><td colspan="${colCount-2}">الإجمالي</td><td class="amt">${fmt(totalInst)}</td><td></td></tr></tbody></table>
    <div class="foot">طُبع بتاريخ ${new Date().toLocaleString("en-US")}</div>
    <button onclick="window.print()" style="display:block;margin:20px auto;padding:10px 30px;font-size:16px;background:#333;color:#fff;border:none;border-radius:8px;cursor:pointer">🖨️ طباعة</button>
    </body></html>`);
    win.document.close(); setTimeout(()=>win.print(),400);
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:10}}>
        <div style={{fontSize:18,fontWeight:800,display:"flex",alignItems:"center",gap:8}}>
          <svg width="20" height="20" viewBox="0 0 24 24"><g fill="none" stroke="#c8922a" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8.6v9.9a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1v-8.4a1 1 0 0 0-1-1H6a2 2 0 0 1 0-4h11.4"/></g></svg>
          {payLabel} ({dRows.length})</div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>

      </div>
      {/* فلتر حالة العقد — مخفي */}
      {showStatusF && (
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8,alignItems:"center"}}>
          {["شهري","مستمر","مؤجل","منتهي"].map(s=>(

                border:statusF.has(s)?"2px solid #c8922a":"1px solid #e2e8f0",

      {/* فلتر نوع السداد — اختيار متعدد */}

          <button key={f} onClick={()=>togglePay(f)}
            style={{padding:"6px 14px",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial",
              border:payF.has(f)?"2px solid #c8922a":"1px solid #e2e8f0",

      </div>

          {BANKS.filter(b=>!["الجزيرة","السعودي الفرنسي","الاستثمار","ساب"].includes(b)).map(b=>{

            return (

                {b}{n?" ("+n+")":""}
              </button>
            );
          })}
        </div>
      )}
      {/* فلتر يوم الاستحقاق */}
      {(()=>{
        const allDays = [...new Set(contracts.filter(c=>!c.deleted).map(c=>getDueDay(c)).filter(Boolean))].sort((a,b)=>parseInt(a)-parseInt(b));
        return (

          <select value={dayF} onChange={e=>setDayF(e.target.value)}

              const isName = h==="اسم الزبون";
              return <th key={h} style={{...styles.th,whiteSpace:"nowrap",position:"sticky",top:0,zIndex:isName?12:10,...(isName?{right:0,zIndex:12}:{})}}>{h}</th>;

              {dRows.map((c,i)=>(
                <tr key={c.id} style={{background:checked[c.id]?"#ecfdf5":(i%2===0?"#fff":"#f8f8f8")}}>

                  <td style={{...styles.td,fontFamily:"monospace",whiteSpace:"nowrap"}}>{c.bankAccount||"—"}</td>
                  <td style={{...styles.td,whiteSpace:"nowrap",fontWeight:700,color:_bankOf(c)?C.ink:"#cbd5e1"}}>{_bankOf(c)||"—"}</td>

            </tbody>
            <tfoot><tr style={{background:"#fffbf0",fontWeight:800}}><td colSpan={8} style={styles.td}>الإجمالي</td><td style={styles.td}>{SAR(totalInst)}</td><td style={{...styles.td,color:C.red}}>{SAR(dRows.reduce((s,c)=>s+(c.left||0),0))}</td></tr></tfoot>

      )}
    </div>
  );
}

function AccountsPage({contracts, investors, setInvestors, settings, txList, setTxList, loans, setLoans, zakatTx, setZakatTx, pending, setPending, payments, toast, goBack}) {
  const [subTab, setSubTab] = useState("inv");
  const [selInv, setSelInv] = useState(investors[0]?.id||null);
  const [invSubTab, setInvSubTab] = useState("inv");
  const [form, setForm] = useState({type:"deposit", amount:"", note:"", date:todayLocal()});
  const set = (k,v) => {
    setForm(f=>({...f,[k]:v}));
    // Auto-fill if idNum entered and matches existing contract
    if(k==="idNum" && v.length>=9){
      const prev = contracts.find(c=>c.idNum===v);
      if(prev){
        setForm(f=>({...f, idNum:v, client:prev.client||f.client, job:prev.job||f.job, cPhone:prev.cPhone||f.cPhone}));
        toast("✅ تم تعبئة بيانات العميل تلقائياً");
      }
    }
  };

  const inv = investors.find(i=>i.id===selInv);
  const myTx = (txList[selInv]||[]);

  // Auto-transactions from contracts
  const myContracts = contracts.filter(c=>c.investorId===selInv);
  const autoTx = myContracts.filter(c=>!c.isOldContract && c.contractType!=="migrated").map(c=>{
    const r = calcC(c, settings);
    // ينخصم: قيمة العقد النقدية + عمولة المحاسبين + نصيب المؤسسة + الرسوم الإدارية
    const deduct = c.amount + r.acc + r.inst + r.admin;
    return {
      id:"auto_"+c.id, date:c.date, auto:true,
      type:"contract",
      amount:-deduct,
      note:c.client,
      breakdown:"نقدي: "+SAR(c.amount)+" | محاسبين: "+SAR(r.acc)+" | مؤسسة: "+SAR(r.inst)+" | رسوم: "+SAR(r.admin),
      admin:r.admin, acc:r.acc, inst:r.inst, net:r.net
    };
  });

  // Auto payments grouped by month
  const paysByMonth = {};
  (payments||[]).forEach(p=>{
    const c = myContracts.find(x=>x.id===p.contractId);
    if(!c) return;
    const d = new Date(p.date);
    const ym = fiscalYM(d);
    if(!paysByMonth[ym]) paysByMonth[ym]={amount:0, count:0, date:ym+"-01"};
    paysByMonth[ym].amount += p.amount;
    paysByMonth[ym].count  += 1;
  });

      <div style={{...styles.panel,marginBottom:16}}>
        <div style={styles.panelHdr}><h3 style={{margin:0,fontSize:15,fontWeight:700}}>➕ إضافة حركة</h3></div>
        <div style={{padding:"14px 18px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:12}}>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>نوع الحركة</label>
              <select style={styles.select} value={form.type} onChange={e=>set("type",e.target.value)}>
                {TX_TYPES.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>المبلغ (ر.س)</label>
              <input style={{...styles.input,borderColor:C.teal,fontWeight:700}} type="number"
                placeholder="أدخل المبلغ" value={form.amount} onChange={e=>set("amount",e.target.value)}/>
            </div>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>التاريخ</label>
              <input style={styles.input} type="date" value={form.date} onChange={e=>set("date",e.target.value)}/>
            </div>
            <div>
              <label style={{fontSize:15,fontWeight:700,color:C.ink2,display:"block",marginBottom:5}}>ملاحظة</label>
              <input style={styles.input} type="text" placeholder="اختياري"
                value={form.note} onChange={e=>set("note",e.target.value)}/>
            </div>
          </div>
          <button style={styles.btn(C.teal)} onClick={addTx}>💾 إضافة</button>
        </div>
      </div>

      {/* Transactions table */}
      <div style={styles.panel}>
        <div style={styles.panelHdr}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700}}>
            📋 كشف حساب — {inv?invLabel(inv):""}
          </h3>
        </div>
        <div style={{padding:"8px 14px"}}>
          <input type="text" placeholder="🔍 بحث بالاسم أو البيان..." value={acctSearch||""} onChange={e=>setAcctSearch(e.target.value)}
            style={{...styles.input,width:"100%",fontSize:15,padding:"10px 14px",borderColor:C.teal}}/>
        </div>
        <div style={{overflowX:"auto",maxHeight:"70vh",overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
          <table style={{width:"100%",borderCollapse:"separate",borderSpacing:0,fontSize:15}}>
            <thead style={{position:"sticky",top:0,zIndex:20}}>
              <tr>
                {["التاريخ","نوع الحركة","البيان","دعم","خصم","الرصيد",""].map((h,hi)=>{
                  const isBayan = h==="البيان";
                  return <th key={h} style={{...styles.th,position:"sticky",top:0,zIndex:isBayan?22:20,background:C.ink,...(isBayan?{right:0}:{})}}>{h}</th>;
                })}
              </tr>
            </thead>
            <tbody>
              {/* Opening balance row */}
              <tr style={{background:"#f0fdf4"}}>
                <td style={{...styles.td,fontSize:14,color:"#333"}}>{inv?.date||"—"}</td>
                <td style={styles.td}><span style={{...styles.badge("#141428","#c8922a")}}>رصيد افتتاحي</span></td>
                <td style={styles.td}>رأس المال المبدئي</td>
                <td style={{...styles.td,color:C.green,fontWeight:700}}>{SAR(inv?.capital||0)}</td>
                <td style={styles.td}>—</td>
                <td style={{...styles.td,fontWeight:800,color:C.teal}}>{SAR(inv?.capital||0)}</td>
                <td style={styles.td}></td>
              </tr>
              {filteredRows.map((tx,i)=>{
                const txType = TX_TYPES.find(t=>t.key===tx.type)||TX_TYPES[0];
                const isPos = tx.amount>0;
                return (
                  <tr key={tx.id} style={{background:i%2===0?C.white:C.gray}}>
                    <td style={{...styles.td,fontSize:14,color:"#1f2937"}}>{tx.date}</td>
                    <td style={styles.td}>
                      <span style={{...styles.badge("#141428","#c8922a")}}>{txType.label}</span>
                    </td>
                    <td style={styles.td}>
                      <div>{tx.note||"—"}</div>
                      
                    </td>
                    <td style={{...styles.td,color:C.green,fontWeight:isPos?700:400}}>
                      {isPos ? SAR(tx.amount) : "—"}
                    </td>
                    <td style={{...styles.td,color:C.red,fontWeight:!isPos?700:400}}>
                      {!isPos ? SAR(Math.abs(tx.amount)) : "—"}
                    </td>
                    <td style={{...styles.td,fontWeight:800,color:tx.balance>=0?C.teal:C.red}}>
                      {SAR(tx.balance)}
                    </td>
                    <td style={styles.td}>
                      {!tx.auto && (
                        <button style={{...styles.btn(C.red),fontSize:13,padding:"3px 8px"}}
                          onClick={()=>delTx(tx.id)}>🗑️</button>
                      )}
                      {tx.auto && <span style={{fontSize:13,color:"#1f2937"}}>تلقائي</span>}
                    </td>
                  </tr>
                );
              })}
              {rows.length===0 && (
                <tr><td colSpan={7} style={{...styles.td,textAlign:"center",padding:40,color:"#1f2937"}}>
                  لا توجد حركات — ابدأ بإضافة حركة
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
      </>}
    </div>
  );
}

// ─── Monthly Jard ────────────────────────────────────────────
function JardPage({contracts,investors,settings,txList,loans,zakatTx,pending,payments,gsWrite,daily,dailyOpen,bankTx}) {
  const today = new Date();
  const currentYM = fiscalYM(today);
  const months = [...new Set(contracts.map(c=>fiscalYM(c.date)))].sort().reverse();
  if(!months.includes(currentYM)) months.unshift(currentYM);
  const [selMonth,setSelMonth]=useState(months[0]);
  const [overrides,setOverrides]=useState(()=>{try{return JSON.parse(localStorage.getItem("qimma_jard_ov")||"{}");}catch{return {};}});

  const mLabel=ym=>{const[y,m]=ym.split("-");return"شهر "+parseInt(m)+" - "+y;};
  const mc = contracts.filter(c=>fiscalYM(c.date)===selMonth);

  // Goods data for cards balance
  const goodsData = (() => {
    try{ return JSON.parse(localStorage.getItem("qimma_goods3")||"[]"); }catch{ return []; }
  })();
  const priceOv = (() => {
    try{ return JSON.parse(localStorage.getItem("qimma_price_ov")||"{}"); }catch{ return {}; }
  })();
  const defPrice2 = (() => {
    try{ return parseFloat(localStorage.getItem("qimma_default_price"))||0; }catch{ return 0; }
  })();

  const getVal = (key) => {
    // البطاقات والزكاة والاستقطاعات: تلقائية دائماً (تتجاهل أي قيمة يدوية قديمة)
    const alwaysAuto = ["cards","zakat","deductions","cash","accounts"];
    if(!alwaysAuto.includes(key) && overrides[selMonth+"_"+key]!==undefined) return overrides[selMonth+"_"+key];
    // رصيد الحسابات البنكية: آخر رصيد من كشف الراجحي المستورد
    if(key==="accounts") {
      const bt = _arr(bankTx);
      if(bt.length > 0) return bt[bt.length-1].balance || 0;
      // لو ما فيه كشف، يرجع للقيمة اليدوية القديمة إن وُجدت
      return overrides[selMonth+"_accounts"] !== undefined ? overrides[selMonth+"_accounts"] : 0;
    }
    // الرصيد النقدي: يُسحب مباشرة من رصيد الصندوق (رصيد البداية + كل حركات اليومية)
    if(key==="cash") {
      const _do = (dailyOpen && typeof dailyOpen==="object" && !Array.isArray(dailyOpen)) ? dailyOpen : {};
      const base = _do.__base && typeof _do.__base==="object" ? _do.__base : null;
      const baseAmount = base ? (+base.amount||0) : 0;
      const baseDate = base ? base.date : "0000-00-00";
      const net = (daily||[]).filter(d=>d.date >= baseDate)
        .reduce((s,d)=>{const t=DAILY_TYPES.find(x=>x.key===d.type);return s+(t?t.sign:1)*(d.amount||0);},0);
      return baseAmount + net;
    }
    // سحب تلقائي من الصفحات المرتبطة
    if(key==="loans") {
      return (loans||[]).reduce((s,l)=>{
        const paid=(l.payments||[]).reduce((ss,p)=>ss+p.amount,0);
        return s+Math.max(0,(l.amount||0)-paid);
      },0);
    }
    if(key==="zakat")   return (zakatTx||[]).reduce((s,t)=>s+(t.type==="collect"?t.amount:-t.amount),0);
    if(key==="deductions") return (pending||[]).reduce((s,p)=>s+p.amount,0);
    if(key==="cards") {
      // مطابقة كشف البضاعة (GoodsPage) بالضبط: نميّز البطاقة عن السلعة النقدية،
      // ونرجّع الإجمالي النقدي = نقدي البطاقات + نقدي السلع (العمود الأخير في الكشف).
      const cRows = contracts.filter(c=>!c.isOldContract && c.contractType!=='migrated').map(c=>{
        const isCard = (c.goods||"").trim().startsWith("بطاقة");
        if(isCard){
          return {
            id:"c_"+c.id, date:c.date,
            supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
            supportAcc:0,
            withdrawnQty:parseInt(c.qty)||0,
            price:0, cashOnly:false,
          };
        }
        // سلعة نقدية (أسهم/سيارة/جوال): قيمتها النقدية تُخصم من نقدي السلع، بلا لمس البطاقات
        return {
          id:"c_"+c.id, date:c.date,
          supportClient:c.deductEnabled?(c.deducts?c.deducts.reduce((s,d)=>s+(parseFloat(d.amount)||0),0):parseFloat(c.deductAmount)||0):0,
          supportAcc:-(parseFloat(c.amount)||0),
          withdrawnQty:0,
          price:0, cashOnly:true,
        };
      });
      const seqOf2 = r => { const n=parseInt(String(r.id).replace(/^c_/,""),10); return isNaN(n)?0:n; };
      const allR = [...cRows,...goodsData].sort((a,b)=>{
        const d=new Date(a.date)-new Date(b.date);
        if(d!==0) return d;
        return seqOf2(a)-seqOf2(b);
      });
      let runCards=0; let lastPrice2=0; let runGoodsCash=0;
      allR.forEach(r=>{
        if(r.cashOnly){
          runGoodsCash += parseFloat(r.supportAcc)||0;
          return;
        }
        const rowPrice=parseFloat(priceOv[r.id]||r.price)||defPrice2||lastPrice2||1;
        if(rowPrice) lastPrice2=rowPrice;
        const supC=parseFloat(r.supportClient)||0;
        const supA=parseFloat(r.supportAcc)||0;
        const supported=supC||supA?Math.floor((supC+supA)/rowPrice):0;
        const withdrawn=parseInt(r.withdrawnQty)||0;
        runCards=runCards+supported-withdrawn;
      });
      const cardsCash = runCards*lastPrice2;
      return cardsCash + runGoodsCash;
    }
    return 0;
  };
  const setVal = (key,v) => setOverrides(p=>{
    const newOv={...p,[selMonth+"_"+key]:parseFloat(v)||0};
    localStorage.setItem("qimma_jard_ov",JSON.stringify(newOv));
    gsWrite("jard_ov",newOv);
    return newOv;
  });
  const getInv = (id) => {
    const key = selMonth+"_inv_"+id;
    if(overrides[key]!==undefined) return overrides[key];
    const inv = investors.find(i=>i.id===id);
    const capital = inv?.capital||0;
    const myContracts = contracts.filter(c=>c.investorId===id);
    const myManualTx = (txList[id]||[]);
    const autoDeduct = myContracts.filter(c=>!c.isOldContract && c.contractType!=="migrated").reduce((s,c)=>{
      const r=calcC(c,settings);
      return s-(c.amount+r.acc+r.inst+r.admin);
    },0);
    const autoPaid = (payments||[]).filter(p=>myContracts.find(c=>c.id===p.contractId)).reduce((s,p)=>s+p.amount,0);
    const manualTotal = myManualTx.reduce((s,t)=>s+t.amount,0);
    return capital + autoDeduct + autoPaid + manualTotal;
  };
  const setInv = (id,sign,v) => {
    const key = selMonth+"_inv_"+id;
    setOverrides(p=>{
      const newOv={...p,[key]: sign===1 ? (parseFloat(v)||0) : -(parseFloat(v)||0)};
      localStorage.setItem("qimma_jard_ov",JSON.stringify(newOv));
      gsWrite("jard_ov",newOv);
      return newOv;
    });
  };

  // بنود "له عندي" (التزامات)
  const invRows = [
    {key:"deductions", name:"المتبقي من الاستقطاعات",  sign:1,  hint:"ناس لهم فلوس عندي"},
    {key:"zakat",      name:"صندوق الزكاة",            sign:1,  hint:"زكاة مدفوعة مقدماً"},
  ];
  // بنود "لي عنده" (أصول)
  const otherRows = [
    {key:"cash",       name:"الرصيد النقدي",           sign:1,  hint:"كاش الصندوق"},
    {key:"accounts",   name:"رصيد الحسابات البنكية",   sign:1,  hint:"رصيد البنك"},
    {key:"cards",      name:"رصيد البطاقات",           sign:1,  hint:"قيمة البضاعة الموجودة"},
    {key:"loans",      name:"السلف",                   sign:1,  hint:"مبالغ مسلّفة لأشخاص"},
  ];

  // calc totals with correct signs
  let totalMojab = 0, totalSalib = 0;
  investors.forEach(inv=>{
    const v = getInv(inv.id);
    if(v>0) totalMojab+=v; else totalSalib+=Math.abs(v);
  });
  invRows.forEach(r=>{
    const v = getVal(r.key)||0;
    if(v>=0) totalMojab+=v; else totalSalib+=Math.abs(v);
  });
  otherRows.forEach(r=>{
    const v = getVal(r.key)||0;
    // الأصول (كاش/بنك/بضاعة/سلف) دائماً "لي عنده"
    totalSalib+=Math.abs(v);
  });
  const farq = totalSalib - totalMojab;

  const thS = {...styles.th, padding:"10px 14px"};
  const tdS = {...styles.td, padding:"9px 12px", verticalAlign:"middle"};
  const inpS = (color)=>({...styles.input,width:"100%",maxWidth:130,textAlign:"center",borderColor:color,color,fontWeight:700,padding:"6px 8px",fontSize:15});
  // مربع للعرض فقط (شكل جمالي مثل المربعات بدون إمكانية الكتابة)
  const boxRO = (color)=>({display:"inline-block",width:"100%",maxWidth:130,textAlign:"center",border:"1.5px solid "+color,borderRadius:8,color,fontWeight:800,padding:"7px 8px",fontSize:15,background:"#fafafa"});

  const Row = ({name,mojab,salib,onMojab,onSalib,auto,isInv,hint,i,autoSalib,hideMojab}) => (
    <tr style={{background:i%2===0?C.white:C.gray}}>
      <td style={tdS}>
        <span style={{fontWeight:700}}>{name}</span>
        {hint && <div style={{fontSize:13,color:"#1f2937",marginTop:2}}>{hint}</div>}
        {isInv && <div style={{fontSize:13,color:"#1f2937",marginTop:2}}>رصيد الحساب الجاري</div>}
      </td>
      <td style={{...tdS,textAlign:"center"}}>
        {auto
          ? <span style={boxRO(C.green)}>{mojab?Number(mojab).toLocaleString("en-US"):"0"}</span>
          : (!hideMojab && <input type="number" value={mojab||""} onChange={e=>onMojab(e.target.value)}
              placeholder="0" style={inpS(C.green)}/>)}
      </td>
      <td style={{...tdS,textAlign:"center"}}>
        {(autoSalib||auto)
          ? <span style={boxRO(C.red)}>{salib?Number(salib).toLocaleString("en-US"):"0"}</span>
          : <input type="number" value={salib||""} onChange={e=>onSalib(e.target.value)}
              placeholder="0" style={inpS(C.red)}/>
        }
      </td>
    </tr>
  );

  return (
    <div>
      {/* Month + header */}
      <div className="noprint" style={{...styles.card,display:"flex",alignItems:"center",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        <label style={{fontWeight:700,fontSize:15,whiteSpace:"nowrap"}}>شهر الجرد:</label>
        <select style={{...styles.select,width:"auto",minWidth:160,borderColor:C.teal,color:C.teal,fontWeight:700,background:C.tealLt}}
          value={selMonth} onChange={e=>setSelMonth(e.target.value)}>
          {months.map(m=><option key={m} value={m}>{mLabel(m)}</option>)}
        </select>
        <button style={{...styles.btn(C.gold),marginRight:"auto"}} onClick={()=>window.print()}>طباعة</button>
      </div>

      <div style={styles.panel}>
        {/* Panel header with totals */}
        <div style={{background:"#1e2235",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div style={{color:"white",fontWeight:900,fontSize:17}}>الجرد — {mLabel(selMonth)}</div>
          <div style={{display:"flex",gap:16,alignItems:"center"}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",marginBottom:2}}>له عندي</div>
              <div style={{fontSize:18,fontWeight:900,color:"#5cd98a"}}>{totalMojab.toLocaleString("en-US")}</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",marginBottom:2}}>لي عنده</div>
              <div style={{fontSize:18,fontWeight:900,color:"#ff8080"}}>{totalSalib.toLocaleString("en-US")}</div>
            </div>
            <div style={{background:farq>=0?"rgba(92,217,138,0.2)":"rgba(255,128,128,0.2)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",marginBottom:2}}>الفرق</div>
              <div style={{fontSize:22,fontWeight:900,color:farq>=0?"#5cd98a":"#ff8080"}}>
                {farq>=0?"":"-"}{Math.abs(farq).toLocaleString("en-US")}
              </div>
              <div style={{fontSize:13,color:farq>=0?"#5cd98a":"#ff8080"}}>{farq>=0?"موجب":"سالب"}</div>
            </div>
          </div>
        </div>

        {/* Single unified table */}
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:15}}>
            <thead>
              <tr>
                <th style={{...thS,width:"45%",textAlign:"right"}}>البند</th>
                <th style={{...thS,color:"#a8f0c6",textAlign:"center"}}>له عندي</th>
                <th style={{...thS,color:"#ff9999",textAlign:"center"}}>لي عنده</th>
              </tr>
            </thead>
            <tbody>
              {/* Section: أرصدة المستثمرين */}
              <tr>
                <td colSpan={3} style={{background:C.tealLt,color:C.teal,fontWeight:800,fontSize:15,padding:"8px 14px",borderRight:"4px solid "+C.teal}}>
                  أرصدة المستثمرين
                </td>
              </tr>
              {[...investors].sort((a,b)=>{
                // استخرج الرقم من اسم المؤسسة؛ التي بلا رقم (ل.ن، ح.ل) توضع في الآخر
                const numOf = (nm)=>{ const m=String(nm).match(/(\d+)\s*$/); return m?parseInt(m[1]):9999; };
                return numOf(a.name)-numOf(b.name);
              }).map((inv,i)=>{
                const cur = getInv(inv.id);
                const mojab = cur>0?cur:0;
                const salib = cur<0?Math.abs(cur):0;
                return <Row key={inv.id} i={i} name={inv.name} mojab={mojab||""} salib={salib||""} auto={true} isInv
                  onMojab={()=>{}}
                  onSalib={()=>{}}/>;
              })}

              {/* invRows مع المستثمرين - كلها تلقائية للعرض فقط */}
              {invRows.map((row,i)=>{
                const v = getVal(row.key);
                return <Row key={row.key} i={i} name={row.name} hint={row.hint}
                  mojab={v>=0?v:""} salib={v<0?Math.abs(v):""}
                  onMojab={()=>{}} onSalib={()=>{}}
                  auto={true} hideMojab={false}/>;
              })}

              {/* Section: لي عنده (أصول) */}
              <tr>
                <td colSpan={3} style={{background:"#fef2f2",color:"#991b1b",fontWeight:800,fontSize:15,padding:"8px 14px",borderRight:"4px solid #ef4444"}}>
                  لي عنده (أصول)
                </td>
              </tr>
              {otherRows.map((row,i)=>{
                const v = getVal(row.key);
                const isAuto = row.key==="loans";
                if(isAuto){
                  // السلف: ثابتة في خانة السالب فقط (تلقائية)
                  return <Row key={row.key} i={i} name={row.name} hint={row.hint}
                    mojab={""} salib={Math.abs(v)}
                    onMojab={()=>{}} onSalib={()=>{}}
                    autoSalib={true} hideMojab={true}/>;
                }
                if(row.key==="cash"){
                  // الرصيد النقدي: يظهر في العمود الأيسر فقط (تلقائي، بلا خانة يمين) مثل السلف
                  return <Row key={row.key} i={i} name={row.name} hint="يُسحب مباشرة من رصيد الصندوق"
                    mojab={""} salib={v}
                    onMojab={()=>{}} onSalib={()=>{}}
                    autoSalib={true} hideMojab={true}/>;
                }
                if(row.key==="accounts" && _arr(bankTx).length>0){
                  // رصيد الحسابات البنكية: يظهر في العمود الأيسر فقط (تلقائي، بلا خانة يمين) مثل السلف
                  return <Row key={row.key} i={i} name={row.name} hint="من كشف الراجحي المستورد تلقائياً"
                    mojab={""} salib={v}
                    onMojab={()=>{}} onSalib={()=>{}}
                    autoSalib={true} hideMojab={true}/>;
                }
                if(row.key==="cards"){
                  return <Row key={row.key} i={i} name={row.name} hint={row.hint}
                    mojab={""} salib={Math.abs(v)}
                    onMojab={()=>{}} onSalib={()=>{}}
                    autoSalib={true} hideMojab={true}/>;
                }
                return <Row key={row.key} i={i} name={row.name} hint={row.hint}
                  mojab={v>=0?v:""}
                  salib={v<0?Math.abs(v):""}
                  onMojab={v2=>setVal(row.key,parseFloat(v2)||0)}
                  onSalib={v2=>setVal(row.key,-(parseFloat(v2)||0))}/>;
              })}

              {/* Total row */}
              <tr style={{background:"#1e2235"}}>
                <td style={{...tdS,color:"white",fontWeight:800}}>المجموع</td>
                <td style={{...tdS,textAlign:"center",color:"#5cd98a",fontWeight:900,fontSize:17}}>{totalMojab.toLocaleString("en-US")}</td>
                <td style={{...tdS,textAlign:"center",color:"#ff8080",fontWeight:900,fontSize:17}}>{totalSalib.toLocaleString("en-US")}</td>
              </tr>
              <tr style={{background:farq>=0?"#e3f5ec":C.redLt}}>
                <td style={{...tdS,fontWeight:800,color:farq>=0?C.green:C.red}}>الفرق</td>
                <td colSpan={2} style={{...tdS,textAlign:"center",fontWeight:900,fontSize:20,color:farq>=0?C.green:C.red}}>
                  {farq>=0?"":"-"}{Math.abs(farq).toLocaleString("en-US")} ريال &nbsp;
                  {farq>=0?"✓":"!"}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── Monthly Portfolio Page (المحفظة الشهرية) ───────────────
// ─── طباعة كشف الحساب البنكي (الراجحي) بالأسماء وآخر رصيد ───
// ─── تحليل نصوص PDF لكشف الراجحي إلى حركات (يعتمد على مواقع الأعمدة x) ───
function parseRajhiPDF(items){
  const num = (s) => { const v=parseFloat(String(s).replace(/,/g,"").replace(/[^0-9.\-]/g,"")); return isNaN(v)?null:v; };
  const isDate = (s) => /\d{4}\/\d{2}\/\d{2}/.test(String(s));
  const rev = (s) => s.split("").reverse().join("");
  // تطبيع الحروف العربية من أشكال العرض (Presentation Forms) إلى الأساسية
  const norm = (s) => { try{ return s.normalize("NFKC"); }catch(e){ return s; } };
  // أنواع معروفة: [كلمات مفتاحية يجب توفرها كلها, التسمية] — مرن ضد أخطاء الاستخراج
  const TYPE_DEFS = [
    [["رسوم","حواله","فوريه","صادره"],"رسوم حوالة فورية صادرة"],
    [["حواله","فوريه","صادره"],"حوالة فورية صادرة"],
    [["حوالات","فوريه","وارده"],"حوالات فورية واردة"],
    [["فوريه","وارده"],"حوالات فورية واردة"],
    [["عمليه","تحويل","داخليه"],"عملية تحويل داخلية"],
    [["تحويل","داخليه"],"عملية تحويل داخلية"],
    [["صراف","الي"],"التحويل للحساب الصراف الآلي"],
    [["نقاط","البيع"],"نقاط البيع"],
    [["مدفوعات","سداد"],"مدفوعات سداد"],
    [["ايداع","شيك","مقاصه"],"إيداع شيك مقاصة"],
    [["ايداع","بشيك"],"إيداع بشيك"],
    [["ايداع","شيك"],"إيداع شيك"],
    [["ايداع","نقدي"],"إيداع نقدي"],
    [["رسوم","الامر","المستديم"],"رسوم الأمر المستديم"],
    [["امر","مستديم"],"أمر مستديم"],
    [["المستديم"],"الأمر المستديم"],
    [["تحويل"],"تحويل"],
    [["سداد"],"سداد"],
    [["رسوم"],"رسوم"],
  ];
  const hasArabic = (s)=>/[\u0600-\u06FF\uFB50-\uFEFF]/.test(s);
  const unify = (x)=> x.replace(/\u0640/g,"").replace(/[إأآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
  const matchType = (raw)=>{
    let base = unify(norm(raw).replace(/[^\u0600-\u06FF]/g,""));
    const cands = [base, unify(rev(base))];
    for(const [keys,label] of TYPE_DEFS){
      for(const c of cands){
        if(keys.every(k=> c.indexOf(unify(k))>-1)) return label;
      }
    }
    return null;
  };

  // اجمع في صفوف حسب y
  items = items.filter(it=>it.str && it.str.trim()!=="");
  const rowsY = [];
  const TOL = 4;
  items.forEach(it=>{
    let row = rowsY.find(r=> r.page===it.page && Math.abs(r.y-it.y)<=TOL);
    if(!row){ row={page:it.page, y:it.y, cells:[]}; rowsY.push(row); }
    row.cells.push(it);
  });
  rowsY.forEach(r=>{ r.cells.sort((a,b)=>a.x-b.x); r.text = r.cells.map(c=>c.str).join(" "); });
  rowsY.sort((a,b)=> a.page-b.page || a.y-b.y);

  // دالة: هل هذا صف مبالغ؟ (فيه SAR مرتين+ أو 3 أرقام عشرية)
  const moneyRow = (r) => {
    const sar = (r.text.match(/SAR/g)||[]).length;
    const nums = r.cells.filter(c=>/^[\d,]+\.\d{2}$/.test(c.str.trim())).length;
    return sar>=2 || nums>=2;
  };
  // استخرج المبالغ الثلاثة من صف مبالغ حسب x: رصيد(x<130) دائن(130-215) مدين(215-310)
  const extractMoney = (r) => {
    let bal=null, dain=0, madin=0;
    r.cells.forEach(c=>{
      const v = num(c.str);
      if(v===null || !/^[\d,]+\.\d{2}$/.test(c.str.trim())) return;
      if(c.x < 130) bal = v;
      else if(c.x < 215) dain = v;
      else if(c.x < 320) madin = v;
    });
    return {bal, dain, madin};
  };

  const parsed = [];
  for(let i=0;i<rowsY.length;i++){
    const r = rowsY[i];
    if(!moneyRow(r)) continue;
    const {bal, dain, madin} = extractMoney(r);
    if(bal===null) continue;

    // التاريخ: في نفس الصف (x>480) أو الصفوف القريبة
    let date = "";
    const findDate = (rr)=>{ rr && rr.cells.forEach(c=>{ const m=String(c.str).match(/\d{4}\/\d{2}\/\d{2}/); if(m && !date) date=m[0]; }); };
    findDate(r);
    for(let k=1;k<=2 && !date;k++){ findDate(rowsY[i-k]); findDate(rowsY[i+k]); }

    // النوع: كلمات عربية في العمود الأوسط (x بين 355 و 495) من الصفوف القريبة (±3)
    // نتجاهل الصفوف التي فيها "ملاحظة"/"الوقت"/أرقام حساب طويلة
    let typeText = "";
    const collectType = (rr)=>{
      if(!rr || typeText) return;
      const midCells = rr.cells.filter(c=> c.x>=350 && c.x<=500 && hasArabic(c.str));
      if(midCells.length===0) return;
      const joined = midCells.map(c=>c.str).join("");
      // تجاهل سطر الملاحظة (فيه ملاحظة/الوقت أو أرقام طويلة)
      const nj = norm(joined);
      if(/ملاحظة|الوقت/.test(nj) || /ملاحظة|الوقت/.test(rev(nj))) return;
      if(/\d{9,}/.test(joined)) return;
      const matched = matchType(joined);
      if(matched){ typeText = matched; return; }
      // fallback: نص عربي مطبّع قصير
      const cleaned = norm(joined).replace(/[^\u0600-\u06FF]/g,"");
      if(cleaned && cleaned.length<=30){ typeText = rev(cleaned); }
    };
    collectType(r);
    for(let k=1;k<=3 && !typeText;k++){ collectType(rowsY[i-k]); collectType(rowsY[i+k]); }

    // الاسم: من سطر الملاحظة أو الإنجليزي القريب
    let nameText = "";
    const collectName = (rr)=>{
      if(!rr || nameText) return;
      // سطر إنجليزي (اسم متجر/شخص دولي)
      const engCells = rr.cells.filter(c=>/[A-Za-z]{3,}/.test(c.str) && !/SAR|TOACCT|FRACCT|SANCBK|SAALBI/.test(c.str));
      if(engCells.length){
        const eng = engCells.map(c=>c.str).join(" ").replace(/[^A-Za-z, ]/g," ").replace(/\s+/g," ").trim();
        if(eng.length>=3 && eng.length<=45){ nameText = eng; return; }
      }
      // اسم عربي من سطر الملاحظة (بعد آخر شرطة)
      const noteCell = rr.cells.find(c=>{ const n=norm(c.str); return /ملاحظة/.test(n)||/ملاحظة/.test(rev(n)); });
      if(noteCell){
        let parts = norm(noteCell.str).split(/[\/\-]/).map(x=>x.trim()).filter(Boolean);
        let cand = parts[0]||"";
        cand = cand.replace(/[A-Za-z0-9:*]/g,"").replace(/ملاحظة/g,"").trim();
        if(hasArabic(cand) && cand.length>=2 && cand.length<=25){ nameText = rev(cand); }
      }
    };
    for(let k=1;k<=3 && !nameText;k++){ collectName(rowsY[i+k]); collectName(rowsY[i-k]); }

    parsed.push({
      id: "bnk_pdf_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
      date: date||"",
      type: typeText||"غير محدد",
      name: nameText||"",
      madin: Math.abs(madin)||0,
      dain: Math.abs(dain)||0,
      balance: bal,
    });
  }
  return parsed;
}

// ═══════════════════════════════════════════════════════════
//  🔗 المطابقة البنكية الذكية
//  يربط حركات البنك بالعقود بأدلة صريحة — لا تخمين
// ═══════════════════════════════════════════════════════════
const _RC_NORM = (s) => String(s||"")
  .replace(/[\u064B-\u0652\u0640]/g,"")
  .replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/[^\u0600-\u06FF0-9a-zA-Z\s]/g," ")
  .replace(/\s+/g," ").trim();
const _RC_STOP = ["عبد","بن","بنت","ابو","ابن","محول","تحويل","من","الى","حساب","سداد","مدفوعات","شبكه","نقاط","بيع","صراف","الي","علي"];
const _RC_TOK = (s) => _RC_NORM(s).split(" ").filter(w=>w.length>=3 && _RC_STOP.indexOf(w)<0);
const _RC_DIG = (s) => String(s||"").replace(/\D/g,"");

function reconcileOne(tx, list){
  const narr = _RC_NORM((tx.type||"")+" "+(tx.name||""));
  const nd = _RC_DIG((tx.type||"")+" "+(tx.name||""));
  const amt = Math.abs(+tx.dain||0) || Math.abs(+tx.madin||0);
  const isIn = (+tx.dain||0) > 0;
  const nTok = _RC_TOK(narr);
  const res = [];
  for(const c of list){
    let score=0; const reasons=[];
    if(c.bankAccount){
      const acc=_RC_DIG(c.bankAccount);
      if(acc.length>=6 && nd.indexOf(acc.slice(-6))>=0){ score+=50; reasons.push("رقم الحساب ("+acc.slice(-6)+")"); }
      else if(acc.length>=4 && nd.indexOf(acc.slice(-4))>=0){ score+=32; reasons.push("آخر 4 من الحساب"); }
    }
    if(c.cPhone){ const p=_RC_DIG(c.cPhone); if(p.length>=7 && nd.indexOf(p.slice(-7))>=0){ score+=45; reasons.push("رقم الجوال"); } }
    if(c.idNum){ const d=_RC_DIG(c.idNum); if(d.length>=9 && nd.indexOf(d)>=0){ score+=45; reasons.push("رقم الهوية"); } }
    const cTok=_RC_TOK(c.client);
    if(cTok.length){
      const hit=cTok.filter(w=>nTok.indexOf(w)>=0);
      if(hit.length>=3){ score+=42; reasons.push("الاسم ("+hit.slice(0,3).join(" ")+")"); }
      else if(hit.length===2){ score+=34; reasons.push("الاسم ("+hit.join(" ")+")"); }
      else if(hit.length===1 && hit[0].length>=5){ score+=12; reasons.push("جزء من الاسم"); }
    }
    const inst=+c.instAmt||0, left=+c.__left||0;
    if(amt>0){
      if(inst>0 && Math.abs(amt-inst)<0.5){ score+=26; reasons.push("يساوي القسط ("+inst.toLocaleString()+")"); }
      else if(inst>0 && amt>inst && Math.abs(amt%inst)<0.5){ score+=16; reasons.push("مضاعف القسط ("+Math.round(amt/inst)+"×)"); }
      else if(left>0 && Math.abs(amt-left)<0.5){ score+=22; reasons.push("يساوي كامل المتبقي"); }
    }
    if(c.firstInst && tx.date){
      const dd=new Date(c.firstInst).getDate();
      const td=parseInt(String(tx.date).slice(-2).replace(/\D/g,""),10);
      if(!isNaN(td)&&!isNaN(dd)){ const df=Math.min(Math.abs(td-dd),31-Math.abs(td-dd));
        if(df<=2){ score+=10; reasons.push("قريب من يوم الاستحقاق"); } else if(df<=5) score+=5; }
    }
    if(isIn && c.payType==="deduction" && score>0){ score+=8; reasons.push("عقد استقطاع"); }
    if(score>0) res.push({c,score,reasons});
  }
  res.sort((a,b)=>b.score-a.score);
  const best=res[0]||null, second=res[1]||null;
  let conf="none";
  if(best){
    const idn=best.reasons.some(r=>/الحساب|الجوال|الهوية|الاسم/.test(r));
    const gap=best.score-(second?second.score:0);
    if(idn && best.score>=60 && gap>=12) conf="high";
    else if(idn && best.score>=38) conf="medium";
    else if(best.score>=22) conf="low";
  }
  return {best, alts:res.slice(0,3), conf, amt, isIn};
}

function classifyTx(tx){
  const n=_RC_NORM((tx.type||"")+" "+(tx.name||""));
  const isIn=(+tx.dain||0)>0;
  const R=[
    [/نقاط بيع|شبكه|مدى|mada|pos|شراء/i,"مشتريات نقاط بيع","masroof",true],
    [/صراف|سحب نقدي|atm|نقدا/i,"سحب نقدي","sahb",true],
    [/رسوم|عموله|عمولة|ضريبه|ضريبة|vat|fee/i,"رسوم بنكية","masroof",true],
    [/راتب|salary/i,"راتب","estilam",true],
    [/زكاه|زكاة|صدقه|صدقة/i,"زكاة","zakat",true],
    [/كهرب|ماء|اتصالات|stc|موبايلي|زين|فاتوره|فاتورة/i,"فواتير","masroof",true],
    [/ايجار|إيجار/i,"إيجار","masroof",true],
    [/تحويل|حواله|حوالة|transfer/i,isIn?"تحويل وارد":"تحويل صادر",isIn?"estilam":"sahb",false],
  ];
  for(const x of R){ if(x[0].test(n)) return {label:x[1],type:x[2],sure:x[3]}; }
  return {label:isIn?"إيداع غير مصنّف":"مصروف غير مصنّف", type:isIn?"estilam":"masroof", sure:false};
}

function BankReconcile({bankTx, contracts, investors, payments, setPayments, doneIds, setDaily, daily, toast, logAct}){
  const [tab, setTab] = useState("alert");
  const [ignored, setIgnored] = useState(()=>{ try{ return JSON.parse(localStorage.getItem("qimma_rc_ignored")||"[]"); }catch(e){ return []; } });
  const ign = (id) => { const n=[...ignored,id]; setIgnored(n); try{localStorage.setItem("qimma_rc_ignored",JSON.stringify(n));}catch(e){} };
  const unIgn = () => { setIgnored([]); try{localStorage.removeItem("qimma_rc_ignored");}catch(e){} };

  const _paid = (cid) => _arr(payments).filter(p=>p.contractId===cid).reduce((s,p)=>s+(+p.amount||0),0);
  const active = _arr(contracts).filter(c=>!c.deleted && (doneIds||[]).indexOf(c.id)<0)
    .map(c=>({...c, __left: Math.max(0,(+c.totalInst||+c.amount||0)-_paid(c.id))}));

  const analysis = React.useMemo(()=>{
    const rows=_arr(bankTx);
    const out={matched:[], review:[], unknown:[], expense:[], unrecorded:[]};
    rows.forEach((tx,idx)=>{
      const key = tx.id || (tx.date+"_"+(tx.dain||0)+"_"+(tx.madin||0)+"_"+idx);
      if(ignored.indexOf(key)>=0) return;
      const isIn=(+tx.dain||0)>0;
      const r = isIn ? reconcileOne(tx, active) : {best:null,conf:"none",amt:Math.abs(+tx.madin||0),isIn:false};
      const item={tx, key, ...r};
      if(!isIn){ item.cls=classifyTx(tx); out.expense.push(item); return; }
      if(r.conf==="high" || r.conf==="medium"){
        // هل هذا الإيداع مسجّل كسداد في النظام؟
        const exists = _arr(payments).some(p=>
          p.contractId===r.best.c.id &&
          Math.abs((+p.amount||0)-r.amt)<0.5 &&
          Math.abs((new Date(p.date)-new Date(tx.date))/86400000)<=7
        );
        item.recorded=exists;
        if(exists) out.matched.push(item); else out.unrecorded.push(item);
      }
      else if(r.conf==="low"){ out.review.push(item); }
      else { item.cls=classifyTx(tx); out.unknown.push(item); }
    });
    return out;
  },[bankTx, contracts, payments, doneIds, ignored]);

  const recordPay = (item) => {
    const c=item.best.c;
    const rn=_arr(payments).length+1;
    setPayments(p=>[...p,{id:Date.now(),contractId:c.id,amount:item.amt,date:item.tx.date,note:"مطابقة بنكية",receipt:rn}]);
    logAct && logAct("سداد","مطابقة بنكية",c.client+" — "+SAR(item.amt));
    toast && toast("✅ سُجّل "+SAR(item.amt)+" على "+c.client);
    ign(item.key);
  };
  const recordExpense = (item) => {
    const all=_arr(daily);
    const rn=all.reduce((m,d)=>Math.max(m,d.receiptNum||0),0)+1;

      <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>

  const cur = tab==="alert"?analysis.unrecorded : tab==="review"?analysis.review

          <span>{ignored.length} حركة متجاهَلة</span>
          <button style={{padding:"5px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",color:"#6d28d9",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"IBM Plex Sans Arabic,Arial"}} onClick={unIgn}>استرجاع الكل</button>
        </div>

      {cur.length===0
        ? <div style={{textAlign:"center",padding:"40px 20px",color:"#94a3b8",fontSize:14}}>لا يوجد شيء هنا 👌</div>
        : cur.slice(0,120).map(it=><Card key={it.key} item={it} kind={tab}/>)}
      {cur.length>120 && <div style={{textAlign:"center",color:"#94a3b8",fontSize:12,padding:10}}>... و{cur.length-120} حركة أخرى</div>}
    </div>
  );
}

function BankPage({bankTx, setBankTx, toast, contracts, investors, payments, setPayments, doneIds, daily, setDaily, logAct}) {
  const rows = _arr(bankTx);
  const [bankView, setBankView] = useState("tx");
  const fileRef = React.useRef(null);
  const [dragOver, setDragOver] = React.useState(false);
  const [bankQuery, setBankQuery] = React.useState(""); // 🔍 بحث بالاسم/الوصف
  const [bankFilter, setBankFilter] = React.useState("all");  // all | in | out | pos

  // حفظ الحركات (مع خيار الدمج أو الاستبدال) — مشترك بين Excel و PDF
  const saveParsed = (parsed) => {
    if(!parsed || parsed.length===0){ toast&&toast("لم يتم العثور على حركات","error"); return; }
    const existing = _arr(bankTx);
    if(existing.length > 0){
      const doMerge = window.confirm(
        "يوجد كشف سابق فيه "+existing.length+" حركة.\n\n"+
        "• اضغط \"موافق\" لـ➕ دمج الكشف الجديد ("+parsed.length+" حركة) مع السابق في كشف واحد.\n"+
        "• اضغط \"إلغاء\" لـ🔄 استبدال الكل بالكشف الجديد فقط."
      );
      if(doMerge){
        setBankTx([...existing, ...parsed]);
        toast&&toast("✅ تم دمج "+parsed.length+" حركة (الإجمالي "+(existing.length+parsed.length)+")");
      } else {
        setBankTx(parsed);
        toast&&toast("🔄 تم استبدال الكشف بـ "+parsed.length+" حركة");
      }
    } else {
      setBankTx(parsed);
      toast&&toast("✅ تم استيراد "+parsed.length+" حركة");
    }
  };

  // قراءة ملف Excel
  const readExcel = (file) => {
    if(typeof XLSX==="undefined"){ toast&&toast("مكتبة القراءة لم تُحمّل، تأكد من الإنترنت","error"); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
        // ابحث عن صف الرأس بمرونة عالية
        let hi = -1;
        const dateWords = ["التاريخ","تاريخ","date","Date"];
        const moneyWords = ["مدين","دائن","الرصيد","رصيد","مبلغ","المبلغ","سحب","إيداع","المسحوب","المودع","debit","credit","balance","amount"];
        for(let i=0;i<Math.min(grid.length,30);i++){
          const rowStr = (grid[i]||[]).map(c=>String(c||"").trim()).join("|");
          const hasDate = dateWords.some(w=>rowStr.includes(w));
          const hasMoney = moneyWords.some(w=>rowStr.includes(w));
          if(hasDate && hasMoney){ hi=i; break; }
        }
        // محاولة ثانية: أي صف فيه كلمة تاريخ
        if(hi<0){
          for(let i=0;i<Math.min(grid.length,30);i++){
            const rowStr = (grid[i]||[]).map(c=>String(c||"").trim()).join("|");
            if(dateWords.some(w=>rowStr.includes(w))){ hi=i; break; }
          }
        }
        if(hi<0){ toast&&toast("لم يتم التعرف على تنسيق الكشف — تأكد أن الملف فيه عمود التاريخ","error"); return; }
        const head = (grid[hi]||[]).map(c=>String(c||"").trim());
        const findCol = (...keys)=> head.findIndex(h=> keys.some(k=> h.toLowerCase().includes(k.toLowerCase())));
        let cDate = findCol("التاريخ","تاريخ","Date");
        let cDetails = findCol("تفاصيل","العملية","البيان","الوصف","Description","نوع");
        let cMadin = findCol("مدين","المسحوب","سحب","Debit","خصم");
        let cDain = findCol("دائن","المودع","إيداع","الوارد","Credit");
        let cBal = findCol("الرصيد","رصيد","Balance");
        // إذا ما لقى أعمدة مدين/دائن، جرّب عمود "المبلغ" الموحّد
        let cAmount = findCol("المبلغ","مبلغ","Amount","القيمة");
        // احتياط: المواقع الافتراضية لكشف الراجحي
        if(cDate<0) cDate = head.length>10 ? 11 : 0;
        if(cDetails<0) cDetails = head.length>10 ? 9 : 1;
        const numOf = (v)=>{ const n=parseFloat(String(v).replace(/[,،\s]/g,"").replace(/[^0-9.\-]/g,"")); return isNaN(n)?null:n; };
        const parsed = [];
        for(let i=hi+1;i<grid.length;i++){
          const r = grid[i]||[];
          const date = String(r[cDate]||"").trim();
          if(!date || date.length<4) continue; // تخطّي الصفوف الفارغة
          let madin=0, dain=0, balN=null;
          if(cMadin>=0) madin = Math.abs(numOf(r[cMadin])||0);
          if(cDain>=0) dain = Math.abs(numOf(r[cDain])||0);
          if(cBal>=0) balN = numOf(r[cBal]);
          // لو عمود مبلغ موحّد بدل مدين/دائن
          if(cMadin<0 && cDain<0 && cAmount>=0){
            const amt = numOf(r[cAmount])||0;
            if(amt<0) madin=Math.abs(amt); else dain=amt;
          }
          // لا نشترط الرصيد — لو مافيه نحطه 0
          if(balN===null) balN=0;
          // لازم يكون فيه حركة مالية أو تاريخ فعلي
          if(madin===0 && dain===0 && balN===0) continue;
          let detailRaw = String(r[cDetails]||"").trim();
          let nameText = "";
          if(cDetails>=0 && cDetails+1<r.length) nameText = String(r[cDetails+1]||"").trim();
          parsed.push({
            id: "bnk_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
            date, type: detailRaw, name: nameText,
            madin, dain, balance: balN,
          });
        }
        if(parsed.length===0){
          // رسالة مفصلة للتشخيص
          toast&&toast("الملف فيه "+grid.length+" صف، رأس في سطر "+(hi+1)+": ["+head.slice(0,6).join(", ")+"] — لكن ما لقيت حركات. جرّب تنسيق مختلف","error");
          return;
        }
        saveParsed(parsed);
      } catch(err){ toast&&toast("خطأ في قراءة ملف Excel: "+(err&&err.message||""),"error"); }
    };
    reader.readAsArrayBuffer(file);
  };

  // ═══ قارئ PDF مدمج بدون مكتبات خارجية ═══
  const extractPdfTextBuiltin = async (arrayBuffer) => {
    const bytes = new Uint8Array(arrayBuffer);
    const raw = new TextDecoder("latin1").decode(bytes);
    const streams = [];
    let pos = 0;
    while(true){
      const si = raw.indexOf("stream", pos);
      if(si<0) break;
      let start = si + 6;
      if(raw.charCodeAt(start)===13) start++;
      if(raw.charCodeAt(start)===10) start++;
      const ei = raw.indexOf("endstream", start);
      if(ei<0) break;
      const header = raw.substring(Math.max(0, si-500), si);
      const isFlate = header.includes("/FlateDecode");
      streams.push({ start, end: ei, isFlate, data: bytes.slice(start, ei) });
      pos = ei + 9;
    }
    const allText = [];
    for(const s of streams){
      let decoded = "";
      try {
        if(s.isFlate && typeof DecompressionStream !== "undefined"){
          const ds = new DecompressionStream("deflate");
          const writer = ds.writable.getWriter();
          const reader = ds.readable.getReader();
          writer.write(s.data).catch(()=>{});
          writer.close().catch(()=>{});
          const chunks = [];
          while(true){ const {done,value} = await reader.read(); if(done) break; chunks.push(value); }
          const total = chunks.reduce((a,c)=>a+c.length,0);
          const result = new Uint8Array(total); let offset=0;
          for(const c of chunks){ result.set(c, offset); offset += c.length; }
          decoded = new TextDecoder("utf-8",{fatal:false}).decode(result);
        } else if(!s.isFlate) {
          decoded = new TextDecoder("utf-8",{fatal:false}).decode(s.data);
        }
      } catch(e){ continue; }
      if(!decoded) continue;
      const tjMatches = decoded.matchAll(/\(([^)]*)\)\s*Tj/g);
      for(const m of tjMatches){ const t=m[1].replace(/\\n/g," ").replace(/\\(.)/g,"$1").trim(); if(t) allText.push(t); }
      const tjArr = decoded.matchAll(/\[([^\]]*)\]\s*TJ/gi);
      for(const m of tjArr){ const parts=m[1].matchAll(/\(([^)]*)\)/g); let line=""; for(const p of parts) line+=p[1].replace(/\\(.)/g,"$1"); line=line.trim(); if(line) allText.push(line); }
    }
    return allText;
  };

  const parseRajhiText = (lines) => {
    const num = (s)=>{ const v=parseFloat(String(s).replace(/[,،\s]/g,"").replace(/[^0-9.\-]/g,"")); return isNaN(v)?null:v; };
    const parsed = [];
    let currentDate = "";
    let pendingType = "";
    for(let i=0;i<lines.length;i++){
      const line = lines[i].trim();
      if(!line) continue;
      const dateMatch = line.match(/(\d{4}[\/-]\d{2}[\/-]\d{2})/);
      if(dateMatch) currentDate = dateMatch[1];
      const amounts = line.match(/[\d,]+\.\d{2}/g);
      if(amounts && amounts.length>=2){
        const nums = amounts.map(a=>Math.abs(num(a)||0));
        let bal=nums[0],madin=0,dain=0;
        if(nums.length>=3){bal=nums[0];dain=nums[1];madin=nums[2];}
        else {bal=nums[0];dain=nums[1];}
        let type = pendingType||"غير محدد";
        let name = "";
        for(let k=1;k<=3;k++){
          const next=lines[i+k]||"";
          const engMatch=next.match(/[A-Za-z]{3,}[A-Za-z\s,.]*/);
          if(engMatch && !/SAR|TOACCT|FRACCT/.test(engMatch[0])){ name=engMatch[0].trim(); break; }
        }
        if(bal>0||madin>0||dain>0){
          parsed.push({ id:"bnk_b_"+i+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), date:currentDate, type, name, madin, dain, balance:bal });
        }
        pendingType="";
      } else {
        const arabic=line.replace(/[^\u0600-\u06FF\s]/g,"").trim();
        if(arabic.length>=3 && arabic.length<=40) pendingType=arabic;
      }
    }
    return parsed;
  };

  const readPDF = async (file) => {
    toast&&toast("⏳ جارٍ قراءة الـ PDF...");
    const reader = new FileReader();
    reader.onload = async (e) => {
      const buf = e.target.result;
      // نسخة بايت مستقلة — pdf.js يفصل الـ ArrayBuffer عند القراءة،
      // فنعطي كل محاولة نسخة خاصة بها حتى لا يحدث "Buffer is already detached"
      const bytesFor = () => new Uint8Array(buf.slice(0));

      // أولاً: جرّب المكتبة الخارجية لو موجودة
      const lib = window.pdfjsLib || window["pdfjs-dist/build/pdf"];
      if(lib){
        try{
          try{ if(lib.GlobalWorkerOptions && !lib.GlobalWorkerOptions.workerSrc) lib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js"; }catch(x){}
          const pdf = await lib.getDocument({data:bytesFor()}).promise;
          let items = [];
          for(let p=1;p<=pdf.numPages;p++){
            const page=await pdf.getPage(p);
            const tc=await page.getTextContent();
            const vp=page.getViewport({scale:1});
            tc.items.forEach(it=>{ const tx=it.transform; items.push({str:it.str,x:tx[4],y:vp.height-tx[5],page:p}); });
          }
          const parsed = parseRajhiPDF(items);
          if(parsed.length>0){ saveParsed(parsed); return; }
        }catch(ex){ console.warn("pdfjsLib failed, trying builtin:", ex); }
      }
      // ثانياً: القارئ المدمج (بنسخة بايت مستقلة)
      try{
        const textLines = await extractPdfTextBuiltin(buf.slice(0));
        if(textLines.length===0){ toast&&toast("لم أستطع استخراج نص من الـ PDF — جرّب Excel","error"); return; }
        const parsed = parseRajhiText(textLines);
        if(parsed.length>0){ saveParsed(parsed); return; }
        const fullText = textLines.join("\n");
        const allNums = fullText.match(/[\d,]+\.\d{2}/g);
        toast&&toast("تم استخراج "+textLines.length+" سطر و "+(allNums?allNums.length:0)+" رقم، لكن ما تعرّفت على تنسيق الراجحي — جرّب Excel","error");
      }catch(err){
        toast&&toast("خطأ في قراءة PDF: "+(err&&err.message||"")+" — جرّب Excel","error");
      }
    };
    reader.readAsArrayBuffer(file);
  };

  // موجّه: يفرّق حسب نوع الملف (بالامتداد أو نوع MIME)
  const readFile = (file) => {
    if(!file) return;
    const name = (file.name||"").toLowerCase();
    const mime = (file.type||"").toLowerCase();
    const isPdf = name.endsWith(".pdf") || mime.indexOf("pdf")>-1;

          {/* 🔍 بحث عن اسم شخص أو نوع عملية */}
